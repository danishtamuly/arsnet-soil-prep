ly releases N, P, S and chelated micronutrients, contributing to soil fertility over time."},{"id":"Q0349","t":"Soil Fertility","q":"Which nutrient deficiency is classically associated with 'reclamation disease' of newly reclaimed peat/marsh soils brought under cultivation?","o":["Nitrogen","Copper","Potassium","Calcium"],"a":1,"e":"Copper deficiency ('reclamation disease') is a well-known problem in crops grown on newly cultivated organic/peat soils, where Cu is strongly complexed."},{"id":"Q0399","t":"Soil Fertility","q":"Which of the following would most directly help reduce nitrate leaching losses in sandy, high-rainfall soils?","o":["Applying the entire seasonal nitrogen dose at planting","Splitting nitrogen application to match crop demand, and/or using slow-release/inhibitor-coated fertilizers","Avoiding any crop cover","Increasing irrigation without regard to crop need"],"a":1,"e":"Synchronizing supply with demand through split doses or controlled-release products reduces the pool of mobile nitrate vulnerable to leaching."},{"id":"Q0353","t":"Soil Fertility","q":"Chlorine (Cl), though an essential micronutrient, is rarely deficient in agricultural soils mainly because:","o":["Plants do not require chlorine at all","It is abundant from rainfall, irrigation water, and as a contaminant in many fertilizers/soils, especially near coasts","Chlorine cannot be taken up by roots","It is toxic at any concentration"],"a":1,"e":"Cl- is ubiquitous in the environment (rain, irrigation water, atmospheric deposition), so deficiency is uncommon except in some specific situations."},{"id":"Q0381","t":"Soil Fertility","q":"A well-conducted fertilizer trial to determine the economic optimum dose of a nutrient typically uses:","o":["A single fertilizer level with no comparison","Multiple graded levels of the nutrient with proper replication to fit a response function","Only farmer's traditional practice as one treatment","No untreated control"],"a":1,"e":"Graded-dose trials with replication allow fitting a yield response curve from which the economically optimum dose can be derived."},{"id":"Q0348","t":"Soil Fertility","q":"The concept of 'nutrient mining' in agriculture refers to:","o":["Deliberate addition of excess fertilizer","Removal of nutrients in harvested produce exceeding the amounts replenished, depleting soil fertility over time","Extraction of minerals from deep soil layers by machinery","Biological nitrogen fixation"],"a":1,"e":"When crop nutrient removal consistently exceeds inputs, soil nutrient reserves are progressively depleted ('mined')."},{"id":"Q0356","t":"Soil Fertility","q":"Nutrient recommendations based on the 'targeted yield concept' aim to:","o":["Ignore soil test values entirely","Calculate fertilizer doses needed to achieve a specific pre-decided yield goal, based on soil test and nutrient requirement factors","Apply a single blanket dose to all fields regardless of yield goal","Only consider organic manure application"],"a":1,"e":"The targeted yield approach (basis of STCR) computes fertilizer needs to reach a chosen yield target given current soil fertility."},{"id":"Q0390","t":"Soil Fertility","q":"A well-recognized strategy to reduce phosphorus fixation losses in acid soils is to:","o":["Apply rock phosphate only in alkaline soils","Combine liming (to raise pH toward optimum) with phosphorus application, and/or use band placement","Lower soil pH further","Avoid any lime application"],"a":1,"e":"Moderating soil acidity reduces Fe/Al-P fixation, and placement further limits soil-fertilizer contact, both improving P availability."},{"id":"Q0312","t":"Soil Fertility","q":"Phosphorus availability to plants is generally highest in the soil pH range of about:","o":["3.0–4.0","6.0–7.0","9.5–10.5","Below 3.0"],"a":1,"e":"P availability peaks near neutral pH; below this it is fixed by Fe/Al, and above it by calcium, both reducing solubility."},{"id":"Q0392","t":"Soil Fertility","q":"Long-term continuous cereal monocropping without adequate nutrient replenishment commonly results in:","o":["Progressive improvement in soil fertility","Gradual depletion of soil organic matter and specific nutrients, reducing yield potential over time","No change whatsoever in soil properties","Automatic correction of any nutrient deficiency"],"a":1,"e":"Repeated nutrient removal without adequate replenishment and organic matter addition depletes soil fertility over successive seasons."},{"id":"Q0366","t":"Soil Fertility","q":"Application of excess nitrogen without adequate potassium can increase a crop's susceptibility to:","o":["Improved lodging resistance","Pest and disease attack, and lodging, due to weak, succulent growth","Complete immunity to disease","Improved drought tolerance"],"a":1,"e":"Excess N with inadequate K produces soft, lush, weak-stemmed growth more vulnerable to pests, disease and lodging."},{"id":"Q0370","t":"Soil Fertility","q":"In most cereal crops, nitrogen demand is generally highest during which growth stage?","o":["Germination only","Active vegetative growth and tillering/panicle initiation stages","Only at physiological maturity","Only during seed dormancy"],"a":1,"e":"Rapid vegetative growth and reproductive initiation are periods of peak nitrogen demand for most cereals."},{"id":"Q0374","t":"Soil Fertility","q":"Which statement correctly distinguishes 'available' nutrient pools from 'total' nutrient content of a soil?","o":["Total content always equals available content","Total nutrient content includes both available and much larger unavailable (fixed/mineral) fractions; available content is only the readily plant-usable portion","Available content is always greater than total content","There is no difference between the two"],"a":1,"e":"Most soil nutrient reserves are in slowly available or unavailable mineral/fixed forms; only a fraction is immediately available to plants."},{"id":"Q0303","t":"Soil Fertility","q":"Denitrification refers to the microbial process converting:","o":["Ammonium to nitrate under aerobic conditions","Nitrate to gaseous nitrogen forms (N2, N2O) under anaerobic conditions","Organic nitrogen to ammonium","Atmospheric nitrogen into plant-available forms"],"a":1,"e":"Under low-oxygen (anaerobic) conditions, denitrifying bacteria reduce nitrate stepwise to gaseous N2/N2O, lost from soil."},{"id":"Q0340","t":"Soil Fertility","q":"Balanced fertilization refers to the practice of:","o":["Applying only nitrogen in large doses","Supplying nutrients in proportions matched to crop requirement and soil supply, avoiding both deficiency and excess","Applying equal quantities of every nutrient regardless of need","Avoiding fertilizer use altogether"],"a":1,"e":"Balanced fertilization supplies N, P, K and other nutrients in the right proportion for the crop and soil, optimizing yield and efficiency."},{"id":"Q0326","t":"Soil Fertility","q":"Manganese toxicity in plants is most likely to occur in:","o":["Strongly alkaline, well-aerated soils","Strongly acidic and/or poorly drained (reducing) soils","Saline soils only","Sandy, low organic matter soils only"],"a":1,"e":"Low pH and reducing conditions increase Mn2+ solubility, sometimes to phytotoxic levels."},{"id":"Q0388","t":"Soil Fertility","q":"The main reason for recommending band placement of fertilizer close to (but not touching) the seed is to:","o":["Cause seed/seedling injury deliberately","Make nutrients available near the developing root system while avoiding salt injury to the germinating seed","Increase volatilization losses","Reduce nutrient availability to the crop"],"a":1,"e":"Banding places nutrients within reach of young roots while a small separation from the seed avoids salt/fertilizer burn to the germinating seed."},{"id":"Q0301","t":"Soil Fertility","q":"A high carbon-to-nitrogen (C:N) ratio in added organic residue (e.g., cereal straw) typically causes:","o":["Immediate net mineralization and N release","Net immobilization of soil nitrogen initially, as microbes scavenge available N","No effect on soil nitrogen dynamics","Immediate volatilization of all soil N"],"a":1,"e":"Decomposers need N to break down carbon-rich, N-poor residues; they draw on soil mineral N, causing temporary immobilization."},{"id":"Q0310","t":"Soil Fertility","q":"The enzyme responsible for biological nitrogen fixation, converting N2 to ammonia, is:","o":["Urease","Nitrogenase","Nitrate reductase","Catalase"],"a":1,"e":"Nitrogenase, an oxygen-sensitive enzyme complex in diazotrophic organisms, catalyzes reduction of N2 to NH3."},{"id":"Q0292","t":"Soil Fertility","q":"Macronutrients required by plants in relatively large amounts include all of the following EXCEPT:","o":["Nitrogen","Potassium","Molybdenum","Calcium"],"a":2,"e":"Molybdenum is required only in trace amounts and is classified as a micronutrient, unlike N, K and Ca."},{"id":"Q0395","t":"Soil Fertility","q":"Precision nutrient management technologies such as leaf color charts (LCC) for rice are used mainly to:","o":["Determine soil texture","Guide the timing of nitrogen top dressing based on real-time crop nitrogen status","Measure soil salinity","Assess soil microbial biomass"],"a":1,"e":"LCC compares leaf greenness to a standard chart to decide if/when nitrogen top dressing is needed, improving N use efficiency."},{"id":"Q0325","t":"Soil Fertility","q":"Molybdenum, unlike most other micronutrient cations, tends to become MORE available to plants as soil pH:","o":["Decreases","Increases (its availability behaves like an anion, similar to phosphate)","Is unrelated to pH","Reaches exactly 5.5"],"a":1,"e":"Molybdate availability rises with increasing pH, the opposite pattern to Fe, Mn, Zn and Cu."},{"id":"Q0362","t":"Soil Fertility","q":"A crop showing yellowing and scorching (necrosis) of leaf margins, weak stalks and lodging is often indicative of deficiency of:","o":["Potassium","Nitrogen","Phosphorus","Boron"],"a":0,"e":"Potassium deficiency classically shows marginal leaf scorch/chlorosis and weakened stems prone to lodging."},{"id":"Q0343","t":"Soil Fertility","q":"A 'critical soil test value' for a nutrient represents:","o":["The value above which the nutrient is toxic to all crops","The soil test level below which crop response to added nutrient is likely, and above which response is unlikely","A value used only for salinity assessment","The value at which soil pH becomes neutral"],"a":1,"e":"Below the critical level, fertilizer application typically gives an economic yield response; above it, further addition gives little benefit."}],"Manures & Fertilizers":[{"id":"Q0982","t":"Manures & Fertilizers","q":"Green manuring is generally most effective at improving soil nitrogen status when the green manure crop is incorporated:","o":["At full maturity, after seed set and significant lignification","At an early-to-optimal vegetative/flowering growth stage, when biomass and nitrogen content are favourable and decomposition is not overly slowed by excessive lignification","Only after the leaves have completely dried and fallen off","Only if grown for more than two full years continuously"],"a":1,"e":"Incorporating green manure crops before they become too fibrous/lignified (commonly around flowering) balances good biomass/nitrogen accumulation with reasonably rapid decomposition and nutrient release."},{"id":"Q0424","t":"Manures & Fertilizers","q":"Oil cakes (e.g., neem cake, castor cake) used as organic manures are valued for:","o":["Zero nutrient content","A relatively higher nitrogen content compared to bulky manures, plus some pest-repellent properties in certain cakes","Being purely inorganic","Containing only potassium"],"a":1,"e":"Oil cakes are concentrated organic manures with appreciable N (and some P, K); neem cake also has nematicidal/insect-repellent properties."},{"id":"Q0402","t":"Manures & Fertilizers","q":"Compared with chemical fertilizers, farmyard manure and compost are classified as:","o":["Concentrated (high-analysis) fertilizers","Bulky organic manures, with relatively low nutrient concentration but beneficial effects on soil physical properties","Straight fertilizers","Complex fertilizers"],"a":1,"e":"FYM/compost are 'bulky organics' — large volumes applied for modest nutrient content, valued also for organic matter/structure benefits."},{"id":"Q0980","t":"Manures & Fertilizers","q":"When recommending organic manure application rates based on nitrogen content, a key practical consideration is that:","o":["All the nitrogen in the manure becomes available to the crop within the same season","Only a fraction of the manure's total nitrogen typically mineralizes and becomes available within the application season, so an appropriate 'availability coefficient' must be applied in calculating equivalent fertilizer value","Manure nitrogen is never available to crops at all","Manure application rates need no consideration of nitrogen release timing"],"a":1,"e":"Because organic nitrogen mineralizes gradually, only part of it becomes available in the season of application; recommendations account for this via mineralization/availability coefficients rather than assuming full immediate availability."},{"id":"Q0454","t":"Manures & Fertilizers","q":"Which best explains why balanced application of organic manures alongside chemical fertilizers often improves overall fertilizer use efficiency?","o":["Organic matter has no interaction with applied fertilizer nutrients","Organic matter improves soil physical/biological conditions and can reduce nutrient losses (e.g., leaching, fixation), enhancing the effectiveness of applied fertilizer","Organic manures always contain more nutrients than chemical fertilizers","There is no scientific evidence for any such benefit"],"a":1,"e":"Better soil structure, water retention, CEC and microbial activity from organic matter can enhance uptake and reduce losses of applied fertilizer nutrients."},{"id":"Q0446","t":"Manures & Fertilizers","q":"Incorporating crop residues into soil, rather than burning them, is generally recommended because it:","o":["Increases soil organic matter, improves structure, and recycles nutrients over time","Immediately increases soil salinity","Has no effect on soil organic carbon","Always causes severe nitrogen immobilization with no recovery"],"a":0,"e":"Residue incorporation returns organic matter and nutrients to the soil, improving long-term fertility and structure despite short-term immobilization risk."},{"id":"Q0451","t":"Manures & Fertilizers","q":"Application of farmyard manure well before sowing (rather than at sowing) is generally recommended to allow:","o":["The manure to decompose further and release nutrients gradually before crop demand peaks","Immediate nutrient release with no decomposition needed","Complete loss of all nutrients before planting","No benefit at all compared to same-day application"],"a":0,"e":"Pre-sowing application gives time for further mineralization, so nutrients become available as the crop's demand increases."},{"id":"Q0435","t":"Manures & Fertilizers","q":"Foliar fertilizer sprays are generally applied at:","o":["Very high concentration regardless of crop stage","Low, carefully calibrated concentrations to avoid leaf scorch/phytotoxicity","Any concentration since foliar sprays cannot cause damage","Only in the form of solid granules"],"a":1,"e":"Because leaves are more sensitive than roots to salt concentration, foliar sprays must use dilute, well-tested nutrient concentrations."},{"id":"Q0974","t":"Manures & Fertilizers","q":"'Nutrient content variability' is a recognized limitation of organic manures compared to standardized chemical fertilizers mainly because organic manure composition:","o":["Is always precisely uniform regardless of source","Varies considerably depending on source, animal feed, storage/handling and decomposition stage, making nutrient dosing less precise than with standardized fertilizer grades","Has no bearing on fertilizer recommendation accuracy","Is identical to chemical fertilizer composition"],"a":1,"e":"Unlike fertilizers with a guaranteed, standardized nutrient grade, organic manure nutrient content varies with source and handling, making precise nutrient dosing more challenging."},{"id":"Q0418","t":"Manures & Fertilizers","q":"Sulfate of potash (SOP) is often preferred over muriate of potash for chloride-sensitive crops because SOP:","o":["Contains no potassium","Supplies potassium along with sulfur but with much lower chloride content","Contains higher chloride than MOP","Is always cheaper than MOP"],"a":1,"e":"SOP (potassium sulfate) avoids the chloride load of MOP, making it suitable for crops sensitive to chloride, while adding sulfur."},{"id":"Q0445","t":"Manures & Fertilizers","q":"Crop residue burning, sometimes practised to quickly clear fields, is discouraged mainly because it:","o":["Improves soil organic matter","Destroys organic matter and nutrients that could otherwise be recycled, and contributes to air pollution","Has no downside at all","Increases nitrogen content of soil"],"a":1,"e":"Burning wastes recyclable nutrients/organic matter and releases pollutants, whereas incorporation or composting recycles the residue's value."},{"id":"Q0448","t":"Manures & Fertilizers","q":"Azospirillum, used as a biofertilizer for cereals, is valued mainly for its ability to:","o":["Solubilize phosphate exclusively","Fix atmospheric nitrogen in association with the root zone of non-leguminous crops and produce plant growth-promoting substances","Fix nitrogen only in legume nodules","Control soil salinity"],"a":1,"e":"Azospirillum forms an associative (non-nodular) relationship with cereal/grass roots, contributing fixed N and growth-promoting hormones."},{"id":"Q0411","t":"Manures & Fertilizers","q":"Straight fertilizers are those that:","o":["Supply only one primary nutrient (e.g., urea supplies only nitrogen)","Supply all three primary nutrients in one product","Are always organic in nature","Contain only micronutrients"],"a":0,"e":"Straight fertilizers, like urea (N) or muriate of potash (K), carry a single major nutrient, unlike complex/mixed fertilizers."},{"id":"Q0438","t":"Manures & Fertilizers","q":"A urease inhibitor, when coated on urea, primarily helps by:","o":["Accelerating urea hydrolysis and ammonia loss","Slowing the hydrolysis of urea to ammonium, reducing ammonia volatilization losses after surface application","Converting urea into phosphate","Eliminating the need for nitrogen fertilizer entirely"],"a":1,"e":"By delaying urease-catalyzed hydrolysis, less ammonium/ammonia accumulates at the surface at once, reducing volatilization loss."},{"id":"Q0981","t":"Manures & Fertilizers","q":"Compatibility testing before mixing different straight fertilizers (to prepare a mixed fertilizer or tank mix) is important mainly to avoid:","o":["Any possibility of nutrient loss whatsoever","Undesirable chemical reactions (e.g., caking, volatilization, or precipitation) between incompatible fertilizer combinations that could reduce nutrient availability or damage equipment","Increasing total nutrient content","Any interaction at all between fertilizers, since none ever occurs"],"a":1,"e":"Certain fertilizer combinations can react unfavourably (e.g., causing ammonia loss, caking, or nutrient precipitation), so compatibility should be checked before mixing/tank-mixing fertilizers."},{"id":"Q0426","t":"Manures & Fertilizers","q":"'Concentrated organic manures' (e.g., oil cakes, blood meal, fish meal), compared to bulky organic manures like FYM, generally have:","o":["Lower nutrient content and are applied in large quantities","Higher nutrient content and are applied in smaller quantities","No nitrogen content at all","Identical composition to FYM"],"a":1,"e":"Concentrated organics carry more nutrients per unit weight than bulky manures, so smaller quantities suffice."},{"id":"Q0422","t":"Manures & Fertilizers","q":"Rock phosphate, used directly as a fertilizer, is a naturally occurring source of:","o":["Nitrogen","Phosphorus (as apatite minerals), of relatively low solubility","Potassium","Sulfur only"],"a":1,"e":"Rock phosphate is mined apatite, containing phosphorus in a form of limited solubility, most effective on acid soils."},{"id":"Q0975","t":"Manures & Fertilizers","q":"Application of lime along with acid-forming fertilizers such as ammonium sulfate, when used together over time, is sometimes recommended mainly to:","o":["Increase soil acidity further","Help offset/counteract the gradual soil acidification caused by repeated use of physiologically acidic fertilizers","Eliminate the need for any fertilizer nitrogen","Increase soil salinity"],"a":1,"e":"Periodic liming can help neutralize the cumulative acidifying effect of long-term ammonium-based fertilizer use, maintaining a more stable soil pH."},{"id":"Q0417","t":"Manures & Fertilizers","q":"Muriate of potash (MOP), the most common potassic fertilizer, has an approximate nutrient content of:","o":["20% K2O","46% K2O","60% K2O","90% K2O"],"a":2,"e":"MOP (potassium chloride) is conventionally graded at about 60% K2O."},{"id":"Q0430","t":"Manures & Fertilizers","q":"Application of raw, undecomposed organic residue with a very high C:N ratio (e.g., >30:1) close to sowing time risks:","o":["Excess nitrogen availability to the crop","Temporary nitrogen immobilization, potentially causing crop nitrogen deficiency in the short term","Immediate crop toxicity from excess phosphorus","No effect on nitrogen availability"],"a":1,"e":"Microbes decomposing high-C:N residue draw heavily on available soil N, temporarily depriving the crop until decomposition progresses."},{"id":"Q0455","t":"Manures & Fertilizers","q":"The general recommendation to apply organic manures based on soil test and crop requirement, similar to fertilizers, reflects the principle that:","o":["Organic manures cannot be over-applied under any circumstances","Even organic nutrient sources should be managed judiciously to avoid nutrient imbalance or environmental loss","Only chemical fertilizers require careful dosing","Manure application rates are irrelevant to crop response"],"a":1,"e":"Excessive or unbalanced organic manure application can also cause nutrient imbalance, salt buildup, or environmental losses, so it too needs proper management."},{"id":"Q0979","t":"Manures & Fertilizers","q":"The main reason liquid biofertilizer formulations have gained popularity over traditional carrier-based (solid) formulations in some contexts is their:","o":["Complete lack of any living microorganisms","Generally longer shelf life, higher cell density, and ease of large-scale application, including through machinery/fertigation systems","Inability to be applied to seeds","Requirement for refrigeration at all times with no exceptions"],"a":1,"e":"Liquid formulations often offer improved shelf life, higher viable cell counts, and greater application flexibility (including via machinery) compared to some traditional carrier-based products."},{"id":"Q0433","t":"Manures & Fertilizers","q":"A key limitation often cited for purely organic nutrient management on a large scale is:","o":["Organic manures always contain higher nutrient concentration than fertilizers","Sufficient organic material is often not available in the quantities needed to meet crop nutrient demand promptly","Organic manures cannot improve soil structure","There is no scientific basis to organic farming"],"a":1,"e":"Bulky organics have relatively low nutrient concentrations, so meeting full crop nutrient demand from organics alone often requires very large quantities not always available."},{"id":"Q0407","t":"Manures & Fertilizers","q":"'Green leaf manuring' differs from 'in-situ green manuring' mainly in that green leaf manuring involves:","o":["Growing and incorporating the green manure crop in the same field where it is grown","Collecting green leaves/twigs from elsewhere (e.g., trees, shrubs) and incorporating them into a different field","Using only chemical fertilizers","Composting for over a year before use"],"a":1,"e":"Green leaf manuring uses biomass harvested from outside the target field (e.g., from trees/hedgerows), whereas in-situ green manuring is grown and incorporated on the spot."},{"id":"Q0401","t":"Manures & Fertilizers","q":"Farmyard manure (FYM), on an average fresh-weight basis, typically supplies approximately:","o":["0.5% N, 0.2% P2O5, 0.5% K2O","10% N, 10% P2O5, 10% K2O","0.01% N, 0.01% P2O5, 0.01% K2O","5% N, 5% P2O5, 5% K2O"],"a":0,"e":"Well-decomposed FYM commonly averages roughly 0.5% N, 0.2% P2O5 and 0.5% K2O, though it varies with source and management."},{"id":"Q0427","t":"Manures & Fertilizers","q":"The main advantage of applying farmyard manure along with chemical fertilizers, rather than fertilizer alone, includes:","o":["No benefit over fertilizer alone","Improved soil physical properties, enhanced microbial activity, and better nutrient use efficiency over the long term","Immediate elimination of the need for any fertilizer","Guaranteed doubling of yield in a single season"],"a":1,"e":"Combined use improves soil structure, water-holding capacity and biological activity while sustaining nutrient supply, generally outperforming fertilizer alone long-term."},{"id":"Q0421","t":"Manures & Fertilizers","q":"Continuous use of physiologically acidic fertilizers such as ammonium sulfate tends to:","o":["Raise soil pH over time","Lower soil pH over time, contributing to soil acidification","Have no effect on soil pH","Immediately neutralize soil acidity"],"a":1,"e":"Nitrification of the ammonium component releases H+, and repeated use gradually acidifies the soil."},{"id":"Q0444","t":"Manures & Fertilizers","q":"In integrated nutrient management recommendations, biofertilizers are generally viewed as:","o":["A complete substitute for all chemical fertilizer under all conditions","A complementary component that can reduce, but not usually fully replace, the chemical fertilizer requirement","Having no agronomic value","Only useful for ornamental plants"],"a":1,"e":"Biofertilizers typically supplement (partially substitute) chemical fertilizer needs rather than eliminating them entirely."},{"id":"Q0453","t":"Manures & Fertilizers","q":"City compost (municipal solid waste compost), used as a soil amendment, requires quality monitoring mainly for:","o":["Excess nitrogen only","Contamination with heavy metals, plastics and other non-biodegradable/toxic materials","Excess organic carbon, which is never a concern","High cost only"],"a":1,"e":"Municipal waste can carry heavy metals and non-biodegradable contaminants, so compost quality standards are needed before agricultural use."},{"id":"Q0457","t":"Manures & Fertilizers","q":"Long-term experiments comparing sole chemical fertilizer use with integrated use of fertilizer plus organic manure generally show that the integrated approach:","o":["Leads to declining soil organic carbon and yield sustainability over time","Better sustains soil organic carbon, soil fertility and long-term yield stability compared to fertilizer alone","Has identical long-term effects to fertilizer alone","Always reduces yield compared to fertilizer alone"],"a":1,"e":"Long-term trials (e.g., permanent manurial experiments) generally show integrated nutrient management better maintains soil organic carbon and sustainable productivity."},{"id":"Q0441","t":"Manures & Fertilizers","q":"Application of biofertilizers is generally recommended as seed treatment, seedling root dip, or soil application mainly because:","o":["They must be applied as foliar sprays only","These methods ensure good contact between the living inoculum and the plant root/rhizosphere for effective colonization","Biofertilizers cannot survive any contact with soil","They work only when mixed with chemical fertilizer"],"a":1,"e":"Direct placement near seed/root zone maximizes survival and establishment of the beneficial microorganisms in the rhizosphere."},{"id":"Q0413","t":"Manures & Fertilizers","q":"Mixed fertilizers differ from complex fertilizers in that mixed fertilizers are:","o":["Chemically synthesized as a single compound","Physical (mechanical) blends of two or more straight/complex fertilizers, without a defined chemical reaction between them","Never used in agriculture","Always liquid formulations"],"a":1,"e":"Mixed fertilizers are simple physical blends, whereas complex fertilizers form through a chemical manufacturing process."},{"id":"Q0428","t":"Manures & Fertilizers","q":"Well-decomposed compost is generally preferred over fresh/raw organic residue for direct field application mainly because compost:","o":["Has a wider, more stable C:N ratio and reduced risk of nitrogen immobilization or phytotoxicity","Contains no nutrients at all","Always has a higher C:N ratio than fresh residue","Causes greater nitrogen immobilization than fresh residue"],"a":0,"e":"Composting narrows the C:N ratio and stabilizes organic matter, reducing the temporary N immobilization and phytotoxic risks of fresh residues."},{"id":"Q0443","t":"Manures & Fertilizers","q":"Vermicompost, compared to conventional farmyard manure, is often reported to have:","o":["Lower nutrient content and no microbial activity","Relatively higher and more readily available nutrient content along with beneficial microbial and enzymatic activity","No effect on soil physical properties","Only mineral (no organic) content"],"a":1,"e":"The earthworm gut processing enriches nutrient availability and microbial/enzyme activity compared to raw or simply composted manure."},{"id":"Q0406","t":"Manures & Fertilizers","q":"Dhaincha (Sesbania) and sunhemp (Crotalaria) are widely used as green manure crops mainly because they:","o":["Are non-leguminous and add no nitrogen","Are fast-growing legumes capable of fixing atmospheric nitrogen and producing substantial biomass in a short period","Require very long duration t /* ===================== Utility: CSV ===================== */
function csvField(v){
  v = String(v==null?'':v);
  if (/[",\n]/.test(v)) v = '"' + v.replace(/"/g,'""') + '"';
  return v;
}
function toCsvRow(arr){ return arr.map(csvField).join(','); }
function parseCsvLine(line){
  var out=[], cur='', inQ=false;
  for (var i=0;i<line.length;i++){
    var c = line[i];
    if (inQ){
      if (c === '"'){ if (line[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
      else cur += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ','){ out.push(cur); cur=''; }
      else cur += c;
    }
  }
  out.push(cur);
  return out;
}

/* ===================== Grading ===================== */
function gradeAttempt(questions, answers){
  var correct=0, wrong=0, unattempted=0;
  var topicStats = {};
  questions.forEach(function(q){
    if (!topicStats[q.t]) topicStats[q.t] = {correct:0,total:0};
    topicStats[q.t].total++;
    var sel = answers[q.id];
    if (sel === undefined || sel === null){ unattempted++; return; }
    if (sel === q.a){ correct++; topicStats[q.t].correct++; }
    else { wrong++; }
  });
  var raw = correct*POS_MARK - wrong*NEG_MARK;
  var max = questions.length*POS_MARK;
  var pct = max>0 ? (raw/max*100) : 0;
  return { correct:correct, wrong:wrong, unattempted:unattempted, raw:raw, max:max, pct:pct, topicStats:topicStats };
}

/* ===================== Test start ===================== */
function shuffledCopy(arr){
  var pool = arr.slice();
  for (var i=pool.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var tmp=pool[i]; pool[i]=pool[j]; pool[j]=tmp; }
  return pool;
}

// Returns a fresh copy of a question with its options (and the correct-answer
// index, remapped to match) shuffled into a new order for this one attempt.
// The shared QUIZ_DATA question object is never mutated, so every student's
// browser produces its own independent option order.
function shuffleQuestionOptions(q){
  var order = shuffledCopy(q.o.map(function(_, i){ return i; }));
  var copy = {};
  for (var k in q){ copy[k] = q[k]; }
  copy.o = order.map(function(i){ return q.o[i]; });
  copy.a = order.indexOf(q.a);
  return copy;
}

function startTest(testId){
  var s = getStudent();
  if (!s){ STATE.view='dashboard'; render(); showToast('Please register first.'); window.scrollTo({top:0}); return; }
  var test = QUIZ_DATA.tests.filter(function(t){ return String(t.id)===String(testId); })[0];
  if (!test) return;
  // Each student gets their own randomized question order AND option order
  // for this attempt, so adjacent students in a hall are never looking at
  // the same question — or the same A/B/C/D arrangement — at the same time.
  var qOrder = shuffledCopy(test.questions).map(shuffleQuestionOptions);
  STATE.quiz = {
    mode:'test', testId:testId, testTitle:test.title, questions:qOrder, idx:0,
    answers:{}, marked:{}, startedAt: new Date().toISOString(),
    deadline: Date.now() + TEST_DURATION_SEC*1000
  };
  STATE.view = 'quiz';
  render();
  startTimerLoop();
}

var timerHandle = null;
function startTimerLoop(){
  if (timerHandle) clearInterval(timerHandle);
  timerHandle = setInterval(function(){
    if (!STATE.quiz || STATE.quiz.mode!=='test' || STATE.view!=='quiz'){ clearInterval(timerHandle); return; }
    var left = Math.round((STATE.quiz.deadline - Date.now())/1000);
    var el = document.getElementById('timer-display');
    if (el){ el.textContent = fmtClock(left); el.classList.toggle('low', left<300); }
    if (left<=0){ clearInterval(timerHandle); submitTest(true); }
  }, 1000);
}

        '<div><span class="legend-dot" style="background:var(--paper); border:1px solid var(--border)"></span>Not visited</div>' +
      '</div>' +
      '<button class="btn btn-gold btn-block" style="margin-top:14px;" data-open-submit="1">Submit test</button>' +
    '</div>';
  }
  inner += '</div>';

  return shell('', inner) + (STATE.showSubmitModal ? submitModal() : '');
}

function submitModal(){
  var qz = STATE.quiz;
  var answered = Object.keys(qz.answers).length;
  var marked = Object.keys(qz.marked||{}).length;
  var unanswered = qz.questions.length - answered;
  return '<div class="modal-backdrop" data-modal-backdrop="1"><div class="modal">' +
    '<h3>Submit test?</h3>' +
    '<p>You have answered <b>'+answered+'</b> of '+qz.questions.length+' questions ('+unanswered+' unanswered, '+marked+' marked for review). Once submitted, the timer stops and you\'ll see your result immediately.</p>' +
    '<div class="actions"><button class="btn btn-outline" data-close-submit="1">Keep working</button><button class="btn btn-gold" data-confirm-submit="1">Submit now</button></div>' +
  '</div></div>';
}

/* ===================== Submit / grade ===================== */
function submitTest(auto){
  if (timerHandle) clearInterval(timerHandle);
  var qz = STATE.quiz;
  var score = gradeAttempt(qz.questions, qz.answers);
  var attempt = {
    id: 'A' + Date.now(), type:'test', testId: qz.testId, testTitle: qz.testTitle,
    startedAt: qz.startedAt, submittedAt: new Date().toISOString(), auto: !!auto,
    answers: qz.answers, questions: qz.questions, score: score
  };
  addAttempt(attempt);
  STATE.reviewAttempt = attempt;
  STATE.showSubmitModal = false;
  STATE.view = 'results';
  render();
  if (auto) showToast('Time up — your test was submitted automatically.');
}

function finishPractice(){
  var qz = STATE.quiz;
  var score = gradeAttempt(qz.questions, qz.answers);
  var attempt = {
    id:'P'+Date.now(), type:'practice', topic:qz.topic,
    startedAt:qz.startedAt, submittedAt:new Date().toISOString(),
    answers:qz.answers, questions:qz.questions, score:score
  };
  addAttempt(attempt);
  STATE.reviewAttempt = attempt;
  STATE.view = 'results';
  render();
}

/* ===================== Results ===================== */
function renderResults(){
  var a = STATE.reviewAttempt;
  if (!a){ STATE.view='dashboard'; return renderDashboard(); }
  var s = a.score;
  var isTest = a.type === 'test';
  var student = getStudent() || {};

  var inner = '<div class="section">' +
    '<h2>'+(isTest? esc(a.testTitle) : 'Practice &middot; '+esc(a.topic))+' &mdash; Result</h2>' +
    '<p class="section-sub">Submitted ' + fmtDateTime(new Date(a.submittedAt)) + (a.auto? ' (auto-submitted at time limit)':'') + '</p>' +
    '<div class="summary-grid">' +
      '<div class="card stat-tile stat-correct"><div class="val">'+s.correct+'</div><div class="lbl">Correct</div></div>' +
      '<div class="card stat-tile stat-wrong"><div class="val">'+s.wrong+'</div><div class="lbl">Wrong</div></div>' +
      '<div class="card stat-tile stat-unattempt"><div class="val">'+s.unattempted+'</div><div class="lbl">Unattempted</div></div>' +
      '<div class="card stat-tile"><div class="val">'+s.raw.toFixed(1)+'/'+s.max+'</div><div class="lbl">Score'+(isTest?' (+'+POS_MARK+'/&minus;'+NEG_MARK+')':'')+'</div></div>' +
      '<div class="card stat-tile"><div class="val">'+s.pct.toFixed(1)+'%</div><div class="lbl">Percentage</div></div>' +
    '</div>' +
  '</div>';

  inner += '<div class="section"><h2>Topic-wise breakdown</h2><div class="card" style="padding:16px 20px;">';
  Object.keys(s.topicStats).sort().forEach(function(t){
    var ts = s.topicStats[t];
    var pct = ts.total? (ts.correct/ts.total*100):0;
    inner += '<div class="topicbar-row"><div class="tlabel">'+esc(t)+'</div>' +
      '<div class="topicbar-track"><div class="topicbar-fill" style="width:'+pct+'%"></div></div>' +
      '<div class="topicbar-num">'+ts.correct+'/'+ts.total+'</div></div>';
  });
  inner += '</div></div>';

  if (isTest){
    var mailtoBody = buildResultText(student, a, true);
    var plainBody = buildResultText(student, a, false);
    inner += '<div class="section"><h2>Send your result to the coordinator</h2>' +
      '<p class="section-sub">There\'s no central login for this app, so results are collected by email. One click below opens your mail app with everything filled in &mdash; just hit send.</p>' +
      '<div class="card" style="padding:18px 20px; display:flex; gap:10px; flex-wrap:wrap;">' +
        '<a class="btn btn-primary" href="mailto:'+CO_EMAIL+'?subject='+encodeURIComponent('AAU-Xafal Mock Result: '+a.testTitle+' - '+(student.name||''))+'&body='+encodeURIComponent(mailtoBody)+'">Email my result</a>' +
        '<button class="btn btn-outline" data-copy-result="1">Copy result text</button>' +
        '<button class="btn btn-outline" data-download-result="1">Download .txt</button>' +
      '</div>' +
    '</div>';
  }

  inner += '<div class="section" style="display:flex; gap:10px; flex-wrap:wrap;">' +
    (isTest ? '<button class="btn btn-primary" data-start-test="'+a.testId+'">Retake this test</button>' : '<button class="btn btn-primary" data-nav="practiceHome">Practice another topic</button>') +
    '<button class="btn btn-outline" data-nav="dashboard">Back to dashboard</button>' +
  '</div>';

  inner += '<div class="section"><h2>Full review</h2><p class="section-sub">Your answer, the correct answer, and a short explanation for every question.</p>';
  a.questions.forEach(function(q, i){
    var sel = a.answers[q.id];
    var tag = sel===undefined ? 'skip' : (sel===q.a ? 'correct' : 'wrong');
    var tagLabel = tag==='skip' ? 'Unattempted' : (tag==='correct' ? 'Correct' : 'Wrong');
    inner += '<div class="card review-item">' +
      '<div class="rmeta"><span class="rtag '+tag+'">'+tagLabel+'</span><span style="color:var(--ink-faint); font-size:12px;">Q'+(i+1)+' &middot; '+esc(q.t)+'</span></div>' +
      '<div class="q-text" style="font-size:14.5px;">'+esc(q.q)+'</div>' +
      q.o.map(function(opt,oi){
        var cls='opt'; if (oi===q.a) cls+=' correct'; else if (oi===sel) cls+=' incorrect';
        return '<div class="'+cls+'"><span class="optlet">'+String.fromCharCode(65+oi)+'</span><span>'+esc(opt)+'</span></div>';
      }).join('') +
      '<div class="explain">'+esc(q.e)+'</div>' +
    '</div>';
  });
  inner += '</div>';

  return shell('', inner);
}

function buildResultText(student, a, forEmail){
  var s = a.score;
  var lines = [];
  lines.push('AAU-Xafal — ARS-NET Soil Science Mock Test Result');
  lines.push('Test: ' + a.testTitle);
  lines.push('Name: ' + (student.name||''));
  lines.push('Discipline: ' + (student.discipline||''));
  lines.push('Email: ' + (student.email||''));
  lines.push('Phone: ' + (student.phone||''));
  lines.push('Submitted: ' + fmtDateTime(new Date(a.submittedAt)));
  lines.push('');
  lines.push('Correct: ' + s.correct + '   Wrong: ' + s.wrong + '   Unattempted: ' + s.unattempted);
  lines.push('Score: ' + s.raw.toFixed(1) + ' / ' + s.max + '   (' + s.pct.toFixed(1) + '%)');
  lines.push('');
  lines.push('--- Do not edit the line below: coordinator import data ---');
  lines.push(toCsvRow([student.name||'', student.discipline||'', student.email||'', student.phone||'',
    a.testTitle, s.correct, s.wrong, s.unattempted, s.raw.toFixed(1), s.max, s.pct.toFixed(1), a.submittedAt]));
  return lines.join('\n');
}

/* ===================== History ===================== */
function renderHistory(){
  var atts = getAttempts();
  var inner = '<div class="section"><h2>Your history</h2><p class="section-sub">Stored on this device. Test and practice attempts you\'ve completed here.</p>';
  if (!atts.length){
    inner += '<div class="card empty-state">No attempts yet. Start a mock test or a practice set to see it here.</div>';
  } else {
    inner += '<div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Type</th><th>Name</th><th>Score</th><th>%</th><th></th></tr></thead><tbody>';
    atts.forEach(function(a){
      var label = a.type==='test' ? a.testTitle : ('Practice: '+a.topic);
      inner += '<tr><td>'+fmtDateTime(new Date(a.submittedAt))+'</td><td>'+(a.type==='test'?'Mock test':'Practice')+'</td><td>'+esc(label)+'</td>' +
        '<td>'+a.score.raw.toFixed(1)+'/'+a.score.max+'</td><td>'+a.score.pct.toFixed(1)+'%</td>' +
        '<td><button class="btn btn-outline btn-sm" data-view-attempt="'+a.id+'">Review</button></td></tr>';
    });
    inner += '</tbody></table></div>';
  }
  inner += '</div>';
  return shell('history', inner);
}

/* ===================== Admin ===================== */
var ADMIN_PASS = 'AAU-SOIL-2026';
function renderAdmin(){
  if (!STATE.admin.unlocked && !lsGet(LS.adminOk,false)){
    return shell('admin', '<div class="card lock-gate"><h3>Coordinator area</h3>' +
      '<p style="font-size:13px; color:var(--ink-dim);">This is a light barrier, not real security &mdash; anyone with the passcode below (shown to you, the coordinator) can enter. Default passcode: <code>'+ADMIN_PASS+'</code></p>' +
      '<input id="admin-pass-input" type="password" placeholder="Passcode"/>' +
      '<button class="btn btn-primary btn-block" data-admin-unlock="1">Enter</button></div>');
  }
  var rows = lsGet(LS.adminRows, []);
  var localAtts = getAttempts().filter(function(a){return a.type==='test';});

  var inner = '<div class="section"><h2>Coordinator dashboard</h2>' +
    '<p class="section-sub">Students submit results by email (or copy/paste). Paste any number of result emails below &mdash; the importer finds the data line in each and builds the leaderboard automatically.</p>' +
    '<div class="card" style="padding:18px 20px;">' +
      '<label style="font-size:12px; font-weight:600; color:var(--ink-dim);">Paste one or more student result emails here</label>' +
      '<textarea class="import-box" id="import-box" placeholder="Paste the full email text (or just the data line) from one or more students, one after another..."></textarea>' +
      '<div style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap;">' +
        '<button class="btn btn-primary btn-sm" data-import-csv="1">Import pasted results</button>' +
        '<label class="btn btn-outline btn-sm" style="cursor:pointer;">Upload .txt/.csv file<input type="file" id="import-file" accept=".txt,.csv" style="display:none;"/></label>' +
        '<button class="btn btn-outline btn-sm" data-export-csv="1">Export leaderboard CSV</button>' +
        '<button class="btn btn-ghost btn-sm" data-clear-admin="1">Clear all imported rows</button>' +
      '</div>' +
    '</div>' +
  '</div>';

  inner += '<div class="section"><h2>Leaderboard ('+rows.length+' imported result'+(rows.length===1?'':'s')+')</h2>';
  if (!rows.length){
    inner += '<div class="card empty-state">No results imported yet.</div>';
  } else {
    var sorted = rows.slice().sort(function(a,b){ return parseFloat(b.pct) - parseFloat(a.pct); });
    inner += '<div class="table-wrap"><table class="data-table"><thead><tr><th>#</th><th>Name</th><th>Discipline</th><th>Email</th><th>Test</th><th>Score</th><th>%</th><th>Submitted</th></tr></thead><tbody>';
    sorted.forEach(function(r,i){
      inner += '<tr><td>'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.discipline)+'</td><td>'+esc(r.email)+'</td><td>'+esc(r.test)+'</td>' +
        '<td>'+esc(r.score)+'/'+esc(r.max)+'</td><td>'+esc(r.pct)+'%</td><td>'+esc((r.date||'').slice(0,10))+'</td></tr>';
    });
    inner += '</tbody></table></div>';
  }
  inner += '</div>';

  inner += '<div class="section"><h2>Attempts recorded on this device</h2><p class="section-sub">If you proctor tests on a shared/lab computer, attempts taken on it also show here directly &mdash; no import needed.</p>';
  if (!localAtts.length){
    inner += '<div class="card empty-state">No test attempts on this device yet.</div>';
  } else {
    inner += '<div class="table-wrap"><table class="data-table"><thead><tr><th>Test</th><th>Score</th><th>%</th><th>Submitted</th></tr></thead><tbody>';
    localAtts.forEach(function(a){
      inner += '<tr><td>'+esc(a.testTitle)+'</td><td>'+a.score.raw.toFixed(1)+'/'+a.score.max+'</td><td>'+a.score.pct.toFixed(1)+'%</td><td>'+fmtDateTime(new Date(a.submittedAt))+'</td></tr>';
    });
    inner += '</tbody></table></div>';
  }
  inner += '</div>';

  return shell('admin', inner);
}

function importResultText(text){
  var lines = text.split('\n');
  var added = 0;
  var rows = lsGet(LS.adminRows, []);
  lines.forEach(function(line){
    line = line.trim();
    if (!line || line.indexOf(',') === -1) return;
    var f = parseCsvLine(line);
    if (f.length < 12) return;
    // columns: name,discipline,email,phone,test,correct,wrong,unattempted,score,max,pct,date
    var correctN = parseFloat(f[5]), maxN = parseFloat(f[9]), pctN = parseFloat(f[10]);
    if (isNaN(maxN) || isNaN(pctN)) return;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f[2])) return;
    rows.push({ name:f[0], discipline:f[1], email:f[2], phone:f[3], test:f[4],
      correct:f[5], wrong:f[6], unattempted:f[7], score:f[8], max:f[9], pct:f[10], date:f[11] });
    added++;
  });
  lsSet(LS.adminRows, rows);
  return added;
}

/* ===================== Toast ===================== */
function showToast(msg){
  var el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3200);
}

/* ===================== Event binding ===================== */
function bindGlobalEvents(){
  root.querySelectorAll('[data-nav]').forEach(function(el){
    el.addEventListener('click', function(){
      var v = el.getAttribute('data-nav');
      if (v === 'editReg'){ STATE.editingReg = true; STATE.view='dashboardEdit'; renderEditWrap(); return; }
      STATE.view = v; STATE.quiz=null; render();
    });
  });
  var regSave = document.getElementById('reg-save');
  if (regSave) regSave.addEventListener('click', function(){
    var s = validateReg();
    if (s){ setStudent(s); STATE.editingReg=false; STATE.view='dashboard'; render(); showToast('Details saved.'); }
  });

  root.querySelectorAll('[data-start-test]').forEach(function(el){
    el.addEventListener('click', function(){ startTest(el.getAttribute('data-start-test')); });
  });
  root.querySelectorAll('[data-practice-topic]').forEach(function(el){
    el.addEventListener('click', function(){
      startPractice(el.getAttribute('data-practice-topic'), parseInt(el.getAttribute('data-practice-n'),10));
    });
  });

  // quiz interactions
  root.querySelectorAll('[data-select-opt]').forEach(function(el){
    el.addEventListener('click', function(){
      var qz = STATE.quiz; var q = qz.questions[qz.idx];
      qz.answers[q.id] = parseInt(el.getAttribute('data-select-opt'),10);
      render();
    });
  });
  var checkBtn = root.querySelector('[data-practice-check]');
  if (checkBtn) checkBtn.addEventListener('click', function(){
    var qz = STATE.quiz; var q = qz.questions[qz.idx];
    qz.revealed[q.id] = true; render();
  });
  root.querySelectorAll('[data-quiz-nav]').forEach(function(el){
    el.addEventListener('click', function(){
      var qz = STATE.quiz; var dir = el.getAttribute('data-quiz-nav');
      if (dir==='next' && qz.idx < qz.questions.length-1) qz.idx++;
      if (dir==='prev' && qz.idx>0) qz.idx--;
      render(); if (qz.mode==='test') startTimerLoop();
    });
  });
  root.querySelectorAll('[data-quiz-jump]').forEach(function(el){
    el.addEventListener('click', function(){
      STATE.quiz.idx = parseInt(el.getAttribute('data-quiz-jump'),10); render(); startTimerLoop();
    });
  });
  var clearBtn = root.querySelector('[data-quiz-clear]');
  if (clearBtn) clearBtn.addEventListener('click', function(){
    var qz = STATE.quiz; delete qz.answers[qz.questions[qz.idx].id]; render(); startTimerLoop();
  });
  var markBtn = root.querySelector('[data-quiz-mark]');
  if (markBtn) markBtn.addEventListener('click', function(){
    var qz = STATE.quiz; var qid = qz.questions[qz.idx].id;
    qz.marked[qid] = !qz.marked[qid]; render(); startTimerLoop();
  });
  var openSubmit = root.querySelector('[data-open-submit]');
  if (openSubmit) openSubmit.addEventListener('click', function(){ STATE.showSubmitModal = true; render(); startTimerLoop(); });
  var closeSubmit = root.querySelector('[data-close-submit]');
  if (closeSubmit) closeSubmit.addEventListener('click', function(){ STATE.showSubmitModal = false; render(); startTimerLoop(); });
  var confirmSubmit = root.querySelector('[data-confirm-submit]');
  if (confirmSubmit) confirmSubmit.addEventListener('click', function(){ submitTest(false); });
  var backdrop = root.querySelector('[data-modal-backdrop]');
  if (backdrop) backdrop.addEventListener('click', function(e){ if (e.target===backdrop){ STATE.showSubmitModal=false; render(); startTimerLoop(); } });

  var quitPractice = root.querySelector('[data-quit-practice]');
  if (quitPractice) quitPractice.addEventListener('click', function(){ STATE.view='practiceHome'; STATE.quiz=null; render(); });
  var finishPracticeBtn = root.querySelector('[data-finish-practice]');
  if (finishPracticeBtn) finishPracticeBtn.addEventListener('click', finishPractice);

  root.querySelectorAll('[data-view-attempt]').forEach(function(el){
    el.addEventListener('click', function(){
      var id = el.getAttribute('data-view-attempt');
      var a = getAttempts().filter(function(x){return x.id===id;})[0];
      if (a){ STATE.reviewAttempt = a; STATE.view='results'; render(); }
    });
  });

  var copyBtn = root.querySelector('[data-copy-result]');
  if (copyBtn) copyBtn.addEventListener('click', function(){
    var text = buildResultText(getStudent()||{}, STATE.reviewAttempt, false);
    copyToClipboard(text);
  });
  var dlBtn = root.querySelector('[data-download-result]');
  if (dlBtn) dlBtn.addEventListener('click', function(){
    var text = buildResultText(getStudent()||{}, STATE.reviewAttempt, false);
    var fname = 'arsnet_result_' + (STATE.reviewAttempt.testId||'practice') + '.txt';
    if (downloadsCap){
      downloadsCap.save({filename:fname, data:text}).then(function(){ showToast('Saved.'); }).catch(function(err){
        if (err && err.code === 'declined') return;
        fallbackCopy(text);
      });
    } else { fallbackCopy(text); }
  });
  function fallbackCopy(text){ copyToClipboard(text); showToast('Download unavailable here — copied the result text instead.'); }

  // admin
  var passInput = document.getElementById('admin-pass-input');
  var unlockBtn = root.querySelector('[data-admin-unlock]');
  if (unlockBtn) unlockBtn.addEventListener('click', function(){
    if (passInput && passInput.value === ADMIN_PASS){ STATE.admin.unlocked = true; lsSet(LS.adminOk, true); render(); }
    else showToast('Incorrect passcode.');
  });
  var importBtn = root.querySelector('[data-import-csv]');
  if (importBtn) importBtn.addEventListener('click', function(){
    var box = document.getElementById('import-box');
    var n = importResultText(box.value);
    showToast(n + ' result' + (n===1?'':'s') + ' imported.');
    render();
  });
  var fileInput = document.getElementById('import-file');
  if (fileInput) fileInput.addEventListener('change', function(){
    var f = fileInput.files[0]; if (!f) return;
    var reader = new FileReader();
    reader.onload = function(){ var n = importResultText(String(reader.result)); showToast(n+' result'+(n===1?'':'s')+' imported.'); render(); };
    reader.readAsText(f);
  });
  var exportBtn = root.querySelector('[data-export-csv]');
  if (exportBtn) exportBtn.addEventListener('click', function(){
    var rows = lsGet(LS.adminRows, []);
    var header = ['Name','Discipline','Email','Phone','Test','Correct','Wrong','Unattempted','Score','Max','Percentage','Date'];
    var csv = [toCsvRow(header)].concat(rows.map(function(r){
      return toCsvRow([r.name,r.discipline,r.email,r.phone,r.test,r.correct,r.wrong,r.unattempted,r.score,r.max,r.pct,r.date]);
    })).join('\n');
    var fname = 'arsnet_leaderboard.csv';
    if (downloadsCap){
      downloadsCap.save({filename:fname, data:csv}).then(function(){ showToast('Leaderboard exported.'); }).catch(function(){ fallbackCopy(csv); });
    } else fallbackCopy(csv);
  });
  var clearAdminBtn = root.querySelector('[data-clear-admin]');
  if (clearAdminBtn) clearAdminBtn.addEventListener('click', function(){
    if (confirm('Clear all imported leaderboard rows on this device?')){ lsSet(LS.adminRows, []); render(); }
  });
}

function copyToClipboard(text){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ showToast('Copied to clipboard.'); }).catch(function(){ legacyCopy(text); });
  } else legacyCopy(text);
}
function legacyCopy(text){
  try{
    var ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('Copied to clipboard.');
  }catch(e){ showToast('Could not copy — please select the text manually.'); }
}

/* editing registration from dashboard */
function renderEditWrap(){
  var inner = '<div class="section">' + renderRegForm(true) + '<div style="margin-top:10px;"><button class="btn btn-ghost btn-sm" data-nav="dashboard">Cancel</button></div></div>';
  root.innerHTML = shell('dashboard', inner);
  bindGlobalEvents();
}

/* ===================== Init ===================== */
render();

</script>
