ge sludge/wastewater","Excessive rainfall alone, with no external source","Certain phosphatic fertilizers and pesticides containing trace heavy metals"],"a":2,"e":"Rainfall itself does not introduce heavy metals; pollution requires an external metal source such as industrial, agricultural or waste inputs."},{"id":"Q0934","t":"Soil Pollution","q":"'Bioconcentration factor' (BCF), used in ecotoxicology, expresses:","o":["The total mass of a pollutant applied to soil","The ratio of a contaminant's concentration in an organism's tissue to its concentration in the surrounding environment (e.g., soil or water), indicating bioaccumulation potential","The rate of soil erosion","The pH of a contaminated soil"],"a":1,"e":"BCF quantifies how much a contaminant accumulates in an organism relative to its environmental concentration, a key metric for assessing bioaccumulation risk."},{"id":"Q0545","t":"Soil Pollution","q":"Lead (Pb) contamination of soils near roadways historically resulted largely from:","o":["Organic manure use","Leaded gasoline emissions before its phase-out, along with some industrial sources","Nitrogen fertilizer use","Natural background levels only, with no human contribution"],"a":1,"e":"Combustion of leaded fuel deposited significant lead along roadsides before unleaded fuel became standard; industrial emissions also contribute."},{"id":"Q0546","t":"Soil Pollution","q":"Which best describes 'ecotoxicological risk assessment' of a contaminated soil?","o":["Measuring only soil color","Evaluating the potential adverse effects of soil contaminants on organisms (plants, soil fauna, microbes) and ecosystem function","Measuring only crop market price","Determining only soil bulk density"],"a":1,"e":"Ecotoxicological assessment evaluates actual biological risk/harm posed by contaminants to organisms and ecosystem processes, beyond just total concentration."},{"id":"Q0935","t":"Soil Pollution","q":"'Biomagnification' in a food chain refers to the phenomenon where a contaminant's concentration:","o":["Decreases progressively at each successive trophic (feeding) level","Increases progressively at each successive trophic level, becoming most concentrated in top predators","Remains constant at every trophic level","Is completely eliminated by the second trophic level"],"a":1,"e":"Biomagnification describes the progressive concentration increase of certain persistent contaminants (e.g., some organochlorines, mercury) as they move up a food chain, reaching highest levels in top predators."},{"id":"Q0531","t":"Soil Pollution","q":"'Phytovolatilization' refers to a plant-based remediation process in which contaminants are:","o":["Taken up by plants and released to the atmosphere in a volatile (often less toxic) form through transpiration","Bound permanently to root surfaces","Converted entirely into plant biomass and never released","Prevented from entering the plant at all"],"a":0,"e":"Certain plants can take up specific contaminants (e.g., some selenium or mercury species) and release volatile derivatives via transpiration."},{"id":"Q0559","t":"Soil Pollution","q":"Which factor generally makes remediation of heavy-metal-contaminated soil more challenging than remediation of many organic pollutant-contaminated soils?","o":["Heavy metals readily biodegrade into harmless compounds","Metals cannot be destroyed/degraded like many organic pollutants; they can only be transformed in speciation, immobilized, or physically removed","Heavy metals volatilize completely on their own","Metal contamination never persists in soil"],"a":1,"e":"Unlike many organics that microbes can break down to simpler, often less toxic products, elemental metals persist and require immobilization, extraction, or speciation change rather than destruction."},{"id":"Q0942","t":"Soil Pollution","q":"Which best explains why bioremediation is often considered a more environmentally sustainable approach to contaminated site management compared to complete excavation and landfill disposal?","o":["Bioremediation always costs significantly more than excavation","Bioremediation can treat contamination in place (in situ), often using natural or enhanced biological processes, minimizing disturbance, transport, and off-site disposal burden","Bioremediation is completely ineffective for all contaminant types","Excavation and disposal has zero environmental impact"],"a":1,"e":"In-situ bioremediation approaches can address contamination with reduced site disturbance and without the transport/disposal burden associated with excavating and landfilling contaminated soil."},{"id":"Q0556","t":"Soil Pollution","q":"A general strategy to reduce arsenic accumulation in rice grain, given arsenic-affected paddy soils, includes:","o":["Continuous flooding throughout the crop cycle, which favours arsenite uptake","Alternate wetting and drying (intermittent irrigation) to reduce the reduced, more mobile arsenite form and limit uptake","Increasing flooding depth further","Avoiding any water management change"],"a":1,"e":"Since flooded, reducing conditions favour more mobile/available arsenite, intermittent aeration (AWD) can help reduce arsenic uptake by rice."},{"id":"Q0903","t":"Soil Pollution","q":"The Langmuir sorption isotherm model, unlike the simpler Freundlich model, explicitly assumes:","o":["Infinite sorption capacity of the soil surface","A finite number of specific sorption sites, leading to a maximum sorption capacity (saturation) as concentration increases","No relationship between concentration and sorption at all","That sorption is always irreversible"],"a":1,"e":"The Langmuir model assumes a finite, saturable number of sorption sites, giving a maximum sorption capacity, unlike the Freundlich model, which does not impose an explicit saturation limit."},{"id":"Q0529","t":"Soil Pollution","q":"'Phytoextraction', a phytoremediation mechanism, refers to plants that:","o":["Convert pollutants into volatile forms released to the atmosphere","Absorb and accumulate contaminants (e.g., heavy metals) in their above-ground harvestable tissues, which are then removed from the site","Immobilize contaminants only in the root zone without uptake","Prevent any water from moving through the soil"],"a":1,"e":"Phytoextraction plants take up and concentrate metals in shoots, which are harvested and removed, progressively lowering soil metal content."},{"id":"Q0519","t":"Soil Pollution","q":"Cadmium contamination of agricultural soils is often linked to long-term use of:","o":["Farmyard manure only","Certain rock-phosphate-derived phosphatic fertilizers that carry cadmium as a trace impurity","Pure nitrogen fertilizers","Gypsum only"],"a":1,"e":"Some phosphate rock sources contain cadmium impurities that can accumulate in soil with repeated phosphatic fertilizer use."},{"id":"Q0893","t":"Soil Pollution","q":"Radioactive contamination of soil can arise from sources including:","o":["Nuclear accident fallout and, at trace levels, naturally occurring radionuclides sometimes associated with certain phosphate rock-derived fertilizers","Only organic manure application, never fertilizers","Only irrigation with rainwater","Complete absence of any natural radioactive sources"],"a":0,"e":"Beyond accidental fallout, some phosphate rock sources contain trace naturally occurring radionuclides (e.g., uranium series) that can accumulate with long-term fertilizer use."},{"id":"Q0535","t":"Soil Pollution","q":"Microbial bioremediation of petroleum hydrocarbon-contaminated soils commonly relies on hydrocarbon-degrading bacteria such as species of:","o":["Rhizobium","Pseudomonas","Nitrosomonas","Frankia"],"a":1,"e":"Pseudomonas and related genera possess enzymatic pathways capable of degrading various petroleum hydrocarbon compounds."}],"Remote Sensing & DSM":[{"id":"Q0804","t":"Remote Sensing & DSM","q":"Cartosat, an Indian remote sensing satellite series, is particularly notable for providing high-resolution data suited to:","o":["Only ocean color monitoring","Detailed topographic mapping and generation of digital elevation models, given its stereoscopic imaging capability","Only atmospheric temperature profiling","Only soil chemical analysis"],"a":1,"e":"Cartosat satellites, with stereo imaging capability, are especially used for large-scale topographic mapping and DEM generation in India."},{"id":"Q0702","t":"Remote Sensing & DSM","q":"The 'topographic wetness index' (TWI), derived from a DEM, is used in digital soil mapping to estimate:","o":["Soil color directly","The relative tendency of a landscape position to accumulate water based on upslope contributing area and local slope","Soil mineralogical composition","Atmospheric humidity"],"a":1,"e":"TWI combines upslope contributing area and local slope to indicate where water is likely to accumulate, correlating with soil moisture/drainage patterns."},{"id":"Q0722","t":"Remote Sensing & DSM","q":"In precision agriculture, variable rate application of fertilizer is guided by spatial data (e.g., soil test maps, remote sensing indices) mainly to:","o":["Apply a single uniform fertilizer rate across the entire field regardless of variability","Match fertilizer application rate to the spatially varying needs/fertility of different zones within a field, improving efficiency and reducing waste","Eliminate the need for any soil testing","Increase fertilizer use uniformly without regard to crop need"],"a":1,"e":"Variable rate technology applies inputs according to mapped spatial variability in soil fertility/crop need, improving efficiency compared to blanket uniform application."},{"id":"Q0718","t":"Remote Sensing & DSM","q":"A soil-adjusted vegetation index (SAVI) improves upon the standard NDVI mainly by:","o":["Ignoring vegetation entirely","Incorporating a soil brightness correction factor to reduce the influence of background soil reflectance, especially useful in areas of sparse vegetation cover","Requiring thermal infrared data exclusively","Eliminating the need for any red or NIR band data"],"a":1,"e":"SAVI adds a soil adjustment factor to minimize the confounding effect of variable soil background brightness on vegetation index values, particularly where canopy cover is incomplete."},{"id":"Q0778","t":"Remote Sensing & DSM","q":"Unsupervised classification of remotely sensed imagery differs from supervised classification mainly in that unsupervised classification:","o":["Requires extensive training samples before processing","Groups pixels into spectral clusters automatically based on statistical similarity, with class identity assigned/labelled afterward by the analyst","Cannot be performed by any software","Is identical in procedure to supervised classification"],"a":1,"e":"Unsupervised methods (e.g., ISODATA, k-means) cluster pixels by spectral similarity first; the analyst interprets and labels clusters afterward using reference knowledge."},{"id":"Q0794","t":"Remote Sensing & DSM","q":"ISRIC's SoilGrids is an example of:","o":["A commercial soil testing laboratory chain","A global digital soil mapping product providing gridded predictions of soil properties at multiple depths, derived using machine learning and global covariate data","A single-country soil classification manual only","A type of soil moisture sensor"],"a":1,"e":"SoilGrids is a widely used global digital soil mapping system that predicts soil properties spatially using machine learning models and globally available covariates."},{"id":"Q0790","t":"Remote Sensing & DSM","q":"Principal Component Analysis (PCA), when applied to multispectral image data, is used mainly to:","o":["Increase the number of spectral bands artificially","Reduce data redundancy by transforming correlated original bands into a smaller set of uncorrelated components that capture most of the image variance","Directly measure soil salinity","Replace the need for ground truthing"],"a":1,"e":"PCA condenses highly correlated multi-band data into fewer components, retaining most information while reducing redundancy for easier analysis/interpretation."},{"id":"Q0724","t":"Remote Sensing & DSM","q":"'Spectral libraries' of soil samples, built from laboratory Vis-NIR/MIR spectral measurements linked to known soil properties, are used mainly to:","o":["Store only soil color photographs","Calibrate predictive models that estimate soil properties (e.g., organic carbon, texture) rapidly from new spectral measurements, reducing the need for extensive wet chemistry","Replace the need for any soil sampling ever","Measure only soil temperature"],"a":1,"e":"Reference spectral libraries with known property values allow chemometric models to be built, enabling rapid, low-cost prediction of soil properties from spectra of new samples."},{"id":"Q0812","t":"Remote Sensing & DSM","q":"Accuracy assessment of a remote sensing-derived classification map is typically carried out by comparing classified results against:","o":["No reference data at all","Independent reference/ground truth data (e.g., field observations or high-resolution imagery) using a confusion (error) matrix and derived accuracy statistics","Only the training data used to build the classifier, with no independent check","Randomly generated numbers"],"a":1,"e":"Accuracy assessment compares classification results against independent reference data, summarized in an error matrix, to quantify overall and class-specific accuracy."},{"id":"Q0696","t":"Remote Sensing & DSM","q":"Iron oxide content in soil (e.g., hematite) tends to produce characteristic:","o":["Absorption features and reddish appearance in the visible spectrum, exploitable for mapping iron-rich soils","No detectable spectral signature","Only thermal infrared changes","Only microwave scattering changes"],"a":0,"e":"Iron oxides produce distinctive absorption features (e.g., near 550 and 900 nm) and impart a reddish visible-spectrum signature useful for remote identification."},{"id":"Q0782","t":"Remote Sensing & DSM","q":"A 'salinity index' derived from satellite reflectance bands is used to:","o":["Estimate the relative degree of surface soil salinity based on characteristic reflectance patterns of salt-affected soils","Measure soil organic carbon directly","Estimate rainfall amount","Measure soil temperature only"],"a":0,"e":"Salinity indices combine specific spectral bands (often visible/NIR) exploiting the distinct brightness/reflectance behaviour of salt-affected soils to help map relative salinity."},{"id":"Q0810","t":"Remote Sensing & DSM","q":"Slope and aspect, two key terrain attributes derived from a DEM, are useful in digital soil mapping mainly because they influence:","o":["Nothing related to soil properties","Solar radiation received, drainage/erosion patterns, and microclimate, all of which affect soil development and properties","Only the map's visual color scheme","Only the satellite's orbital path"],"a":1,"e":"Slope affects drainage/erosion and aspect affects solar exposure/microclimate, both of which are strongly linked to systematic variation in soil properties across a landscape."},{"id":"Q0693","t":"Remote Sensing & DSM","q":"The Normalized Difference Vegetation Index (NDVI) is calculated using reflectance in which two spectral bands?","o":["Blue and thermal infrared","Red and near-infrared","Only visible bands","Only microwave bands"],"a":1,"e":"NDVI = (NIR − Red)/(NIR + Red), exploiting the strong NIR reflectance and red absorption of healthy vegetation."},{"id":"Q0697","t":"Remote Sensing & DSM","q":"A Geographic Information System (GIS) is best defined as a system designed to:","o":["Only capture photographs of the Earth's surface","Capture, store, manage, analyse and display spatially referenced (geographic) data","Only measure atmospheric temperature","Only perform laboratory chemical analysis"],"a":1,"e":"GIS integrates hardware, software and data to work with spatially referenced information for analysis, mapping and decision support."},{"id":"Q0789","t":"Remote Sensing & DSM","q":"IRS (Indian Remote Sensing) satellites, developed by ISRO, have been widely used in India for applications including:","o":["Only international weather forecasting for other countries","Land use/land cover mapping, crop monitoring, and natural resource assessment, including soil survey support","Only ocean navigation","Only satellite communication"],"a":1,"e":"IRS satellites with sensors like LISS have supported extensive Indian natural resource, agricultural and land use applications, including soil-related studies."},{"id":"Q0785","t":"Remote Sensing & DSM","q":"LiDAR (Light Detection and Ranging) is a remote sensing technology particularly valued for producing very high-resolution:","o":["Soil chemical maps directly","Digital elevation models/terrain data, by measuring the time-of-flight of laser pulses reflected from the surface","Soil color classifications","Soil salinity maps directly"],"a":1,"e":"LiDAR precisely measures distance to the surface via laser pulses, enabling generation of highly detailed elevation/terrain models."},{"id":"Q0783","t":"Remote Sensing & DSM","q":"A 'brightness index' (BI), calculated from visible-band reflectance, is sometimes used in soil remote sensing as a general indicator of:","o":["Soil organic matter and moisture status (darker/lower BI often indicating higher organic matter or moisture)","Cation exchange capacity directly","Soil microbial biomass","Soil temperature regime"],"a":0,"e":"Because organic matter and moisture both tend to darken soil, brightness indices provide a simple proxy related to these properties, though not a precise direct measurement."},{"id":"Q0796","t":"Remote Sensing & DSM","q":"In digital soil mapping workflows, cross-validation of a predictive model is used mainly to:","o":["Guarantee a perfect prediction with zero error","Assess how well the model is likely to predict soil properties at new, unsampled locations by testing it against data withheld from model training","Eliminate the need for any field sampling from the start","Only visualize the raw covariate layers"],"a":1,"e":"Cross-validation partitions data into training and testing subsets (repeated systematically) to give an honest estimate of a model's predictive performance on unseen locations."},{"id":"Q0798","t":"Remote Sensing & DSM","q":"A reconnaissance-level soil survey, conducted at a small map scale (e.g., 1:250,000 or smaller), is generally intended for:","o":["Detailed individual farm-level fertilizer recommendations","Broad regional planning purposes, providing a general overview of soil distribution rather than field-level detail","Precision agriculture management zones within a single field","Determining exact plant spacing"],"a":1,"e":"Reconnaissance surveys cover large areas at coarse detail, suitable for broad regional resource assessment and planning rather than fine, farm-scale decisions."},{"id":"Q0698","t":"Remote Sensing & DSM","q":"In GIS, 'raster' data format represents spatial information as:","o":["Points, lines and polygons with defined boundaries","A grid of regularly sized cells (pixels), each holding an attribute value","Only textual attribute tables with no spatial component","Three-dimensional solid models only"],"a":1,"e":"Raster data divides space into a regular grid of cells, each assigned a value — common for satellite imagery and continuous surfaces like elevation."},{"id":"Q0811","t":"Remote Sensing & DSM","q":"'Change detection' analysis using multi-temporal (different date) satellite imagery is used mainly to:","o":["Only produce a single static map with no time dimension","Identify and quantify changes in land cover/use or surface conditions over time by comparing imagery from different dates","Replace the need for any classification accuracy assessment","Only work with a single image date"],"a":1,"e":"Change detection compares imagery from two or more time periods to identify areas of land cover/use change, useful for monitoring degradation, expansion, or recovery."},{"id":"Q0808","t":"Remote Sensing & DSM","q":"In digital soil mapping, 'covariates' (predictor variables) commonly derived from terrain, climate and remote sensing data are used to:","o":["Directly replace the need for any soil property measurements","Statistically relate to and help predict the spatial distribution of soil properties/classes across a landscape","Only serve as background decoration on maps","Measure soil pH directly without any model"],"a":1,"e":"Covariates capture environmental factors correlated with soil formation/properties, serving as predictor inputs in the statistical/machine-learning models underlying DSM."},{"id":"Q0695","t":"Remote Sensing & DSM","q":"Increasing soil moisture content generally causes soil reflectance to:","o":["Increase sharply across all wavelengths","Decrease, as water absorption reduces overall reflected energy, making wet soil appear darker than dry soil","Remain completely unaffected","Only affect the thermal band, with no visible effect"],"a":1,"e":"Water strongly absorbs radiation at several wavelengths, so wetter soils generally show lower reflectance (appear darker) than dry soils of the same composition."},{"id":"Q0787","t":"Remote Sensing & DSM","q":"'Spatial resolution', 'spectral resolution', 'radiometric resolution', and 'temporal resolution' together describe the:","o":["Cost of a satellite mission only","Key characteristics defining the capability of a remote sensing imaging system","Only the launch date of a satellite","Only the orbit altitude"],"a":1,"e":"These four resolution types collectively describe a sensor's ground detail, spectral discrimination, brightness discrimination and revisit frequency capabilities."},{"id":"Q0719","t":"Remote Sensing & DSM","q":"'Spatial interpolation' in soil mapping refers to the process of:","o":["Measuring soil properties at every possible location directly","Estimating soil property values at unsampled locations based on values observed at nearby sampled points","Converting vector data into tabular data only","Removing outliers from a dataset"],"a":1,"e":"Since sampling every point is impractical, interpolation methods (e.g., kriging, IDW) predict values at unsampled locations from surrounding sample data."},{"id":"Q0809","t":"Remote Sensing & DSM","q":"The term 'pixel' in a digital remote sensing image refers to:","o":["A vector polygon boundary","The smallest individual grid cell/picture element in a raster image, each holding a single value representing the ground area it covers","A GPS coordinate point only","A type of GIS software tool"],"a":1,"e":"A pixel is the fundamental unit of a raster image, representing the average reflectance/value over the small ground area it corresponds to."},{"id":"Q0802","t":"Remote Sensing & DSM","q":"'Overlay analysis' in GIS, combining multiple spatial data layers (e.g., soil type, slope, land use), is used mainly to:","o":["Store only tabular data with no spatial component","Identify spatial relationships and combined conditions across layers, such as areas meeting multiple suitability criteria simultaneously","Replace the need for any single data layer","Only work with satellite imagery, never other data"],"a":1,"e":"Overlay analysis integrates multiple spatial layers to identify locations satisfying combined criteria, central to many land suitability and planning applications."},{"id":"Q0716","t":"Remote Sensing & DSM","q":"Spatial resolution of a remote sensing image refers to:","o":["The number of spectral bands captured","The ground area represented by a single image pixel (smaller pixel size = finer/higher spatial resolution)","The frequency with which a satellite revisits an area","The radiometric bit-depth of the sensor"],"a":1,"e":"Spatial resolution describes the smallest ground feature size distinguishable, corresponding to the ground area covered by one pixel."},{"id":"Q0707","t":"Remote Sensing & DSM","q":"'Proximal soil sensing' refers to techniques that:","o":["Use only satellite-based sensors from space","Measure soil properties using sensors placed close to or in contact with the soil, such as handheld Vis-NIR spectrometers or EM induction meters","Require only laboratory wet chemistry","Are unrelated to soil property estimation"],"a":1,"e":"Proximal sensing uses field/near-field instruments (spectrometers, EM sensors, etc.) placed close to the soil for rapid, often non-destructive property estimation."},{"id":"Q0706","t":"Remote Sensing & DSM","q":"A 'semivariogram' (variogram) in geostatistics describes:","o":["The relationship between two unrelated variables","How the variance (dissimilarity) between paired sample values changes as a function of the distance separating them","Only the mean value of a soil property","Only the total number of samples collected"],"a":1,"e":"A variogram summarizes spatial dependence, showing how sample-pair dissimilarity increases with separation distance, which underlies kriging interpolation."},{"id":"Q0705","t":"Remote Sensing & DSM","q":"Kriging, a geostatistical interpolation method used in soil mapping, is distinguished from simpler methods (like inverse distance weighting) mainly because kriging:","o":["Ignores spatial autocorrelation entirely","Explicitly models spatial autocorrelation (via a variogram) to provide optimal, unbiased predictions along with an estimate of prediction uncertainty","Requires no sample data at all","Can only be used for categorical (not continuous) variables"],"a":1,"e":"Kriging uses the spatial structure captured in a variogram to produce statistically optimal interpolated estimates, along with quantified prediction uncertainty."},{"id":"Q0779","t":"Remote Sensing & DSM","q":"Atmospheric correction is applied to satellite imagery mainly to:","o":["Remove the effects of atmospheric scattering/absorption, converting raw sensor radiance into accurate surface reflectance values","Increase cloud cover in the image","Add artificial noise to the data","Eliminate the need for any spatial referencing"],"a":0,"e":"Atmospheric correction compensates for scattering and absorption by the atmosphere, so the corrected values better represent true ground surface reflectance."},{"id":"Q0792","t":"Remote Sensing & DSM","q":"'Image mosaicking' in remote sensing refers to the process of:","o":["Deleting cloud-covered pixels permanently","Joining multiple adjacent satellite/aerial images into a single, seamless larger composite image covering a wider area","Reducing spatial resolution deliberately","Converting an image into a numeric table with no spatial reference"],"a":1,"e":"Mosaicking combines several overlapping or adjacent images (after appropriate geometric/radiometric matching) into one continuous composite covering a larger area."},{"id":"Q0723","t":"Remote Sensing & DSM","q":"The 'false colour composite' commonly used in satellite image interpretation, where healthy vegetation appears bright red, is typically created by displaying:","o":["Only the blue band in all three colour channels","Near-infrared, red, and green bands mapped to the red, green, and blue display channels respectively","Only thermal infrared data","Only panchromatic data"],"a":1,"e":"Standard false colour composites assign NIR to red, red to green, and green to blue display channels, making chlorophyll-reflective healthy vegetation appear vivid red."},{"id":"Q0813","t":"Remote Sensing & DSM","q":"An 'error matrix' (confusion matrix) used in remote sensing accuracy assessment summarizes:","o":["Only the total image file size","Agreement and disagreement between classified map categories and reference (true) categories for a set of sample locations","Only the sensor's launch date","Only the number of spectral bands used"],"a":1,"e":"The error matrix cross-tabulates classified versus reference categories, from which overall accuracy, user's accuracy, and producer's accuracy can be calculated."},{"id":"Q0700","t":"Remote Sensing & DSM","q":"A Digital Elevation Model (DEM) is a data layer that represents:","o":["Soil chemical properties","The continuous variation of land surface elevation across an area, typically in raster format","Vegetation type classification only","Rainfall distribution only"],"a":1,"e":"A DEM stores elevation values across a grid, forming the basis for deriving terrain attributes like slope, aspect and drainage patterns."},{"id":"Q0692","t":"Remote Sensing & DSM","q":"Healthy green vegetation shows characteristically high reflectance in which region of the spectrum, forming the basis of vegetation indices?","o":["Blue","Near-infrared (NIR)","Thermal infrared only","Microwave only"],"a":1,"e":"Chlorophyll-rich, healthy vegetation strongly reflects near-infrared radiation, a key feature exploited by indices like NDVI."},{"id":"Q0709","t":"Remote Sensing & DSM","q":"Landsat and Sentinel are examples of:","o":["Ground-based soil testing laboratories","Earth observation satellite programs providing multispectral imagery useful for land/soil/vegetation monitoring","Types of soil classification systems","Types of fertilizers"],"a":1,"e":"Landsat (NASA/USGS) and Sentinel (ESA/Copernicus) are prominent satellite programs providing multispectral imagery widely used in agricultural and environmental remote sensing."},{"id":"Q0704","t":"Remote Sensing & DSM","q":"Digital soil mapping (DSM) can be broadly described as the process of:","o":["Manually drawing soil maps with no quantitative methods","Creating spatially explicit soil information using field/lab observations combined with environmental covariates and statistical/machine-learning models","Only digitizing existing paper maps with no new prediction","Only measuring soil temperature"],"a":1,"e":"DSM uses quantitative models relating soil observations to environmental covariates (terrain, climate, remote sensing) to predict and map soil properties/classes across a landscape."},{"id":"Q0708","t":"Remote Sensing & DSM","q":"Global Positioning System (GPS) technology is used in soil survey and precision agriculture primarily to:","o":["Determine soil pH directly","Provide accurate geographic location (coordinates) for soil sampling points, field boundaries, and machinery guidance","Measure soil temperature","Analyse soil color"],"a":1,"e":"GPS provides precise spatial positioning, essential for georeferencing soil samples/observations and for precision agriculture operations."},{"id":"Q0721","t":"Remote Sensing & DSM","q":"A key practical advantage of digital soil mapping over traditional manual soil survey/mapping methods is that DSM generally:","o":["Requires no field data at all","Can produce continuous, quantitative predictions with associated uncertainty estimates more efficiently, especially over large or data-scarce areas","Is always less accurate than manual mapping","Cannot be updated once created"],"a":1,"e":"DSM methods can generate spatially continuous, quantitative, and updatable soil property/class predictions more efficiently than purely manual cartographic methods, especially at larger scales."},{"id":"Q0690","t":"Remote Sensing & DSM","q":"Remote sensing is defined as the science of acquiring information about an object or area:","o":["Only through direct physical contact and sampling","Without direct physical contact, typically by detecting and measuring reflected/emitted electromagnetic radiation","Only through laboratory chemical analysis","Only through underground drilling"],"a":1,"e":"Remote sensing gathers information from a distance using sensors that detect electromagnetic energy reflected or emitted by the target."},{"id":"Q0786","t":"Remote Sensing & DSM","q":"SRTM (Shuttle Radar Topography Mission) data is a widely used global source of:","o":["Soil pH values","Digital elevation model (DEM) data derived from radar interferometry","Soil microbial biomass data","Crop yield statistics"],"a":1,"e":"SRTM used radar interferometry aboard the Space Shuttle to generate a near-global digital elevation dataset widely used in terrain analysis and DSM."},{"id":"Q0720","t":"Remote Sensing & DSM","q":"'Legacy soil data' in digital soil mapping refers to:","o":["Newly collected field data only","Previously collected soil survey/point data (often from older surveys), which can be reused/harmonized as input for new digital soil mapping efforts","Only satellite imagery","Only climate data"],"a":1,"e":"Legacy data — existing historical soil survey records/samples — is a valuable, cost-effective input for building new digital soil maps when properly harmonized."},{"id":"Q0799","t":"Remote Sensing & DSM","q":"The map projection and datum used in a GIS/remote sensing project are important mainly because they determine:","o":["The color scheme of the final map only","How the curved Earth's surface is mathematically represented on a flat map, affecting spatial accuracy and compatibility between different data layers","The spectral bands available on a satellite","The cost of the imagery"],"a":1,"e":"Consistent projection and datum ensure spatial data from different sources align correctly; mismatched projections/datums cause positional errors."}],"Pedology":[{"id":"Q0608","t":"Pedology","q":"A 'soil series', the most detailed (lowest) category in the US soil classification hierarchy, is defined by:","o":["Very broad climatic zones only","A group of soils having similar horizons, arrangement and characteristics developed from a particular type of parent material, typically named after a locality","Only the surface texture, ignoring the subsoil","National boundaries"],"a":1,"e":"Soil series are the most specific taxonomic unit, distinguished by detailed profile characteristics, usually named for the place where first identified."},{"id":"Q0591","t":"Pedology","q":"A 'udic' soil moisture regime is typical of:","o":["Deserts with minimal rainfall","Humid climates where the soil moisture control section is not dry for as long as 90 cumulative days in most years","Only frozen tundra regions","Only saline coastal areas"],"a":1,"e":"Udic regimes reflect relatively humid conditions with generally adequate, well-distributed moisture through most of the year."},{"id":"Q0571","t":"Pedology","q":"'Salinization' as a pedogenic process involves:","o":["Leaching all soluble salts out of the profile","Accumulation of soluble salts in the soil profile, typically under arid/semi-arid conditions with high evapotranspiration and/or shallow saline water tables","Formation of clay minerals only","Accumulation of organic matter"],"a":1,"e":"Limited leaching combined with high evaporation and/or capillary rise from saline groundwater concentrates soluble salts in the profile."},{"id":"Q0587","t":"Pedology","q":"A 'calcic horizon' is a diagnostic subsurface horizon defined by:","o":["Significant secondary accumulation of calcium carbonate","Accumulation of gypsum only","Presence of illuvial humus-aluminium complexes","Perennial saturation with reducing conditions"],"a":0,"e":"Calcic horizons show measurable secondary CaCO3 accumulation, common in soils of arid/semi-arid regions (e.g., some Aridisols, Mollisols)."},{"id":"Q0581","t":"Pedology","q":"A 'mollic epipedon', a key diagnostic surface horizon in Soil Taxonomy, is characterized by:","o":["Very low organic matter and pale color","A thick, dark-colored, base-rich surface horizon with good structure, typical of grassland soils (Mollisols)","High soluble salt content","Complete absence of biological activity"],"a":1,"e":"Mollic epipedons are thick, dark, base-saturated, well-structured surface horizons — the defining feature of the fertile Mollisol order."},{"id":"Q0597","t":"Pedology","q":"Mollisols are characterized primarily by:","o":["A thick, dark, base-rich mollic epipedon, typically formed under grassland vegetation, and generally high natural fertility","An oxic horizon and low fertility","Perennial ice","A spodic horizon typical of coniferous forest"],"a":0,"e":"Mollisols, the classic grassland/prairie soils, have a deep, dark, fertile mollic epipedon and are among the most agriculturally productive soils."},{"id":"Q0634","t":"Pedology","q":"A well-drained upland soil in a catena typically shows, compared to a poorly drained soil lower in the same catena:","o":["More prominent gley/mottled colors","Better (more oxidized) color development and generally less mottling, due to better aeration","Identical color and drainage characteristics","Always higher organic matter content"],"a":1,"e":"Better aeration in upslope, well-drained positions favours oxidized (brighter) colors, while downslope, poorly drained positions show reduction-related grey/mottled colors."},{"id":"Q0613","t":"Pedology","q":"Chemical weathering processes acting on primary minerals include all of the following EXCEPT:","o":["Hydrolysis","Oxidation","Carbonation","Frost wedging"],"a":3,"e":"Frost wedging (ice expansion in cracks) is a purely physical/mechanical weathering process, not a chemical reaction."},{"id":"Q0610","t":"Pedology","q":"Simonson's model of soil genesis describes pedogenesis as resulting from four basic groups of processes: additions, losses, transformations, and:","o":["Translocations (movement of material within the profile)","Only mineral dissolution","Only biological decomposition","Only erosion"],"a":0,"e":"Simonson's framework describes soil development through additions, losses, translocations and transformations of material within the developing profile."},{"id":"Q0639","t":"Pedology","q":"Which best describes 'soil development index' concepts sometimes used to compare the relative maturity of different soil profiles?","o":["A qualitative color chart with no scientific basis","A composite index combining measurable indicators of pedogenic change (e.g., horizon differentiation, clay content increase, structure development) to rank relative soil profile development/age","A measure of only soil pH","A measure exclusively of soil salinity"],"a":1,"e":"Soil development indices combine multiple measurable profile features to provide a relative, semi-quantitative assessment of how much pedogenic change/maturity a profile has undergone."},{"id":"Q0566","t":"Pedology","q":"The soil formation factor 'time' refers to:","o":["The duration since deposition/exposure of the parent material, during which pedogenic processes have acted","Only geological time before any life existed","The time taken to complete a soil survey","The season of the year"],"a":0,"e":"Time is the duration over which the other formation factors have interacted to develop soil properties/horizons from the parent material."},{"id":"Q0569","t":"Pedology","q":"'Laterization' (ferrallitization), typical of humid tropical regions, is characterized by:","o":["Accumulation of soluble salts","Intense weathering and desilication leading to relative accumulation of Fe and Al oxides, and formation of kaolinite-dominated, often reddish soils","Formation of a podzol E horizon","Accumulation of gypsum crystals"],"a":1,"e":"Under high rainfall and temperature, silica is leached preferentially, leaving Fe/Al oxide-enriched, kaolinitic, often deeply weathered red/lateritic soils."},{"id":"Q0640","t":"Pedology","q":"Which of the following pairs correctly matches a soil order with its most typically associated broad climatic/vegetation setting?","o":["Oxisols — cold tundra with permafrost","Mollisols — temperate grasslands/prairies","Spodosols — hot arid deserts","Aridisols — humid tropical rainforest"],"a":1,"e":"Mollisols are classically associated with temperate grassland/prairie regions, reflecting the deep, organic-rich mollic epipedon formed under grass vegetation."},{"id":"Q0606","t":"Pedology","q":"Spodosols are typically associated with:","o":["Hot, arid deserts","Cool, humid climates under coniferous forest vegetation, showing strong podzolization (spodic horizon development)","Tropical rainforest with laterization","Perennial waterlogged wetlands"],"a":1,"e":"Spodosols form characteristically under acidic, coniferous forest litter in cool humid climates, developing a distinctive spodic horizon via podzolization."},{"id":"Q0575","t":"Pedology","q":"In standard soil horizon nomenclature, the 'O horizon' refers to:","o":["A mineral horizon of maximum illuviation","An organic horizon formed above the mineral soil, dominated by organic material (e.g., litter, humus)","The parent material horizon","The bedrock horizon"],"a":1,"e":"O horizons are organic layers (litter, decomposing plant material) that accumulate at the surface, especially under forest vegetation."},{"id":"Q0603","t":"Pedology","q":"Andisols are soils that develop predominantly from:","o":["Limestone bedrock","Volcanic ash and other pyroclastic materials, characterized by dominance of short-range-order minerals like allophane/imogolite","Pure quartz sand","Marine sediments only"],"a":1,"e":"Andisols form from volcanic ejecta, showing distinctive properties (high P fixation, low bulk density, allophane/imogolite dominance) from rapid weathering of volcanic glass."},{"id":"Q0611","t":"Pedology","q":"'Weathering' as a soil-forming process broadly encompasses:","o":["Only biological decomposition","Physical disintegration and chemical decomposition of rocks/minerals into progressively smaller particles and new secondary compounds","Only wind erosion","Only human cultivation"],"a":1,"e":"Weathering includes both mechanical breakdown (physical) and chemical alteration of primary minerals, forming the raw material for soil development."},{"id":"Q0612","t":"Pedology","q":"Physical (mechanical) weathering processes include all of the following EXCEPT:","o":["Frost action (freeze-thaw)","Thermal expansion/contraction","Hydrolysis of minerals","Abrasion by wind/water"],"a":2,"e":"Hydrolysis is a chemical weathering reaction (mineral reacting with water); the others are physical/mechanical disintegration processes."},{"id":"Q0636","t":"Pedology","q":"'Illuvial clay skins' (clay cutans) observed on ped surfaces in a soil profile are considered field evidence of:","o":["Recent volcanic activity","Clay translocation and accumulation (illuviation), typically supporting classification as an argillic horizon","Salt crystallization","Permafrost presence"],"a":1,"e":"Clay cutans (thin coatings) on ped faces/pore walls are visible field evidence of clay movement and deposition, a key indicator of an argillic horizon."},{"id":"Q0609","t":"Pedology","q":"In a detailed soil survey, the basic mapping unit typically shown on a soil map is the:","o":["Soil order","Soil phase of a soil series (a subdivision based on features like slope, erosion, or stoniness)","Continent","Country"],"a":1,"e":"Soil maps commonly depict 'soil phases' — subdivisions of a series based on practical features (slope class, erosion degree, etc.) relevant to land use."},{"id":"Q0645","t":"Pedology","q":"Which of the following best distinguishes a 'diagnostic horizon' from an ordinary soil horizon (A, B, C, etc.) in Soil Taxonomy?","o":["Diagnostic horizons are simply another name for the A horizon","Diagnostic horizons are defined by specific, quantitatively measurable criteria used explicitly for classification purposes, and may or may not correspond exactly to a single master horizon","Diagnostic horizons only occur in Entisols","Diagnostic horizons have no measurable criteria"],"a":1,"e":"Diagnostic horizons (mollic, argillic, oxic, etc.) are precisely defined by measurable property thresholds specifically for taxonomic classification, distinct from the more general master horizon (A, B, C) designations."},{"id":"Q0576","t":"Pedology","q":"The 'A horizon' in a typical soil profile is best described as:","o":["The horizon of maximum illuviated clay accumulation","The mineral surface horizon of maximum biological activity and organic matter accumulation, often darker in color","Unweathered parent material","Consolidated bedrock"],"a":1,"e":"The A horizon (topsoil) typically has the highest organic matter and biological activity, often giving it a darker color than horizons below."},{"id":"Q0642","t":"Pedology","q":"'Gilgai' microrelief, characterized by an irregular pattern of mounds and depressions, is a distinctive surface feature of:","o":["Podzol soils under conifer forest","Vertisols, resulting from repeated shrink-swell/self-churning of expanding clay","Sandy Entisols on beaches","Permanently frozen Gelisols"],"a":1,"e":"Gilgai microrelief develops from the cyclic swelling/shrinking and internal churning characteristic of high-shrink-swell clay soils like Vertisols."},{"id":"Q0596","t":"Pedology","q":"Inceptisols represent soils that are:","o":["Extremely old and highly weathered with an oxic horizon","In an early to moderate stage of profile development, showing some horizon differentiation (e.g., a cambic horizon) but lacking more strongly developed diagnostic horizons","Dominated entirely by organic material","Permanently frozen"],"a":1,"e":"Inceptisols show incipient (beginning) soil development — more advanced than Entisols but without the strongly expressed diagnostic horizons of more mature orders."},{"id":"Q0625","t":"Pedology","q":"A 'chronosequence' in soil genesis studies refers to a series of soils that differ mainly due to variation in:","o":["Age (time since parent material stabilization/exposure), with other formation factors relatively similar","Climate only","Slope only","Parent material only"],"a":0,"e":"Chronosequences isolate time as the primary variable, comparing soils of different ages developed under otherwise similar conditions."},{"id":"Q0620","t":"Pedology","q":"The concept of 'soil individual' (pedon) in Soil Taxonomy refers to:","o":["An entire continent's soil cover","The smallest three-dimensional volume of soil that can be recognized and sampled as representing the full range of horizon variability at a point","A single sand grain","A soil order"],"a":1,"e":"A pedon is the basic sampling/study unit of soil — a small, three-dimensional body large enough to represent its horizons and their variability."},{"id":"Q0624","t":"Pedology","q":"A soil 'toposequence' refers to a sequence of soils that vary systematically primarily due to differences in:","o":["Parent material only","Position on the landscape/slope (topography), with other factors relatively constant","Time of formation only","Climate zone only"],"a":1,"e":"A toposequence (essentially synonymous with catena in many usages) isolates topography as the main factor causing systematic soil variation."},{"id":"Q0628","t":"Pedology","q":"The rate of soil formation is generally:","o":["Extremely rapid, forming a mature soil within a few years everywhere","A slow process, often requiring hundreds to many thousands of years to develop a mature profile, though the rate varies with climate and parent material","Uniform and identical in all environments","Independent of climate and parent material"],"a":1,"e":"Soil formation is typically slow, though rates vary considerably with climate (faster in warm, humid regions) and the resistance of the parent material."},{"id":"Q0595","t":"Pedology","q":"Entisols, in Soil Taxonomy, are characterized by:","o":["Very old, deeply weathered profiles with an oxic horizon","Very little or no profile development, often young soils (e.g., recent alluvium or eroded surfaces) lacking diagnostic subsurface horizons","Perennial ice/permafrost as the defining feature","A thick mollic epipedon"],"a":1,"e":"Entisols are recent, weakly developed soils lacking significant diagnostic horizons, often found on recent deposits, steep slopes, or eroded lands."},{"id":"Q0602","t":"Pedology","q":"Aridisols are soils of:","o":["Humid tropical rainforest regions","Arid (desert) regions, characterized by an aridic moisture regime and often the presence of diagnostic horizons such as calcic, gypsic or salic horizons","Cold tundra regions with permafrost","Wetland/marsh regions"],"a":1,"e":"Aridisols occur in deserts, defined by an aridic (dry) moisture regime, and often show accumulations of carbonates, gypsum or salts."},{"id":"Q0570","t":"Pedology","q":"'Calcification' as a soil-forming process, typical of semi-arid/arid regions, refers to:","o":["Removal of all carbonates from the profile","Accumulation of calcium carbonate within the soil profile due to limited leaching under low rainfall","Intense leaching of iron and aluminium","Formation of a spodic horizon"],"a":1,"e":"Where evapotranspiration exceeds precipitation, leaching is insufficient to remove dissolved carbonate, which precipitates as a calcic horizon or nodules."},{"id":"Q0632","t":"Pedology","q":"A 'salic horizon', another diagnostic feature in Soil Taxonomy, is defined by:","o":["High content of readily soluble salts (more soluble than gypsum) accumulated in the horizon","Accumulation of calcium carbonate only","Complete absence of any salts","High organic matter content"],"a":0,"e":"Salic horizons contain a substantial accumulation of highly soluble salts, characteristic of saline soils/Aridisols in arid environments with restricted drainage."},{"id":"Q0564","t":"Pedology","q":"Climate influences soil formation mainly through:","o":["Only its effect on soil color","Temperature and precipitation, which control weathering rate, leaching intensity, and biological activity","Only wind speed","Only atmospheric pressure"],"a":1,"e":"Climate governs the intensity of chemical/physical weathering, leaching, and the type/activity of organisms, making it a dominant formation factor."},{"id":"Q0643","t":"Pedology","q":"'Slickensides' — polished, grooved surfaces within the soil, formed as clay particles slide past one another — are a diagnostic feature commonly used to help identify:","o":["Spodosols","Vertisols","Histosols","Gelisols"],"a":1,"e":"Slickensides result from the shear stresses of repeated shrink-swell movement in high-clay soils, a defining diagnostic feature of Vertisols."},{"id":"Q0614","t":"Pedology","q":"A 'paleosol' refers to:","o":["A currently forming young soil","A soil formed under past environmental/climatic conditions, often buried or preserved, providing evidence of past soil-forming environments","A type of soil classification order","A modern agricultural soil"],"a":1,"e":"Paleosols are ancient, often buried soils that record past pedogenic environments, useful in paleoclimate and geological studies."},{"id":"Q0584","t":"Pedology","q":"A 'spodic horizon', diagnostic of the Spodosol order, is characterized by:","o":["Illuvial accumulation of amorphous organic matter combined with aluminium (and often iron)","Accumulation of calcium carbonate","Accumulation of gypsum","High base saturation and thick dark color"],"a":0,"e":"Spodic horizons form through podzolization, accumulating illuvial humus-Al(-Fe) complexes, typically beneath an E horizon."},{"id":"Q0567","t":"Pedology","q":"A 'catena' in soil science refers to:","o":["A single soil profile at one point","A sequence of related soils that differ mainly due to variations in relief/drainage along a slope, developed from similar parent material and under similar climate","A soil classification order","A type of soil structure"],"a":1,"e":"A catena describes soils linked topographically, showing systematic property changes from summit to valley bottom due to drainage differences."},{"id":"Q0582","t":"Pedology","q":"An 'ochric epipedon' is a diagnostic surface horizon characterized by:","o":["Very thick, dark, humus-rich material","Being too light in color, too low in organic matter, or too thin to qualify as any other diagnostic epipedon","Presence of a spodic horizon immediately below","Perennial waterlogging"],"a":1,"e":"Ochric epipedons are essentially 'default' pale, low-organic-matter surface horizons that don't meet the criteria of the richer epipedons."},{"id":"Q0593","t":"Pedology","q":"Soil temperature regimes used in Soil Taxonomy (e.g., cryic, frigid, mesic, thermic, hyperthermic) classify soils primarily by their:","o":["Mean annual and seasonal soil temperature at a specified depth","Soil color","Soil salinity","Cation exchange capacity"],"a":0,"e":"Temperature regimes categorize soils by mean annual soil temperature (and summer/winter variation) at about 50 cm depth, influencing biological activity and classification."},{"id":"Q0607","t":"Pedology","q":"The World Reference Base for Soil Resources (WRB), an international soil classification system, differs from US Soil Taxonomy mainly in that WRB:","o":["Is identical to Soil Taxonomy in all respects","Uses a different hierarchical structure based on Reference Soil Groups and qualifiers, developed under FAO/IUSS auspices for international use","Recognizes no diagnostic horizons at all","Applies only to soils of the United States"],"a":1,"e":"WRB, an internationally coordinated system, classifies soils into Reference Soil Groups modified by qualifiers, distinct in structure from the US Soil Taxonomy hierarchy (though both use diagnostic horizon concepts)."},{"id":"Q0580","t":"Pedology","q":"The 'R horizon' designation in soil profile description refers to:","o":["A rock/organic transitional layer","Consolidated bedrock underlying the soil, showing little evidence of weathering","The uppermost organic layer","A horizon rich in soluble salts"],"a":1,"e":"R designates hard, consolidated bedrock beneath the soil profile, essentially unweathered."},{"id":"Q0633","t":"Pedology","q":"Which of these best explains why soils formed on steep slopes tend to be shallower and less developed than soils on adjacent level land under similar climate?","o":["Steep slopes always receive more rainfall","Erosion on steep slopes removes surface material faster than it can accumulate/develop, limiting profile depth and development","Steep slopes have no biological activity","Steep slopes are always colder"],"a":1,"e":"Active erosion on steep terrain continually removes developing soil material, preventing the accumulation of a thick, well-developed profile compared to stable, level sites."},{"id":"Q0592","t":"Pedology","q":"An 'ustic' soil moisture regime represents conditions:","o":["Intermediate between udic (humid) and aridic (dry), with moisture available during the growing season but with significant dry periods, typical of monsoonal/semi-arid climates","Always saturated","Always frozen","Always extremely humid with no dry season"],"a":0,"e":"Ustic regimes are common in monsoon climates — moisture is available for at least part of the growing season, but dry spells occur, distinguishing it from more humid udic conditions."},{"id":"Q0621","t":"Pedology","q":"A group of contiguous, similar pedons that together form a recognizable, mappable body of soil is termed a:","o":["Polypedon","Soil order","Soil horizon","Soil series suffix"],"a":0,"e":"A polypedon is the basic soil mapping unit — an aggregation of similar, contiguous pedons forming an identifiable soil body in the landscape."},{"id":"Q0629","t":"Pedology","q":"Which statement correctly distinguishes 'soil genesis' from 'soil classification'?","o":["They are identical concepts with no distinction","Soil genesis studies how and why soils develop their properties (pedogenic processes), while soil classification systematically groups and names soils based on their properties","Soil genesis only concerns soil color","Soil classification only applies to agricultural soils"],"a":1,"e":"Genesis focuses on the processes and factors producing soil properties; classification is the systematic ordering/naming of soils based on the resulting properties."},{"id":"Q0572","t":"Pedology","q":"'Gleization' is a soil-forming process associated with:","o":["Well-drained, aerobic upland soils","Prolonged waterlogging/anaerobic conditions, producing characteristic grey, blue-grey or mottled colors from iron reduction","Extreme aridity","Volcanic ash weathering only"],"a":1,"e":"Under saturated, reducing conditions, iron is reduced (Fe2+), giving grey/greenish gley colors, with mottles where redox conditions fluctuate."},{"id":"Q0617","t":"Pedology","q":"Colluvial soils develop from parent material that has been transported mainly by:","o":["Gravity, moving material downslope (e.g., at the base of hills)","Glacial ice sheets","Wind action across deserts","Deep ocean currents"],"a":0,"e":"Colluvium accumulates at the base of slopes through gravity-driven downslope movement (e.g., creep, slumping) of weathered material."},{"id":"Q0601","t":"Pedology","q":"Vertisols are distinguished mainly by:","o":["Perennial freezing","Dominance of expanding (2:1, e.g., montmorillonite) clays causing pronounced shrink-swell behaviour, deep cracking on drying, and self-mulching/mixing (churning)","A thick organic surface horizon","An oxic horizon"],"a":1,"e":"High-shrink-swell clay content causes Vertisols to crack deeply on drying and to self-churn (via slickensides and gilgai microrelief), a hallmark of this order."},{"id":"Q0590","t":"Pedology","q":"An 'aridic' soil moisture regime describes soils that are:","o":["Saturated with water for most of the year","Dry for long periods, typical of desert/arid climates with insufficient moisture for most crop growth without irrigation","Continuously moist throughout the year","Under permafrost conditions"],"a":1,"e":"Aridic regimes characterize very dry soils typical of deserts, where the soil moisture control section is dry most of the time."},{"id":"Q0588","t":"Pedology","q":"A 'cambic horizon' represents:","o":["A horizon showing only slight to moderate physical/chemical alteration (e.g., structure development, weak color change), without meeting criteria for stronger diagnostic horizons like argillic or oxic","The most intensely developed diagnostic horizon possible","A horizon of pure sand deposition","A permanently frozen horizon"],"a":0,"e":"Cambic horizons indicate incipient/moderate soil development — some structure and color change from the parent material, but not enough alteration to qualify as argillic, spodic, or oxic."},{"id":"Q0626","t":"Pedology","q":"'Biosequence' studies in pedology examine soils that vary mainly because of differences in:","o":["Organisms/vegetation (biotic factor), other formation factors being similar","Only rock type","Only time","Only rainfall amount"],"a":0,"e":"A biosequence isolates the influence of vegetation/organisms on soil development, holding other factors approximately constant."},{"id":"Q0578","t":"Pedology","q":"The 'B horizon' is typically distinguished as the zone of:","o":["Organic litter accumulation","Illuviation (accumulation of translocated clay, Fe/Al oxides, or other materials) and/or significant weathering/structure development, below the A/E horizons","Unaltered parent rock","Surface organic matter only"],"a":1,"e":"B horizons commonly show illuvial accumulation of clay or oxides and/or in-situ alteration, distinguishing them from the overlying eluvial/surface horizons."},{"id":"Q0600","t":"Pedology","q":"Oxisols are the classic soils of humid tropical regions, characterized by:","o":["An oxic horizon reflecting intense, prolonged weathering, dominance of kaolinite and Fe/Al oxides, and generally low native fertility","A mollic epipedon and high native fertility","Perennial ice","High shrink-swell 2:1 clay dominance"],"a":0,"e":"Oxisols represent the most intensely and long-weathered mineral soils, dominated by resistant oxides/kaolinite, generally with low inherent fertility."},{"id":"Q0562","t":"Pedology","q":"According to Jenny's classical soil formation equation, soil properties (s) are a function of:","o":["Only climate and time","Climate, organisms, relief (topography), parent material and time (CLORPT)","Only parent material","Only human management"],"a":1,"e":"Jenny's equation s = f(cl, o, r, p, t, ...) identifies climate, organisms, relief, parent material and time as the state factors of soil formation."}],"Soil Fertility":[{"id":"Q0304","t":"Soil Fertility","q":"Ammonia volatilization losses of applied urea are particularly high when urea is:","o":["Deep-placed and incorporated into moist soil","Surface-broadcast on moist, high-pH soil without incorporation","Applied as a basal dose in flooded, reduced soil below the surface","Combined with a urease inhibitor"],"a":1,"e":"Surface urea hydrolyses to ammonium carbonate; under alkaline, moist, warm conditions much NH3 escapes to the atmosphere before it can be adsorbed."},{"id":"Q0372","t":"Soil Fertility","q":"Which of the following best describes why potassium chloride (muriate of potash) is generally avoided for chloride-sensitive crops like tobacco?","o":["It contains no potassium","Its chloride component can adversely affect quality/burning characteristics of such crops","It is too expensive","It causes nitrogen deficiency"],"a":1,"e":"High chloride content from muriate of potash can impair quality traits in chloride-sensitive crops, favouring sulfate of potash instead."},{"id":"Q0378","t":"Soil Fertility","q":"Phosphorus, in contrast to nitrate, generally shows:","o":["High mobility and high leaching risk in most soils","Low mobility due to strong fixation/adsorption, with leaching risk mainly in very sandy or highly P-saturated soils","No interaction with soil at all","Complete volatilization losses"],"a":1,"e":"P's strong reactions with Fe/Al oxides or Ca generally immobilize it, limiting leaching except under specific high-risk conditions."},{"id":"Q0394","t":"Soil Fertility","q":"'Top dressing' of nitrogen fertilizer refers to:","o":["Incorporating fertilizer deep into the soil before sowing","Surface application of fertilizer to a standing crop during its growth, often in split doses","Applying fertilizer only through irrigation water","Applying fertilizer only as seed treatment"],"a":1,"e":"Top dressing is broadcasting or applying fertilizer to a growing crop on the soil surface, typically timed with crop growth stages."},{"id":"Q0331","t":"Soil Fertility","q":"The '4R Nutrient Stewardship' concept in fertilizer management stands for applying the:","o":["Right source, Right rate, Right time, Right place","Right rate, Right region, Right result, Right ratio","Right crop, Right rain, Right ridge, Right row","Right price, Right rate, Right region, Right ratio"],"a":0,"e":"4R stewardship promotes matching fertilizer source, rate, timing and placement to crop needs for efficiency and sustainability."},{"id":"Q0313","t":"Soil Fertility","q":"Mycorrhizal fungi (e.g., VAM/arbuscular mycorrhizae) benefit host plants mainly by:","o":["Fixing atmospheric nitrogen","Extending the effective root absorbing surface, improving uptake of phosphorus and other relatively immobile nutrients","Producing herbicidal compounds","Converting nitrate to ammonium"],"a":1,"e":"Mycorrhizal hyphae greatly extend the root's absorptive area, notably enhancing P uptake from soils where P is diffusion-limited."},{"id":"Q0337","t":"Soil Fertility","q":"Nutrient use efficiency (NUE) is generally defined as:","o":["Total nutrient content of the soil","Crop yield (or nutrient uptake) produced per unit of nutrient applied or available","Rate of fertilizer application only","Cost of fertilizer per hectare"],"a":1,"e":"NUE relates output (yield or uptake) to nutrient input, reflecting how efficiently applied/available nutrients are converted to yield."},{"id":"Q0361","t":"Soil Fertility","q":"A crop showing stunted growth, dark green to purplish leaf coloration, and delayed maturity is a classic symptom of deficiency of:","o":["Nitrogen","Phosphorus","Potassium","Calcium"],"a":1,"e":"Phosphorus deficiency often causes stunted growth with a characteristic purplish/reddish leaf discoloration, especially in some crops like maize."},{"id":"Q0368","t":"Soil Fertility","q":"Response curves relating crop yield to increasing fertilizer dose typically show that beyond a certain optimum dose, yield:","o":["Continues increasing linearly forever","Plateaus or may even decline, reflecting diminishing returns or toxicity","Drops to zero immediately","Is completely unaffected by further fertilizer"],"a":1,"e":"Beyond the economic/agronomic optimum, additional fertilizer gives little or no extra yield and can even depress yield at excessive rates."},{"id":"Q0387","t":"Soil Fertility","q":"Fertilizer recommendations that specify 'kg N, P2O5, K2O per hectare' express phosphorus and potassium in:","o":["Elemental form (P and K)","Oxide equivalent form (P2O5 and K2O), the conventional fertilizer-grade notation","Molar concentration","Percentage of soil weight"],"a":1,"e":"By long-standing convention, fertilizer P and K content/recommendations are expressed as P2O5 and K2O equivalents, not elemental P and K."},{"id":"Q0318","t":"Soil Fertility","q":"Magnesium deficiency in crops is often more pronounced on:","o":["Calcareous, base-rich soils","Strongly acid, sandy, leached soils, especially after heavy potassium fertilization","Saline soils exclusively","Soils rich in dolomite"],"a":1,"e":"Mg is easily leached from light, acid soils, and excess K can antagonize Mg uptake, aggravating deficiency."},{"id":"Q0383","t":"Soil Fertility","q":"Nutrient deficiency symptoms that appear uniformly across a whole field, rather than in patches, are more likely to indicate:","o":["A localized drainage problem","A true widespread soil nutrient deficiency rather than a localized soil/management issue","Pest damage only","Weed competition only"],"a":1,"e":"Uniform, field-wide symptoms point toward a genuine, generalized nutrient deficiency rather than a spatially localized cause."},{"id":"Q0299","t":"Soil Fertility","q":"Mineralization of soil organic nitrogen refers to the conversion of:","o":["Ammonium to nitrate","Organic (protein/amino) nitrogen to inorganic ammonium form","Nitrate to N2 gas","Elemental N2 to organic nitrogen"],"a":1,"e":"Mineralization (ammonification) is microbial breakdown of organic N compounds to release plant-available NH4+."},{"id":"Q0367","t":"Soil Fertility","q":"Deep placement of phosphatic fertilizer near the root zone is generally more effective than surface broadcasting mainly because:","o":["Phosphorus is highly mobile and would be lost by leaching if not placed deep","Phosphorus has very limited mobility in soil, so placing it near roots improves the chance of uptake before fixation","Broadcasting always causes phosphorus volatilization","Deep placement prevents any P fixation entirely"],"a":1,"e":"Because P diffuses very slowly, band/deep placement near roots increases the likelihood of uptake before extensive fixation occurs."},{"id":"Q0358","t":"Soil Fertility","q":"A basic principle behind recommending micronutrient application as soil-applied chelates (e.g., Zn-EDTA) rather than inorganic salts on alkaline soils is that chelates:","o":["Precipitate more readily at high pH","Remain more soluble and available across a wider pH range, resisting fixation","Cannot be absorbed by roots","Increase soil salinity permanently"],"a":1,"e":"Chelation protects the micronutrient cation from precipitation reactions that would otherwise occur readily at high soil pH."},{"id":"Q0324","t":"Soil Fertility","q":"Boron deficiency in crops such as cauliflower and other cole crops is characteristically associated with:","o":["Hollow stem and internal browning symptoms","Excessive vegetative growth only","Purple leaf margins only","Blue-green foliage"],"a":0,"e":"Boron deficiency disrupts cell wall/meristem development, causing symptoms like hollow stem in cauliflower and related crops."},{"id":"Q0296","t":"Soil Fertility","q":"Liebig's 'Law of the Minimum' states that:","o":["Plant growth is controlled by the nutrient present in greatest abundance","Plant growth is limited by the nutrient that is in shortest supply relative to the plant's requirement","All nutrients limit growth equally at all times","Only nitrogen can ever be limiting"],"a":1,"e":"The nutrient in least relative supply (the 'limiting factor') restricts growth, regardless of the abundance of other nutrients."},{"id":"Q0327","t":"Soil Fertility","q":"Copper deficiency is particularly associated with soils that are:","o":["High in organic matter, such as peat/muck soils, which strongly complex copper","Sandy, low-organic-matter mineral soils only","Calcareous soils only","Saline soils only"],"a":0,"e":"Organic matter strongly complexes/chelates copper, reducing its availability especially in organic (peaty) soils."},{"id":"Q0389","t":"Soil Fertility","q":"Soil fertility evaluation through periodic soil testing is important primarily because nutrient status:","o":["Never changes over time","Changes over time due to cropping, fertilization, leaching and other losses, requiring updated assessment","Is identical for every field in a region","Cannot be measured accurately"],"a":1,"e":"Continuous cropping and nutrient cycling alter soil nutrient status, so periodic testing keeps recommendations current and accurate."},{"id":"Q0294","t":"Soil Fertility","q":"Nickel was more recently recognized as an essential micronutrient because it is a functional component of the enzyme:","o":["Nitrogenase","Urease","Nitrate reductase","Rubisco"],"a":1,"e":"Nickel is required for the enzyme urease, which hydrolyses urea; its deficiency causes urea/leaf-tip necrosis symptoms."},{"id":"Q0298","t":"Soil Fertility","q":"The largest reservoir of nitrogen on Earth, though largely unavailable to most plants directly, is:","o":["Soil organic matter","Atmospheric N2 gas","Mineral fertilizers","Animal manure"],"a":1,"e":"The atmosphere (about 78% N2) is the largest N pool, but most plants cannot use N2 directly without biological or industrial fixation."},{"id":"Q0344","t":"Soil Fertility","q":"Which of these best explains why potassium, though needed in large amounts, is often less limiting than nitrogen in many soils?","o":["K is never present in soil minerals","Many soils have substantial reserves of K in primary/secondary minerals that slowly release K","K cannot be taken up by roots","K is always supplied by rainfall"],"a":1,"e":"Mineral K reserves (feldspar, mica) can buffer available K over time in many soils, unlike N which has no comparable mineral reservoir."},{"id":"Q0400","t":"Soil Fertility","q":"'Soil fertility' is best defined as:","o":["The soil's capacity to supply essential nutrients in adequate amounts and proper balance for plant growth","The soil's color and texture only","The presence of any fertilizer in the soil","The soil's water-holding capacity alone"],"a":0,"e":"Fertility specifically refers to the soil's inherent nutrient-supplying capacity, distinct from other productivity factors like climate and management."},{"id":"Q0377","t":"Soil Fertility","q":"Which of the following nutrients is most prone to loss from soil by leaching in sandy, high-rainfall conditions?","o":["Phosphorus","Nitrate-nitrogen","Exchangeable potassium in clay soils","Iron oxide"],"a":1,"e":"Being an anion not retained by predominantly negative soil charge, nitrate readily leaches with percolating water, especially in sandy soils."},{"id":"Q0391","t":"Soil Fertility","q":"The relative order of mobility within the plant for nitrogen, phosphorus and potassium (all relatively mobile) compared with calcium and boron (relatively immobile) explains why:","o":["Deficiency symptoms of N, P, K typically appear on older leaves first, while Ca/B deficiency affects new growth first","All nutrients show identical deficiency symptom patterns","Only N shows any mobility","Ca and B are always more available than N"],"a":0,"e":"Phloem-mobile nutrients (N,P,K) are retranslocated from old to new tissue under deficiency, unlike poorly mobile Ca and B, which harms new growth directly."},{"id":"Q0357","t":"Soil Fertility","q":"Nitrogen use efficiency in lowland rice is often lower than in upland crops mainly due to:","o":["Absence of any nitrogen loss pathways","Greater losses via ammonia volatilization, denitrification, and leaching under flooded conditions","Excessive immobilization by roots","Complete absence of nitrifying bacteria"],"a":1,"e":"Flooded rice soils are prone to multiple N loss pathways (volatilization from floodwater, denitrification in reduced zones), lowering NUE."},{"id":"Q0369","t":"Soil Fertility","q":"The term 'agronomic efficiency' of a fertilizer nutrient is defined as:","o":["Total nutrient content in the fertilizer bag","Increase in crop yield per unit of nutrient applied, compared to an unfertilized control","Cost of fertilizer per kilogram","Soil test value after harvest"],"a":1,"e":"Agronomic efficiency = (yield with nutrient − yield without) / (quantity of nutrient applied), reflecting the yield benefit per unit nutrient."},{"id":"Q0347","t":"Soil Fertility","q":"Excess nitrogen fertilization, beyond crop requirement, commonly leads to environmental problems including:","o":["Reduced greenhouse gas emissions","Nitrate leaching to groundwater and increased N2O emissions","Complete elimination of soil acidity","Reduced eutrophication risk"],"a":1,"e":"Unused N is prone to leaching as nitrate and to loss as the potent greenhouse gas N2O via nitrification-denitrification."},{"id":"Q0386","t":"Soil Fertility","q":"Which of the following best explains why potassium deficiency symptoms often appear first on the margins of older leaves?","o":["Potassium is immobile in the plant","Potassium is mobile and is retranslocated from older to younger tissue when supply is limited, leaving margins of older leaves scorched","Potassium accumulates only in roots","Potassium is never present in leaves"],"a":1,"e":"As a mobile nutrient, K is moved from older leaves to actively growing tissue under deficiency, causing marginal scorch on the older leaves first."},{"id":"Q0317","t":"Soil Fertility","q":"Calcium deficiency in plants is relatively uncommon in most agricultural soils mainly because:","o":["Calcium is not required by plants","Most soils, except strongly acid or sandy ones, contain adequate exchangeable calcium","Calcium is always toxic","Calcium is only needed by legumes"],"a":1,"e":"Ca is abundant on the exchange complex of most soils except highly leached acid or very sandy, low-CEC soils."},{"id":"Q0319","t":"Soil Fertility","q":"Sulfur in soil is primarily taken up by plants as:","o":["Elemental sulfur","Sulfate (SO4^2-) ion","Sulfide gas","Sulfurous acid"],"a":1,"e":"Plants absorb sulfur mainly as the soluble sulfate anion from soil solution."},{"id":"Q0314","t":"Soil Fertility","q":"Rock phosphate, a natural phosphatic fertilizer, is most effective when applied to:","o":["Calcareous alkaline soils","Acid soils, where its low solubility is enhanced by soil acidity","Saline soils","Sodic soils"],"a":1,"e":"Rock phosphate dissolves more readily in acid soil conditions, making it more agronomically effective there than on alkaline/calcareous soils."},{"id":"Q0329","t":"Soil Fertility","q":"Soil testing for available nutrients is primarily used to:","o":["Determine soil color","Guide fertilizer recommendations based on nutrient supplying capacity of the soil","Measure soil temperature","Assess soil microbial diversity only"],"a":1,"e":"Soil test values, calibrated against crop response, help recommend appropriate fertilizer rates."},{"id":"Q0336","t":"Soil Fertility","q":"Nutrient antagonism refers to a situation where:","o":["Two nutrients enhance each other's uptake","Excess of one nutrient interferes with or reduces the uptake/utilization of another","Both nutrients are absent from the soil","Nutrients have no interaction at all"],"a":1,"e":"For example, excess K can antagonize Mg and Ca uptake; antagonistic interactions can induce secondary deficiencies."},{"id":"Q0291","t":"Soil Fertility","q":"The total number of essential elements generally recognized for higher plants is:","o":["10","14","17","25"],"a":2,"e":"Seventeen elements (C, H, O, N, P, K, Ca, Mg, S, Fe, Mn, Zn, Cu, B, Mo, Cl, Ni) are widely recognized as essential."},{"id":"Q0334","t":"Soil Fertility","q":"Fertigation refers to the practice of:","o":["Applying fertilizer through the irrigation water/system","Applying fertilizer only as a foliar spray","Broadcasting fertilizer before ploughing","Applying only organic manures"],"a":0,"e":"Fertigation delivers soluble fertilizers dissolved in irrigation water (commonly via drip systems), improving precision and efficiency."},{"id":"Q0380","t":"Soil Fertility","q":"Excessive and continuous use of phosphatic fertilizers over many years, beyond crop requirement, can lead to:","o":["Complete elimination of P fixation","Induced deficiency of certain micronutrients such as zinc, due to P–Zn antagonism","No environmental or agronomic consequence","Immediate loss of soil structure"],"a":1,"e":"High soil P can antagonize Zn uptake/availability, contributing to zinc deficiency even where soil Zn is marginally adequate."},{"id":"Q0295","t":"Soil Fertility","q":"The primary source of carbon, hydrogen and oxygen for plant growth is:","o":["Soil minerals","Air (CO2) and water","Fertilizers only","Organic manures only"],"a":1,"e":"C, H and O — the most abundant elements in plant dry matter — come mainly from atmospheric CO2 and soil/atmospheric water."},{"id":"Q0328","t":"Soil Fertility","q":"'Critical nutrient concentration' in plant tissue refers to:","o":["The concentration above which toxicity always occurs","The tissue concentration below which yield is significantly reduced due to deficiency","A fixed value identical for all nutrients and crops","The concentration found only in roots"],"a":1,"e":"Critical concentration marks the threshold in plant tissue analysis below which growth/yield is limited by deficiency."},{"id":"Q0306","t":"Soil Fertility","q":"Symbiotic nitrogen fixation in legume root nodules is carried out mainly by bacteria of the genus:","o":["Azotobacter","Rhizobium","Nitrosomonas","Nitrobacter"],"a":1,"e":"Rhizobium species form nodules on legume roots and fix atmospheric N2 into ammonia in symbiosis with the host plant."},{"id":"Q0307","t":"Soil Fertility","q":"Azotobacter and Azospirillum are examples of:","o":["Free-living (non-symbiotic) nitrogen-fixing bacteria","Obligate symbiotic nitrogen fixers requiring legume nodules","Nitrifying bacteria only","Denitrifying bacteria only"],"a":0,"e":"These genera fix atmospheric N2 independently in soil or in loose association with roots, without forming nodules."},{"id":"Q0333","t":"Soil Fertility","q":"Placement of fertilizer (e.g., deep placement of urea super granules) in flooded rice soils primarily improves efficiency by:","o":["Placing nutrients where they can volatilize faster","Placing nutrients in the reduced zone below the floodwater-soil interface, reducing ammonia volatilization losses","Making no difference to nitrogen losses","Increasing denitrification deliberately"],"a":1,"e":"Deep placement below the oxidized surface layer reduces contact with floodwater and lowers NH3 volatilization losses."},{"id":"Q0373","t":"Soil Fertility","q":"A well-designed fertilizer recommendation for a region is generally based on:","o":["A single blanket rate irrespective of soil type or yield target","Field-calibrated response data considering soil fertility status, crop, climate and yield target","Only fertilizer cost","Farmer preference with no scientific basis"],"a":1,"e":"Sound recommendations integrate agronomic trial data, soil testing, crop requirement and target yield rather than a one-size-fits-all rate."},{"id":"Q0360","t":"Soil Fertility","q":"Which statement about the relationship between soil organic matter and nutrient availability is correct?","o":["Organic matter has no effect on nutrient supply","Organic matter serves as a reservoir and slow-release source of N, P, S and micronutrients as it decomposes","Organic matter only supplies potassium","Organic matter always immobilizes all nutrients permanently"],"a":1,"e":"Mineralization of organic matter gradual
