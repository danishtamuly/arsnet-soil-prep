w and spread runoff, reducing erosive velocity and encouraging infiltration."},{"id":"Q0666","t":"Soil Conservation","q":"Shelterbelts/windbreaks, used to control wind erosion, function primarily by:","o":["Increasing wind speed at the soil surface","Reducing wind velocity near the ground over a protected zone, thereby reducing the wind's soil-detaching and transporting capacity","Eliminating all rainfall in the area","Increasing soil salinity"],"a":1,"e":"Rows of trees/shrubs planted perpendicular to prevailing winds reduce near-surface wind speed over a downwind zone, protecting soil from wind erosion."},{"id":"Q0652","t":"Soil Conservation","q":"Wind erosion is generally most severe on soils that are:","o":["Wet, heavy-textured, and well-covered with vegetation","Dry, loose, fine-textured (or fine sandy), and lacking vegetative cover, especially in flat, open, windy areas","Saturated with water at all times","Densely forested"],"a":1,"e":"Dry, loose, unprotected soil with little vegetative cover in open, windy conditions is most susceptible to detachment and transport by wind."},{"id":"Q0663","t":"Soil Conservation","q":"Grassed waterways are constructed in agricultural fields mainly to:","o":["Increase soil erosion in natural drainage channels","Provide a stable, vegetated channel for safely conveying concentrated runoff without excessive erosion","Prevent any water from leaving the field","Replace the need for contour farming entirely"],"a":1,"e":"Grassed waterways stabilize natural drainage lines with erosion-resistant vegetation, safely carrying concentrated flow without gully formation."},{"id":"Q0685","t":"Soil Conservation","q":"Which of the following soil/land conditions would be MOST susceptible to severe water erosion under intense rainfall?","o":["Flat, well-vegetated land with high infiltration capacity","Steep, bare, cultivated slopes with low infiltration capacity and erodible soil","Densely forested, gently sloping land","Level, mulched, cover-cropped land"],"a":1,"e":"Steep slope, lack of protective cover, poor infiltration and erodible soil together maximize runoff velocity and erosive potential."},{"id":"Q0675","t":"Soil Conservation","q":"Percolation tanks, a groundwater recharge structure common in water-scarce regions, function primarily to:","o":["Store water for direct large-scale irrigation only","Impound runoff over a permeable bed, allowing it to slowly percolate down and recharge the local groundwater aquifer","Prevent any groundwater recharge","Increase surface runoff velocity"],"a":1,"e":"Percolation tanks are sited on permeable strata specifically to maximize infiltration of impounded water into the aquifer, rather than for direct surface use."},{"id":"Q0870","t":"Soil Conservation","q":"Coastal shelterbelts, in addition to controlling wind erosion, provide the important additional benefit of:","o":["Increasing storm surge damage","Reducing the impact of strong coastal winds and, to some extent, buffering the effects of cyclonic storms/storm surges on adjacent agricultural land","Increasing soil salinity intentionally","Eliminating the need for crop diversification"],"a":1,"e":"Coastal shelterbelts (e.g., casuarina plantations) reduce wind velocity and provide some protective buffering against storm impacts on land behind them, alongside their soil conservation role."},{"id":"Q0665","t":"Soil Conservation","q":"Gully plugging, using temporary or permanent structures across a gully, is a technique aimed at:","o":["Encouraging further gully growth","Halting/reducing gully advance by controlling water flow and encouraging sediment deposition and vegetative stabilization","Eliminating the need for afforestation","Increasing downstream flooding intentionally"],"a":1,"e":"Small check structures (brushwood, loose rock, or masonry) placed across a gully reduce flow energy, promote deposition, and help stabilize/heal the gully over time."},{"id":"Q0677","t":"Soil Conservation","q":"Vegetative barriers (e.g., grass strips like vetiver) planted along the contour are used in soil conservation mainly to:","o":["Increase runoff velocity down the slope","Slow runoff, filter sediment, and gradually help form natural terraces over time as soil accumulates behind them","Replace the need for any cropping system","Increase soil erosion deliberately"],"a":1,"e":"Dense contour vegetative barriers (e.g., vetiver grass hedges) slow flow, trap sediment, and over time promote natural terrace formation on the upslope side."},{"id":"Q0878","t":"Soil Conservation","q":"Cover crops grown primarily for soil protection (rather than direct harvest) provide conservation benefits mainly by:","o":["Leaving the soil bare between main crop seasons","Providing vegetative cover during otherwise fallow periods, reducing erosion, suppressing weeds, and often adding organic matter/nutrients when incorporated","Increasing soil erosion during the off-season","Replacing the need for any main crop entirely"],"a":1,"e":"Cover crops protect otherwise exposed soil during fallow periods between main crops, reducing erosion risk while offering secondary benefits like weed suppression and organic matter addition."},{"id":"Q0664","t":"Soil Conservation","q":"Check dams constructed across small gullies/waterways serve mainly to:","o":["Increase the velocity of water flow","Reduce flow velocity, trap sediment, and help stabilize the gully bed, preventing further head-cutting/erosion","Prevent any water from flowing at all","Replace the need for vegetative cover entirely"],"a":1,"e":"Check dams slow runoff and trap sediment behind them, reducing the erosive energy that would otherwise deepen and extend the gully."},{"id":"Q0889","t":"Soil Conservation","q":"Which of the following best explains why a combination of both agronomic and engineering (structural) measures is often recommended for effective soil conservation on steep, degraded watersheds?","o":["A single measure type is always sufficient regardless of site severity","Different measures address different aspects/scales of the erosion problem, and combining them (e.g., structures for immediate stabilization, vegetation for long-term protection) typically gives more effective, sustainable control","Combining measures always increases erosion","Structural and agronomic measures cannot be used together"],"a":1,"e":"Structural measures often provide immediate physical stabilization while agronomic/vegetative measures provide longer-term, self-sustaining protection; combining them typically yields more robust overall erosion control."},{"id":"Q0678","t":"Soil Conservation","q":"Ravine reclamation, addressing severely gullied badland terrain, typically combines:","o":["No treatment, leaving the land abandoned permanently","Structural measures (check dams, gully plugging) with vegetative measures (afforestation, grass establishment) to stabilize and gradually reclaim the land","Only chemical fertilizer application, without physical measures","Only removal of all vegetation"],"a":1,"e":"Reclaiming severely eroded ravine lands generally requires an integrated approach combining engineering structures to control water flow with vegetative establishment to stabilize soil long-term."},{"id":"Q0868","t":"Soil Conservation","q":"Vegetative filter strips established along field edges adjacent to streams/waterways function mainly to:","o":["Increase sediment and nutrient runoff directly into the water body","Slow runoff and trap sediment, nutrients and other pollutants before they reach the water body, protecting water quality","Eliminate the need for any other erosion control practice in the field","Increase the water body's salinity"],"a":1,"e":"Filter/buffer strips of dense vegetation along waterways slow overland flow and filter out sediment and associated pollutants before runoff enters the water body."},{"id":"Q0673","t":"Soil Conservation","q":"Sediment delivery ratio (SDR) is defined as:","o":["Total gross erosion within a watershed divided by total rainfall","The ratio of sediment yield actually delivered at a watershed outlet to the total gross (upland) erosion occurring within the watershed","The ratio of clay to sand in eroded sediment","The area of a watershed divided by its perimeter"],"a":1,"e":"SDR expresses what fraction of eroded soil actually reaches the outlet, since much eroded material is redeposited within the watershed before reaching it."},{"id":"Q0681","t":"Soil Conservation","q":"Crop rotation contributes to soil and water conservation partly by:","o":["Always leaving the soil bare between crops","Diversifying vegetative cover through the year, which can improve soil structure/organic matter and reduce periods of exposed, erosion-prone soil","Eliminating the need for any conservation structures on all lands","Increasing soil erosion by breaking up aggregates each season"],"a":1,"e":"Rotating crops (especially including cover/soil-building crops) maintains better soil cover and structure across seasons compared to continuous, erosion-prone monocropping."},{"id":"Q0887","t":"Soil Conservation","q":"Farm ponds are generally sited at a location within the watershed that:","o":["Maximizes travel distance from any natural drainage line","Takes advantage of natural drainage convergence (a suitable natural catchment/drainage line) while considering soil permeability and structural safety for water storage","Ignores catchment area entirely","Is always at the highest point of the watershed"],"a":1,"e":"Effective farm pond siting considers a natural catchment/drainage convergence point, adequate impermeable subsoil for storage, and safe structural conditions."},{"id":"Q0657","t":"Soil Conservation","q":"RUSLE (Revised Universal Soil Loss Equation) improves upon the original USLE mainly by:","o":["Eliminating the need for any input factors","Refining the calculation of individual factors (e.g., improved erosivity, cover-management sub-factors) using updated data and process understanding","Applying only to wind erosion","Removing the topographic factor entirely"],"a":1,"e":"RUSLE retains the same basic factor structure as USLE but incorporates more refined, process-based methods for estimating each factor."},{"id":"Q0883","t":"Soil Conservation","q":"'Live check dams', constructed using brushwood, branches, or rooted cuttings across small gully channels, are advantageous mainly because they:","o":["Are permanent, rigid, impermeable structures","Are low-cost, readily available materials that can take root and provide long-term vegetative stabilization in addition to initial sediment trapping","Require expensive imported materials","Cannot trap any sediment at all"],"a":1,"e":"Live check dams use inexpensive, locally available plant materials that can establish roots over time, combining immediate sediment-trapping function with eventual vegetative stabilization."},{"id":"Q0656","t":"Soil Conservation","q":"In the USLE, the 'P factor' (support practice factor) accounts for the effect of:","o":["Rainfall erosivity only","Specific erosion-control practices such as contouring, strip-cropping, or terracing, which reduce soil loss compared to up-and-down-slope farming","Soil mineralogy only","Only wind speed"],"a":1,"e":"P reflects the soil-loss-reducing benefit of conservation practices (contour farming, strip cropping, terracing) relative to farming straight up-and-down the slope."},{"id":"Q0873","t":"Soil Conservation","q":"Contour hedgerows, similar in principle to vegetative barriers, are established along the contour mainly to:","o":["Increase downslope runoff velocity","Slow runoff, trap sediment, and over time promote the formation of natural terraces on sloping land","Replace the need for any soil testing","Eliminate crop production on the land entirely"],"a":1,"e":"Like other vegetative contour barriers, hedgerows reduce runoff velocity and trap sediment, gradually leading to terrace-like landform development upslope of the hedge."},{"id":"Q0650","t":"Soil Conservation","q":"Gully erosion represents an advanced stage of water erosion characterized by:","o":["Channels too large and deep to be removed by ordinary tillage, requiring special reclamation measures","Only microscopic soil particle detachment","Erosion confined to raindrop splash only","No channel formation whatsoever"],"a":0,"e":"Gullies are deep, well-defined channels that cannot be eliminated by normal cultivation, often requiring engineering/structural remediation."},{"id":"Q0654","t":"Soil Conservation","q":"In the USLE, the 'K factor' represents:","o":["Rainfall erosivity","Inherent soil erodibility — the susceptibility of a particular soil to erosion, based on its properties (texture, structure, organic matter, permeability)","Slope steepness only","Crop management practices only"],"a":1,"e":"K quantifies how easily a specific soil erodes under standard conditions, reflecting its inherent physical/chemical susceptibility."}],"Soil Microbiology":[{"id":"Q0496","t":"Soil Microbiology","q":"Rhizobium bacteria must first recognize and infect compatible legume root hairs before nodulation; this specificity is largely governed by:","o":["Random chance with no biochemical basis","Signal exchange between plant-released flavonoids and bacterial Nod factors, which is host-specific","Soil pH alone","Soil temperature alone"],"a":1,"e":"Legume roots release flavonoid compounds that induce Rhizobium to produce Nod factors; this molecular signaling determines host specificity."},{"id":"Q0462","t":"Soil Microbiology","q":"Soil protozoa mainly influence nutrient cycling through:","o":["Nitrogen fixation","Grazing on bacteria, which releases mineralized nitrogen (the 'microbial loop')","Photosynthesis","Cellulose decomposition directly"],"a":1,"e":"Protozoan grazing on bacteria releases excess nitrogen as ammonium, contributing to nutrient turnover in the soil food web."},{"id":"Q0479","t":"Soil Microbiology","q":"Frankia, an actinomycete genus capable of nitrogen fixation, forms symbiotic root nodules with certain non-leguminous woody plants such as:","o":["Rice and wheat","Casuarina and Alnus (alder)","Groundnut and soybean","Cotton and sugarcane"],"a":1,"e":"Frankia forms 'actinorhizal' nitrogen-fixing symbioses with a range of non-legume woody plants, including Casuarina and Alnus."},{"id":"Q0470","t":"Soil Microbiology","q":"Soil catalase enzyme activity is generally used as an indicator related to:","o":["Aerobic microbial activity, since it decomposes hydrogen peroxide produced during respiration","Soil salinity only","Cation exchange capacity","Soil color development"],"a":0,"e":"Catalase breaks down H2O2 generated in oxidative metabolism, so its activity broadly reflects aerobic microbial/root activity."},{"id":"Q0491","t":"Soil Microbiology","q":"Soil pH strongly influences the balance of microbial groups; in general, fungi tend to dominate relative to bacteria in:","o":["Neutral to slightly alkaline soils","Acidic soils, where bacterial activity is often more restricted","Extremely saline soils only","Waterlogged anaerobic soils only"],"a":1,"e":"Bacteria are generally more sensitive to low pH than fungi, so fungi often become relatively more dominant decomposers in acid soils."},{"id":"Q0464","t":"Soil Microbiology","q":"The 'R:S ratio' (rhizosphere to non-rhizosphere/bulk soil ratio) of microbial counts is generally:","o":["Less than 1, since roots suppress microbial growth","Greater than 1, reflecting enhanced microbial activity stimulated by root exudates","Always exactly equal to 1","Unrelated to root activity"],"a":1,"e":"Root exudates (sugars, amino acids, organic acids) stimulate microbial growth, giving R:S ratios well above 1."},{"id":"Q0473","t":"Soil Microbiology","q":"Humification refers to the process by which:","o":["Fresh organic residues are rapidly decomposed into CO2 and water only","Decomposed organic materials are transformed into complex, relatively stable humic substances","Minerals are converted into organic matter","Soil pH is neutralized"],"a":1,"e":"Humification is the biochemical transformation of decomposing organic matter into stable, dark-colored humic substances (humus)."},{"id":"Q0507","t":"Soil Microbiology","q":"The optimum soil temperature range for most mesophilic microbial activity, including composting after the initial thermophilic phase, is approximately:","o":["0–5°C","25–40°C","70–90°C","Below freezing"],"a":1,"e":"Most mesophilic soil microorganisms are most active in the roughly 25–40°C range, though thermophiles in active compost can exceed this."},{"id":"Q0469","t":"Soil Microbiology","q":"Soil phosphatase enzyme activity is used as an indicator of:","o":["The soil's capacity to mineralize organic phosphorus into plant-available inorganic forms","Nitrogen fixation potential","Soil salinity level","Soil bulk density"],"a":0,"e":"Phosphatases hydrolyze organic phosphate esters, releasing inorganic phosphate, and their activity indicates the soil's P-mineralizing potential."},{"id":"Q0478","t":"Soil Microbiology","q":"Leghemoglobin, a pink/red pigment found in effective legume root nodules, functions mainly to:","o":["Fix atmospheric nitrogen directly","Regulate oxygen concentration within the nodule, protecting the oxygen-sensitive nitrogenase enzyme while allowing respiration","Produce chlorophyll","Break down soil organic matter"],"a":1,"e":"Leghemoglobin buffers oxygen levels inside the nodule, supplying enough O2 for bacteroid respiration without inactivating nitrogenase."},{"id":"Q0513","t":"Soil Microbiology","q":"Which of the following soil microorganisms is specifically associated with symbiotic phosphorus nutrition rather than nitrogen fixation?","o":["Rhizobium","Frankia","Arbuscular mycorrhizal fungi","Azotobacter"],"a":2,"e":"AMF form a symbiosis focused primarily on enhancing phosphorus (and some micronutrient) uptake, distinct from N-fixing symbioses."},{"id":"Q0505","t":"Soil Microbiology","q":"Which factor most directly limits microbial activity in very dry (low water potential) soils?","o":["Excess oxygen availability","Restricted water availability, which limits microbial metabolism and movement of substrates/enzymes","Excess nitrogen","High soil temperature only"],"a":1,"e":"Water is essential for microbial metabolic processes and diffusion of substrates; drought sharply reduces microbial activity."},{"id":"Q0509","t":"Soil Microbiology","q":"Which of the following best describes 'biological nitrogen fixation' as a soil process?","o":["Conversion of atmospheric N2 gas into ammonia by specific microorganisms possessing the nitrogenase enzyme","Chemical synthesis of nitrogen fertilizer","Uptake of nitrate by plant roots","Loss of nitrogen gas from soil"],"a":0,"e":"BNF is the microbial reduction of inert atmospheric N2 to biologically usable ammonia, carried out only by organisms with nitrogenase."},{"id":"Q0512","t":"Soil Microbiology","q":"Which best explains why legume-Rhizobium symbiosis is described as 'mutualistic'?","o":["Only the plant benefits, with no cost or benefit to the bacteria","Both partners benefit — the plant receives fixed nitrogen while the bacteria receive photosynthate and a protected niche","Only the bacteria benefit, harming the plant","Neither partner benefits"],"a":1,"e":"Mutualism means both the host legume (nitrogen supply) and the rhizobial symbiont (carbon supply, protection) gain from the relationship."},{"id":"Q0465","t":"Soil Microbiology","q":"Ectomycorrhizae, in contrast to endomycorrhizae (VAM), are characterized by:","o":["Fungal hyphae penetrating inside root cortical cells","A fungal sheath (mantle) around the root surface with a Hartig net between cortical cells, without penetrating the cells themselves","Complete absence of any fungal-root association","Occurring only in agricultural crop plants"],"a":1,"e":"Ectomycorrhizae form an external mantle plus intercellular Hartig net, typically associated with forest trees, unlike VAM which penetrate root cells."},{"id":"Q0463","t":"Soil Microbiology","q":"The 'rhizosphere' is defined as:","o":["The bulk soil far from any root influence","The zone of soil immediately surrounding and influenced by plant roots, with elevated microbial activity","The soil surface layer exposed to sunlight","The subsoil layer below the root zone"],"a":1,"e":"The rhizosphere is the narrow zone of soil influenced by root exudates and activity, typically showing much higher microbial density than bulk soil."},{"id":"Q0492","t":"Soil Microbiology","q":"Symbiotic nitrogen fixation is generally more efficient (fixes more N per unit area) than free-living/associative fixation mainly because:","o":["Symbiotic systems provide the bacteria a protected niche and direct carbon supply from the host plant, supporting higher fixation rates","Free-living bacteria always fix more nitrogen","Symbiosis has no effect on fixation rate","Free-living fixation requires no energy"],"a":0,"e":"The host plant supplies photosynthate directly to the nodule bacteria and provides a protective, low-oxygen environment, enabling higher fixation rates than free-living systems typically achieve."},{"id":"Q0500","t":"Soil Microbiology","q":"Which of the following microbial groups is generally most tolerant of dry, hot, and alkaline soil conditions, often persisting where bacterial activity is reduced?","o":["Protozoa","Actinomycetes","Algae","Nematodes"],"a":1,"e":"Actinomycetes are relatively tolerant of dry and alkaline conditions, remaining active where many other groups are limited."},{"id":"Q0501","t":"Soil Microbiology","q":"In the decomposition of plant residues, the general sequence of colonization by microorganisms tends to progress from:","o":["Fungi (lignin) first, followed by simple-sugar-using bacteria","Fast-growing organisms using simple sugars/sap first, followed progressively by organisms capable of degrading cellulose and finally the more resistant lignin","No particular sequence at all","Only actinomycetes throughout"],"a":1,"e":"Decomposition proceeds through a microbial succession, starting with easily available substrates and moving toward more recalcitrant compounds like lignin over time."},{"id":"Q0468","t":"Soil Microbiology","q":"Urease activity in soil is significant because it catalyzes:","o":["Hydrolysis of urea to ammonia and carbon dioxide","Oxidation of ammonium to nitrate","Fixation of atmospheric nitrogen","Reduction of nitrate to N2 gas"],"a":0,"e":"Urease hydrolyzes applied urea fertilizer to ammonium carbonate, releasing plant-available ammonium (and risking ammonia volatilization)."},{"id":"Q0460","t":"Soil Microbiology","q":"Actinomycetes are a group of soil microorganisms notable for:","o":["Being strictly photosynthetic","Having filamentous, bacteria-like growth and producing the characteristic 'earthy' smell of freshly ploughed soil (geosmin)","Being obligate plant pathogens only","Fixing atmospheric nitrogen exclusively"],"a":1,"e":"Actinomycetes (e.g., Streptomyces) are filamentous bacteria responsible for the characteristic earthy odor of soil, via geosmin production."},{"id":"Q0514","t":"Soil Microbiology","q":"Which observation best supports classifying nitrifying bacteria as 'obligate aerobes'?","o":["They function normally under complete anaerobiosis","Nitrification (NH4+ to NO3-) requires molecular oxygen as the terminal electron acceptor, so it proceeds only under aerobic conditions","They only function in flooded soils","They require darkness to function"],"a":1,"e":"Because nitrification is an oxidative process requiring O2, nitrifiers are strict aerobes and their activity halts under waterlogged, anaerobic conditions."},{"id":"Q0489","t":"Soil Microbiology","q":"Soil fungal biomass generally has a wider C:N ratio than bacterial biomass, which partly explains why:","o":["Fungi are more efficient at surviving in low-nitrogen, high-carbon residues such as straw or wood","Fungi never decompose any organic matter","Bacteria always dominate acid soils","Fungi require no carbon at all"],"a":0,"e":"A wider C:N tolerance allows fungi to better colonize carbon-rich, nitrogen-poor substrates like straw, wood and other plant residues."},{"id":"Q0485","t":"Soil Microbiology","q":"Plant growth-promoting rhizobacteria (PGPR) benefit crops through mechanisms that include:","o":["Producing plant growth hormones, solubilizing nutrients, and suppressing certain pathogens","Only causing plant disease","Fixing nitrogen exclusively, with no other function","Only degrading pesticides"],"a":0,"e":"PGPR promote plant growth via multiple mechanisms: phytohormone production, nutrient solubilization/fixation, and biocontrol of pathogens."},{"id":"Q0488","t":"Soil Microbiology","q":"The C:N ratio of most soil bacteria's own biomass is relatively:","o":["Very high (>50:1)","Narrow (typically around 4:1 to 6:1), lower than that of fungi","Identical to fresh straw (about 80:1)","Impossible to determine"],"a":1,"e":"Bacterial biomass has a comparatively narrow C:N ratio, generally lower than fungal biomass, reflecting their protein-rich composition."},{"id":"Q0517","t":"Soil Microbiology","q":"Which of the following would be expected to most directly reduce beneficial soil microbial activity in the short term?","o":["Balanced organic manure application","Excessive, repeated application of broad-spectrum chemical biocides/fumigants","Crop residue incorporation","Green manuring"],"a":1,"e":"Broad-spectrum fumigants/biocides can non-selectively suppress or kill soil microorganisms, at least temporarily reducing overall biological activity."},{"id":"Q0461","t":"Soil Microbiology","q":"Soil algae, though present in smaller numbers than bacteria, contribute to soil fertility mainly by:","o":["Fixing atmospheric nitrogen (in the case of blue-green algae/cyanobacteria) and adding organic matter through photosynthesis","Decomposing lignin exclusively","Producing antibiotics only","Fixing phosphorus permanently"],"a":0,"e":"Certain soil algae, especially cyanobacteria, photosynthesize and some fix N2, contributing organic matter and nitrogen."},{"id":"Q0499","t":"Soil Microbiology","q":"Actinomycetes are of considerable agricultural and pharmaceutical importance because many species produce:","o":["No useful secondary metabolites","Antibiotics (e.g., streptomycin from Streptomyces), useful in medicine and sometimes in disease suppression","Only toxic compounds harmful to plants","Nitrogen gas directly"],"a":1,"e":"Streptomyces and related actinomycetes are major natural sources of antibiotics, and some contribute to soil-borne disease suppression."},{"id":"Q0515","t":"Soil Microbiology","q":"The general term 'edaphon' refers to:","o":["The mineral fraction of soil","The entire community of soil-inhabiting organisms (flora and fauna) collectively","Only the soil microbial biomass carbon value","A specific soil enzyme"],"a":1,"e":"Edaphon is a classical term encompassing all soil-dwelling organisms — microorganisms, fauna, and roots — collectively."},{"id":"Q0510","t":"Soil Microbiology","q":"Which of the following soil conditions is generally MOST favourable for high overall microbial activity?","o":["Waterlogged, cold, acidic soil with no organic matter","Well-aerated, moist (not saturated), warm soil with adequate organic matter and near-neutral pH","Completely dry, hot desert soil","Extremely saline, alkaline soil"],"a":1,"e":"Optimal moisture, aeration, temperature, organic substrate and moderate pH together support maximal microbial activity."},{"id":"Q0480","t":"Soil Microbiology","q":"Heterocysts, specialized cells found in filamentous cyanobacteria such as Anabaena, function to:","o":["Carry out photosynthesis only","Provide a microaerobic environment for nitrogen fixation, protecting nitrogenase from oxygen produced during photosynthesis","Produce spores for dispersal only","Store excess phosphorus"],"a":1,"e":"Heterocysts have thick walls limiting oxygen entry, allowing nitrogen fixation to proceed separately from oxygen-evolving photosynthesis in adjacent cells."},{"id":"Q0459","t":"Soil Microbiology","q":"Although bacteria are most numerous, which group generally contributes the greatest microbial biomass in soil due to their extensive hyphal networks?","o":["Protozoa","Fungi","Algae","Viruses"],"a":1,"e":"Despite lower numbers, fungal hyphae have substantial biomass, often exceeding bacterial biomass in many soils."},{"id":"Q0458","t":"Soil Microbiology","q":"Among soil microorganisms, which group is generally most numerous by count per gram of soil?","o":["Fungi","Bacteria","Actinomycetes","Protozoa"],"a":1,"e":"Bacteria typically outnumber all other soil microbial groups, often reaching hundreds of millions to billions per gram of soil."},{"id":"Q0484","t":"Soil Microbiology","q":"PLFA (phospholipid fatty acid) analysis is a technique used in soil microbiology to:","o":["Directly sequence microbial DNA","Estimate the size and general composition (e.g., bacterial vs fungal) of the living soil microbial community based on characteristic membrane lipid signatures","Measure soil pH","Measure soil salinity"],"a":1,"e":"Different microbial groups have characteristic phospholipid fatty acid profiles, allowing PLFA analysis to estimate living biomass and community structure."},{"id":"Q0477","t":"Soil Microbiology","q":"The 'nitrogenase' enzyme complex responsible for biological nitrogen fixation is inhibited by the presence of:","o":["Carbon dioxide","Free oxygen, since nitrogenase is oxygen-sensitive","Water","Sunlight only"],"a":1,"e":"Nitrogenase is irreversibly inactivated by oxygen, so N2-fixing organisms have evolved mechanisms (e.g., leghemoglobin, heterocysts) to protect it."},{"id":"Q0481","t":"Soil Microbiology","q":"Nitrifying bacteria such as Nitrosomonas and Nitrobacter are classified as:","o":["Heterotrophic bacteria requiring organic carbon","Chemoautotrophic bacteria that derive energy from oxidizing inorganic nitrogen compounds","Obligate anaerobes","Photosynthetic bacteria"],"a":1,"e":"Nitrifiers are chemoautotrophs, obtaining energy by oxidizing NH4+ or NO2- and fixing CO2 for their carbon needs."}],"General Agriculture & Statistics":[{"id":"Q0960","t":"General Agriculture & Statistics","q":"Mountain and forest soils of India, found in Himalayan and other hilly forested regions, are generally characterized by:","o":["Extremely low organic matter due to complete absence of vegetation","Variable depth and texture depending on slope/altitude, generally higher organic matter under forest litter accumulation, and often acidic reaction","Uniform, deep, level profiles with no variation","Extremely high salinity throughout"],"a":1,"e":"Forest/mountain soils vary considerably with terrain and altitude but commonly show notable organic matter accumulation from forest litter and often acidic reaction under humid forested conditions."},{"id":"Q0756","t":"General Agriculture & Statistics","q":"'Randomization' in experimental design serves mainly to:","o":["Introduce systematic bias intentionally","Ensure each experimental unit has an equal chance of receiving any treatment, helping to eliminate systematic bias and validate statistical assumptions","Eliminate the need for any replication","Guarantee identical results across all replicates"],"a":1,"e":"Randomization removes systematic assignment bias, helping ensure that treatment comparisons reflect true treatment effects rather than confounded extraneous factors."},{"id":"Q0861","t":"General Agriculture & Statistics","q":"A 'census' survey, as opposed to a 'sample' survey, refers to data collection that:","o":["Covers only a small representative subset of the population","Attempts to cover every single unit of the entire population, rather than a subset","Is conducted only once every century","Applies only to livestock, never crops"],"a":1,"e":"A census aims for complete enumeration of every unit in the population, whereas a sample survey studies only a representative subset."},{"id":"Q0845","t":"General Agriculture & Statistics","q":"A Student's t-test is generally used to:","o":["Compare the means of exactly two groups/treatments to assess whether they differ significantly","Compare more than ten groups simultaneously with no assumptions","Directly compute soil texture percentages","Test only categorical/frequency data"],"a":0,"e":"The t-test evaluates whether the difference between two group means is statistically significant, commonly used for simple two-treatment comparisons."},{"id":"Q0865","t":"General Agriculture & Statistics","q":"The Green Revolution in India, from the 1960s onward, was primarily characterized by the introduction of:","o":["Only organic farming practices","High-yielding crop varieties (especially wheat and rice) combined with increased use of fertilizers, irrigation, and improved agronomic practices","Complete elimination of chemical fertilizer use","Only mechanization, with no change in varieties"],"a":1,"e":"The Green Revolution centered on high-yielding varieties supported by expanded irrigation, fertilizer use and modern agronomic practices, substantially boosting national food grain production."},{"id":"Q0860","t":"General Agriculture & Statistics","q":"'Gross cropped area', in contrast to net sown area, refers to:","o":["The total area sown, counting land sown more than once in a year as many times as it is cropped","Only the area under a single, primary crop","Only fallow land area","Only forest area"],"a":1,"e":"Gross cropped area sums the area under crops each time land is cropped during the year, so multi-cropped land is counted multiple times."},{"id":"Q0994","t":"General Agriculture & Statistics","q":"A 'border effect' (edge effect) in field plot experiments, if not accounted for, can bias results mainly because:","o":["Border rows/plants are always identical in performance to interior ones","Plants at the edge of a plot may experience different competitive/environmental conditions than interior plants, so many trials exclude border rows/plants from data collection ('border effect' correction)","Border effects only occur in laboratory experiments","Border effects always improve data accuracy with no correction needed"],"a":1,"e":"Edge plants often experience reduced competition or altered microclimate, so excluding border rows/plants from actual data collection helps avoid this bias in yield/performance estimates."},{"id":"Q0840","t":"General Agriculture & Statistics","q":"A Latin Square Design in agricultural experimentation is particularly suited to situations where:","o":["There is no field variability to control","Two independent sources of variability (e.g., variation in two perpendicular directions, such as rows and columns) need to be controlled simultaneously, in addition to treatment effects","Only one treatment is being tested with no replication","The experiment must be conducted in a single row only"],"a":1,"e":"A Latin Square controls two directions of variability (rows and columns) by ensuring each treatment appears exactly once in every row and every column."},{"id":"Q0842","t":"General Agriculture & Statistics","q":"Angular (arcsine) transformation is commonly applied to percentage or proportion data before ANOVA mainly to:","o":["Increase the range of the data artificially","Stabilize variance and better satisfy the assumptions of normality/homogeneity of variance required for valid ANOVA, since raw percentage data often violates these assumptions","Convert the data into a categorical (non-numeric) form","Eliminate the need for any statistical analysis"],"a":1,"e":"Percentage/proportion data, especially near 0% or 100%, often has non-constant variance; arcsine transformation helps stabilize variance for valid ANOVA."},{"id":"Q0759","t":"General Agriculture & Statistics","q":"'Standard error of the mean' (SEm) in agricultural research is used to:","o":["Represent the total range of raw data values","Quantify the precision of an estimated treatment mean and to construct significance tests/confidence intervals for comparing means","Replace the need for any replication","Measure soil texture"],"a":1,"e":"SEm reflects how precisely the sample mean estimates the true population mean, forming the basis for significance testing (e.g., critical difference) between treatment means."},{"id":"Q0769","t":"General Agriculture & Statistics","q":"A cropping system in which two or more crops are grown simultaneously on the same piece of land is generally termed:","o":["Monocropping","Intercropping/mixed cropping","Crop rotation","Fallowing"],"a":1,"e":"Intercropping (or mixed cropping) involves growing two or more crops together on the same land during the same season, often to improve resource use efficiency."},{"id":"Q0856","t":"General Agriculture & Statistics","q":"Krishi Vigyan Kendras (KVKs) in India primarily function as:","o":["Only research laboratories with no farmer contact","District-level frontline agricultural extension centres that transfer agricultural technology/knowledge directly to farmers through training and demonstration","Only seed certification agencies","Only meteorological observatories"],"a":1,"e":"KVKs serve as district-level extension units that bridge agricultural research and farmers through training, demonstrations, and technology transfer."},{"id":"Q0758","t":"General Agriculture & Statistics","q":"The 'coefficient of variation' (CV%) in a field experiment is used mainly to indicate:","o":["The average yield of the experiment","The relative precision/reliability of the experiment — a lower CV% generally indicates more precise, reliable experimental conduct","The total number of treatments tested","The soil type used in the experiment"],"a":1,"e":"CV% expresses experimental error as a percentage of the mean, with lower values indicating greater precision and more reliable/consistent experimental conduct."},{"id":"Q0848","t":"General Agriculture & Statistics","q":"A 'population' in statistical terminology refers to:","o":["Only human inhabitants of a region","The entire, complete set of individuals/units of interest about which conclusions are to be drawn, from which a smaller sample may be studied","Only the treatments applied in an experiment","A single data point"],"a":1,"e":"Statistically, 'population' means the complete group under study (e.g., all fields in a district), distinct from a 'sample' — a subset actually measured."},{"id":"Q0853","t":"General Agriculture & Statistics","q":"Red and laterite soils in India, generally low in fertility and often acidic, are predominantly associated with which broad regions?","o":["The Indo-Gangetic plains","Parts of peninsular India (e.g., Tamil Nadu, Karnataka, Odisha, and parts of the Northeast) under high rainfall and older crystalline rock","Only the Thar desert","Only the Himalayan high-altitude zone"],"a":1,"e":"Red and laterite soils, formed under intense weathering of older crystalline rocks in high-rainfall regions, are widespread across parts of peninsular India and the Northeast."},{"id":"Q0849","t":"General Agriculture & Statistics","q":"'Skewness' of a frequency distribution describes:","o":["The average value of the distribution","The asymmetry of the distribution around its mean (e.g., a longer tail on one side)","The total number of observations","The units of measurement used"],"a":1,"e":"Skewness quantifies how asymmetric a distribution is; a symmetric (normal) distribution has zero skewness, while skewed distributions have a longer tail on one side."},{"id":"Q0752","t":"General Agriculture & Statistics","q":"In agricultural field experimentation, a Randomized Block Design (RBD) is primarily used to:","o":["Ignore all sources of field variability","Control known/expected variability in one direction (e.g., a fertility gradient) by grouping experimental units into homogeneous blocks before randomizing treatments within each block","Eliminate the need for replication entirely","Apply only one treatment across the whole field"],"a":1,"e":"RBD groups similar experimental units into blocks to control a known source of variation, increasing precision compared to a completely randomized design when such variation exists."},{"id":"Q0770","t":"General Agriculture & Statistics","q":"Crop rotation, as a farming practice, refers to:","o":["Growing the same crop repeatedly on the same land every season","Growing different crops in a planned, recurring sequence on the same land over successive seasons/years","Growing multiple crops simultaneously on the same land","Leaving land completely uncultivated indefinitely"],"a":1,"e":"Crop rotation systematically alternates different crops (often including a legume) over time on the same land, helping manage pests, diseases and soil fertility."},{"id":"Q0841","t":"General Agriculture & Statistics","q":"Duncan's Multiple Range Test (DMRT), like the Critical Difference/LSD test, is used after a significant ANOVA result mainly to:","o":["Recompute the total experimental error only","Compare multiple pairs of treatment means to identify which specific means differ significantly from each other","Eliminate the need for any replication in future experiments","Determine soil texture class"],"a":1,"e":"Post-hoc mean comparison tests like DMRT are applied after a significant ANOVA F-test to pinpoint which specific treatment mean pairs differ significantly."},{"id":"Q0844","t":"General Agriculture & Statistics","q":"A chi-square (χ2) test is commonly used in agricultural research to:","o":["Compare only continuous, normally distributed means","Test whether observed categorical/frequency data significantly deviate from expected frequencies (e.g., testing goodness of fit or independence of categorical variables)","Only calculate soil pH","Directly estimate crop yield"],"a":1,"e":"Chi-square tests assess whether observed frequency/categorical data depart significantly from an expected distribution or whether two categorical variables are independent."},{"id":"Q0993","t":"General Agriculture & Statistics","q":"In a well-designed field experiment, 'plot size and shape' are important considerations mainly because they influence:","o":["Nothing relevant to experimental precision","The magnitude of within-plot (and between-plot) variability, and hence the overall precision of treatment comparisons","Only the cost of seed used, with no effect on results","Only the color of the crop"],"a":1,"e":"Appropriately sized/shaped plots help balance practical constraints with minimizing variability that could otherwise obscure real treatment differences, improving overall experimental precision."},{"id":"Q0862","t":"General Agriculture & Statistics","q":"In a research trial comparing several treatments, a 'control' (or check) treatment is included primarily to:","o":["Provide a baseline/reference against which the effects of other treatments can be meaningfully compared","Always give the highest yield in the trial","Replace the need for statistical analysis","Only be used in laboratory studies"],"a":0,"e":"A control/check provides the untreated or standard-practice baseline needed to judge whether other treatments produce a meaningful difference."},{"id":"Q0757","t":"General Agriculture & Statistics","q":"Analysis of Variance (ANOVA) is a statistical technique used primarily to:","o":["Calculate only the mean of a dataset","Partition total variability in the data into components attributable to different sources (e.g., treatments, blocks, error), allowing a test of whether treatment means differ significantly","Determine soil pH","Measure spatial autocorrelation only"],"a":1,"e":"ANOVA decomposes total variance into treatment and error components, providing an F-test to assess whether observed treatment differences are statistically significant."},{"id":"Q0760","t":"General Agriculture & Statistics","q":"'Critical Difference' (CD) or 'Least Significant Difference' (LSD), commonly reported in agricultural trial results, is used to:","o":["Determine the total experimental area","Decide whether the difference between two treatment means is statistically significant at a chosen probability level","Calculate rainfall totals","Measure soil bulk density"],"a":1,"e":"CD/LSD provides a threshold: if the observed difference between two means exceeds this value, it is considered statistically significant at the stated probability level."},{"id":"Q0859","t":"General Agriculture & Statistics","q":"The term 'net sown area' refers to:","o":["The total area sown more than once in a year, counted multiple times","The physical area of land sown with crops at least once in a given agricultural year, counted only once regardless of how many crops are grown on it","Only irrigated land area","Only forest land area"],"a":1,"e":"Net sown area counts each physical piece of land only once, regardless of how many crops are grown on it during the year, distinguishing it from gross cropped area."},{"id":"Q0764","t":"General Agriculture & Statistics","q":"'Interaction effect' between two factors in a factorial experiment refers to a situation where:","o":["The effect of one factor is completely independent of the level of the other factor","The effect of one factor on the response variable changes depending on the level of the other factor","Neither factor has any effect on the response","Both factors always have identical, additive effects"],"a":1,"e":"An interaction indicates that the factors do not act independently — the response to one factor differs across levels of the other factor."},{"id":"Q0955","t":"General Agriculture & Statistics","q":"A 'factorial RBD' experiment combines the features of factorial treatment structure with:","o":["No blocking at all","Randomized block design's blocking to control field variability, while testing combinations of two or more treatment factors","Only a single treatment factor with no combinations","Complete absence of randomization"],"a":1,"e":"A factorial RBD applies factorial treatment combinations (multiple factors) within the blocking structure of an RBD, combining both design principles in one experiment."},{"id":"Q0998","t":"General Agriculture & Statistics","q":"Which best describes why replicated, multi-location trials are often preferred over single-location trials when evaluating a new crop variety or soil management practice for wider recommendation?","o":["Single-location results are always sufficient for any recommendation, anywhere","Performance can vary with local soil, climate and management conditions, so multi-location testing helps assess the stability/adaptability of a treatment across diverse environments before broader recommendation","Multi-location trials are only used for cosmetic reasons, not scientific ones","Multi-location trials eliminate the need for any statistical analysis"],"a":1,"e":"Testing across diverse locations/environments reveals whether a variety or practice performs consistently or is highly sensitive to specific local conditions, informing more robust, broadly applicable recommendations."},{"id":"Q0762","t":"General Agriculture & Statistics","q":"In regression analysis relating a dependent variable (e.g., crop yield) to an independent variable (e.g., fertilizer dose), the coefficient of determination (R2) indicates:","o":["The exact experimental error variance only","The proportion of variability in the dependent variable that is statistically explained by the independent variable(s) in the model","The total number of observations","The critical difference value"],"a":1,"e":"R2 expresses how much of the variation in the response variable is accounted for by the fitted regression model, ranging from 0 to 1."},{"id":"Q0753","t":"General Agriculture & Statistics","q":"A Completely Randomized Design (CRD) is most appropriate for experiments conducted under conditions of:","o":["Considerable known field variability requiring blocking","Fairly homogeneous experimental conditions (e.g., controlled laboratory/greenhouse settings) with minimal need to control extraneous variability","Only multi-location field trials","Only very large-scale farmer field experiments"],"a":1,"e":"CRD randomly assigns treatments across all experimental units without blocking, suited to relatively uniform conditions such as many laboratory/pot experiments."},{"id":"Q0851","t":"General Agriculture & Statistics","q":"Alluvial soils, the most extensive soil group in India, are predominantly found in which broad region?","o":["The Deccan plateau exclusively","The Indo-Gangetic and Brahmaputra plains, formed from river-deposited sediment","Only the Thar desert","Only the Western Ghats"],"a":1,"e":"Alluvial soils, deposited by major river systems, dominate the vast Indo-Gangetic and Brahmaputra plains, forming India's most extensive and agriculturally important soil group."},{"id":"Q0961","t":"General Agriculture & Statistics","q":"A 'multiple regression' model, as opposed to simple linear regression, relates a dependent variable to:","o":["Exactly one independent variable only, identical to simple regression","Two or more independent (predictor) variables simultaneously, allowing assessment of their combined and individual contributions to the dependent variable","No independent variables at all","Only categorical independent variables, never continuous ones"],"a":1,"e":"Multiple regression extends simple regression to incorporate two or more predictor variables, useful when a response (e.g., yield) depends on several interacting factors."},{"id":"Q0768","t":"General Agriculture & Statistics","q":"The Indian Council of Agricultural Research (ICAR) functions as the apex body responsible mainly for:","o":["Only regulating agricultural imports/exports","Coordinating agricultural research and education across India through its network of institutes, universities and research programs","Only issuing weather forecasts","Only administering rural banking"],"a":1,"e":"ICAR is India's apex organization for coordinating, promoting and funding agricultural research and higher agricultural education nationwide."},{"id":"Q0956","t":"General Agriculture & Statistics","q":"'Missing plot technique' in agricultural experimental statistics is used when:","o":["All experimental data are complete with no missing values","One or a few observations in a designed experiment are missing (e.g., due to plot damage), and a statistical method estimates the missing value(s) to allow a valid overall analysis","An experiment has no treatments at all","Replication is deliberately avoided"],"a":1,"e":"Missing plot techniques provide a statistically valid way to estimate absent data points (e.g., from damaged plots) so the overall experimental analysis can still proceed appropriately."},{"id":"Q0775","t":"General Agriculture & Statistics","q":"A 'p-value' of 0.03 obtained from a statistical test, when compared against a conventional significance level of 0.05, would generally be interpreted as:","o":["Not statistically significant, since 0.03 is greater than 0.05","Statistically significant at the 5% level, since 0.03 is less than 0.05, providing evidence against the null hypothesis","Completely inconclusive, with no possible interpretation","Proof of a large practical effect size regardless of context"],"a":1,"e":"A p-value below the chosen significance threshold (commonly 0.05) is conventionally taken as statistically significant evidence against the null hypothesis."},{"id":"Q0843","t":"General Agriculture & Statistics","q":"'Degrees of freedom' in a statistical analysis generally refers to:","o":["The total sample size only, with no other meaning","The number of independent values/comparisons that are free to vary when estimating a statistical parameter, used in determining critical values for significance tests","The number of treatments tested, always identical to sample size","A fixed constant, identical for every dataset"],"a":1,"e":"Degrees of freedom reflect the number of independent pieces of information available for estimating variability, central to determining appropriate reference distributions for significance testing."},{"id":"Q0761","t":"General Agriculture & Statistics","q":"Correlation coefficient (r) between two variables (e.g., soil organic carbon and crop yield) measures:","o":["The exact cause-and-effect relationship between the variables","The strength and direction of the linear association between the two variables, ranging from -1 to +1","Only the mean of one variable","Only the variance of one variable"],"a":1,"e":"Correlation quantifies linear association strength/direction, but does not by itself establish causation between the two variables."},{"id":"Q0997","t":"General Agriculture & Statistics","q":"'Farming system' sustainability is often evaluated using multiple indicators spanning:","o":["Only immediate crop yield, with no other consideration","Productivity, economic viability, environmental soundness (e.g., soil health, resource use), and social acceptability together","Only market price trends","Only rainfall data"],"a":1,"e":"A holistic sustainability assessment considers multiple dimensions — productivity, economics, environmental impact (including soil health), and social factors — rather than yield alone."},{"id":"Q0846","t":"General Agriculture & Statistics","q":"'Precision' and 'accuracy' in measurement are distinguished such that:","o":["Precision refers to how close repeated measurements are to each other, while accuracy refers to how close a measurement is to the true value","They are exactly synonymous terms with no distinction","Precision refers only to instrument cost","Accuracy refers only to sample size"],"a":0,"e":"Precision reflects repeatability/consistency of measurements, while accuracy reflects closeness to the true (correct) value; a measurement can be precise without being accurate, or vice versa."},{"id":"Q0772","t":"General Agriculture & Statistics","q":"'Farming systems research' takes a holistic approach to agricultural research mainly because it:","o":["Studies each crop or enterprise in complete isolation, ignoring interactions","Considers the interactions among various farm enterprises (crops, livestock, etc.) and resources as an integrated whole, reflecting the reality of a farm household","Ignores farmer resource constraints entirely","Focuses solely on single-crop yield maximization regardless of other enterprises"],"a":1,"e":"Farming systems research examines the farm as an interconnected system of enterprises and resources, better reflecting real-world farmer decision-making than isolated single-crop studies."}],"Soil Physics":[{"id":"Q0059","t":"Soil Physics","q":"Atterberg limits are primarily used to characterize:","o":["Soil color","Consistency and engineering/workability behaviour of fine-textured soils","Nutrient status","Microbial biomass"],"a":1,"e":"These limits describe how a fine-textured soil's mechanical behaviour changes with water content."},{"id":"Q0019","t":"Soil Physics","q":"Micropores in soil are mainly responsible for:","o":["Rapid drainage","Water retention against gravity","Root channel formation","Soil aeration"],"a":1,"e":"Small pores hold water by capillary and adsorptive forces, retaining it against gravity."},{"id":"Q0092","t":"Soil Physics","q":"Soil structure that develops naturally is classified by grade, class (size) and:","o":["Type (shape)","Color hue","pH class","Salinity class"],"a":0,"e":"Structure is described by grade (distinctness), class (size) and type (shape, e.g. granular, blocky, prismatic, platy)."},{"id":"Q0051","t":"Soil Physics","q":"Gypsum blocks (electrical resistance blocks) are used to measure soil water status mainly in the:","o":["Very wet range near saturation","Drier range, useful where tensiometers lose contact","Only under waterlogged conditions","Only in laboratory columns"],"a":1,"e":"Gypsum blocks work well in drier soil where tensiometers (limited to about −0.08 MPa) fail."},{"id":"Q0027","t":"Soil Physics","q":"Soil organic matter improves aggregate stability mainly by:","o":["Increasing bulk density","Binding particles together via organic binding agents","Increasing sodium saturation","Reducing microbial activity"],"a":1,"e":"Organic matter and microbial by-products (polysaccharides, fungal hyphae) cement particles into stable aggregates."},{"id":"Q0015","t":"Soil Physics","q":"A higher bulk density value generally indicates:","o":["Greater total porosity","More compaction and less pore space","Higher organic matter","Higher hydraulic conductivity"],"a":1,"e":"Bulk density rises as soil particles are packed more closely, reflecting compaction and reduced porosity."},{"id":"Q0082","t":"Soil Physics","q":"Compared with clay, sandy soil generally has:","o":["Larger individual pores but lower total porosity","Smaller individual pores and higher total porosity","Identical pore size distribution","No porosity at all"],"a":0,"e":"Sand grains pack into fewer, larger pores overall, giving larger individual pores despite lower total porosity than clay."},{"id":"Q0017","t":"Soil Physics","q":"Total porosity of most agricultural mineral soils typically ranges between:","o":["5–15%","25–35%","40–60%","80–95%"],"a":2,"e":"Well-structured mineral soils commonly have 40–60% total pore space."},{"id":"Q0031","t":"Soil Physics","q":"Total soil water potential is the sum of:","o":["Only matric and gravitational potential","Matric, osmotic, gravitational and pressure potentials","Only osmotic potential","Only pressure potential"],"a":1,"e":"Total water potential integrates matric, osmotic, gravitational and (where relevant) pressure/pneumatic components."},{"id":"Q0072","t":"Soil Physics","q":"Soil compaction is most directly indicated by an increase in:","o":["Total porosity","Bulk density","Available water capacity","Aggregate stability"],"a":1,"e":"Compaction packs particles closer together, raising bulk density and reducing pore space."},{"id":"Q0002","t":"Soil Physics","q":"As per the USDA system, the silt fraction includes particles in the size range:","o":["0.002–0.05 mm","0.05–2.0 mm","<0.001 mm","1–2 mm"],"a":0,"e":"Silt is defined as 0.002–0.05 mm in the USDA classification."},{"id":"Q0077","t":"Soil Physics","q":"Surface soil crusting is primarily caused by:","o":["High organic matter content","Raindrop impact dispersing surface aggregates followed by drying","Deep root growth","Excessive gypsum application"],"a":1,"e":"Raindrop energy breaks down surface aggregates; the dispersed fines then seal pores and dry into a crust."},{"id":"Q0075","t":"Soil Physics","q":"In the Munsell system, 'value' indicates:","o":["The dominant wavelength/hue of color","The lightness or darkness of the color","The strength/purity of the color","The soil pH"],"a":1,"e":"Value expresses lightness, from black (low value) to white (high value)."},{"id":"Q0023","t":"Soil Physics","q":"Columnar structure, with rounded pillar-like peds, is typically associated with:","o":["Sodic (high-sodium) subsoils","Well-drained sandy soils","Peaty organic soils","Recently ploughed fields"],"a":0,"e":"Columnar structure with rounded caps is characteristic of sodic soil horizons rich in exchangeable sodium."},{"id":"Q0010","t":"Soil Physics","q":"Stoke's law, which relates the settling velocity of a particle to its diameter, forms the basis of:","o":["The core method for bulk density","Sedimentation analysis of particle size","The pressure plate method","Tensiometry"],"a":1,"e":"Stoke's law underlies hydrometer/pipette sedimentation analysis for particle-size distribution."},{"id":"Q0069","t":"Soil Physics","q":"Soil temperature influences all of the following EXCEPT:","o":["Microbial activity","Seed germination","Root growth","Primary mineral crystal structure"],"a":3,"e":"Temperature strongly affects biological processes; it does not alter the crystal structure of primary minerals."},{"id":"Q0084","t":"Soil Physics","q":"Which of the following has the LEAST direct influence on soil bulk density?","o":["Soil texture","Organic matter content","Degree of compaction","Soil pH"],"a":3,"e":"Bulk density is governed mainly by texture, structure/compaction and organic matter — not directly by pH."},{"id":"Q0008","t":"Soil Physics","q":"Cation exchange capacity of a mineral soil is most strongly influenced by the amount of:","o":["Sand","Silt","Gravel","Clay and organic matter"],"a":3,"e":"Clay minerals and humus carry the surface charges responsible for most of a soil's CEC."},{"id":"Q0042","t":"Soil Physics","q":"During a prolonged irrigation or rainfall event, infiltration rate typically:","o":["Increases steadily throughout","Starts high and decreases, approaching a steady basic rate","Remains constant","Oscillates randomly"],"a":1,"e":"Infiltration rate is highest initially and declines as the surface wets and macropores fill, approaching a steady final rate."},{"id":"Q0060","t":"Soil Physics","q":"A high plasticity index generally indicates:","o":["Sandy, non-cohesive soil","High clay content and difficulty in tillage operations when wet","Low water-holding capacity","High infiltration rate"],"a":1,"e":"High PI reflects a wide plastic range typical of clay-rich soils, which are hard to work at intermediate moisture."},{"id":"Q0041","t":"Soil Physics","q":"As a soil dries from saturation, its unsaturated hydraulic conductivity:","o":["Increases sharply","Remains constant","Decreases sharply","Becomes negative"],"a":2,"e":"As pores drain and continuity of water-filled paths is lost, unsaturated hydraulic conductivity falls rapidly."},{"id":"Q0056","t":"Soil Physics","q":"The liquid limit of a soil is defined as the water content at which the soil:","o":["Changes from a solid to a semi-solid state","Changes from a plastic to a liquid state","Becomes completely dry","Reaches field capacity"],"a":1,"e":"Liquid limit marks the boundary between plastic and liquid consistency (Atterberg limits)."},{"id":"Q0064","t":"Soil Physics","q":"The specific heat of water compared to that of mineral soil solids is:","o":["Much lower","Much higher","Approximately equal","Zero"],"a":1,"e":"Water has a high specific heat, so wet soils warm and cool more slowly than dry soils."},{"id":"Q0090","t":"Soil Physics","q":"Which of these best describes 'available water' held in the soil?","o":["Water held tighter than the wilting point","Water held between field capacity and permanent wilting point","Water lost to deep drainage only","Water present only in macropores"],"a":1,"e":"Available water is the fraction plants can extract, bounded by field capacity (upper) and PWP (lower)."},{"id":"Q0097","t":"Soil Physics","q":"The 'available water capacity' of a soil profile is used practically to estimate:","o":["Soil color changes","Irrigation interval and depth of application","Cation exchange capacity","Soil pH buffering"],"a":1,"e":"AWC, together with crop root depth, helps determine how much water to apply and how often."},{"id":"Q0005","t":"Soil Physics","q":"A soil with 40% sand, 40% silt and 20% clay is classified, using the USDA textural triangle, as:","o":["Sandy loam","Loam","Silty clay loam","Clay loam"],"a":1,"e":"This combination plots in the 'loam' class on the USDA textural triangle."},{"id":"Q0073","t":"Soil Physics","q":"Among soil orders, Histosols (organic soils) typically show:","o":["The highest bulk density","Very low bulk density due to high organic matter content","Bulk density equal to quartz sand","No measurable porosity"],"a":1,"e":"Organic materials are much less dense than mineral particles, giving Histosols very low bulk density."},{"id":"Q0093","t":"Soil Physics","q":"A well-graded, strongly developed granular structure in the surface horizon is generally considered:","o":["Poor for crop production","Favourable, promoting aeration, infiltration and root growth","Irrelevant to crop production","Indicative of salinity"],"a":1,"e":"Stable granular structure provides good pore continuity, supporting water entry, aeration and rooting."},{"id":"Q0024","t":"Soil Physics","q":"Platy structure, in which peds are arranged in horizontal plates, commonly results from:","o":["Deep tillage","Compaction or depositional layering","High organic matter","Root proliferation"],"a":1,"e":"Platy structure often forms from compaction (e.g., traffic) or sedimentary layering, and is common in E horizons."},{"id":"Q0004","t":"Soil Physics","q":"In the International (ISSS) system, the sand fraction ranges from:","o":["0.02–2.0 mm","0.05–2.0 mm","0.002–0.2 mm","0.1–1.0 mm"],"a":0,"e":"The ISSS (Atterberg) system sets sand at 0.02–2.0 mm, silt at 0.002–0.02 mm, clay <0.002 mm."},{"id":"Q0061","t":"Soil Physics","q":"Compared to the free atmosphere, soil air typically contains:","o":["Lower CO2 and higher O2","Higher CO2 and lower O2","Identical composition","No CO2 at all"],"a":1,"e":"Root and microbial respiration enrich soil air in CO2 while depleting O2 relative to the atmosphere."},{"id":"Q0083","t":"Soil Physics","q":"For scheduling irrigation, the most directly relevant soil physical property is:","o":["Soil color","Available water capacity","Specific heat","Chroma"],"a":1,"e":"Irrigation scheduling is based on how much plant-available water the root zone can store (AWC)."},{"id":"Q0012","t":"Soil Physics","q":"Bulk density of a well-aggregated silty clay loam surface soil typically falls in the range:","o":["0.1–0.3 Mg/m3","1.0–1.3 Mg/m3","2.0–2.3 Mg/m3","2.6–2.7 Mg/m3"],"a":1,"e":"Fine-textured, well-structured surface soils commonly have bulk densities of about 1.0–1.3 Mg/m3."},{"id":"Q0021","t":"Soil Physics","q":"Granular soil structure is most typically found in:","o":["Surface horizons of grassland/cultivated soils","Compacted subsoil B horizons","Sodic soil B horizons","Parent material (C horizon)"],"a":0,"e":"Granular (crumb) structure, favoured by roots and organic matter, is typical of well-managed surface soils."},{"id":"Q0037","t":"Soil Physics","q":"The soil moisture characteristic (retention) curve relates:","o":["Bulk density to particle density","Soil water content to soil water potential","Infiltration rate to time","Hydraulic conductivity to depth"],"a":1,"e":"This curve shows how much water is held at each matric potential (suction) value."},{"id":"Q0067","t":"Soil Physics","q":"Mulching influences soil temperature mainly by:","o":["Eliminating temperature variation entirely","Moderating diurnal and seasonal fluctuations","Increasing maximum daytime temperature","Cooling the subsoil only at night"],"a":1,"e":"Mulch insulates the surface, buffering extremes and moderating temperature swings."},{"id":"Q0071","t":"Soil Physics","q":"A plough pan (traffic pan) commonly develops due to:","o":["Excess organic matter addition","Repeated tillage/traffic at the same shallow depth","High rainfall alone","Application of gypsum"],"a":1,"e":"Repeated implement/wheel pressure at a consistent depth compacts soil just below the tilled layer, forming a pan."},{"id":"Q0014","t":"Soil Physics","q":"Which classical method is most commonly used to measure the bulk density of undisturbed soil?","o":["Core method","Munsell method","Kjeldahl method","Walkley–Black method"],"a":0,"e":"The core (cylinder) method extracts a known volume of undisturbed soil to compute bulk density."},{"id":"Q0026","t":"Soil Physics","q":"Aggregate stability is commonly assessed in the laboratory by:","o":["Wet sieving","Kjeldahl distillation","Flame photometry","Munsell comparison"],"a":0,"e":"Wet-sieving measures the proportion of aggregates that survive simulated rainfall/wetting energy."},{"id":"Q0052","t":"Soil Physics","q":"The pressure plate apparatus is used to determine:","o":["Soil water retention at specified suctions (e.g., 15 bar)","Infiltration rate","Bulk density","Aggregate stability"],"a":0,"e":"Pressure plates apply known air pressures to soil samples to equilibrate them at defined matric potentials."},{"id":"Q0034","t":"Soil Physics","q":"Field capacity corresponds approximately to a soil water potential of:","o":["0 MPa (saturation)","−0.033 MPa (about 1/3 bar)","−1.5 MPa (about 15 bar)","−5.0 MPa"],"a":1,"e":"Field capacity is conventionally taken at about −0.033 MPa (1/3 atmosphere) suction."},{"id":"Q0074","t":"Soil Physics","q":"In Munsell soil color notation, the three components recorded are:","o":["Hue, value and chroma","Hue, tint and shade","Red, green and blue","Brightness, contrast and saturation only"],"a":0,"e":"Munsell notation specifies hue (color), value (lightness) and chroma (color purity/intensity)."},{"id":"Q0016","t":"Soil Physics","q":"Compared to clayey soils, sandy soils generally have:","o":["Lower bulk density","Higher bulk density","Equal bulk density","No consistent relationship"],"a":1,"e":"Sandy soils lack the fine aggregation of clays and typically show higher bulk density despite larger individual pores."},{"id":"Q0055","t":"Soil Physics","q":"Compared with tensiometers, TDR and capacitance probes offer the advantage of:","o":["Measuring only at saturation","Continuous, relatively non-destructive water content monitoring over a wide range","Requiring no calibration ever","Only working in sandy soils"],"a":1,"e":"TDR/capacitance sensors can log soil water content continuously across a wide moisture range."},{"id":"Q0047","t":"Soil Physics","q":"The neutron probe is used in the field to estimate:","o":["Soil pH","Volumetric soil water content","Soil bulk density directly","Soil organic carbon"],"a":1,"e":"Neutron scattering by hydrogen atoms in soil water is used to estimate volumetric water content."},{"id":"Q0020","t":"Soil Physics","q":"Soil compaction primarily reduces the proportion of:","o":["Micropores","Macropores","Clay particles","Sand particles"],"a":1,"e":"Compaction collapses the larger, structural pores (macropores) first, impairing drainage and aeration."},{"id":"Q0081","t":"Soil Physics","q":"A shallow water table influences the overlying soil mainly through:","o":["Reduced soil temperature only","Capillary rise/upward flow into the capillary fringe","Increased bulk density","Reduced soil color intensity"],"a":1,"e":"Capillary forces draw water upward from a shallow water table into the overlying capillary fringe."},{"id":"Q0062","t":"Soil Physics","q":"Poor soil aeration commonly leads to:","o":["Enhanced nitrification","Anaerobic conditions favouring denitrification","Increased earthworm activity","Higher hydraulic conductivity"],"a":1,"e":"When O2 is depleted, facultative anaerobes use nitrate as an electron acceptor, driving denitrification losses."},{"id":"Q0057","t":"Soil Physics","q":"The plastic limit is the water content marking the boundary between:","o":["Liquid and plastic states","Plastic and semi-solid states","Semi-solid and solid states","Saturation and field capacity"],"a":1,"e":"Plastic limit is the lower boundary of the plastic range, below which the soil becomes semi-solid/friable."},{"id":"Q0035","t":"Soil Physics","q":"Permanent wilting point corresponds approximately to a soil water potential of:","o":["−0.01 MPa","−0.033 MPa","−1.5 MPa (about 15 bar)","−10 MPa"],"a":2,"e":"Permanent wilting point is conventionally defined at about −1.5 MPa (15 bar) suction."},{"id":"Q0080","t":"Soil Physics","q":"The direction and rate of soil water movement are driven by the:","o":["Soil color gradient","Gradient of total soil water potential","Soil pH gradient","Cation exchange capacity"],"a":1,"e":"Water moves from zones of higher to lower total water potential; the potential gradient is the driving force."},{"id":"Q0085","t":"Soil Physics","q":"Specific surface area of soil separates generally follows the order:","o":["Sand > Silt > Clay","Clay > Silt > Sand","Silt > Clay > Sand","All are equal"],"a":1,"e":"Because of its very small particle size, clay has by far the greatest specific surface area, followed by silt, then sand."},{"id":"Q0011","t":"Soil Physics","q":"The average particle density of a typical mineral soil is approximately:","o":["1.0 Mg/m3","1.6 Mg/m3","2.65 Mg/m3","3.5 Mg/m3"],"a":2,"e":"Particle density of mineral soils averages about 2.65 Mg/m3, close to that of quartz."},{"id":"Q0039","t":"Soil Physics","q":"Flow of water through a saturated soil is described by:","o":["Fick's law","Darcy's law","Ohm's law","Henry's law"],"a":1,"e":"Darcy's law states that water flux is proportional to the hydraulic gradient, scaled by hydraulic conductivity."},{"id":"Q0038","t":"Soil Physics","q":"Hysteresis in the soil moisture characteristic curve refers to:","o":["Identical wetting and drying curves","Different retention curves obtained on wetting versus drying","Change of curve with temperature only","Absence of any pore-size effect"],"a":1,"e":"At a given water content, matric potential differs between the wetting and drying paths — this path-dependence is hysteresis."},{"id":"Q0076","t":"Soil Physics","q":"In the Munsell system, 'chroma' indicates:","o":["The lightness of a color","The strength or purity of a given hue","The redness only","The wetness of the soil"],"a":1,"e":"Chroma measures color saturation/purity — low chroma is a dull/grey color, high chroma is vivid."},{"id":"Q0088","t":"Soil Physics","q":"Which single property is generally regarded as the best overall indicator of soil physical quality (tilth)?","o":["Soil color","Aggregate stability","Particle density","Soil pH"],"a":1,"e":"Aggregate stability integrates structure, porosity and resistance to degradation, making it a key tilth indicator."}],"Problem Soils":[{"id":"Q0249","t":"Problem Soils","q":"'Leaching requirement' in soil reclamation refers to:","o":["The fraction of applied irrigation water that must pass through the root zone to control salt accumulation","The amount of lime needed to reclaim acid soil","The depth of the water table","The amount of gypsum needed for sodic soils only"],"a":0,"e":"Leaching requirement is the extra water applied beyond crop needs to flush accumulating salts below the root zone."},{"id":"Q0287","t":"Problem Soils","q":"In the reclamation of sodic soils, after gypsum application, why is subsequent leaching essential?","o":["To wash away the displaced sodium (now as soluble sodium sulfate) from the root zone","Leaching is not needed once gypsum is applied","To increase exchangeable sodium further","To dissolve the applied gypsum without removing anything"],"a":0,"e":"Gypsum only exchanges Ca2+ for Na+ on the complex; leaching is required to actually flush the released sodium salts out of the root zone."},{"id":"Q0278","t":"Problem Soils","q":"A high water table combined with poor natural drainage in arid/semi-arid irrigated command areas is a classic cause of:","o":["Soil acidification","Secondary soil salinization/waterlogging","Improved soil fertility with no risk","Reduced soil pH"],"a":1,"e":"Seepage losses from canals/over-irrigation raise the water table, and capillary rise plus evaporation concentrate salts at the surface."},{"id":"Q0279","t":"Problem Soils","q":"Which practice helps prevent development of secondary salinity in canal-irrigated command areas?","o":["Excessive, unregulated flood irrigation","Efficient irrigation scheduling combined with proper surface and subsurface drainage","Lining canals only, with no attention to field drainage","Avoiding all drainage infrastructure"],"a":1,"e":"Controlling water application and ensuring adequate drainage prevent water-table rise and salt accumulation."},{"id":"Q0286","t":"Problem Soils","q":"The dominant soluble salts responsible for most saline soils typically include:","o":["Chlorides and sulfates of sodium, calcium and magnesium","Only nitrates of potassium","Only phosphates of calcium","Only carbonates of iron"],"a":0,"e":"Saline soils are dominated by chloride and sulfate salts of Na, Ca and Mg, derived from parent material, groundwater or irrigation water."},{"id":"Q0266","t":"Problem Soils","q":"'White alkali' is an older descriptive term historically used for:","o":["Sodic soils with black organic staining","Saline soils showing visible white salt efflorescence/crusts on the surface","Acid sulfate soils","Peaty organic soils"],"a":1,"e":"Visible white salt crusts on the surface, from evaporative concentration, gave rise to the older term 'white alkali' for saline soils."},{"id":"Q0284","t":"Problem Soils","q":"Which crop management strategy is commonly recommended while reclaiming salt-affected soils?","o":["Planting the most salt-sensitive high-value crop first","Growing salt-tolerant crops/green manures during the initial reclamation phase","Avoiding any cropping until fully reclaimed, always","Applying only nitrogen fertilizer, ignoring salinity"],"a":1,"e":"Tolerant crops or green manures can be grown during reclamation, generating income/organic matter while the soil is progressively improved."},{"id":"Q0919","t":"Problem Soils","q":"Waterlogging, distinct from salinity/sodicity but often interlinked with it, directly harms crop growth mainly by:","o":["Improving root zone aeration","Depriving root zones of adequate oxygen, restricting root respiration and function, and creating reducing conditions that can release toxic substances","Increasing nutrient availability uniformly","Reducing soil temperature to optimal levels for all crops"],"a":1,"e":"Excess water displaces soil air, starving roots of oxygen and creating reducing conditions that can generate phytotoxic compounds (e.g., excess Fe2+, H2S), directly harming most non-wetland crops."},{"id":"Q0255","t":"Problem Soils","q":"Adequate sub-surface drainage is essential during salt-affected soil reclamation mainly because it:","o":["Prevents leached salts from re-accumulating and raises the water table further","Carries leached salts away, preventing re-salinization and waterlogging","Has no relevance to salt removal","Is only needed for sodic soils, not saline soils"],"a":1,"e":"Without drainage, leached salts and a rising water table can bring salts back up by capillary action, defeating leaching."},{"id":"Q0257","t":"Problem Soils","q":"'Residual sodium carbonate' (RSC) is a parameter used to assess:","o":["Soil bulk density","The sodium hazard of irrigation water based on carbonate/bicarbonate versus calcium+magnesium content","Soil organic carbon","Soil color"],"a":1,"e":"RSC = (CO3^2- + HCO3-) − (Ca2+ + Mg2+) in irrigation water; high RSC indicates a risk of soil sodification over time."},{"id":"Q0275","t":"Problem Soils","q":"Which of the following amendments would be INAPPROPRIATE for reclaiming a saline (non-sodic) soil?","o":["Leaching with good-quality water","Provision of adequate drainage","Gypsum application (unnecessary since sodium is not the problem)","Selection of salt-tolerant crops during reclamation"],"a":2,"e":"Since saline soils are not sodium-dominated, gypsum is not required; leaching and drainage are the key reclamation measures."},{"id":"Q0927","t":"Problem Soils","q":"Boron toxicity, occasionally encountered in some arid-zone soils and with certain irrigation waters, is difficult to manage mainly because:","o":["Boron precipitates immediately and never affects crops","Boron is highly soluble and leaches only slowly relative to other salts, making it persist in the root zone even after major salts have been leached","Boron cannot be measured in soil or water","Boron toxicity has an identical management solution to sodium toxicity"],"a":1,"e":"Because boron is not efficiently removed even when a soil is otherwise successfully leached of major salts, boron toxicity often requires more prolonged, careful leaching/management."},{"id":"Q0268","t":"Problem Soils","q":"Deep tillage/sub-soiling is sometimes combined with gypsum application in sodic soil reclamation mainly to:","o":["Increase soil salinity","Break up dense/compact sodic subsoil layers and improve gypsum-water penetration","Preven
