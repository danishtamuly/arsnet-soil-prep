t any leaching","Increase soil pH further"],"a":1,"e":"Physical loosening improves permeability, helping gypsum solution and leaching water penetrate the dense sodic subsoil."},{"id":"Q0261","t":"Problem Soils","q":"Acid sulfate soils develop mainly in:","o":["Arid desert basins","Coastal/tidal areas where pyrite-rich sediments are oxidized upon drainage","Volcanic ash deposits at high elevation","Calcareous uplands"],"a":1,"e":"Drainage or excavation of pyrite-bearing waterlogged coastal sediments allows oxidation of pyrite to sulfuric acid, producing extreme acidity."},{"id":"Q0251","t":"Problem Soils","q":"Besides gypsum, which other amendment can be used to reclaim calcareous sodic soils by generating acidity that dissolves native lime?","o":["Elemental sulfur or sulfuric acid/pyrite","Sodium chloride","Ammonium nitrate only","Dolomite"],"a":0,"e":"On calcareous sodic soils, elemental sulfur (oxidized to H2SO4) or pyrite can dissolve native CaCO3, releasing Ca2+ to replace Na+."},{"id":"Q0262","t":"Problem Soils","q":"The extreme acidity in acid sulfate soils results mainly from oxidation of:","o":["Calcium carbonate","Pyrite (iron disulfide, FeS2)","Gypsum","Organic humus"],"a":1,"e":"Pyrite oxidizes on exposure to air/drainage, ultimately forming sulfuric acid and driving pH to extremely low (often <4) values."},{"id":"Q0260","t":"Problem Soils","q":"Irrigation water classified as 'C3S1' under the USSL system indicates:","o":["Low salinity, low sodium hazard — excellent for all soils","High salinity hazard but low sodium hazard, requiring caution/drainage on sensitive crops","Low salinity but very high sodium hazard","Extremely high salinity and sodium hazard, unsuitable for irrigation"],"a":1,"e":"C3 denotes high salinity hazard while S1 denotes low sodium hazard; such water needs good drainage and salt-tolerant crops."},{"id":"Q0925","t":"Problem Soils","q":"In saline-sodic soil management, applying gypsum BEFORE substantial leaching (rather than leaching first) is generally preferred mainly because:","o":["Leaching first, without gypsum, risks converting the soil to a purely sodic state as salts are removed while excess exchangeable sodium remains, worsening structure","Gypsum has no role in saline-sodic soil management","Leaching always improves saline-sodic soils regardless of amendment timing","Gypsum increases soil sodicity if applied first"],"a":0,"e":"If salts are leached out before sodium is addressed, the soil's structure-supporting electrolyte concentration drops while high ESP remains, risking severe dispersion — hence gypsum (or an equivalent Ca source) is generally applied before/along with leaching."},{"id":"Q0247","t":"Problem Soils","q":"Reclamation of saline soils primarily relies on:","o":["Gypsum application alone","Leaching of soluble salts below the root zone with adequate drainage","Addition of elemental sulfur only","Deep ploughing without water"],"a":1,"e":"Because sodium is not the primary problem, saline soils are reclaimed mainly by leaching salts out with good-quality water, given adequate drainage."},{"id":"Q0283","t":"Problem Soils","q":"For classification purposes, a soil showing ECe = 10 dS/m and ESP = 25 would be classified as:","o":["Normal soil","Saline soil only","Sodic soil only","Saline-sodic soil"],"a":3,"e":"Both high salinity (ECe>4) and high sodicity (ESP>15) together define a saline-sodic soil."},{"id":"Q0265","t":"Problem Soils","q":"'Black alkali' soils, an older field term, refers to sodic soils where:","o":["High exchangeable sodium disperses organic matter, staining the surface dark","The soil is rich in black iron sulfide","The soil has very high organic carbon from peat","Salt crusts appear white on the surface"],"a":0,"e":"Dispersed humic material coats the soil surface dark ('black alkali'), distinguishing it from the white salt crusts of saline ('white alkali') soils."},{"id":"Q0923","t":"Problem Soils","q":"Which statement best explains why acid soils are particularly extensive and agriculturally significant across much of Northeast India, including Assam?","o":["The region receives very low rainfall, limiting any leaching","High rainfall and humid subtropical conditions drive intense leaching of basic cations from the soil profile over time, resulting in widespread natural soil acidity that constrains crop productivity without appropriate management (e.g., liming, acid-tolerant varieties)","Acid soils only occur due to excessive fertilizer use in the region, with no natural cause","The region has no acid soil constraint at all"],"a":1,"e":"The Northeast's characteristically very high rainfall promotes strong leaching of base cations, naturally producing widespread acid soils that require appropriate liming and acid-adapted management for sustained productivity."},{"id":"Q0258","t":"Problem Soils","q":"Irrigation water with RSC greater than about 2.5 meq/L is generally considered:","o":["Completely safe for all soils","Unsuitable/hazardous, likely to increase soil sodicity over time","Ideal for reclaiming saline soils","Irrelevant to soil sodicity"],"a":1,"e":"High RSC water precipitates Ca and Mg as carbonates, relatively enriching sodium and raising SAR/sodicity risk with continued use."},{"id":"Q0277","t":"Problem Soils","q":"'Alkali soils' is a traditional term broadly equivalent to modern usage of:","o":["Saline soils","Sodic soils","Acid sulfate soils","Peaty soils"],"a":1,"e":"The older term 'alkali soil' generally corresponds to what is now classified as sodic soil (high ESP, high pH)."},{"id":"Q0915","t":"Problem Soils","q":"Halophytes, plants naturally adapted to grow in highly saline environments, are sometimes considered for cultivation on severely salt-affected land mainly because they:","o":["Cannot survive any level of soil salinity","Can tolerate and sometimes thrive under high salinity, offering an alternative productive use (e.g., fodder, biomass) for land unsuitable for conventional crops","Increase soil salinity further when grown","Require complete desalinization before planting"],"a":1,"e":"Halophytes' inherent salt tolerance allows productive use of severely salt-affected land that would be unsuitable for conventional glycophytic (salt-sensitive) crops."},{"id":"Q0253","t":"Problem Soils","q":"Which crop is generally considered relatively salt-tolerant and often recommended for saline soils?","o":["Barley","Green gram (mung bean)","Citrus","Most pulses generally"],"a":0,"e":"Barley is among the more salt-tolerant common cereal crops, commonly recommended in saline soil management."},{"id":"Q0246","t":"Problem Soils","q":"The primary soil physical problem in sodic soils, distinguishing them from purely saline soils, is:","o":["Excess soluble salts limiting osmotic water uptake only","Clay dispersion, poor structure, and very low permeability due to high exchangeable sodium","Excess organic matter","Excess calcium carbonate only"],"a":1,"e":"High ESP disperses clay, destroying structure and drastically reducing infiltration and hydraulic conductivity."},{"id":"Q0930","t":"Problem Soils","q":"'Sub-surface drainage' is often considered essential, not optional, in successful large-scale reclamation of heavy saline-sodic soils mainly because:","o":["Surface drainage alone is always sufficient regardless of soil permeability","Without adequate removal of leached salts and control of a potentially rising water table, leaching water can simply re-concentrate salts or cause waterlogging, undermining reclamation efforts","Sub-surface drainage increases soil salinity","Sub-surface drainage has no relationship to reclamation success"],"a":1,"e":"Effective salt leaching requires that dissolved salts and excess water actually be removed from the profile; without adequate (often subsurface) drainage, leaching efforts can fail or even worsen waterlogging."},{"id":"Q0912","t":"Problem Soils","q":"Subsurface (subsoil) acidity, where acidity/aluminium toxicity is concentrated below the tilled layer, poses a particular management challenge mainly because:","o":["Surface-applied lime readily and quickly neutralizes acidity at depth","Lime, being of low solubility, moves very slowly downward, making correction of subsoil acidity considerably slower/more difficult than correcting surface acidity","Subsoil acidity has no effect on root growth","Subsoil acidity is always easier to correct than surface acidity"],"a":1,"e":"Because lime has low solubility and moves slowly by mass flow/diffusion, subsoil acidity below the tilled zone is much harder and slower to ameliorate than surface soil acidity."},{"id":"Q0924","t":"Problem Soils","q":"A 'saline seep', a localized area of soil salinity that develops on otherwise non-saline dryland farming areas, typically forms due to:","o":["Direct seawater intrusion far inland","Water percolating through a permeable upslope recharge area, moving laterally, and re-emerging (with concentrated salts) at a downslope discharge point, often linked to summer fallow practices","Complete absence of any subsurface water movement","Only volcanic activity"],"a":1,"e":"Saline seeps arise from a hydrologic recharge-discharge process: excess water infiltrating an upslope area moves through the subsurface and emerges downslope, evaporating and concentrating salts at the seep."},{"id":"Q0245","t":"Problem Soils","q":"If a saline-sodic soil is leached with good-quality water without amendment, it commonly becomes:","o":["A normal fertile soil directly","A sodic soil, as salts are removed but excess exchangeable sodium remains and disperses clay","More saline than before","Unaffected"],"a":1,"e":"Leaching salts without addressing exchangeable sodium leaves the soil sodic, often making conditions physically worse (dispersion, poor permeability)."},{"id":"Q0242","t":"Problem Soils","q":"According to the US Salinity Laboratory classification, a saline soil is defined as one having:","o":["ECe > 4 dS/m, ESP < 15, pH usually < 8.5","ECe < 4 dS/m, ESP > 15, pH > 8.5","ECe < 2 dS/m, ESP < 5","ECe > 4 dS/m, ESP > 15, pH > 8.5"],"a":0,"e":"Saline soils are characterized by high soluble salts (ECe>4 dS/m) but low exchangeable sodium (ESP<15) and near-neutral to slightly alkaline pH."},{"id":"Q0248","t":"Problem Soils","q":"Reclamation of sodic soils primarily relies on:","o":["Leaching alone, without amendment","Application of a soluble calcium source (e.g., gypsum) to replace exchangeable sodium, followed by leaching","Addition of common salt (NaCl)","Deep flooding without drainage"],"a":1,"e":"Gypsum supplies Ca2+ to displace exchangeable Na+, which is then leached out, restoring structure and permeability."},{"id":"Q0263","t":"Problem Soils","q":"A key management strategy for acid sulfate soils is to:","o":["Maintain waterlogged/reduced conditions to prevent pyrite oxidation, or lime heavily if drained","Drain and cultivate immediately without any treatment","Add only nitrogen fertilizer","Avoid liming entirely"],"a":0,"e":"Keeping pyrite reduced (submerged) avoids acid generation; if drainage is unavoidable, heavy liming is needed to neutralize the acidity produced."},{"id":"Q0922","t":"Problem Soils","q":"Among the reclamation priorities for a saline-sodic soil, the generally recommended sequence is to:","o":["Address sodicity (via gypsum) and control salinity/leaching together in a coordinated manner, since leaching salts alone (without addressing sodium) can worsen soil structure","Only address salinity, ignoring sodicity entirely","Only address sodicity, ignoring salinity entirely","Apply no amendments and rely on natural rainfall alone regardless of climate"],"a":0,"e":"Because uncontrolled leaching of a saline-sodic soil (without a calcium amendment) can leave it sodic with degraded structure, gypsum application and controlled leaching are generally coordinated together in reclamation planning."},{"id":"Q0926","t":"Problem Soils","q":"Amongst common reclamation amendments, which would be LEAST suitable for reclaiming a strongly ACID soil (as opposed to a sodic soil)?","o":["Agricultural lime (calcitic/dolomitic limestone)","Gypsum, since it does not effectively neutralize soil acidity (raise pH) the way a carbonate-based liming material does","Basic slag","Dolomite"],"a":1,"e":"Gypsum (a neutral salt) does not significantly raise soil pH and so is not an effective acid-neutralizing amendment, unlike carbonate-based liming materials specifically used to correct acidity."},{"id":"Q0273","t":"Problem Soils","q":"According to USSL guidelines, irrigation water sodium hazard classes (S1 to S4) are based on:","o":["Electrical conductivity","Sodium adsorption ratio (SAR)","Soil pH","Rainfall amount"],"a":1,"e":"S1 (low) to S4 (very high) sodium hazard classes are defined by SAR ranges of the irrigation water."},{"id":"Q0272","t":"Problem Soils","q":"According to USSL guidelines, irrigation water salinity hazard classes (C1 to C4) are based on:","o":["Electrical conductivity of the water","Sodium adsorption ratio","Soil texture","Soil color"],"a":0,"e":"C1 (low) to C4 (very high) salinity hazard classes are defined by ranges of water electrical conductivity."},{"id":"Q0933","t":"Problem Soils","q":"Deep-rooted perennial vegetation is sometimes promoted in dryland salinity management (e.g., in recharge areas) mainly because such vegetation:","o":["Increases groundwater recharge substantially","Uses more water throughout the year than shallow-rooted annual crops, helping to reduce excess deep percolation/recharge that would otherwise raise water tables and mobilize salts","Has no effect on the local water balance","Only work in irrigated systems, never dryland/rainfed settings"],"a":1,"e":"Deep-rooted perennials can intercept and use water throughout the year (including periods when annual crops are absent), reducing the deep drainage that drives water table rise and associated salinity in dryland systems."},{"id":"Q0243","t":"Problem Soils","q":"According to the US Salinity Laboratory classification, a sodic (alkali) soil is defined as one having:","o":["ECe > 4 dS/m, ESP > 15","ECe < 4 dS/m, ESP > 15, pH often > 8.5","ECe > 8 dS/m, ESP < 5","ECe < 1 dS/m, ESP < 5"],"a":1,"e":"Sodic soils have low soluble salts but high exchangeable sodium, leading to dispersion and high (often >8.5) pH."},{"id":"Q0916","t":"Problem Soils","q":"High exchangeable sodium percentage in sodic soils particularly impairs water movement mainly by causing:","o":["Increased macropore continuity","Dispersion of clay particles, which then clog soil pores and drastically reduce infiltration and hydraulic conductivity","Increased soil aggregation and structure","No change in soil pore characteristics"],"a":1,"e":"Dispersed clay particles migrate and clog soil pores under high sodicity, severely restricting water movement despite the soil's mineral composition otherwise supporting good permeability."},{"id":"Q0913","t":"Problem Soils","q":"Hooghoudt's drainage spacing equation, used in agricultural subsurface drainage design, primarily helps determine:","o":["The exact fertilizer dose for a crop","The appropriate spacing between parallel subsurface drains needed to maintain a desired water table depth, based on soil hydraulic conductivity and other factors","The optimal planting density of a crop","The gypsum requirement of a sodic soil"],"a":1,"e":"Hooghoudt's equation relates drain spacing to soil hydraulic conductivity, drain depth, and desired water table control, guiding subsurface drainage system design."},{"id":"Q0252","t":"Problem Soils","q":"Press mud (sugar factory filter cake) is sometimes used in sodic soil reclamation because it supplies:","o":["Calcium and organic matter that improve soil structure and provide a Ca source","Only sodium","Only micronutrients","Only phosphorus, with no calcium"],"a":0,"e":"Press mud contains calcium compounds and organic matter, helping both Ca supply and physical improvement of sodic soils."},{"id":"Q0910","t":"Problem Soils","q":"'Potential' acid sulfate soils differ from 'actual' acid sulfate soils in that potential acid sulfate soils:","o":["Are already extremely acidic under current waterlogged conditions","Contain pyrite but remain near-neutral while waterlogged/reduced, becoming severely acidic only if drained and the pyrite is allowed to oxidize","Contain no pyrite at all","Can never become acidic under any condition"],"a":1,"e":"Potential acid sulfate soils hold unoxidized pyrite under reduced, waterlogged conditions and are only classified as 'actual' acid sulfate soils once oxidation (usually from drainage) has produced severe acidity."},{"id":"Q0285","t":"Problem Soils","q":"Soil physical indicators commonly used in the field to suspect sodicity include:","o":["Loose, granular, well-aggregated surface soil with rapid infiltration","Surface crusting, poor infiltration, and standing water after rain due to dispersed clay","Deep, well-developed root systems","High earthworm activity"],"a":1,"e":"Dispersed clay in sodic soils seals pores, causing crusting, ponding and very slow infiltration."}],"Soil Chemistry":[{"id":"Q0221","t":"Soil Chemistry","q":"Which of the following generally increases a soil's resistance to pH change (buffering capacity)?","o":["Higher sand content, lower clay and organic matter","Higher clay content and higher organic matter","Lower CEC","Higher bulk density alone"],"a":1,"e":"More exchange sites (from clay and humus) allow the soil to absorb more acid/base with less pH change."},{"id":"Q0241","t":"Soil Chemistry","q":"Application of excessive lime beyond the requirement can induce deficiency of:","o":["Calcium","Micronutrients such as Zn, Fe, Mn, B (through pH-induced unavailability)","Nitrogen only","Magnesium only, never other nutrients"],"a":1,"e":"Over-liming raises pH excessively, reducing solubility and availability of several micronutrients."},{"id":"Q0234","t":"Soil Chemistry","q":"In the context of soil fertility, 'available nutrient' generally refers to a nutrient form that is:","o":["Permanently fixed in primary minerals","In the soil solution or readily exchangeable/soluble form accessible to plant roots","Present only as insoluble precipitate","Lost by volatilization"],"a":1,"e":"Available nutrients are those in solution or in rapidly exchangeable pools that plants can take up within a growing season."},{"id":"Q0159","t":"Soil Chemistry","q":"The standard laboratory method for determining CEC uses which index cation for saturation and leaching?","o":["Ammonium acetate (NH4OAc) at pH 7","Distilled water only","Concentrated sulfuric acid","Sodium chloride at pH 3"],"a":0,"e":"The ammonium acetate (1N NH4OAc, pH 7) method is the classical standard procedure for CEC determination."},{"id":"Q0166","t":"Soil Chemistry","q":"Soil pH is defined as:","o":["The negative logarithm of the hydrogen ion activity in soil solution","The percentage of exchangeable hydrogen","The total acidity of the soil","The concentration of hydroxide ions only"],"a":0,"e":"pH = −log[H+ activity]; it measures the intensity, not the total quantity, of soil acidity."},{"id":"Q0161","t":"Soil Chemistry","q":"A soil with high base saturation is generally associated with:","o":["Strongly acidic, infertile conditions","Higher pH and generally better fertility status","Extreme salinity","Waterlogging"],"a":1,"e":"Higher base saturation usually corresponds to less acidic, more fertile soil conditions."},{"id":"Q0157","t":"Soil Chemistry","q":"CEC of soils is most commonly expressed in units of:","o":["mg/kg","cmol(+)/kg (meq/100 g)","dS/m","g/cm3"],"a":1,"e":"CEC is conventionally reported as cmol(+)/kg soil, numerically equal to the older meq/100 g."},{"id":"Q0204","t":"Soil Chemistry","q":"Which of these ions is generally held LEAST strongly on soil exchange sites, being easily leached?","o":["Al3+","Ca2+","Na+","H+"],"a":2,"e":"Monovalent, weakly hydrated Na+ is generally the most weakly held and most easily displaced/leached common exchangeable cation."},{"id":"Q0215","t":"Soil Chemistry","q":"'Titratable acidity' of a soil, determined by direct titration with a base, represents:","o":["Only the solution (active) acidity","Both active and a portion of exchangeable/reserve acidity neutralized during titration","Only exchangeable sodium","Salinity level"],"a":1,"e":"Titration with base neutralizes both free H+ in solution and much of the reserve acidity released as the reaction proceeds."},{"id":"Q0213","t":"Soil Chemistry","q":"Below its point of zero charge, an oxide mineral surface carries a net:","o":["Negative charge","Positive charge","Zero charge always","Charge unrelated to pH"],"a":1,"e":"Below the PZC pH, protonation dominates, giving the oxide surface a net positive charge capable of adsorbing anions."},{"id":"Q0162","t":"Soil Chemistry","q":"The order of general replacing (bonding) strength of common cations on exchange sites (Ca2+ vs Na+) shows that:","o":["Na+ replaces Ca2+ more easily than the reverse","Ca2+ is generally held more strongly than Na+ due to higher charge","Both are held with identical strength","Neither is exchangeable"],"a":1,"e":"Higher-valence cations like Ca2+ are generally held more tightly on exchange sites than monovalent Na+."},{"id":"Q0189","t":"Soil Chemistry","q":"The soil solution is best described as:","o":["The aqueous phase of soil containing dissolved ions and solutes, in dynamic equilibrium with solid and exchange phases","Only rainwater percolating through soil","Water held at the wilting point","Groundwater below the water table"],"a":0,"e":"Soil solution is the liquid phase from which plants directly absorb water and nutrients, constantly interacting with solid surfaces."},{"id":"Q0192","t":"Soil Chemistry","q":"The Walkley–Black method is a widely used wet-oxidation procedure for determining:","o":["Soil organic carbon","Soil available phosphorus","Cation exchange capacity","Soil texture"],"a":0,"e":"Walkley–Black uses chromic acid oxidation to estimate readily oxidizable soil organic carbon."},{"id":"Q0175","t":"Soil Chemistry","q":"Lime requirement of a soil is determined mainly by:","o":["Its exchangeable acidity/buffering capacity and target pH","Its bulk density only","Its available phosphorus content","Its electrical conductivity"],"a":0,"e":"Lime requirement is estimated from soil buffering capacity (e.g., SMP buffer method) and the pH change desired."},{"id":"Q0182","t":"Soil Chemistry","q":"Under reducing (low Eh) flooded conditions, iron is typically transformed from:","o":["Fe2+ to Fe3+ (oxidized, less soluble)","Fe3+ to Fe2+ (reduced, more soluble, can accumulate to toxic levels in rice)","Fe metal to Fe oxide","No change occurs"],"a":1,"e":"Reduction converts insoluble Fe3+ oxides to soluble Fe2+, which can reach phytotoxic levels in submerged rice soils."},{"id":"Q0201","t":"Soil Chemistry","q":"Which of the following best describes 'soil buffer pH' as used in lime requirement determination?","o":["The pH of the soil solution only","A laboratory pH obtained after reacting soil with a standard buffer solution, used to estimate reserve acidity","Soil salinity index","Exchangeable potassium content"],"a":1,"e":"Buffer methods (e.g., SMP buffer) measure the pH drop of a buffer solution to estimate a soil's total (reserve) acidity for liming calculations."},{"id":"Q0196","t":"Soil Chemistry","q":"Adsorption of sulfate and phosphate anions in soils is particularly strong on surfaces of:","o":["Quartz sand","Iron and aluminium oxide/hydroxide minerals","Calcite crystals only","Organic mulch residue"],"a":1,"e":"Fe/Al oxide surfaces have variable positive charge (especially at low pH) that strongly retains oxyanions like phosphate and sulfate."},{"id":"Q0224","t":"Soil Chemistry","q":"'Hydrolysis' of exchangeable Al3+ in soil water contributes to soil acidity because it:","o":["Consumes H+ ions","Releases H+ ions as Al3+ reacts with water to form Al-hydroxy species","Produces hydroxide ions only","Has no effect on pH"],"a":1,"e":"Al3+ + H2O → Al(OH)2+ + H+ (and further steps) releases H+, making Al a significant contributor to soil acidity."},{"id":"Q0236","t":"Soil Chemistry","q":"A rise in soil pH from 5 to 7 in a variable-charge soil typically:","o":["Decreases CEC and increases AEC","Increases CEC (more negative charge exposed) and decreases AEC","Has no effect on either CEC or AEC","Converts all clay to sand"],"a":1,"e":"As pH rises, deprotonation increases negative (CEC) charge while reducing positive (AEC) charge on variable-charge surfaces."},{"id":"Q0191","t":"Soil Chemistry","q":"Electrical conductivity of soil extracts is typically expressed in units of:","o":["cmol(+)/kg","dS/m (deciSiemens per metre)","mg/kg","g/cm3"],"a":1,"e":"Soil salinity (ECe) is conventionally reported in dS/m (equivalent to the older mmhos/cm)."},{"id":"Q0203","t":"Soil Chemistry","q":"The 'lime-induced chlorosis' observed in some crops on calcareous soils is primarily due to:","o":["Excess nitrogen","Iron deficiency caused by high pH-induced Fe unavailability","Potassium toxicity","Soil salinity"],"a":1,"e":"High pH and bicarbonate in calcareous soils reduce Fe solubility/uptake, producing interveinal chlorosis."},{"id":"Q0208","t":"Soil Chemistry","q":"Micronutrient cations such as Zn2+ and Cu2+ generally become LESS available to plants as soil pH:","o":["Decreases below 5","Increases above 7, due to precipitation/adsorption reactions","Stays exactly at 7","Is unrelated to their availability"],"a":1,"e":"Rising pH favours precipitation of these micronutrients as hydroxides/carbonates and stronger adsorption, reducing solubility."},{"id":"Q0170","t":"Soil Chemistry","q":"In strongly acid mineral soils, the dominant source of exchangeable acidity is typically:","o":["Exchangeable Al3+","Exchangeable Ca2+","Exchangeable Na+","Exchangeable K+"],"a":0,"e":"At low pH, Al3+ is released from clay/oxide surfaces and dominates the exchange complex, hydrolysing to release H+."},{"id":"Q0184","t":"Soil Chemistry","q":"Denitrification (loss of N2/N2O gas) is favoured under conditions of:","o":["High Eh (oxidizing), well-aerated soil","Low Eh (reducing), poorly aerated/waterlogged soil","Extremely acid soils only","Extremely saline soils only"],"a":1,"e":"Low oxygen availability forces facultative anaerobes to use nitrate as an electron acceptor, releasing gaseous N."},{"id":"Q0165","t":"Soil Chemistry","q":"The CEC of soil organic matter (humus), compared to that of most clay minerals, is generally:","o":["Much lower","Comparable to or higher, especially at near-neutral to alkaline pH","Exactly zero","Unrelated to pH"],"a":1,"e":"Humus carries abundant pH-dependent carboxylic and phenolic groups that ionize with rising pH, giving high CEC."},{"id":"Q0173","t":"Soil Chemistry","q":"Among common liming materials, burnt lime (CaO) compared to agricultural limestone (CaCO3) is:","o":["Slower acting and weaker neutralizing power","Faster acting with higher neutralizing value per unit weight","Completely ineffective","Only used for sodic soils"],"a":1,"e":"CaO reacts quickly and has a higher CaCO3-equivalent value per unit weight than raw limestone."},{"id":"Q0195","t":"Soil Chemistry","q":"Precipitation reactions in soils (e.g., formation of calcium phosphate, iron phosphate) mainly control the:","o":["Long-term availability and solubility of certain nutrients","Soil color exclusively","Soil texture","Soil bulk density"],"a":0,"e":"Precipitation-dissolution equilibria regulate solution concentrations of nutrients such as P, and of carbonates and sulfates."},{"id":"Q0190","t":"Soil Chemistry","q":"Electrical conductivity (EC) of a soil (saturation) extract is used primarily to assess:","o":["Soil pH","Soluble salt concentration (salinity)","Cation exchange capacity","Organic carbon content"],"a":1,"e":"EC of the saturated paste extract is the standard index of total soluble salt concentration."},{"id":"Q0216","t":"Soil Chemistry","q":"The Schollenberger method, historically used for lime requirement, is based on:","o":["Buffer solution pH depression by soil exchangeable acidity","Direct measurement of soil salinity","Measurement of soil color","Determination of soil bulk density"],"a":0,"e":"Buffer-based methods (of which Schollenberger's is an early example) infer reserve acidity from the pH change of a buffered solution."},{"id":"Q0232","t":"Soil Chemistry","q":"Carbonation, as a soil weathering process, involves reaction of minerals with:","o":["Carbonic acid formed from CO2 and water","Pure oxygen gas","Elemental sulfur","Chlorine gas"],"a":0,"e":"CO2 dissolving in soil water forms carbonic acid, which attacks carbonate and silicate minerals."},{"id":"Q0230","t":"Soil Chemistry","q":"Fixation of ammonium (NH4+) in soils, analogous to potassium fixation, occurs mainly in the interlayers of:","o":["Kaolinite","2:1 clay minerals such as illite and vermiculite","Quartz","Gypsum"],"a":1,"e":"NH4+, being similar in size to K+, can become trapped in the collapsed interlayer spaces of certain 2:1 clays."},{"id":"Q0214","t":"Soil Chemistry","q":"The main reason gypsum (CaSO4·2H2O), rather than lime, is used to reclaim sodic soils is that gypsum:","o":["Raises soil pH strongly, like lime","Supplies soluble calcium to replace exchangeable sodium without further raising already-high pH","Contains no calcium","Is more expensive per unit calcium than lime"],"a":1,"e":"Because sodic soils already have high pH, a neutral-salt calcium source (gypsum) is preferred over lime for Na replacement."},{"id":"Q0199","t":"Soil Chemistry","q":"'Liming materials' commonly include all of the following EXCEPT:","o":["Calcitic limestone (CaCO3)","Dolomitic limestone [CaMg(CO3)2]","Basic slag","Ammonium sulfate"],"a":3,"e":"Ammonium sulfate is an acid-forming nitrogen fertilizer, not a liming material."},{"id":"Q0186","t":"Soil Chemistry","q":"Phosphorus fixation in calcareous (alkaline) soils occurs mainly through reaction with:","o":["Calcium carbonate, forming insoluble calcium phosphates","Iron oxides exclusively","Organic matter exclusively","Exchangeable potassium"],"a":0,"e":"In calcareous soils, phosphate precipitates with calcium as relatively insoluble calcium phosphate compounds."},{"id":"Q0202","t":"Soil Chemistry","q":"Which statement about cation exchange capacity and soil pH is correct for variable-charge soils?","o":["CEC is completely independent of pH","CEC generally increases as pH rises, because more pH-dependent negative charge is exposed","CEC always decreases as pH rises","CEC is unrelated to organic matter"],"a":1,"e":"As pH rises, more hydroxyl groups on oxides/humus deprotonate, increasing negative charge and effective CEC."},{"id":"Q0217","t":"Soil Chemistry","q":"A soil test reporting 'exchangeable sodium percentage' (ESP) expresses:","o":["Exchangeable Na / CEC × 100","Total soluble salts / EC","Exchangeable Ca / exchangeable Mg","Soil pH minus 7"],"a":0,"e":"ESP = (exchangeable sodium / cation exchange capacity) × 100, a key index of sodicity."},{"id":"Q0177","t":"Soil Chemistry","q":"Clay soils generally have (higher/lower) buffering capacity than sandy soils:","o":["Lower","Higher","Identical","Buffering is unrelated to texture"],"a":1,"e":"More clay and organic matter provide more exchange sites, giving clay soils greater resistance to pH change."},{"id":"Q0235","t":"Soil Chemistry","q":"Which factor generally has the LEAST direct effect on a soil's cation exchange capacity?","o":["Clay content","Clay mineral type","Organic matter content","Soil color hue"],"a":3,"e":"CEC is governed by clay amount/type and organic matter; color hue (largely from Fe oxide type) is not a direct determinant."},{"id":"Q0205","t":"Soil Chemistry","q":"The lyotropic (replacing power) series for common cations is generally given as:","o":["Na+ > K+ > Ca2+ > Al3+","Al3+ > Ca2+ > Mg2+ > K+ > Na+","H+ > Na+ > Al3+ > Ca2+","All cations are held equally"],"a":1,"e":"Higher valence and smaller hydrated radius generally increase bonding strength, giving roughly Al3+ > Ca2+ > Mg2+ > K+ ≈ NH4+ > Na+."},{"id":"Q0176","t":"Soil Chemistry","q":"Soil buffering capacity refers to:","o":["The soil's resistance to change in pH upon addition of acid or base","The soil's water-holding capacity","The salinity level of a soil","The soil's color stability"],"a":0,"e":"Buffering capacity measures how strongly a soil resists pH change, largely governed by clay and organic matter content."},{"id":"Q0209","t":"Soil Chemistry","q":"Molybdenum availability to plants, unlike most other micronutrients, generally:","o":["Decreases with increasing soil pH","Increases with increasing soil pH","Is unrelated to soil pH","Is highest under strongly acid conditions"],"a":1,"e":"Molybdate is an anion whose availability rises with pH, opposite to the pattern for most cationic micronutrients."},{"id":"Q0187","t":"Soil Chemistry","q":"Chelation in soil chemistry refers to:","o":["Formation of a ring-type complex between a metal ion and an organic ligand, increasing metal availability/mobility","Precipitation of a metal as an insoluble salt","Oxidation of a metal ion","Adsorption of anions on clay"],"a":0,"e":"Chelating agents (natural or synthetic) bind metal cations (e.g., Fe, Zn) in soluble complexes, improving their availability."},{"id":"Q0211","t":"Soil Chemistry","q":"Soil solution ionic strength most directly affects:","o":["Activity coefficients and hence the effective (thermodynamic) activity of dissolved ions","Soil color","Soil bulk density","Soil texture"],"a":0,"e":"Higher ionic strength (e.g., in saline soils) lowers ion activity coefficients, affecting solubility and plant uptake calculations."},{"id":"Q0228","t":"Soil Chemistry","q":"Which best describes 'soil colloidal complex' in the context of nutrient chemistry?","o":["The combined clay and humus fraction responsible for adsorption and exchange reactions","Only the sand fraction","Only dissolved salts","Only soil microorganisms"],"a":0,"e":"The colloidal complex (clay + humus) provides the charged surfaces that govern nutrient retention and exchange."},{"id":"Q0240","t":"Soil Chemistry","q":"The most common and cost-effective liming material used in Indian agriculture is:","o":["Basic slag","Ground agricultural limestone (calcite/dolomite)","Pure calcium oxide always","Gypsum"],"a":1,"e":"Ground limestone (calcitic or dolomitic) is widely used because of its availability, cost and ease of handling."},{"id":"Q0178","t":"Soil Chemistry","q":"Which nutrient deficiency is commonly induced in strongly alkaline (high pH) soils?","o":["Nitrogen","Micronutrients such as iron, zinc and manganese","Potassium","Sulfur"],"a":1,"e":"High pH reduces solubility of Fe, Zn, Mn and Cu, often inducing micronutrient deficiencies."},{"id":"Q0210","t":"Soil Chemistry","q":"'Le Chatelier's principle', as applied to soil nutrient equilibria, implies that:","o":["Removing a nutrient from soil solution (e.g., by plant uptake) shifts equilibrium to replenish it from solid/exchange phases","Chemical equilibria in soil never shift","Nutrients cannot move between phases","Only physical properties are governed by this principle"],"a":0,"e":"As plants deplete solution nutrients, the system responds by releasing more from exchangeable/solid pools to partially restore equilibrium."},{"id":"Q0227","t":"Soil Chemistry","q":"Which of the following is generally used as an acidifying soil amendment (to lower soil pH)?","o":["Calcitic limestone","Elemental sulfur or ammonium sulfate","Gypsum for a saline soil","Dolomite"],"a":1,"e":"Elemental sulfur (via microbial oxidation) and acid-forming fertilizers like ammonium sulfate lower soil pH over time."},{"id":"Q0160","t":"Soil Chemistry","q":"Base saturation percentage is defined as:","o":["Exchangeable acidity / CEC × 100","Sum of exchangeable basic cations (Ca, Mg, K, Na) / CEC × 100","Soluble salts / CEC × 100","Organic carbon / CEC × 100"],"a":1,"e":"Base saturation expresses the proportion of the CEC occupied by basic cations rather than acidic cations (H+, Al3+)."},{"id":"Q0225","t":"Soil Chemistry","q":"In acid soils, liming to raise pH primarily reduces toxicity risk from:","o":["Aluminium and manganese","Calcium and magnesium","Potassium and sodium","Nitrogen and phosphorus"],"a":0,"e":"Liming precipitates soluble Al and reduces Mn solubility, both of which are toxic to roots under acid conditions."}],"Analytical Techniques":[{"id":"Q0827","t":"Analytical Techniques","q":"A permeameter, used in the laboratory or field, is designed to directly measure:","o":["Soil hydraulic conductivity (rate of water movement through saturated soil)","Soil pH","Soil color","Soil organic carbon"],"a":0,"e":"Permeameters (constant-head or falling-head types) measure the rate of water flow through a soil sample under controlled hydraulic gradient, yielding hydraulic conductivity."},{"id":"Q0835","t":"Analytical Techniques","q":"Sieve analysis, used alongside sedimentation methods in particle size analysis, is specifically used to separate and quantify:","o":["Only the clay fraction","The sand fraction into various size sub-classes (e.g., coarse, medium, fine sand) by passing the sample through a nested series of sieves","Only dissolved salts","Only soil organic carbon"],"a":1,"e":"Mechanical sieving through graduated mesh sizes separates and quantifies sand-sized particles into finer sub-fractions, complementing sedimentation methods used for silt and clay."},{"id":"Q0741","t":"Analytical Techniques","q":"The standard depth commonly recommended for routine surface soil fertility sampling in most annual field crops is approximately:","o":["0–15 cm (plough layer)","1–2 metres","Only 50–100 cm","Only the top 1 cm"],"a":0,"e":"Since most annual crop roots and nutrient management concerns are concentrated in the plough layer, 0–15 cm is the standard sampling depth for routine fertility testing."},{"id":"Q0730","t":"Analytical Techniques","q":"Flame photometry is a classical analytical method most commonly used in soil/plant analysis for determining:","o":["Soil organic carbon","Potassium and sodium concentrations","Soil texture","Cation exchange capacity directly"],"a":1,"e":"Flame photometry measures characteristic emission from excited alkali metal atoms (notably K and Na) in a flame, a simple, widely used method for these elements."},{"id":"Q0749","t":"Analytical Techniques","q":"Which technique is generally preferred for detecting and quantifying trace levels of pesticide residues in soil or water samples with high sensitivity and specificity?","o":["Simple visual color comparison","Gas or liquid chromatography, often coupled with mass spectrometry (GC-MS/LC-MS)","Only pH measurement","Only bulk density measurement"],"a":1,"e":"Chromatography coupled with mass spectrometry provides the sensitivity and specificity needed to detect and confirm trace pesticide residues in environmental samples."},{"id":"Q0987","t":"Analytical Techniques","q":"Soil sampling tools such as an auger or a tube sampler are chosen over a spade for routine fertility sampling mainly because they:","o":["Cannot collect any soil sample at all","Allow a more uniform, consistent sample volume/depth to be collected efficiently across many sampling points","Are only usable in extremely dry soils","Always damage the soil profile permanently"],"a":1,"e":"Augers/tube samplers provide a consistent core of soil from a defined depth relatively quickly, supporting efficient, uniform sampling across many points in a field."},{"id":"Q0746","t":"Analytical Techniques","q":"Which instrument is most directly used to measure the particle size distribution of soil by monitoring settling rates in suspension?","o":["Flame photometer","Hydrometer","pH meter","AAS"],"a":1,"e":"The hydrometer method (based on Stoke's law) tracks suspension density changes over time as particles of different sizes settle at different rates."},{"id":"Q0945","t":"Analytical Techniques","q":"A titration is fundamentally based on:","o":["Measuring color intensity only, with no chemical reaction involved","Adding a reagent of known concentration (titrant) to a sample until a reaction reaches a defined endpoint, from which the unknown concentration in the sample can be calculated","Passing an electrical current through a sample with no reagent addition","Weighing a sample before and after heating"],"a":1,"e":"Titration determines an unknown concentration by measuring the volume of a standard reagent solution needed to complete a defined reaction with the sample, signaled by an endpoint (e.g., color change)."},{"id":"Q0949","t":"Analytical Techniques","q":"A conductivity (EC) measurement on a soil sample is fundamentally dependent on the sample containing:","o":["No water at all, since EC is measured on dry soil directly","Sufficient water (as in a soil-water suspension or the saturation extract) to allow dissolved ions to conduct an electrical current between the meter's electrodes","Only organic matter, with no mineral content","Only air, with no liquid phase"],"a":1,"e":"Electrical conductivity measurement requires a liquid (water) phase containing dissolved ions to actually conduct current; hence EC is measured on a soil-water suspension or extract, not on dry soil directly."},{"id":"Q0739","t":"Analytical Techniques","q":"Proper soil sample preparation before laboratory analysis typically includes:","o":["Analysing the sample wet and unsieved directly from the field","Air-drying, grinding, and sieving the sample (commonly through a 2 mm sieve) to obtain a uniform, representative sub-sample","Freezing the sample without any drying","Burning the entire sample before any chemical test"],"a":1,"e":"Standard preparation (air-drying, grinding, sieving) ensures a homogeneous, reproducible sample suitable for most standard chemical/physical soil tests."},{"id":"Q0944","t":"Analytical Techniques","q":"Normality and molarity are both units expressing solution concentration; normality specifically accounts for:","o":["Only the mass of solute, ignoring reactive capacity","The reactive capacity (equivalents) of a solute in a reaction, which can differ from its molarity depending on the number of reactive units (e.g., charge/protons) per molecule","Only the temperature of the solution","Only the color of the solution"],"a":1,"e":"Normality (equivalents per litre) accounts for the number of reactive units (e.g., H+ ions, charge) a solute contributes per mole, which can make normality differ from molarity depending on the reaction context."},{"id":"Q0984","t":"Analytical Techniques","q":"Which best explains why soil samples for heavy metal analysis are often digested using a combination of strong acids (e.g., a nitric-perchloric or aqua regia mixture) rather than a single mild extractant?","o":["Mild extractants always give identical results to strong acid digestion","Total/pseudo-total elemental analysis requires breaking down the mineral matrix and organic complexes to release metals bound in resistant forms, which mild extractants cannot achieve","Strong acids are used only for organic carbon analysis","No digestion is ever needed for elemental analysis"],"a":1,"e":"Determining total (or near-total, 'pseudo-total') metal content requires aggressive digestion to break down resistant mineral and organic-bound fractions, which milder extractants used for 'available' nutrient testing are not designed to achieve."},{"id":"Q0951","t":"Analytical Techniques","q":"Replicate analysis of the same sample (running the same sample multiple times through an analytical procedure) is done primarily to assess:","o":["The accuracy of the method against a certified true value","The precision (repeatability) of the analytical method for that sample","The total sample size of the study","The cost-effectiveness of the laboratory"],"a":1,"e":"Repeated analysis of the same sample specifically evaluates how consistent (precise/repeatable) the method's results are, distinct from accuracy, which requires comparison against a known true value."},{"id":"Q0733","t":"Analytical Techniques","q":"Gas chromatography (GC) is commonly used in soil/environmental analysis for:","o":["Determining soil texture","Analysis of volatile and semi-volatile organic compounds, such as certain pesticide residues","Measuring soil pH","Measuring soil bulk density"],"a":1,"e":"GC separates and detects volatile organic compounds, making it well suited to analysing pesticide residues and other organic contaminants."},{"id":"Q0833","t":"Analytical Techniques","q":"The turbidimetric method for sulfate determination is based on:","o":["Measuring the color intensity of a molybdenum-blue complex","Measuring the turbidity (cloudiness) produced when sulfate reacts with barium chloride to form a fine precipitate of barium sulfate","Measuring electrical conductivity directly","Measuring magnetic susceptibility"],"a":1,"e":"Sulfate reacts with barium chloride to form a fine, light-scattering BaSO4 precipitate, whose turbidity (measured spectrophotometrically) is proportional to sulfate concentration."},{"id":"Q0729","t":"Analytical Techniques","q":"Inductively Coupled Plasma (ICP) spectroscopy, compared to conventional AAS, generally offers the advantage of:","o":["Determining only a single element per analytical run","Simultaneous multi-element analysis at generally low detection limits","Being usable only for soil physical properties","No ability to detect trace elements"],"a":1,"e":"ICP-based techniques (ICP-OES/ICP-MS) can quantify many elements simultaneously in a single run, offering efficiency and sensitivity advantages over single-element AAS."},{"id":"Q0727","t":"Analytical Techniques","q":"Chemometric calibration methods, such as Partial Least Squares Regression (PLSR), are used with soil spectral data to:","o":["Directly measure soil pH with a glass electrode","Statistically relate spectral reflectance data to measured (reference laboratory) soil property values, building predictive calibration models","Only visualize raw spectra with no predictive modeling","Replace the need for reference laboratory analysis entirely, even initially"],"a":1,"e":"PLSR and similar chemometric techniques build quantitative relationships between spectral data and reference lab values, enabling prediction of properties from spectra alone once calibrated."},{"id":"Q0744","t":"Analytical Techniques","q":"In wet-chemistry soil organic carbon determination (Walkley-Black method), which reagent is used as the oxidizing agent?","o":["Sodium bicarbonate","Potassium dichromate in the presence of concentrated sulfuric acid","Ammonium acetate","Sodium hydroxide"],"a":1,"e":"The Walkley-Black method uses potassium dichromate (with concentrated H2SO4) to oxidize organic carbon, with the unreacted dichromate then back-titrated."},{"id":"Q0748","t":"Analytical Techniques","q":"Quality control in a soil testing laboratory typically includes the use of:","o":["No reference materials at all","Certified reference materials, blanks, and duplicate samples to verify analytical accuracy and precision","Only visual inspection of soil color","Randomly skipping calibration"],"a":1,"e":"Reference materials, blanks and duplicates are standard quality-control tools to ensure the reliability, accuracy, and precision of laboratory analytical results."},{"id":"Q0816","t":"Analytical Techniques","q":"The 'moisture equivalent' (a historical soil physical property measure) is defined as the water content retained by a saturated soil sample after being subjected to:","o":["Simple air drying","A standardized centrifugal force (in a centrifuge), approximating field capacity for many soils","Oven drying at 105°C","Freezing"],"a":1,"e":"Moisture equivalent, a classical laboratory measure, is obtained by centrifuging a saturated sample at a standard force, historically used to approximate field capacity."},{"id":"Q0726","t":"Analytical Techniques","q":"Mid-infrared (MIR) spectroscopy, compared to Vis-NIR, generally offers:","o":["Weaker, less specific molecular absorption features","Stronger, more specific ('fingerprint region') molecular absorption features, often giving more precise property predictions, though sometimes at higher instrument cost","Identical information content to Vis-NIR in all respects","No relevance to soil analysis"],"a":1,"e":"MIR wavelengths correspond to fundamental molecular vibrations, providing sharper, more diagnostic absorption features than the overtone/combination bands seen in Vis-NIR."},{"id":"Q0742","t":"Analytical Techniques","q":"Which analytical technique would be most appropriate for rapidly identifying the dominant clay mineral type in a soil sample?","o":["Flame photometry","X-ray diffraction (XRD)","Kjeldahl digestion","Electrical conductivity measurement"],"a":1,"e":"XRD's characteristic diffraction patterns are the standard, most direct method for identifying specific crystalline clay mineral species."},{"id":"Q0824","t":"Analytical Techniques","q":"DTPA (diethylenetriaminepentaacetic acid) extraction is a standard method specifically used to estimate plant-available:","o":["Total nitrogen","Micronutrient cations such as Zn, Fe, Mn and Cu in near-neutral to calcareous soils","Soil texture","Soil salinity"],"a":1,"e":"DTPA is a chelating extractant widely used (especially in neutral to alkaline/calcareous soils) to estimate plant-available Zn, Fe, Mn and Cu."},{"id":"Q0991","t":"Analytical Techniques","q":"Which of the following best explains the importance of proper sample homogenization (thorough mixing) before sub-sampling a bulk soil sample for laboratory analysis?","o":["Homogenization has no effect on analytical results","A well-mixed sample ensures that the smaller sub-sample analysed is representative of the entire bulk sample, reducing sampling error introduced during sub-sampling","Homogenization is only relevant for water samples, never soil","Homogenization always increases nutrient content artificially"],"a":1,"e":"Thorough mixing before taking a laboratory sub-sample helps ensure that the small portion actually analysed accurately represents the composition of the whole bulk sample, minimizing sub-sampling error."},{"id":"Q0989","t":"Analytical Techniques","q":"Which best explains the purpose of running a set of samples in duplicate (or triplicate) within a routine analytical batch, alongside blanks and reference materials?","o":["Duplicates serve no analytical quality purpose","Duplicates provide an ongoing check of analytical precision/repeatability specific to that batch, complementing accuracy checks from reference materials and blanks","Duplicates are only used to double the total number of billable analyses","Duplicates replace the need for any reference material"],"a":1,"e":"Analysing selected samples in duplicate within each batch gives an ongoing, batch-specific check on measurement precision/repeatability, complementing the accuracy check provided by reference materials."},{"id":"Q0725","t":"Analytical Techniques","q":"Visible-near infrared (Vis-NIR) diffuse reflectance spectroscopy is used in soil analysis mainly to:","o":["Directly measure soil salinity through electrical conductivity","Rapidly estimate several soil properties (e.g., organic carbon, texture, moisture) from the soil's characteristic light reflectance spectrum, using calibration models","Directly measure soil temperature","Directly count microbial populations"],"a":1,"e":"Vis-NIR spectroscopy captures reflectance across visible and near-infrared wavelengths, which, combined with chemometric calibration, can rapidly predict multiple soil properties simultaneously."},{"id":"Q0826","t":"Analytical Techniques","q":"A double-ring infiltrometer is a field instrument used to directly measure:","o":["Soil salinity","The rate of water infiltration into soil under near-saturated conditions","Soil color","Soil microbial biomass"],"a":1,"e":"The double-ring infiltrometer measures the rate at which ponded water infiltrates into the soil, minimizing lateral water spread using its outer buffer ring."},{"id":"Q0837","t":"Analytical Techniques","q":"In colorimetric/spectrophotometric analysis, a 'blank' solution (containing all reagents except the analyte) is run mainly to:","o":["Increase the measured absorbance of samples artificially","Correct for background absorbance from reagents/solvents, ensuring the measured signal reflects only the analyte of interest","Replace the need for any standard curve","Calibrate soil bulk density"],"a":1,"e":"The blank accounts for any inherent absorbance of the reagents/solvent system itself, which is subtracted so sample readings reflect only the analyte's contribution."},{"id":"Q0832","t":"Analytical Techniques","q":"An ion-selective electrode (ISE), such as a nitrate-selective electrode, is used to:","o":["Directly and rapidly measure the activity/concentration of a specific ion in solution, based on a potential difference across a selective membrane","Measure soil bulk density","Measure soil color","Separate organic compounds chromatographically"],"a":0,"e":"ISEs generate a membrane potential proportional to the activity of a specific target ion, allowing rapid, selective ion concentration measurement."},{"id":"Q0834","t":"Analytical Techniques","q":"'Limit of detection' (LOD) in analytical chemistry refers to:","o":["The maximum possible concentration an instrument can measure","The lowest concentration of an analyte that can be reliably distinguished from a blank/background signal by a given method","The exact concentration of every sample tested","A fixed value identical for all instruments and analytes"],"a":1,"e":"LOD defines the smallest analyte amount/concentration statistically distinguishable from background noise for a specific analytical method and instrument."},{"id":"Q0823","t":"Analytical Techniques","q":"A 'standard calibration curve' in analytical chemistry is constructed by plotting:","o":["Random unrelated values","Instrument response (e.g., absorbance) against known concentrations of a series of standard solutions, used to determine unknown sample concentrations","Only two data points with no line fitted","Only qualitative color descriptions"],"a":1,"e":"A calibration curve relates instrument signal to known standard concentrations, allowing the concentration of an unknown sample to be read off from its measured signal."},{"id":"Q0821","t":"Analytical Techniques","q":"Determination of available phosphorus by the Olsen or Bray methods typically involves a final colorimetric step based on:","o":["Formation of a blue-colored phosphomolybdate complex, whose intensity is measured spectrophotometrically and related to phosphorus concentration","Direct weighing of a phosphorus precipitate","Flame photometry","X-ray diffraction"],"a":0,"e":"Extracted phosphate reacts with molybdate reagents to form a blue complex; the color intensity, measured by spectrophotometer, is proportional to phosphorus concentration."},{"id":"Q0985","t":"Analytical Techniques","q":"A spectrophotometer's 'wavelength selection' (choosing the specific wavelength for absorbance measurement) is typically set at:","o":["A completely random wavelength each time","The wavelength of maximum absorbance for the specific colored complex being measured, to maximize sensitivity and accuracy","Always exactly 000 nm","A wavelength unrelated to the analyte's properties"],"a":1,"e":"Measuring at the wavelength of maximum absorbance (λmax) for the specific developed color complex maximizes sensitivity and reduces interference, standard practice in colorimetric analysis."},{"id":"Q0953","t":"Analytical Techniques","q":"Which of the following would be the most appropriate analytical approach for rapidly screening a large number of field soil samples for approximate pH and salinity in the field itself, without full laboratory processing?","o":["X-ray diffraction analysis","Portable/field pH and EC meters applied to a simple soil-water suspension","Full laboratory Kjeldahl nitrogen analysis","Gas chromatography-mass spectrometry"],"a":1,"e":"Portable pH/EC meters allow rapid, low-cost field-level screening of many samples, whereas the other listed methods require more extensive laboratory processing/instrumentation, unsuited for quick field screening."},{"id":"Q0728","t":"Analytical Techniques","q":"Atomic Absorption Spectroscopy (AAS) is a widely used analytical technique for determining:","o":["Soil texture class","Concentrations of specific metallic elements (e.g., Zn, Cu, Fe, Mn) in soil/plant digests","Soil pH directly","Soil bulk density"],"a":1,"e":"AAS measures the absorption of specific wavelength light by atomized metal atoms in a sample, providing sensitive elemental concentration determination."},{"id":"Q0743","t":"Analytical Techniques","q":"Which analytical method would be most suitable for quickly estimating soil organic carbon content across many samples, once properly calibrated against reference wet-chemistry data?","o":["Vis-NIR/MIR diffuse reflectance spectroscopy","X-ray diffraction","Flame photometry","Gas chromatography"],"a":0,"e":"Once calibrated, reflectance spectroscopy allows rapid, low-cost, non-destructive estimation of organic carbon (and other properties) for large sample sets."},{"id":"Q0737","t":"Analytical Techniques","q":"An electrical conductivity (EC) meter measures soil salinity based on:","o":["The soil's ability to conduct an electrical current, which increases with dissolved salt (ion) concentration in solution","The color of the soil extract","The soil's magnetic properties","The soil's thermal conductivity"],"a":0,"e":"EC meters pass a current through the soil extract/suspension; higher ion concentration (more dissolved salts) increases conductivity, the basis of salinity measurement."},{"id":"Q0948","t":"Analytical Techniques","q":"In the Walkley-Black wet oxidation method for soil organic carbon, the excess (unreacted) potassium dichromate remaining after oxidation is typically quantified by:","o":["Direct weighing of a dichromate precipitate","Back-titration with a standard ferrous solution (e.g., ferrous ammonium sulfate), using a redox indicator to detect the endpoint","Flame photometry","X-ray diffraction"],"a":1,"e":"The unreacted dichromate is back-titrated against a standardized ferrous solution, and the dichromate consumed by soil organic carbon is calculated by difference, using a redox indicator to identify the titration endpoint."},{"id":"Q0819","t":"Analytical Techniques","q":"An electrical conductivity bridge (or EC meter) used for soil salinity testing is typically calibrated against:","o":["A standard potassium chloride (KCl) solution of known conductivity","A soil sample of unknown salinity","A dry sand blank only","A humidity sensor"],"a":0,"e":"EC meters are calibrated using standard solutions (commonly KCl) of precisely known conductivity to ensure accurate salinity measurements."},{"id":"Q0745","t":"Analytical Techniques","q":"A soil moisture meter based on capacitance or frequency domain reflectometry (FDR) principles estimates water content by measuring:","o":["The soil's magnetic susceptibility","The dielectric permittivity of the soil, which is strongly influenced by its water content","The soil's color","The soil's cation exchange capacity"],"a":1,"e":"FDR/capacitance sensors detect changes in the soil's dielectric properties, which respond strongly to water content, similarly in principle to TDR."},{"id":"Q0983","t":"Analytical Techniques","q":"A 'method validation' process in a soil testing laboratory is undertaken mainly to:","o":["Skip the need for any quality control","Demonstrate, through defined performance criteria (accuracy, precision, detection limits, etc.), that an analytical method is fit for its intended purpose before routine use","Only check the price of reagents","Eliminate the need for any standard operating procedures"],"a":1,"e":"Method validation systematically confirms that an analytical procedure reliably meets required performance criteria before it is adopted for routine sample analysis."},{"id":"Q0988","t":"Analytical Techniques","q":"Storage of collected soil samples before laboratory analysis should generally avoid:","o":["Air-drying in a clean, contamination-free environment","Prolonged storage under warm, moist conditions in sealed plastic bags, which can promote microbial activity and alter nitrogen and other labile properties before analysis","Proper labelling of each sample","Recording sampling location and depth"],"a":1,"e":"Storing moist samples in warm, sealed conditions can allow continued microbial activity, altering mineral nitrogen and other labile properties before they are actually measured, biasing results."},{"id":"Q0950","t":"Analytical Techniques","q":"Which of the following analytical methods would be considered a 'destructive' technique, in that it physically or chemically alters/consumes the original sample during analysis?","o":["Vis-NIR diffuse reflectance spectroscopy of an intact sample","Wet acid digestion of a soil sample for total elemental analysis","Simple visual Munsell color matching","Non-destructive X-ray fluorescence scanning of an intact sample"],"a":1,"e":"Acid digestion chemically breaks down (consumes) the original sample to release elements for analysis, unlike non-destructive techniques (reflectance spectroscopy, XRF scanning, visual color matching) that leave the sample largely intact."},{"id":"Q0829","t":"Analytical Techniques","q":"A chlorophyll meter (e.g., SPAD meter), widely used for rapid crop nitrogen status assessment, works by measuring:","o":["Soil reflectance","Light transmittance through a leaf at specific wavelengths, correlated with leaf chlorophyll content and hence often with plant nitrogen status","Soil salinity","Soil bulk density"],"a":1,"e":"SPAD meters estimate relative leaf chlorophyll content from light transmittance, which correlates with leaf nitrogen status, enabling quick, non-destructive crop N assessment."}],"Soil Pollution":[{"id":"Q0555","t":"Soil Pollution","q":"Which best describes why arsenic-contaminated groundwater used for irrigation poses an agricultural concern beyond drinking water safety?","o":["Arsenic has no effect on crops","Arsenic can accumulate in soil and be taken up by crops (notably rice), entering the food chain and posing chronic health risks with continued irrigation","Arsenic only affects soil color","Arsenic immediately kills all crops, with no partial uptake"],"a":1,"e":"Continued irrigation with arsenic-laden groundwater can build up soil arsenic and lead to crop (especially paddy rice) uptake, creating a dietary exposure pathway."},{"id":"Q0901","t":"Soil Pollution","q":"Tailings ponds associated with mining operations pose a soil/environmental pollution risk mainly due to:","o":["Their complete absence of any contaminants","Potential seepage or failure releasing heavy metals, process chemicals, and fine sediment into surrounding soil and water systems","Being entirely composed of harmless organic material","Having no interaction with the surrounding environment"],"a":1,"e":"Tailings ponds store mining waste that can contain heavy metals and process chemicals; seepage or structural failure can cause significant contamination of adjacent soil and water."},{"id":"Q0530","t":"Soil Pollution","q":"'Phytostabilization', another phytoremediation mechanism, works mainly by:","o":["Removing all contaminants from the site permanently","Using plant roots and associated processes to immobilize contaminants in soil, reducing their mobility/bioavailability and erosion/leaching risk","Volatilizing contaminants into the air","Increasing contaminant solubility and mobility"],"a":1,"e":"Phytostabilization reduces contaminant mobility (via root-zone chemistry, physical stabilization) rather than removing it from the site."},{"id":"Q0524","t":"Soil Pollution","q":"Heavy metal bioavailability in soil generally increases as soil pH:","o":["Increases (becomes more alkaline)","Decreases (becomes more acidic), which increases solubility of most metal cations","Is unrelated to metal solubility","Reaches exactly 7.0 for all metals"],"a":1,"e":"Lower pH generally increases the solubility and hence bioavailability/mobility of most cationic heavy metals in soil."},{"id":"Q0553","t":"Soil Pollution","q":"Which of these best describes the concept of 'assisted natural attenuation' in contaminated site management?","o":["Actively excavating and removing all contaminated soil immediately","Enhancing or supporting the site's own natural physical, chemical and biological processes that reduce contaminant concentration/toxicity over time, with monitoring","Complete abandonment of the site with no monitoring","Sealing the site permanently under concrete with no biological process involved"],"a":1,"e":"This approach relies on and sometimes enhances natural degradation/attenuation processes, combined with monitoring, rather than aggressive active remediation."},{"id":"Q0560","t":"Soil Pollution","q":"Constructed wetlands are sometimes used to treat contaminated wastewater/effluent before it reaches agricultural soils, relying mainly on:","o":["Complete absence of biological activity","Combined physical, chemical and biological (plant and microbial) processes to remove/transform pollutants as water passes through the wetland system","Only mechanical filtration through sand","Only chemical precipitation with no plants involved"],"a":1,"e":"Constructed wetlands use an engineered combination of plants, substrate and associated microbial communities to treat and reduce pollutant loads in wastewater."},{"id":"Q0941","t":"Soil Pollution","q":"Application of excessive raw (undigested) piggery/poultry slurry to land, beyond crop nutrient requirement and assimilative capacity, risks contributing to:","o":["Improved water quality in adjacent water bodies","Nutrient (especially N and P) runoff/leaching, pathogen contamination risk, and potential odour/environmental nuisance","Complete elimination of any nutrient loss","No risk whatsoever if applied in any quantity"],"a":1,"e":"Over-application of livestock slurry beyond what the soil-crop system can use/assimilate risks significant nutrient loss to water bodies, pathogen contamination, and other environmental nuisances."},{"id":"Q0558","t":"Soil Pollution","q":"Municipal solid waste dumping sites, if unmanaged, can contaminate surrounding soils mainly through:","o":["No risk at all if waste is organic","Leachate containing heavy metals, pathogens and various pollutants percolating into surrounding soil and groundwater","Only carbon dioxide release","Only noise pollution"],"a":1,"e":"Leachate from unmanaged waste sites can carry a mix of contaminants into surrounding soil and groundwater, posing significant pollution risk."},{"id":"Q0908","t":"Soil Pollution","q":"Which of the following best describes the relationship between soil organic matter content and the fate of many organic pollutants (e.g., pesticides) in soil?","o":["Organic matter has no influence on organic pollutant behaviour","Higher organic matter content generally increases sorption/retention of many organic pollutants, reducing their mobility and leaching potential while sometimes prolonging persistence","Organic matter always accelerates leaching of organic pollutants","Organic matter destroys all organic pollutants instantly"],"a":1,"e":"Soil organic matter provides strong sorption sites for many organic contaminants, generally reducing their mobility/leaching, though this can also slow degradation and prolong persistence in some cases."},{"id":"Q0548","t":"Soil Pollution","q":"Persistent organic pollutants (POPs) are of global environmental concern mainly because they exhibit:","o":["Rapid degradation and no bioaccumulation","Resistance to degradation, bioaccumulation in fatty tissues, and long-range environmental transport","Complete water solubility with no soil affinity","No toxicity to any organism"],"a":1,"e":"POPs (e.g., certain organochlorines) persist, bioaccumulate up food chains, and can travel long distances, making them a priority global pollutant class."},{"id":"Q0895","t":"Soil Pollution","q":"Fly ash, a by-product of coal-based thermal power generation, when applied to agricultural soils requires caution mainly because it may contain:","o":["No trace elements of any concern","Trace heavy metals and can affect soil pH/physical properties, requiring careful, regulated application rates despite some beneficial properties (e.g., improving soil physical conditions)","Only beneficial nutrients with absolutely no risk","Only water, with no solid content"],"a":1,"e":"While fly ash can improve certain soil physical properties and supply some nutrients, it may also carry trace heavy metals, necessitating careful, regulated use to avoid contamination risk."},{"id":"Q0541","t":"Soil Pollution","q":"Chromium contamination from tannery effluent is a significant soil pollution concern mainly because chromium (particularly hexavalent Cr(VI)) is:","o":["Completely non-toxic and beneficial to plants","Highly toxic and carcinogenic, unlike the comparatively less toxic trivalent Cr(III) form","Only toxic to microorganisms, never to humans","Always immobile and never a groundwater concern"],"a":1,"e":"Cr(VI) is highly mobile, toxic and carcinogenic, whereas Cr(III) is far less mobile and toxic; tannery effluent is a major source of Cr contamination."},{"id":"Q0523","t":"Soil Pollution","q":"Bioavailability of heavy metals in soil, and hence their toxicity risk, is strongly influenced by:","o":["Soil pH, organic matter content, and redox conditions, which affect metal speciation and solubility","Only the total metal concentration, regardless of chemical form","Soil color alone","Only atmospheric temperature"],"a":0,"e":"Metal speciation (and thus bioavailability) is governed by soil chemical conditions like pH, organic matter and redox status, not just total concentration."},{"id":"Q0539","t":"Soil Pollution","q":"Biochar application to contaminated soils is increasingly studied as a remediation approach mainly because biochar can:","o":["Increase heavy metal bioavailability sharply","Adsorb and immobilize certain contaminants (heavy metals and some organics), reducing their bioavailability and leaching risk","Have no interaction with soil contaminants","Only be used as a nitrogen fertilizer"],"a":1,"e":"Biochar's high surface area and functional groups can bind heavy metals/organic pollutants, reducing their mobility and biological availability."},{"id":"Q0936","t":"Soil Pollution","q":"Soil pollution by excess nitrate is generally considered more of an environmental/water-quality concern than a direct soil-productivity concern mainly because:","o":["Excess nitrate always reduces crop yield directly and severely","Nitrate is highly mobile and leaches readily to groundwater and surface waters, creating off-site water quality (and health) risks even though it may not directly damage the soil resource itself","Nitrate is completely immobile in soil","Excess nitrate destroys soil structure directly"],"a":1,"e":"Because nitrate moves readily with water rather than accumulating/damaging the soil itself, its primary pollution concern lies in impacts on downstream water quality (eutrophication, drinking water safety) rather than direct soil harm."},{"id":"Q0542","t":"Soil Pollution","q":"Which soil amendment is commonly used to immobilize heavy metals in situ by raising soil pH and promoting metal precipitation/adsorption?","o":["Elemental sulfur","Lime (liming materials)","Ammonium sulfate","Muriate of potash"],"a":1,"e":"Liming raises pH, which generally reduces the solubility of most cationic heavy metals through precipitation and increased adsorption, immobilizing them."},{"id":"Q0939","t":"Soil Pollution","q":"'Ecological risk assessment' of a contaminated site typically considers exposure pathways such as:","o":["Only direct human ingestion of soil, with no other pathway considered","Soil-to-plant transfer, soil-to-water leaching, and direct exposure to soil organisms, among other relevant pathways depending on site use","Only atmospheric pathways, with no soil or water pathways","No pathways at all, since ecological risk cannot be assessed"],"a":1,"e":"A thorough ecological risk assessment considers multiple relevant exposure routes (plant uptake, leaching to water, direct soil organism exposure, etc.) depending on the specific site and receptors of concern."},{"id":"Q0943","t":"Soil Pollution","q":"Which of these is generally true regarding the persistence of heavy metal contamination in soil compared to many organic pollutants?","o":["Heavy metals typically degrade completely within a few years, similar to many pesticides","Heavy metals are elements and cannot be biologically or chemically destroyed, so they can persist indefinitely in soil unless physically removed, only their form/mobility can be altered","Heavy metals always volatilize completely within months","Heavy metal contamination is always less persistent than organic pesticide contamination"],"a":1,"e":"Unlike many organic pollutants that can be degraded to simpler, often less harmful compounds, elemental heavy metals cannot be destroyed — remediation can only change their speciation/mobility or physically remove them."},{"id":"Q0904","t":"Soil Pollution","q":"Dust generated from mining and mineral processing operations can contribute to soil pollution in surrounding areas mainly through:","o":["Complete absence of any transportable contaminants","Wind-blown deposition of metal-bearing particulate matter onto nearby agricultural and other land","Only affecting water bodies, never soil","Only affecting the mining site itself, with zero off-site impact"],"a":1,"e":"Windborne dust from mining/processing can carry heavy metals and other contaminants, depositing them onto surrounding soils well beyond the immediate mining site."},{"id":"Q0528","t":"Soil Pollution","q":"Phytoremediation refers to the use of:","o":["Chemical fertilizers to dilute pollutants","Plants to remove, degrade, stabilize, or contain contaminants in soil or water","Only bacteria for pollutant degradation","Physical excavation equipment"],"a":1,"e":"Phytoremediation employs plants and their associated rhizosphere processes to manage contamination through several possible mechanisms."},{"id":"Q0527","t":"Soil Pollution","q":"'Biostimulation', another bioremediation strategy, involves:","o":["Introducing new, foreign microorganisms","Modifying environmental conditions (e.g., adding nutrients, oxygen, adjusting moisture) to stimulate the activity of existing indigenous pollutant-degrading microorganisms","Complete soil sterilization","Adding heavy metals to soil"],"a":1,"e":"Biostimulation enhances native microbial degrader activity by optimizing conditions (nutrients, aeration, moisture) rather than introducing new organisms."},{"id":"Q0561","t":"Soil Pollution","q":"The 'maximum permissible limit' concept for heavy metals in agricultural soils/food is established primarily to:","o":["Encourage unlimited contamination","Protect human and environmental health by setting regulatory thresholds beyond which soil/food is considered unsafe","Increase crop yield artificially","Measure soil texture"],"a":1,"e":"Regulatory limits are science-based thresholds intended to keep contaminant exposure through soil and food within safe bounds for health and the environment."},{"id":"Q0547","t":"Soil Pollution","q":"Which of the following microbial degradation pathways is generally favoured for many pesticides under well-aerated (aerobic) soil conditions?","o":["Complete absence of any degradation","Oxidative degradation pathways mediated by aerobic microorganisms","Only anaerobic fermentation pathways","Photodegradation exclusively, with no microbial role"],"a":1,"e":"Many pesticide-degrading microorganisms use oxidative enzymatic pathways that function preferentially under aerobic soil conditions."},{"id":"Q0938","t":"Soil Pollution","q":"Application of biosolids (treated sewage sludge) to agricultural land, when properly regulated, can provide agronomic benefits including:","o":["No nutrient or organic matter value whatsoever","Nitrogen, phosphorus and organic matter supply to soil, provided contaminant levels and application rates are kept within regulatory limits","Complete elimination of any need for soil testing","Guaranteed absence of any heavy metals under all circumstances"],"a":1,"e":"When properly treated and regulated, biosolids can supply valuable nutrients and organic matter, though their use requires monitoring to keep contaminant levels within safe regulatory limits."},{"id":"Q0522","t":"Soil Pollution","q":"Mercury contamination of soil and water, historically linked to Minamata disease, primarily entered the food chain through:","o":["Direct soil ingestion only","Bioaccumulation of methylmercury in aquatic organisms consumed by humans","Airborne dust with no water pathway","Only industrial fertilizer use"],"a":1,"e":"Industrial mercury discharge was converted to methylmercury by aquatic microorganisms, which then bioaccumulated up the food chain."},{"id":"Q0525","t":"Soil Pollution","q":"Bioremediation is broadly defined as:","o":["Physical removal of contaminated soil for landfill disposal","The use of living organisms, especially microorganisms or plants, to degrade, transform, or remove environmental contaminants","Chemical incineration of polluted soil","Simple dilution of contaminated soil with clean soil"],"a":1,"e":"Bioremediation harnesses biological processes (microbial or plant-based) to detoxify or remove pollutants from contaminated environments."},{"id":"Q0940","t":"Soil Pollution","q":"Which of the following would generally be considered the most effective FIRST step in managing a newly identified point-source soil contamination (e.g., a chemical spill)?","o":["Immediate large-scale crop planting on the site with no assessment","Site characterization/delineation of the extent and nature of contamination, before selecting an appropriate remediation strategy","Ignoring the contamination since it will resolve naturally in all cases","Applying random, untested amendments immediately"],"a":1,"e":"Proper site characterization (extent, contaminant type/concentration, pathways) is essential before selecting an appropriate, effective remediation approach for a contaminated site."},{"id":"Q0534","t":"Soil Pollution","q":"Chelate-assisted phytoextraction, using agents like EDTA, is intended to:","o":["Reduce metal solubility, making metals less available for plant uptake","Increase the solubility and plant availability of otherwise poorly soluble soil metals, enhancing uptake efficiency","Have no effect on metal solubility","Permanently bind metals in an unavailable form"],"a":1,"e":"Synthetic chelates mobilize soil-bound metals into solution, increasing their availability for plant uptake during phytoextraction, though this raises leaching-risk concerns."},{"id":"Q0520","t":"Soil Pollution","q":"Arsenic contamination of groundwater and soils in parts of the Indo-Gangetic and Bengal delta regions is primarily a result of:","o":["Only industrial discharge","Natural geogenic arsenic release from sediments under reducing groundwater conditions, exacerbated by groundwater irrigation","Only pesticide application","Only urban sewage"],"a":1,"e":"Natural arsenic-bearing sediments release arsenic under reducing aquifer conditions; extensive tube-well irrigation then brings it into soils and crops."},{"id":"Q0518","t":"Soil Pollution","q":"Soil pollution by heavy metals commonly arises from all of the following sources EXCEPT:","o":["Industrial effluents and mining activity","Application of contaminated sewa
