
<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AAU-Xafal — ASRB NET Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5ef; --paper:#fdfefb; --surface:#ffffff; --surface-2:#eef1e7;
  --ink:#1c2419; --ink-dim:#4c5946; --ink-faint:#7c8a73;
  --border:#d7ddca; --border-strong:#b7c1a6;
  --accent:#3d5c3a; --accent-ink:#f4f6ef; --accent-soft:#e3ead9;
  --gold:#a9762f; --gold-soft:#f3e6cd; --gold-ink:#5c3f16;
  --danger:#a13d2e; --danger-soft:#f6e0da; --danger-ink:#7a2c20;
  --success:#3d6b45; --success-soft:#e1ecdf;
  --info:#3a5a78; --info-soft:#e2ebf2;
  --shadow: 0 1px 2px rgba(28,36,25,.06), 0 6px 20px -8px rgba(28,36,25,.18);
  --radius: 12px;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12160f; --paper:#171c13; --surface:#1c2217; --surface-2:#242b1d;
    --ink:#eef1e6; --ink-dim:#c1cab4; --ink-faint:#8b9880;
    --border:#333d29; --border-strong:#454f37;
    --accent:#87b285; --accent-ink:#0f1a0f; --accent-soft:#233324;
    --gold:#d7a856; --gold-soft:#3a2e17; --gold-ink:#f1dcac;
    --danger:#e08975; --danger-soft:#3a231f; --danger-ink:#f3c9bd;
    --success:#8fc194; --success-soft:#1f2e21;
    --info:#89b3d6; --info-soft:#1c2a34;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#12160f; --paper:#171c13; --surface:#1c2217; --surface-2:#242b1d;
  --ink:#eef1e6; --ink-dim:#c1cab4; --ink-faint:#8b9880;
  --border:#333d29; --border-strong:#454f37;
  --accent:#87b285; --accent-ink:#0f1a0f; --accent-soft:#233324;
  --gold:#d7a856; --gold-soft:#3a2e17; --gold-ink:#f1dcac;
  --danger:#e08975; --danger-soft:#3a231f; --danger-ink:#f3c9bd;
  --success:#8fc194; --success-soft:#1f2e21;
  --info:#89b3d6; --info-soft:#1c2a34;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--sans); margin:0; line-height:1.5; -webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; text-wrap:balance; margin:0 0 .3em;}
a{color:inherit}
button{font-family:var(--sans); cursor:pointer;}
::selection{background:var(--gold-soft)}
.hz-strip{height:6px; width:100%; background:linear-gradient(90deg, #3d5c3a 0 25%, #2b3d24 25% 50%, #a9762f 50% 75%, #c7bfa4 75% 100%);}
:root[data-theme="dark"] .hz-strip, :root:not([data-theme="light"]) .hz-strip{ filter:brightness(.85) saturate(.9); }

#app{max-width:1180px; margin:0 auto; padding:0 20px 64px;}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:20px 0 14px; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:12px;}
.brand-mark{width:38px; height:38px; border-radius:9px; background:linear-gradient(160deg, var(--accent), #2b3d24); display:flex; align-items:center; justify-content:center; color:var(--accent-ink); font-family:var(--serif); font-weight:700; font-size:18px; flex-shrink:0;}
.brand-text h1{font-size:19px; margin:0; letter-spacing:.01em;}
.brand-text p{margin:0; font-size:12.5px; color:var(--ink-faint);}
nav.tabs{display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:10px; flex-wrap:wrap;}
nav.tabs button{background:none; border:none; padding:8px 14px; border-radius:7px; font-size:13.5px; color:var(--ink-dim); font-weight:500;}
nav.tabs button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}
nav.tabs button:hover:not(.active){color:var(--ink);}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}
.section{margin-top:28px;}
.section > h2{font-size:20px; margin-bottom:4px;}
.section-sub{color:var(--ink-faint); font-size:13.5px; margin-bottom:16px;}

.hero{background:linear-gradient(155deg, var(--surface) 0%, var(--surface-2) 100%); border:1px solid var(--border); border-radius:16px; padding:22px 24px; display:flex; justify-content:space-between; gap:20px; align-items:center; flex-wrap:wrap;}
.hero h2{font-size:22px; margin-bottom:6px;}
.hero p{margin:0; color:var(--ink-dim); font-size:14px; max-width:52ch;}
.exam-date-pill{display:inline-flex; align-items:center; gap:8px; background:var(--gold-soft); color:var(--gold-ink); border-radius:999px; padding:8px 14px; font-family:var(--mono); font-size:12.5px; font-weight:600; white-space:nowrap;}

.grid-tests{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:16px; margin-top:16px;}
.test-card{padding:18px; display:flex; flex-direction:column; gap:10px;}
.test-card .tnum{font-family:var(--mono); font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em;}
.test-card h3{font-size:16px; margin:0;}
.status-badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:4px 9px; border-radius:999px; width:fit-content;}
.status-available{background:var(--success-soft); color:var(--success);}
.status-locked{background:var(--surface-2); color:var(--ink-faint);}
.status-done{background:var(--info-soft); color:var(--info);}
.test-meta{font-size:12.5px; color:var(--ink-faint); display:flex; flex-direction:column; gap:3px;}
.test-meta b{color:var(--ink-dim); font-weight:600;}
.btn{border:none; border-radius:9px; padding:10px 16px; font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:6px; transition:transform .08s ease;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--accent); color:var(--accent-ink);}
.btn-outline{background:none; border:1px solid var(--border-strong); color:var(--ink);}
.btn-gold{background:var(--gold); color:#2a1c07;}
.btn-danger{background:var(--danger); color:#2a0f09;}
.btn-ghost{background:var(--surface-2); color:var(--ink-dim);}
.btn-sm{padding:7px 12px; font-size:12.5px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.5; cursor:not-allowed;}

.reg-card{padding:20px 22px;}
.reg-card h3{font-size:16px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;}
@media(max-width:560px){.field-row{grid-template-columns:1fr;}}
.field{display:flex; flex-direction:column; gap:5px;}
.field label{font-size:12px; font-weight:600; color:var(--ink-dim);}
.field input, .field select{background:var(--paper); border:1px solid var(--border-strong); border-radius:8px; padding:9px 11px; font-size:14px; color:var(--ink); font-family:var(--sans);}
.field input:focus, .field select:focus{outline:2px solid var(--accent); outline-offset:1px;}
.field-error{font-size:11.5px; color:var(--danger);}

.chip-row{display:flex; gap:6px; flex-wrap:wrap;}
.chip{font-size:11px; padding:3px 9px; border-radius:999px; background:var(--surface-2); color:var(--ink-dim); font-weight:600;}

.practice-topics{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; margin-top:14px;}
.topic-card{padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px;}
.topic-card .tname{font-size:13.5px; font-weight:600;}
.topic-card .tcount{font-size:11.5px; color:var(--ink-faint); font-family:var(--mono);}

.quiz-shell{display:grid; grid-template-columns:1fr 260px; gap:20px; margin-top:18px; align-items:start;}
@media(max-width:860px){.quiz-shell{grid-template-columns:1fr;}}
.quiz-header{position:sticky; top:0; z-index:5; background:var(--bg); padding:10px 0; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; border-bottom:1px solid var(--border); margin-bottom:14px;}
.timer{font-family:var(--mono); font-weight:700; font-size:18px; background:var(--surface); border:1px solid var(--border); padding:8px 14px; border-radius:9px;}
.timer.low{color:var(--danger); border-color:var(--danger);}
.q-card{padding:22px 24px;}
.q-index{font-family:var(--mono); font-size:12px; color:var(--ink-faint); margin-bottom:8px; display:flex; justify-content:space-between;}
.q-text{font-size:16px; line-height:1.55; margin-bottom:18px;}
.opt{display:flex; align-items:flex-start; gap:11px; padding:12px 14px; border:1px solid var(--border); border-radius:10px; margin-bottom:9px; cursor:pointer; font-size:14px; background:var(--paper);}
.opt:hover{border-color:var(--border-strong);}
.opt.selected{border-color:var(--accent); background:var(--accent-soft);}
.opt .optlet{font-family:var(--mono); font-weight:700; font-size:12px; width:22px; height:22px; border-radius:6px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.opt.selected .optlet{background:var(--accent); color:var(--accent-ink);}
.opt.correct{border-color:var(--success); background:var(--success-soft);}
.opt.incorrect{border-color:var(--danger); background:var(--danger-soft);}
.explain{margin-top:14px; padding:12px 14px; background:var(--info-soft); border-radius:10px; font-size:13px; color:var(--ink); border:1px solid var(--border);}
.q-actions{display:flex; justify-content:space-between; margin-top:16px; gap:8px; flex-wrap:wrap;}
.q-actions .left, .q-actions .right{display:flex; gap:8px; flex-wrap:wrap;}

.palette{padding:16px; position:sticky; top:70px;}
.palette h4{font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin:0 0 10px;}
.palette-grid{display:grid; grid-template-columns:repeat(8,1fr); gap:5px;}
@media(max-width:860px){.palette-grid{grid-template-columns:repeat(12,1fr);}}
.pnum{aspect-ratio:1; border-radius:6px; border:1px solid var(--border); background:var(--paper); font-family:var(--mono); font-size:10.5px; display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font-weight:600;}
.pnum.answered{background:var(--success); color:#fff; border-color:var(--success);}
.pnum.marked{background:var(--gold); color:#2a1c07; border-color:var(--gold);}
.pnum.current{outline:2px solid var(--accent); outline-offset:1px;}
.palette-legend{display:flex; flex-direction:column; gap:6px; margin-top:14px; font-size:11.5px; color:var(--ink-dim);}
.legend-dot{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:6px; vertical-align:middle;}

.summary-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin-top:16px;}
.stat-tile{padding:16px; text-align:center;}
.stat-tile .val{font-family:var(--mono); font-size:24px; font-weight:700;}
.stat-tile .lbl{font-size:11.5px; color:var(--ink-faint); margin-top:4px;}
.stat-correct .val{color:var(--success);}
.stat-wrong .val{color:var(--danger);}
.stat-unattempt .val{color:var(--ink-faint);}

.topicbar-row{display:flex; align-items:center; gap:10px; margin:8px 0; font-size:12.5px;}
.topicbar-row .tlabel{width:170px; flex-shrink:0; color:var(--ink-dim);}
.topicbar-track{flex:1; height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden;}
.topicbar-fill{height:100%; background:var(--accent); border-radius:99px;}
.topicbar-num{font-family:var(--mono); width:48px; text-align:right; color:var(--ink-faint);}

.review-item{padding:16px 18px; margin-bottom:10px;}
.review-item .rmeta{display:flex; gap:8px; margin-bottom:8px; align-items:center;}
.rtag{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:6px; text-transform:uppercase; letter-spacing:.03em;}
.rtag.correct{background:var(--success-soft); color:var(--success);}
.rtag.wrong{background:var(--danger-soft); color:var(--danger);}
.rtag.skip{background:var(--surface-2); color:var(--ink-faint);}

.modal-backdrop{position:fixed; inset:0; background:rgba(10,14,8,.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;}
.modal{background:var(--surface); border-radius:14px; max-width:440px; width:100%; padding:24px; box-shadow:var(--shadow);}
.modal h3{font-size:17px;}
.modal p{font-size:13.5px; color:var(--ink-dim);}
.modal .actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}

table.data-table{width:100%; border-collapse:collapse; font-size:13px;}
table.data-table th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); padding:8px 10px; border-bottom:1px solid var(--border-strong);}
table.data-table td{padding:9px 10px; border-bottom:1px solid var(--border);}
.table-wrap{overflow-x:auto; border-radius:10px; border:1px solid var(--border);}

.empty-state{text-align:center; padding:40px 20px; color:var(--ink-faint);}
textarea.import-box{width:100%; min-height:120px; font-family:var(--mono); font-size:12px; padding:10px; border-radius:9px; border:1px solid var(--border-strong); background:var(--paper); color:var(--ink);}
.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:9px; font-size:13px; z-index:60; box-shadow:var(--shadow);}
:root:not([data-theme="light"]) .toast, :root[data-theme="dark"] .toast{background:var(--surface); color:var(--ink); border:1px solid var(--border-strong);}
footer.foot{margin-top:48px; padding-top:20px; border-top:1px solid var(--border); font-size:11.5px; color:var(--ink-faint); text-align:center;}
.lock-gate{max-width:360px; margin:60px auto; padding:26px; text-align:center;}
.lock-gate input{width:100%; margin:14px 0; text-align:center; letter-spacing:.1em;}

</style>
<div id="app-root"></div>
<script>
const QUIZ_DATA = {"tests":[{"id":1,"title":"Mock Test 1","questions":[{"id":"Q0053","t":"Soil Physics","q":"The standard oven-drying temperature used for the gravimetric soil moisture method is:","o":["50°C","70°C","105°C","150°C"],"a":2,"e":"Soil samples are dried to constant weight at 105°C to determine gravimetric water content."},{"id":"Q0795","t":"Remote Sensing & DSM","q":"QGIS is widely used in soil/agricultural spatial analysis as an example of:","o":["A proprietary satellite platform","A free and open-source Geographic Information System (GIS) software for spatial data analysis and mapping","A type of soil test kit","A type of spectrometer"],"a":1,"e":"QGIS is a popular open-source GIS application used for visualizing, analysing and mapping spatial data, including soil survey and digital soil mapping work."},{"id":"Q0886","t":"Soil Conservation","q":"Ravine lands, characterized by extensive, deeply dissected gully networks, are among the most severely eroded landforms and generally require:","o":["No treatment at all, since they cannot be reclaimed","An integrated combination of structural gully control measures and vegetative stabilization, often over an extended period, for effective reclamation","Only chemical fertilizer application","Immediate conversion to intensive irrigated agriculture with no preparatory treatment"],"a":1,"e":"Because of their severe, complex erosion, ravine lands typically need a combined, phased approach of structural and vegetative treatment to achieve effective, lasting reclamation."},{"id":"Q0550","t":"Soil Pollution","q":"Excessive and continuous application of certain pesticides can adversely affect soil health by:","o":["Always increasing beneficial microbial diversity","Suppressing beneficial soil microorganisms (e.g., N-fixers, mycorrhizae) and disrupting nutrient cycling processes","Having no effect on non-target organisms","Improving soil structure directly"],"a":1,"e":"Non-target effects of some pesticides can harm beneficial microbial populations, impairing processes like nitrogen fixation and mycorrhizal symbiosis."},{"id":"Q0906","t":"Soil Pollution","q":"Continuous long-term application of untreated tannery/industrial effluent for irrigation, without proper treatment, is particularly concerning for soil health because it can lead to:","o":["Improved soil fertility with absolutely no risk","Accumulation of specific heavy metals (e.g., chromium) and salts, degrading soil quality and posing risks to crops and human health via the food chain","Complete absence of any soil impact","Automatic soil remediation over time with no intervention needed"],"a":1,"e":"Untreated industrial effluents can introduce specific contaminants (like chromium from tanneries) and salts that accumulate with repeated irrigation, degrading soil and posing food-chain risks."},{"id":"Q0937","t":"Soil Pollution","q":"Which best explains why speciation (chemical form), rather than only total concentration, is critical when assessing arsenic risk in paddy soils?","o":["All arsenic species have identical toxicity and mobility","Different arsenic species (e.g., arsenite vs arsenate) differ substantially in toxicity and mobility/bioavailability, so total arsenic alone does not fully predict risk","Arsenic speciation is irrelevant to plant uptake","Total arsenic concentration always equals bioavailable arsenic"],"a":1,"e":"Arsenite (more mobile/toxic under reduced conditions) and arsenate behave differently in soil and are taken up differently by plants, so understanding speciation is essential for accurate risk assessment beyond total arsenic content."},{"id":"Q0872","t":"Soil Conservation","q":"Alley cropping, an agroforestry-based soil conservation practice, involves:","o":["Growing crops exclusively without any trees","Growing agricultural/horticultural crops in the alleys between rows of trees or shrubs (often nitrogen-fixing species) planted along the contour","Removing all vegetation from a field before planting","Planting only trees, with no crop production"],"a":1,"e":"Alley cropping combines contour-planted tree/shrub hedgerows with crops grown in between, providing erosion control (via the hedgerows) alongside continued crop production."},{"id":"Q0376","t":"Soil Fertility","q":"Which of these is generally considered the most reliable overall approach for diagnosing a suspected nutrient deficiency in a standing crop?","o":["Visual symptoms alone, without any confirmation","A combination of visual symptoms, plant tissue analysis and soil testing","Soil color observation alone","Crop yield history alone"],"a":1,"e":"Combining visual diagnosis with tissue and soil analysis gives a more reliable, confirmed diagnosis than any single method alone."},{"id":"Q0046","t":"Soil Physics","q":"A tensiometer installed in the field measures:","o":["Osmotic potential","Soil matric potential (suction)","Total salt concentration","Soil temperature"],"a":1,"e":"A tensiometer records the suction (matric potential) the soil exerts on water in its porous cup."},{"id":"Q0538","t":"Soil Pollution","q":"Organochlorine pesticides such as DDT are generally characterized by:","o":["Rapid biodegradation and negligible persistence","High persistence, bioaccumulation potential, and slow degradation in the environment","Complete water solubility and rapid leaching only","No environmental impact at all"],"a":1,"e":"Organochlorines like DDT resist microbial breakdown and are lipophilic, causing them to persist and bioaccumulate through food chains."},{"id":"Q0659","t":"Soil Conservation","q":"Strip cropping is an erosion control practice that involves:","o":["Growing a single crop uniformly across an entire field","Growing crops in alternating strips (e.g., a row crop alternated with a closely growing cover crop) arranged across the slope or along the contour","Removing all crop residue after harvest","Applying fertilizer only in strips"],"a":1,"e":"Alternating erosion-prone row crops with dense-cover strips reduces runoff velocity and traps sediment, controlling erosion across the field."},{"id":"Q0079","t":"Soil Physics","q":"Available water capacity is generally highest in soils of which texture?","o":["Coarse sand","Medium-textured soils such as loam or silt loam","Pure gravel","Pure clay with heavy cracking"],"a":1,"e":"Medium-textured soils balance adequate pore space and retention, usually giving the greatest plant-available water."},{"id":"Q0482","t":"Soil Microbiology","q":"Most denitrifying bacteria in soil are best described as:","o":["Obligate aerobes only","Facultative anaerobes that use nitrate as an alternative electron acceptor when oxygen is limited","Obligate photosynthetic organisms","Nitrogen-fixing symbionts only"],"a":1,"e":"Denitrifiers normally respire aerobically but switch to nitrate respiration under low-oxygen conditions, releasing gaseous N products."},{"id":"Q0627","t":"Pedology","q":"Soils developed on limestone parent material in humid regions often show which characteristic due to preferential removal of carbonate?","o":["Very high bulk density with no weathering at all","Reddish, clay-enriched residual soils (e.g., terra rossa) as carbonate is dissolved and removed, concentrating insoluble residue including iron oxides","Formation of a spodic horizon","Perennial waterlogging"],"a":1,"e":"Dissolution of the highly soluble carbonate fraction concentrates the insoluble residue (often iron-rich clay), producing characteristic red residual soils on limestone."},{"id":"Q0300","t":"Soil Fertility","q":"Immobilization of soil nitrogen refers to:","o":["Conversion of inorganic N (NH4+/NO3-) into microbial biomass/organic form, temporarily reducing plant availability","Loss of N as gas to the atmosphere","Leaching of nitrate below the root zone","Fixation of atmospheric N2 by legumes"],"a":0,"e":"Microbes assimilate inorganic N into their own biomass when decomposing high C:N residues, temporarily locking up plant-available N."},{"id":"Q0323","t":"Soil Fertility","q":"'Khaira disease' of rice, common in some alluvial soils, is caused by deficiency of:","o":["Nitrogen","Zinc","Potassium","Sulfur"],"a":1,"e":"Khaira disease of rice is a classic Zn-deficiency disorder seen in zinc-deficient alluvial rice soils."},{"id":"Q0918","t":"Problem Soils","q":"Which best describes why continuously flooded rice cultivation is sometimes used strategically as a transitional crop on moderately sodic soils during reclamation?","o":["Rice cannot tolerate any degree of sodicity","The standing water helps leach sodium/salts while rice, being relatively tolerant of wet, poorly structured conditions, can still be productively grown during the reclamation period","Rice increases soil sodicity permanently","Rice requires completely dry soil conditions"],"a":1,"e":"Ponded rice cultivation aids leaching of sodium/salts from the profile while providing an economically viable crop despite the soil's initially poor structure, useful during transitional reclamation phases."},{"id":"Q0734","t":"Analytical Techniques","q":"High Performance Liquid Chromatography (HPLC) is particularly useful, compared to GC, for analysing compounds that are:","o":["Highly volatile and thermally stable only","Non-volatile, thermally unstable, or polar, which are not well suited to gas chromatography","Only inorganic elements","Only soil physical properties"],"a":1,"e":"HPLC separates compounds in a liquid mobile phase, making it suitable for non-volatile, heat-sensitive or polar analytes that GC cannot easily handle."},{"id":"Q0198","t":"Soil Chemistry","q":"Soil pH measured in a dilute salt solution (e.g., KCl) compared to pH measured in water is usually:","o":["Higher","Lower, due to release of exchangeable Al/H by the salt","Identical","Undefined"],"a":1,"e":"Salt displaces exchangeable Al3+/H+ into solution, so KCl-pH is typically lower than water-pH (the 'salt effect')."},{"id":"Q0830","t":"Analytical Techniques","q":"Wet digestion (using strong acids) and dry ashing (high-temperature combustion) are two general approaches used to:","o":["Measure soil texture directly","Break down organic matter and mineralize a sample prior to elemental analysis (e.g., determining total mineral content of plant/soil material)","Directly measure soil pH","Directly measure hydraulic conductivity"],"a":1,"e":"Both approaches destroy organic matrices to release elements into a measurable form, a necessary preparatory step for many elemental analyses."},{"id":"Q0382","t":"Soil Fertility","q":"Root-zone nutrient stratification (nutrients concentrated near the surface) can become a problem under long-term:","o":["Deep ploughing every season","Continuous no-till/minimum tillage with surface fertilizer application and no incorporation","Frequent subsoiling","Puddled rice cultivation"],"a":1,"e":"Without incorporation, surface-applied, immobile nutrients like P and K can accumulate near the surface, potentially limiting uptake if surface soil dries."},{"id":"Q0385","t":"Soil Fertility","q":"A soil is described as having 'high fertility but low productivity'. This situation could arise because:","o":["Fertility and productivity always mean exactly the same thing","Other factors such as poor drainage, unfavourable climate, or poor management may prevent the soil's inherent nutrient supplying capacity from being realized as yield","Fertility is a meaningless term","Productivity depends only on fertilizer applied"],"a":1,"e":"Fertility describes the soil's inherent capacity to supply nutrients, while productivity also depends on other growth factors and management."},{"id":"Q0776","t":"General Agriculture & Statistics","q":"'Mean' and 'standard deviation' together are commonly used to summarize a dataset by describing, respectively:","o":["Only the range of extreme values","The central tendency (average) and the spread/variability of the data around that average","Only the sample size","Only the correlation between two variables"],"a":1,"e":"The mean indicates the central/average value, while standard deviation quantifies how much individual observations typically deviate from that mean."},{"id":"Q0431","t":"Manures & Fertilizers","q":"Integrated Nutrient Management (INM), also referred to as Integrated Plant Nutrition System (IPNS), aims to:","o":["Maximize reliance on a single nutrient source","Optimize crop nutrition and maintain/improve soil fertility by combining organic, inorganic and biological nutrient sources appropriately","Eliminate the use of chemical fertilizer completely","Focus solely on micronutrient management"],"a":1,"e":"INM/IPNS integrates manures, fertilizers and biofertilizers in a balanced, site-specific way to sustain productivity and soil health."},{"id":"Q0127","t":"Soil Mineralogy","q":"X-ray diffraction (XRD) analysis is used in soil mineralogy chiefly to:","o":["Measure soil pH","Identify and characterize clay mineral types from their layer spacing","Determine soil organic carbon","Measure hydraulic conductivity"],"a":1,"e":"XRD detects characteristic basal spacings (d-spacings) that distinguish clay mineral species."},{"id":"Q0359","t":"Soil Fertility","q":"Which of the following best explains why sandy soils are generally more prone to nutrient deficiencies than clay-rich soils?","o":["Sandy soils have higher CEC and organic matter","Sandy soils have low CEC, low organic matter, and are prone to leaching of mobile nutrients","Sandy soils fix more phosphorus than clay soils","Sandy soils retain nutrients more strongly"],"a":1,"e":"Low CEC and organic matter reduce nutrient retention capacity in sandy soils, and rapid drainage promotes leaching of mobile nutrients like nitrate."},{"id":"Q0526","t":"Soil Pollution","q":"'Bioaugmentation', a bioremediation strategy, involves:","o":["Adding nutrients to stimulate indigenous microorganisms","Introducing specific pollutant-degrading microorganisms into contaminated soil to enhance degradation","Removing all microorganisms from soil","Physically excavating soil"],"a":1,"e":"Bioaugmentation adds selected, often pollutant-adapted, microbial strains to boost degradation capacity beyond what indigenous populations provide."},{"id":"Q0212","t":"Soil Chemistry","q":"The point of zero charge (PZC) of common Fe and Al oxides in soils typically occurs at:","o":["A distinctly acid pH range, often around pH 4","A near-neutral to alkaline pH range, e.g. roughly pH 7–9 depending on the mineral","Always at pH 14","Only at pH 0"],"a":1,"e":"PZC values for common Fe/Al oxides (e.g., goethite, gibbsite) generally fall in the near-neutral to somewhat alkaline range."},{"id":"Q0638","t":"Pedology","q":"Soils developed under dense forest vegetation, compared with grassland soils, more commonly show:","o":["A thicker, darker mollic epipedon than grassland soils","A comparatively thinner organic-rich surface horizon, since much organic input is as surface litter (O horizon) rather than deep root turnover","Identical organic matter distribution to grassland soils","No organic matter input at all"],"a":1,"e":"Forest organic matter input is concentrated at the surface as litterfall, in contrast to the deep root-derived organic matter typical of grassland soils, generally giving forest soils a thinner dark A horizon."},{"id":"Q0964","t":"Soil Mineralogy","q":"The term 'short-range order' minerals, such as allophane and imogolite, refers to minerals that:","o":["Have a perfectly repeating, well-defined long-range crystal lattice like quartz","Lack extensive long-range crystalline order, showing structural order only over very short atomic distances","Are entirely composed of organic carbon","Only occur as primary minerals"],"a":1,"e":"Short-range-order minerals have some local structural organization but lack the extensive, repeating crystal lattice of well-crystallized minerals, distinguishing them from true crystalline clays."},{"id":"Q0807","t":"Remote Sensing & DSM","q":"'Radiometric resolution' of a remote sensing sensor refers to:","o":["The ground area covered by one pixel","The sensor's ability to distinguish differences in the intensity (brightness) of reflected/emitted energy, often expressed in bits (e.g., 8-bit, 12-bit)","The number of spectral bands captured","The revisit frequency of the satellite"],"a":1,"e":"Radiometric resolution determines how finely a sensor can discriminate brightness levels, with higher bit-depth allowing detection of subtler intensity differences."},{"id":"Q0420","t":"Manures & Fertilizers","q":"Ammonium sulfate, besides supplying nitrogen, is agronomically useful because it also supplies:","o":["Potassium","Sulfur","Boron","Molybdenum"],"a":1,"e":"Ammonium sulfate [(NH4)2SO4] provides sulfur along with about 21% nitrogen, useful where S deficiency also exists."},{"id":"Q0777","t":"Remote Sensing & DSM","q":"Supervised classification of a satellite image, used to produce a land use/land cover map, requires the analyst to first:","o":["Let the software group pixels automatically with no prior input","Define representative 'training samples' of known classes (e.g., cropland, forest, water) which the classifier uses to categorize the remaining pixels","Avoid using any ground reference information","Only use thermal infrared bands"],"a":1,"e":"Supervised classification relies on analyst-selected training areas of known class identity to statistically classify the rest of the image."},{"id":"Q0219","t":"Soil Chemistry","q":"Precipitation of calcium carbonate (caliche/kankar) in soils typically occurs under:","o":["Humid, high-rainfall, leaching-dominated regimes","Arid to semi-arid conditions with limited leaching","Waterlogged acid sulfate conditions","High organic matter peat conditions"],"a":1,"e":"Where evapotranspiration exceeds precipitation, dissolved bicarbonate concentrates and precipitates as calcium carbonate nodules/layers."},{"id":"Q0238","t":"Soil Chemistry","q":"A soil pH of 7.0 is described as:","o":["Strongly acidic","Neutral","Strongly alkaline","Saline"],"a":1,"e":"pH 7.0 represents the neutral point on the pH scale."},{"id":"Q0135","t":"Soil Mineralogy","q":"Imogolite is characterized structurally as a:","o":["Tubular, non-crystalline (short-range order) aluminosilicate","Sheet silicate identical to kaolinite","Sulphate mineral","Carbonate mineral"],"a":0,"e":"Imogolite forms distinctive tubular structures and, like allophane, is a short-range-order mineral typical of volcanic-ash soils."},{"id":"Q0508","t":"Soil Microbiology","q":"Soil microbial communities generally show greater diversity and activity under:","o":["Continuous monocropping with no organic input","Diversified cropping systems/rotations with regular organic matter addition","Complete fallow with bare soil for extended periods","Repeated soil sterilization"],"a":1,"e":"Crop diversity and organic inputs provide varied substrates and habitats, generally supporting richer, more active microbial communities than monoculture/bare fallow."},{"id":"Q0099","t":"Soil Mineralogy","q":"Primary minerals in soil are best described as those that:","o":["Formed by weathering of secondary minerals","Are inherited largely unaltered from the parent rock","Only occur in the clay fraction","Are always amorphous"],"a":1,"e":"Primary minerals persist from the parent material without significant chemical alteration."},{"id":"Q0063","t":"Soil Physics","q":"The main difference between soil air and atmospheric air is that soil air has:","o":["Higher CO2 and lower O2 concentration","Higher O2 and lower CO2 concentration","Higher nitrogen only","No water vapour"],"a":0,"e":"Biological respiration in the soil raises CO2 and lowers O2 relative to open-air composition."},{"id":"Q0679","t":"Soil Conservation","q":"Which erosion control measure would be classified as an 'agronomic' (biological/cropping-based) measure rather than an 'engineering' (structural) measure?","o":["Terracing","Check dams","Contour cropping and strip cropping","Contour bunding"],"a":2,"e":"Agronomic measures use cropping/vegetation management (like contour and strip cropping) to control erosion, distinct from structural/engineering measures like terraces, bunds, and check dams."},{"id":"Q0932","t":"Problem Soils","q":"Which of these best distinguishes 'primary salinity' from 'secondary (human-induced) salinity'?","o":["Primary salinity arises from natural processes (e.g., weathering, saline parent material, or natural groundwater), while secondary salinity results from human activities such as irrigation mismanagement or land clearing that raise water tables","Both terms describe exactly the same process","Secondary salinity only occurs naturally, with no human cause","Primary salinity always results from irrigation"],"a":0,"e":"Primary (natural) salinity arises independent of human activity, whereas secondary salinity is induced or accelerated by human actions like poorly managed irrigation or vegetation clearing that alters the water balance."},{"id":"Q0969","t":"Soil Mineralogy","q":"Talc and pyrophyllite, though less common in soils than clay minerals like kaolinite or smectite, are structurally classified as:","o":["Primary ferromagnesian minerals only","2:1 layer silicates that, unlike smectite or vermiculite, carry essentially no layer charge (electrically neutral layers)","Iron oxide minerals","Carbonate minerals"],"a":1,"e":"Talc and pyrophyllite share the 2:1 tetrahedral-octahedral-tetrahedral layer structure but, lacking significant isomorphous substitution, carry essentially no layer charge, unlike charged 2:1 clays."},{"id":"Q0732","t":"Analytical Techniques","q":"X-ray fluorescence (XRF) spectroscopy is used in soil/geochemical analysis primarily to:","o":["Determine total elemental composition (major and trace elements) of a sample based on characteristic secondary X-ray emission","Measure soil water content","Measure soil pH","Measure soil bulk density"],"a":0,"e":"XRF excites atoms with primary X-rays, causing them to emit characteristic secondary (fluorescent) X-rays used to identify and quantify elements present."},{"id":"Q0714","t":"Remote Sensing & DSM","q":"'Ground truthing' in the context of remote sensing-based soil/land cover mapping refers to:","o":["Ignoring any field verification of remotely sensed classifications","Collecting field observations/samples to verify and calibrate/validate the accuracy of remotely sensed classifications or predictive maps","Using only satellite data with no field visits at all","A method to fertilize crops"],"a":1,"e":"Ground truth data (actual field observations) is essential to calibrate remote sensing-based models and independently validate their accuracy."},{"id":"Q0905","t":"Soil Pollution","q":"Post-remediation monitoring of a previously contaminated soil site is important mainly to:","o":["Confirm remediation success is unnecessary once treatment is applied","Verify that contaminant levels remain within acceptable limits over time and detect any re-contamination or rebound in bioavailability","Eliminate the need for any future site management","Increase contamination levels intentionally for research"],"a":1,"e":"Ongoing monitoring after remediation confirms long-term effectiveness and catches any resurgence of contamination or bioavailability that initial treatment may not have fully addressed."},{"id":"Q0030","t":"Soil Physics","q":"Which exchangeable cation promotes flocculation and good soil structure?","o":["Sodium","Calcium","Potassium (in excess)","Hydrogen alone"],"a":1,"e":"Calcium bridges clay particles, encouraging flocculation and stable aggregate formation."},{"id":"Q0054","t":"Soil Physics","q":"A lysimeter is primarily used to measure:","o":["Soil pH changes","Evapotranspiration and the soil water balance","Soil color","Cation exchange capacity"],"a":1,"e":"Lysimeters isolate a soil volume to directly measure water inputs/outputs, quantifying evapotranspiration."},{"id":"Q0838","t":"Analytical Techniques","q":"Which of the following best describes the general principle of atomic absorption spectroscopy (AAS)?","o":["Free ground-state atoms of an element absorb light at a characteristic wavelength specific to that element, and the amount of absorption is proportional to atomic concentration","Molecules emit light of a single universal wavelength regardless of composition","Only solid samples can ever be analysed by AAS","AAS measures only physical soil properties, never chemical composition"],"a":0,"e":"AAS atomizes the sample and measures the characteristic wavelength-specific light absorption by free atoms, which is proportional to the element's concentration (per Beer-Lambert law)."},{"id":"Q0398","t":"Soil Fertility","q":"Application of gypsum as a source of calcium and sulfur is particularly useful in soils that are:","o":["Strongly acidic and requiring pH increase","Sodic (needing Ca without raising pH) or deficient in sulfur, without requiring a pH change","Already saturated with calcium","Deficient in nitrogen only"],"a":1,"e":"Gypsum supplies Ca and S as a neutral salt without significantly altering soil pH, useful for sodic reclamation and S-deficient soils alike."},{"id":"Q0044","t":"Soil Physics","q":"The Kostiakov equation is an empirical model commonly used to describe:","o":["Soil infiltration rate over time","Soil organic carbon decomposition","Cation exchange capacity","Evapotranspiration demand"],"a":0,"e":"Kostiakov's power-function equation is widely used to fit measured infiltration data."},{"id":"Q0867","t":"Soil Conservation","q":"Geotextiles (synthetic or natural fabric materials) are sometimes used in soil conservation engineering mainly to:","o":["Increase soil erosion on slopes","Stabilize soil surfaces, reinforce embankments, and control erosion on slopes/channels while allowing water drainage and, often, vegetation establishment","Prevent any water infiltration whatsoever","Replace the need for any vegetative cover permanently"],"a":1,"e":"Geotextiles provide temporary or long-term physical stabilization of erosion-prone surfaces while still permitting drainage and, in biodegradable forms, supporting vegetation establishment."},{"id":"Q0475","t":"Soil Microbiology","q":"Lignin, a major structural component of plant residues, is decomposed in soil relatively slowly mainly by:","o":["Bacteria exclusively, with no fungal involvement","Specialized fungi (e.g., white-rot fungi) and, to a lesser extent, actinomycetes","Protozoa exclusively","Algae exclusively"],"a":1,"e":"Lignin's complex, resistant structure is broken down mainly by specific lignin-degrading fungi, with actinomycetes contributing more slowly."},{"id":"Q0516","t":"Soil Microbiology","q":"Which best describes the ecological role of decomposer soil fungi and bacteria in the ecosystem?","o":["They serve as primary producers","They break down dead organic matter, releasing nutrients and cycling carbon back through the ecosystem","They fix atmospheric carbon dioxide into biomass without organic substrate","They have no role in nutrient cycling"],"a":1,"e":"Decomposers mineralize organic matter, recycling nutrients (N, P, S, etc.) and releasing CO2, sustaining ecosystem nutrient cycles."},{"id":"Q0110","t":"Soil Mineralogy","q":"Montmorillonite (smectite) is a classic example of a:","o":["1:1 type clay mineral","2:1 type clay mineral","Non-crystalline mineral","Primary silicate mineral"],"a":1,"e":"Montmorillonite has two tetrahedral sheets sandwiching one octahedral sheet — a 2:1 structure."},{"id":"Q0847","t":"General Agriculture & Statistics","q":"'Bias' in a measurement or sampling procedure refers to:","o":["Random, unpredictable variation with no consistent direction","A systematic, consistent deviation of measured/estimated values from the true value, in a particular direction","The total sample size collected","The standard deviation of a dataset"],"a":1,"e":"Bias is a systematic error causing consistent over- or under-estimation, distinct from random variability (which affects precision, not necessarily direction)."},{"id":"Q0276","t":"Problem Soils","q":"Soil salinity primarily restricts plant growth mainly through:","o":["Physical toxicity of soil structure","Osmotic effects that reduce water availability to roots, plus specific ion toxicity","Excess soil aeration","Excess nitrogen supply"],"a":1,"e":"High soluble salt concentration lowers soil solution osmotic potential, making water uptake harder, and specific ions (Na, Cl) can be directly toxic."},{"id":"Q0490","t":"Soil Microbiology","q":"Soil microbial activity and population are generally greatest in which soil layer?","o":["Deep subsoil, far below the root zone","The surface layer, rich in organic matter, oxygen, and root activity","Parent material (C horizon)","Bedrock"],"a":1,"e":"The organic-matter-rich, well-aerated surface horizon, with abundant root activity, supports the highest microbial populations."},{"id":"Q0379","t":"Soil Fertility","q":"The main agronomic advantage of applying di-ammonium phosphate (DAP) as a basal dose is that it supplies:","o":["Only nitrogen","Both readily available nitrogen and phosphorus in one fertilizer","Only potassium","Only micronutrients"],"a":1,"e":"DAP (18% N, 46% P2O5) is a popular basal fertilizer supplying both N and P together."},{"id":"Q0048","t":"Soil Physics","q":"Time Domain Reflectometry (TDR) estimates soil water content based on:","o":["The dielectric constant of the soil-water system","Radioactive decay","Soil color changes","Osmotic pressure"],"a":0,"e":"TDR relates the speed of an electromagnetic pulse (governed by dielectric constant, dominated by water) to soil water content."},{"id":"Q0274","t":"Problem Soils","q":"The effect of high sodium hazard irrigation water on soil is to:","o":["Improve soil structure over time","Progressively increase exchangeable sodium percentage, causing dispersion and permeability problems","Have no effect on exchange chemistry","Immediately leach all salts"],"a":1,"e":"Continued use of high-SAR water raises soil ESP over time, degrading structure through clay dispersion."},{"id":"Q0050","t":"Soil Physics","q":"Volumetric water content can be obtained from gravimetric water content by:","o":["Dividing by particle density","Multiplying by bulk density and dividing by density of water","Multiplying by porosity only","Subtracting bulk density"],"a":1,"e":"Volumetric content = gravimetric content × (bulk density / density of water)."},{"id":"Q0119","t":"Soil Mineralogy","q":"High shrink–swell behaviour (cracking when dry, swelling when wet), as seen in Vertisols, is mainly attributed to:","o":["Kaolinite dominance","Montmorillonite (smectite) dominance","Quartz dominance","Gibbsite dominance"],"a":1,"e":"Montmorillonite's expanding interlayer causes marked volume change with wetting and drying."},{"id":"Q0511","t":"Soil Microbiology","q":"Soil enzyme assays are considered useful, rapid indicators of soil quality changes mainly because enzyme activities:","o":["Never change regardless of management","Respond relatively quickly to changes in management/organic inputs, often before changes are detectable in total organic carbon or other slower indicators","Are completely unrelated to microbial activity","Can only be measured after many decades"],"a":1,"e":"Being tied to active microbial metabolism, enzyme activities can shift noticeably within a season or few years, offering an early signal of soil quality change."},{"id":"Q0288","t":"Problem Soils","q":"Which statement about the relationship between soil salinity and plant nutrient uptake is generally correct?","o":["Salinity has no effect on nutrient uptake","High salinity can interfere with the uptake of certain nutrients, including inducing ion imbalances (e.g., Na interfering with K uptake)","Salinity always improves nutrient uptake","Salinity only affects micronutrients, never macronutrients"],"a":1,"e":"Excess Na and Cl can antagonize uptake of K, Ca and other nutrients, contributing to nutritional imbalance under salt stress."},{"id":"Q0750","t":"Analytical Techniques","q":"Loss-on-ignition (LOI) is a simple analytical method sometimes used to estimate:","o":["Soil pH","Approximate soil organic matter content, based on weight loss upon high-temperature combustion","Soil texture directly","Cation exchange capacity directly"],"a":1,"e":"LOI estimates organic matter by measuring the mass lost when a dried sample is combusted at high temperature (though it can be biased by loss of structural water/carbonates)."},{"id":"Q0181","t":"Soil Chemistry","q":"Under waterlogged (anaerobic) conditions, soil redox potential typically:","o":["Increases sharply","Decreases, becoming more reducing","Remains unchanged","Becomes infinite"],"a":1,"e":"Oxygen depletion under flooding drives Eh down as microbes use alternate electron acceptors (NO3-, Mn4+, Fe3+, SO4^2-)."},{"id":"Q0425","t":"Manures & Fertilizers","q":"Sewage sludge/biosolids, when used as a soil amendment, require careful monitoring mainly because of the risk of:","o":["Excess nitrogen only, with no other concern","Accumulation of heavy metals and pathogens in soil if not properly treated and regulated","Complete absence of any nutrients","Causing soil salinity only"],"a":1,"e":"Untreated or poorly regulated sewage sludge can introduce heavy metals and pathogens, requiring strict quality control before land application."},{"id":"Q0305","t":"Soil Fertility","q":"Nitrate (NO3-), unlike ammonium (NH4+), is:","o":["Strongly adsorbed on soil exchange sites","Mobile in soil solution and prone to leaching, since it is not attracted to negatively charged colloids","Immobile and fixed in clay interlayers","Volatile as a gas directly from soil"],"a":1,"e":"Being an anion, nitrate is repelled by the predominantly negative soil colloid charge and moves freely with water, risking leaching."},{"id":"Q0788","t":"Remote Sensing & DSM","q":"Landsat satellites, a long-running Earth observation program, provide multispectral imagery at a typical spatial resolution of approximately:","o":["1 metre","30 metres (for most multispectral bands)","1 kilometre","100 kilometres"],"a":1,"e":"Landsat's multispectral bands (e.g., TM, ETM+, OLI) are commonly provided at about 30 m spatial resolution, suitable for regional/farm-scale land studies."},{"id":"Q0880","t":"Soil Conservation","q":"Subsurface (tile) drainage systems are installed in agricultural fields mainly to:","o":["Increase waterlogging deliberately","Remove excess water from the root zone via buried perforated pipes/tiles, improving aeration and reducing waterlogging/salinity risk in poorly drained soils","Increase soil salinity intentionally","Eliminate the need for any surface drainage"],"a":1,"e":"Subsurface drains collect and remove excess soil water below the surface, alleviating waterlogging and helping manage salinity in poorly drained agricultural land."},{"id":"Q0393","t":"Soil Fertility","q":"The main purpose of applying a 'basal dose' of fertilizer at the time of sowing/transplanting is to:","o":["Supply the entire season's total nutrient requirement in one go, always","Provide nutrients (especially less mobile ones like P) needed for early establishment and root development","Replace the need for any top dressing","Only supply micronutrients"],"a":1,"e":"The basal dose ensures nutrients, especially immobile ones, are available at/near the root zone during early crop establishment."},{"id":"Q0619","t":"Pedology","q":"Glacial till, an important parent material in formerly glaciated regions, is characterized by:","o":["Well-sorted, uniform particle size","Unsorted, heterogeneous mixture of particle sizes (from clay to boulders) deposited directly by glacial ice","Pure volcanic ash only","Pure organic peat"],"a":1,"e":"Till is deposited directly by glacial ice without water sorting, so it typically contains a wide, unsorted range of particle sizes."},{"id":"Q0694","t":"Remote Sensing & DSM","q":"In soil remote sensing, increasing soil organic matter content generally causes:","o":["Increased overall reflectance (soil appears brighter/lighter)","Decreased overall reflectance (soil appears darker) across much of the visible-NIR spectrum","No change in reflectance at all","Only a change in thermal infrared emission"],"a":1,"e":"Higher organic matter content typically darkens soil, reducing its reflectance across a broad range of visible and near-infrared wavelengths."},{"id":"Q0415","t":"Manures & Fertilizers","q":"Di-ammonium phosphate (DAP) has an approximate nutrient grade of:","o":["12-32-16","18-46-0","46-0-0","0-0-60"],"a":1,"e":"DAP is conventionally graded 18-46-0, indicating 18% N, 46% P2O5, and no K2O."},{"id":"Q0644","t":"Pedology","q":"Which best describes the relationship between soil classification (e.g., Soil Taxonomy) and agricultural land use planning?","o":["Classification has no practical relevance to land use","Classification systematically organizes soils with similar properties, helping predict behaviour and guide appropriate management/land-use decisions across similar soils","Classification only matters for research, never for farming decisions","Every soil order requires identical management regardless of properties"],"a":1,"e":"A sound classification groups soils that behave similarly, allowing management recommendations and land-use planning to be transferred across soils of the same class."},{"id":"Q0660","t":"Soil Conservation","q":"Terracing, as a soil conservation engineering measure, primarily functions to:","o":["Increase slope steepness","Reduce effective slope length and steepness by creating a series of level or gently sloped platforms, thereby reducing runoff velocity and erosion","Increase runoff velocity deliberately","Eliminate the need for any other conservation practice"],"a":1,"e":"Terraces break a long slope into shorter, flatter segments, reducing the erosive energy of runoff and encouraging infiltration/controlled drainage."},{"id":"Q0864","t":"General Agriculture & Statistics","q":"Adequate 'sample size' in an agricultural survey or experiment is important mainly because:","o":["A larger, appropriately determined sample generally improves the precision and reliability of estimates and statistical tests, within practical resource constraints","Sample size has no bearing on result reliability","Smaller samples always give more accurate results","Sample size only matters for laboratory experiments, never field surveys"],"a":0,"e":"Appropriately sized samples improve the precision of estimates and the power of statistical tests to detect real effects, balanced against the practical cost/effort of larger samples."},{"id":"Q0551","t":"Soil Pollution","q":"Nitrate contamination of groundwater beneath agricultural fields is primarily linked to:","o":["Excess phosphorus fertilizer use only","Leaching of unused nitrate-nitrogen from over-application of nitrogen fertilizers/manures beyond crop uptake capacity","Potassium fertilizer application only","Liming of acid soils"],"a":1,"e":"Nitrate not taken up by crops readily leaches with percolating water, accumulating in groundwater when nitrogen inputs exceed crop demand."},{"id":"Q1000","t":"General Agriculture & Statistics","q":"A well-structured agricultural research thesis/dissertation typically follows a general format including:","o":["Results presented with no methodology or discussion at all","Introduction, review of literature, materials and methods, results, discussion, and conclusions/summary, generally supported by appropriate statistical analysis","Only raw data tables with no narrative text","Only a list of references with no other content"],"a":1,"e":"Standard agricultural research write-ups follow a structured format (introduction, literature review, methods, results, discussion, conclusions) with appropriate statistical treatment of the data throughout."},{"id":"Q0315","t":"Soil Fertility","q":"Potassium in soil exists in several forms; the form immediately available for plant uptake is:","o":["Structural (mineral lattice) K","Fixed (non-exchangeable interlayer) K","Water-soluble and exchangeable K","K held in primary feldspar and mica minerals"],"a":2,"e":"Water-soluble and exchangeable K are in rapid equilibrium with soil solution, making them directly plant-available."},{"id":"Q0995","t":"General Agriculture & Statistics","q":"'Coefficient of variation' comparisons ACROSS different traits/experiments should generally be interpreted with caution mainly because:","o":["CV% always means exactly the same thing regardless of the trait being measured","What constitutes an 'acceptable' CV% can vary depending on the trait/type of experiment (e.g., yield trials typically tolerate different CV ranges than some quality traits), so context matters in interpretation","CV% is never useful for interpreting experimental precision","CV% is only relevant to soil chemical analysis, never field trials"],"a":1,"e":"Different traits/experiment types have different inherent variability, so acceptable CV% benchmarks differ by context; a CV% considered high for one type of trial might be normal for another."},{"id":"Q0207","t":"Soil Chemistry","q":"The term 'complexation' in soil chemistry describes:","o":["Formation of a soluble or insoluble species by combination of a metal ion with a ligand","Physical mixing of soil particles","Loss of soil structure","Cation exchange only"],"a":0,"e":"Complexation includes chelation and simpler ion-pair formation between metals and organic/inorganic ligands."},{"id":"Q0731","t":"Analytical Techniques","q":"X-ray diffraction (XRD) analysis of soil clay fractions is used mainly to:","o":["Measure soil organic carbon content","Identify and quantify crystalline mineral phases (e.g., specific clay minerals) based on their characteristic diffraction patterns","Measure soil salinity","Measure soil microbial biomass"],"a":1,"e":"XRD detects characteristic diffraction angles corresponding to the crystal lattice spacing of specific minerals, enabling their identification in soil samples."},{"id":"Q0605","t":"Pedology","q":"Gelisols are defined primarily by the presence of:","o":["Permafrost within a shallow depth of the soil surface","A mollic epipedon","An oxic horizon","High soluble salt content"],"a":0,"e":"Gelisols are soils of very cold regions containing permafrost within a specified shallow depth, distinguishing them regardless of other properties."},{"id":"Q0412","t":"Manures & Fertilizers","q":"Complex fertilizers, such as DAP or NPK complexes, are manufactured products that:","o":["Contain two or more nutrients chemically combined in each granule, made through a defined industrial process","Are simple physical mixtures of straight fertilizers","Contain no nitrogen ever","Cannot be granulated"],"a":0,"e":"Complex fertilizers result from chemical reactions producing granules that carry two or more nutrients in fixed proportions."},{"id":"Q0244","t":"Problem Soils","q":"A saline-sodic soil, per the USSL classification, is characterized by:","o":["ECe > 4 dS/m AND ESP > 15, with pH usually < 8.5 while salts remain","ECe < 4 dS/m and ESP < 15","Zero soluble salts and zero exchangeable sodium","Only high pH with no salinity or sodicity"],"a":0,"e":"Saline-sodic soils combine high soluble salts and high exchangeable sodium; the salts keep pH relatively lower until leached."},{"id":"Q0086","t":"Soil Physics","q":"Long-term zero (no) tillage, compared with conventional tillage, generally leads to:","o":["Permanently loose surface soil with no compaction risk","Somewhat higher near-surface bulk density initially, but improved aggregate stability over time","Immediate loss of all soil structure","No change in any physical property"],"a":1,"e":"No-till surface soils may show slightly higher bulk density initially but typically develop better long-term aggregation and stability."},{"id":"Q0404","t":"Manures & Fertilizers","q":"Vermicompost is produced through the action of:","o":["Nitrogen-fixing bacteria","Earthworms acting on organic waste, along with associated microorganisms","Blue-green algae","Mycorrhizal fungi"],"a":1,"e":"Vermicomposting uses earthworms (e.g., Eisenia fetida) to convert organic waste into a nutrient-rich, humus-like material."},{"id":"Q0801","t":"Remote Sensing & DSM","q":"'Buffer analysis' in GIS, for example creating a 100 m buffer around a river, is used mainly to:","o":["Directly change the elevation values of a DEM","Delineate a zone of specified distance around a feature, useful for proximity-based analysis (e.g., identifying land within a set distance of a water source)","Only classify soil texture","Only convert raster data to a table"],"a":1,"e":"Buffering generates a zone of defined distance around point, line or polygon features, commonly used to analyse or restrict areas relative to that feature."},{"id":"Q0773","t":"General Agriculture & Statistics","q":"Rainfed agriculture, as opposed to irrigated agriculture, primarily depends on:","o":["Assured year-round canal irrigation","Natural rainfall as the main source of crop water supply, without assured irrigation","Groundwater tube wells exclusively","Only greenhouse-controlled water supply"],"a":1,"e":"Rainfed farming relies on natural precipitation rather than assured irrigation, making it more vulnerable to rainfall variability."},{"id":"Q0264","t":"Problem Soils","q":"Soils affected by high exchangeable sodium but classified as non-saline typically show a soil pH range of about:","o":["3.5–4.5","5.0–6.5","8.5–10.5","Exactly 7.0 always"],"a":2,"e":"Sodic (non-saline) soils, dominated by sodium carbonate/bicarbonate hydrolysis, characteristically show high pH, often above 8.5."},{"id":"Q0194","t":"Soil Chemistry","q":"The Bray-1 method for extractable phosphorus is generally best suited to:","o":["Acid to neutral soils","Strongly calcareous soils only","Saline soils only","Sodic soils only"],"a":0,"e":"Bray-1 (dilute HCl + NH4F) is appropriate for acid and moderately acid to neutral soils, not highly calcareous ones."},{"id":"Q0577","t":"Pedology","q":"The 'E horizon' is characterized by:","o":["Maximum accumulation of clay and organic matter","Maximum eluviation (removal) of clay, iron and aluminium oxides, often appearing pale/light in color","Being the unweathered parent material","Cementation by silica"],"a":1,"e":"The E (eluvial) horizon, common beneath the A horizon in some soils, is depleted of clay/sesquioxides through leaching, giving it a lighter color."},{"id":"Q0763","t":"General Agriculture & Statistics","q":"A factorial experiment, as opposed to a single-factor experiment, is designed to:","o":["Study the effect of only one factor at a time","Simultaneously study two or more factors and their combinations, allowing estimation of main effects and interaction effects between factors","Avoid the use of any replication","Only be used in laboratory conditions"],"a":1,"e":"Factorial designs test combinations of multiple factors (e.g., variety × nitrogen level), enabling assessment of both individual (main) effects and how factors interact."},{"id":"Q0197","t":"Soil Chemistry","q":"Soil pH is generally measured in the laboratory using a soil-to-water (or soil-to-KCl) ratio, most commonly:","o":["1:1 or 1:2.5 soil:solution","1:100 soil:solution","10:1 soil:solution","Pure soil paste only, never diluted"],"a":0,"e":"Standard laboratory soil pH is typically measured in a 1:1 or 1:2.5 (soil:water or soil:0.01M KCl) suspension."},{"id":"Q0820","t":"Analytical Techniques","q":"A pH meter is typically calibrated before use with standard buffer solutions of pH values commonly around:","o":["1, 2 and 3","4, 7 and 9.2 (or similar standard buffers)","20, 40 and 60","100, 200 and 300"],"a":1,"e":"Standard buffer solutions near pH 4, 7 and 9.2 are commonly used to calibrate pH meters across the acidic-to-alkaline range relevant to soils."},{"id":"Q0163","t":"Soil Chemistry","q":"Cation exchange in soils is best described as a reaction that is:","o":["Irreversible and very slow","Reversible and stoichiometric","Only occurring in alkaline soils","Independent of soil colloids"],"a":1,"e":"Cation exchange is a rapid, reversible, charge-for-charge (stoichiometric) replacement reaction on colloid surfaces."},{"id":"Q0622","t":"Pedology","q":"Soil profile description in the field typically records, for each horizon, properties including:","o":["Only soil pH","Depth, color (Munsell), texture, structure, consistence, and boundary characteristics, among others","Only soil salinity","Only crop yield history"],"a":1,"e":"Standard profile description systematically records horizon depth, color, texture, structure, consistence, boundary and other diagnostic field properties."},{"id":"Q0618","t":"Pedology","q":"Loess soils develop from parent material transported and deposited primarily by:","o":["Wind (aeolian deposition of fine silt)","River water","Glacial meltwater only","Ocean waves"],"a":0,"e":"Loess consists of wind-blown, well-sorted silt-sized material, forming distinctive, often very fertile soils in several world regions."},{"id":"Q0436","t":"Manures & Fertilizers","q":"Liquid fertilizers/fertigation formulations are particularly compatible with which irrigation method for precise nutrient delivery?","o":["Flood/basin irrigation only","Drip irrigation","Rainfed conditions with no irrigation","Furrow irrigation exclusively"],"a":1,"e":"Drip fertigation allows precise, frequent, small-dose nutrient delivery directly to the root zone, maximizing use efficiency."}]},{"id":2,"title":"Mock Test 2","questions":[{"id":"Q0250","t":"Problem Soils","q":"Gypsum requirement of a sodic soil is calculated primarily based on:","o":["The amount of exchangeable sodium to be replaced to reach a target ESP","Soil organic carbon content","Soil bulk density","Soil color"],"a":0,"e":"Gypsum requirement is computed from the quantity of Ca2+ needed to displace excess exchangeable Na+ down to an acceptable ESP."},{"id":"Q0375","t":"Soil Fertility","q":"Response to applied sulfur is increasingly being observed in many intensively cropped soils mainly because:","o":["Sulfur is added in excess through all fertilizers","Use of high-analysis, sulfur-free fertilizers (e.g., urea, DAP) has reduced incidental sulfur inputs that older fertilizers used to supply","Sulfur cannot be taken up by plants","Soils are naturally becoming richer in sulfur"],"a":1,"e":"Older fertilizers like ammonium sulfate and single superphosphate supplied incidental S; the shift to high-analysis, S-free fertilizers has increased S deficiency risk."},{"id":"Q0767","t":"General Agriculture & Statistics","q":"India's agro-climatic zones, as delineated for agricultural planning, are primarily based on:","o":["State administrative boundaries alone","Combinations of climate, soil, physiography, and cropping pattern characteristics relevant to agricultural planning","Only population density","Only the number of universities in the region"],"a":1,"e":"Agro-climatic zoning groups regions with broadly similar climate, soil, and farming characteristics to guide region-specific agricultural planning and research."},{"id":"Q0863","t":"General Agriculture & Statistics","q":"'Non-parametric' statistical tests are generally used instead of standard parametric tests (like ANOVA/t-test) when:","o":["Data closely follow a normal distribution with all standard assumptions met","Data seriously violate assumptions of normality/homogeneity of variance required for parametric tests, or when data are ordinal/rank-based rather than truly continuous","Sample size is extremely large with no other consideration","Only categorical qualitative descriptions are irrelevant"],"a":1,"e":"Non-parametric methods make fewer distributional assumptions, making them appropriate when data don't meet the normality/variance assumptions parametric tests require, or for rank/ordinal data."},{"id":"Q0976","t":"Manures & Fertilizers","q":"'Fortified/enriched compost', prepared by adding rock phosphate or other mineral amendments during composting, aims mainly to:","o":["Reduce the nutrient value of the final compost","Enhance the nutrient content (e.g., phosphorus availability) of the finished compost by combining it with mineral amendments during the composting process","Eliminate the need for any composting time","Convert compost into a purely inorganic fertilizer"],"a":1,"e":"Adding mineral amendments like rock phosphate during composting can improve the nutrient value of the final product, partly through biologically enhanced solubilization during decomposition."},{"id":"Q0467","t":"Soil Microbiology","q":"The enzyme dehydrogenase is commonly assayed in soil microbiology studies as an indicator of:","o":["Soil salinity","Overall soil microbial oxidative/respiratory activity","Soil texture","Soil color"],"a":1,"e":"Dehydrogenase activity reflects the general metabolic (respiratory) activity of the living soil microbial community."},{"id":"Q0637","t":"Pedology","q":"Soils developed under prairie/grassland vegetation typically develop a deep, dark A horizon mainly because:","o":["Grass roots contribute abundant organic matter through their fine, fibrous, deeply penetrating root systems that die back annually","Grassland soils receive no organic matter input","Trees contribute more organic matter than grasses","Grassland soils are always waterlogged"],"a":0,"e":"The dense, fibrous root systems of grasses, cycling annually, add substantial organic matter throughout a deep zone, producing the classic thick, dark mollic epipedon."},{"id":"Q0423","t":"Manures & Fertilizers","q":"Bone meal, used as an organic phosphatic manure, supplies phosphorus mainly in the form of:","o":["Ammonium phosphate","Calcium phosphate (from bone mineral)","Potassium phosphate","Iron phosphate"],"a":1,"e":"Bone meal is derived from processed animal bone, rich in calcium phosphate, and releases P slowly as it decomposes."},{"id":"Q0138","t":"Soil Mineralogy","q":"Among common primary silicate minerals, weathering typically proceeds FASTEST for:","o":["Quartz","Olivine","Muscovite mica","Zircon"],"a":1,"e":"Olivine, with its isolated silica tetrahedra and high content of easily oxidized Fe/Mg, weathers most rapidly of common silicates."},{"id":"Q0239","t":"Soil Chemistry","q":"According to common soil pH classification, a soil with pH 4.5–5.0 would be described as:","o":["Slightly acidic","Extremely/very strongly acidic","Neutral","Strongly alkaline"],"a":1,"e":"pH below about 5.0 is generally categorized as very strongly to extremely acidic."},{"id":"Q0876","t":"Soil Conservation","q":"'Soil loss tolerance' (T-value) is defined as:","o":["The absolute maximum soil loss a field can experience with no consequence ever","The maximum rate of soil erosion that can occur while still sustaining a level of soil productivity economically/indefinitely, used as a benchmark in conservation planning","A fixed universal value identical for every soil type worldwide","The total historical soil loss recorded for a field"],"a":1,"e":"T-value represents an estimated threshold erosion rate below which long-term soil productivity can be maintained, used to guide acceptable conservation planning targets."},{"id":"Q0747","t":"Analytical Techniques","q":"For determining exchangeable cations and CEC by the ammonium acetate method, the extracted ammonium is subsequently measured, commonly by:","o":["X-ray diffraction","Distillation and titration (Kjeldahl-type) or colorimetric/other suitable methods","Flame photometry exclusively, with no alternative","Gas chromatography"],"a":1,"e":"After NH4OAc extraction/saturation and displacement, the ammonium content (reflecting CEC) is commonly quantified by distillation-titration or other suitable analytical methods."},{"id":"Q0143","t":"Soil Mineralogy","q":"pH-dependent (variable) charge arises mainly from:","o":["Isomorphous substitution deep in the lattice","Protonation/deprotonation of exposed hydroxyl (–OH) groups at particle edges and oxide surfaces","Fixation of potassium ions","Formation of gypsum crystals"],"a":1,"e":"Edge and oxide-surface hydroxyls gain or lose H+ depending on soil pH, generating charge that varies with pH."},{"id":"Q0594","t":"Pedology","q":"US Soil Taxonomy currently recognizes how many soil orders at the highest level of classification?","o":["6","12","20","50"],"a":1,"e":"Soil Taxonomy recognizes twelve soil orders: Alfisols, Andisols, Aridisols, Entisols, Gelisols, Histosols, Inceptisols, Mollisols, Oxisols, Spodosols, Ultisols and Vertisols."},{"id":"Q0852","t":"General Agriculture & Statistics","q":"Black soils (regur/Vertisols), rich in expanding clay and known for cotton cultivation, are predominantly found in India in the:","o":["Himalayan foothills","Deccan trap (basaltic) region, including much of Maharashtra, Madhya Pradesh and parts of Gujarat/Karnataka","Coastal sandy tracts only","Northeastern hill states only"],"a":1,"e":"Black cotton soils have developed extensively over basaltic Deccan trap rock, covering large areas of central and western peninsular India."},{"id":"Q0154","t":"Soil Mineralogy","q":"Illite is generally understood to form through weathering/alteration of:","o":["Quartz","Mica (especially under moderate weathering intensity)","Gypsum","Calcite"],"a":1,"e":"Illite is often described as a weathering product of mica minerals under conditions of moderate, incomplete alteration."},{"id":"Q0917","t":"Problem Soils","q":"Molasses or press mud, sometimes used alongside gypsum in sodic soil reclamation, primarily contribute by:","o":["Increasing soil sodicity further","Supplying organic matter/energy source that stimulates microbial activity and CO2 production, which can help dissolve native soil carbonates and release additional calcium","Preventing any calcium release from native minerals","Eliminating the need for any leaching"],"a":1,"e":"Organic amendments like molasses/press mud fuel microbial activity, generating CO2/organic acids that can help mobilize calcium from native carbonates, supplementing gypsum's effect."},{"id":"Q0018","t":"Soil Physics","q":"Macropores in soil primarily control:","o":["Nutrient adsorption","Aeration and rapid drainage","Cation exchange","Soil color"],"a":1,"e":"Large pores (macropores) drain quickly under gravity and are the main pathway for air movement."},{"id":"Q0814","t":"Remote Sensing & DSM","q":"Compared with traditional soil survey based purely on manual field mapping, integrating remote sensing and GIS mainly helps by:","o":["Making soil survey slower and less efficient","Providing auxiliary spatial information (terrain, spectral, land cover) that improves mapping efficiency, consistency, and coverage, especially over large or inaccessible areas","Eliminating the need for any field verification permanently","Working only for very small, single-field areas"],"a":1,"e":"RS/GIS integration provides spatially continuous auxiliary data that, combined with field observations, improves the efficiency, consistency and extent of soil survey and mapping."},{"id":"Q0095","t":"Soil Physics","q":"Evapotranspiration losses from a cropped field are influenced mainly by:","o":["Soil color alone","Climatic demand, crop cover and available soil water","Soil pH only","Clay mineralogy alone"],"a":1,"e":"ET integrates atmospheric evaporative demand, crop water use and the soil's capacity to supply water."},{"id":"Q0897","t":"Soil Pollution","q":"Polychlorinated biphenyls (PCBs), a class of persistent organic pollutants historically used in industrial applications, are of soil/environmental concern mainly due to their:","o":["Rapid, complete biodegradation within days","High persistence, bioaccumulation potential, and toxicity, similar in behaviour to other persistent organic pollutants like organochlorine pesticides","Complete absence of any environmental or health risk","Immediate volatilization with no soil residue"],"a":1,"e":"PCBs share key characteristics with other POPs: strong environmental persistence, bioaccumulation through food chains, and toxicity, making them a significant historical soil/environmental contaminant."},{"id":"Q0471","t":"Soil Microbiology","q":"Soil microbial biomass carbon (SMBC) is widely used as an indicator of:","o":["Soil texture class","The size of the living microbial pool, a sensitive early indicator of soil quality/health changes","Soil salinity","Soil color"],"a":1,"e":"SMBC responds quickly to management changes, making it a sensitive biological indicator of soil quality before changes appear in total organic carbon."},{"id":"Q0892","t":"Soil Pollution","q":"Microplastic contamination of agricultural soils has emerged as a concern mainly due to sources such as:","o":["Only natural rock weathering","Plastic mulch degradation, application of contaminated compost/biosolids, and irrigation with contaminated water","Only volcanic ash deposits","Only natural forest litter"],"a":1,"e":"Plastic mulch breakdown, contaminated organic amendments, and irrigation water are recognized pathways introducing microplastic particles into agricultural soils."},{"id":"Q0735","t":"Analytical Techniques","q":"The Kjeldahl method, a classical wet-chemistry technique, is used to determine:","o":["Soil organic carbon","Total nitrogen content in soil/plant/organic samples","Available phosphorus","Cation exchange capacity"],"a":1,"e":"The Kjeldahl procedure digests organic nitrogen to ammonium, which is then distilled and titrated to quantify total nitrogen content."},{"id":"Q0894","t":"Soil Pollution","q":"Earthworm toxicity tests are sometimes used as a bioindicator/bioassay approach in soil pollution assessment mainly because earthworms:","o":["Are unaffected by any soil contaminant","Are sensitive to soil contaminants and their survival/reproduction/behaviour can indicate soil toxicity, serving as an ecologically relevant test organism","Cannot be used in any laboratory test","Only respond to changes in soil texture"],"a":1,"e":"Earthworms are ecologically important, contaminant-sensitive soil organisms, making standardized earthworm toxicity tests a recognized method for assessing soil ecotoxicological risk."},{"id":"Q0585","t":"Pedology","q":"An 'oxic horizon', diagnostic of the Oxisol order, is characterized by:","o":["Dominance of highly weathered minerals (kaolinite, Fe/Al oxides), very low content of weatherable primary minerals, and low CEC","Abundance of fresh, unweathered primary minerals","High content of expanding 2:1 clays","Perennial ice"],"a":0,"e":"Oxic horizons reflect an advanced stage of weathering, dominated by resistant oxides and 1:1 clays with correspondingly low CEC and few weatherable minerals."},{"id":"Q0043","t":"Soil Physics","q":"The Green–Ampt model is a physically based equation describing:","o":["Cation exchange","Infiltration of water into soil","Soil respiration","Soil color development"],"a":1,"e":"The Green–Ampt model describes infiltration using a sharp wetting front concept."},{"id":"Q0158","t":"Soil Chemistry","q":"Anion exchange capacity (AEC) in soils is generally more significant in:","o":["Soils dominated by 2:1 clay minerals","Highly weathered soils rich in Fe/Al oxides and kaolinite","Saline soils only","Peat soils only"],"a":1,"e":"Variable-charge oxide/kaolinite-dominated soils can develop positive charge at low pH, giving appreciable AEC."},{"id":"Q0655","t":"Soil Conservation","q":"In the USLE, the 'C factor' (cover-management factor) reflects:","o":["Rainfall intensity","The effect of vegetation cover, cropping system and management on reducing (or allowing) soil loss relative to bare, tilled fallow","Only the length of the slope","Only the soil's clay content"],"a":1,"e":"C compares soil loss under a given cropping/management system to loss from continuously bare, tilled fallow, capturing the protective effect of cover/management."},{"id":"Q0712","t"
