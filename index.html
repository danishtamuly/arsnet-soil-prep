:"Remote Sensing & DSM","q":"Hyperspectral remote sensing differs from conventional multispectral remote sensing mainly in that hyperspectral sensors:","o":["Capture data in only 3–4 broad spectral bands","Capture data in many (often hundreds of) narrow, contiguous spectral bands, allowing more detailed spectral characterization of targets","Cannot be used for soil or vegetation studies","Only operate in the thermal infrared"],"a":1,"e":"Hyperspectral sensors record fine, continuous spectral detail across many narrow bands, enabling more precise identification of soil/vegetation spectral features than broad-band multispectral sensors."},{"id":"Q0493","t":"Soil Microbiology","q":"Which of the following best explains the term 'microbial biomass' in soil ecology?","o":["The total mass of dead organic matter in soil","The mass of the living component of soil organic matter, comprising bacteria, fungi, and other microorganisms","The mass of soil minerals","The mass of plant roots only"],"a":1,"e":"Microbial biomass specifically refers to the living microorganism fraction of soil organic matter, distinct from non-living organic residues."},{"id":"Q0831","t":"Analytical Techniques","q":"Microwave-assisted digestion, compared to conventional open-vessel acid digestion, generally offers the advantage of:","o":["Much slower digestion times","Faster digestion, reduced reagent use, and reduced risk of volatile element loss due to closed-vessel conditions","No ability to digest any sample type","Complete elimination of the need for acids"],"a":1,"e":"Microwave digestion in closed vessels speeds digestion, reduces reagent consumption, and better retains volatile elements compared to traditional open digestion."},{"id":"Q0967","t":"Soil Mineralogy","q":"Weathering of biotite (a ferromagnesian mica) in soils, compared to muscovite (a non-ferromagnesian mica), generally proceeds:","o":["More slowly, since biotite is more resistant","More rapidly, since the iron/magnesium in its structure makes it more susceptible to oxidation and alteration","At an identical rate to muscovite","Not at all, since biotite never weathers"],"a":1,"e":"The iron and magnesium content of biotite makes it more chemically reactive (via oxidation) and generally more weatherable than the more resistant, iron-poor muscovite."},{"id":"Q0233","t":"Soil Chemistry","q":"Oxidation, as a soil chemical weathering process, is well illustrated by:","o":["Conversion of ferrous (Fe2+) minerals to ferric (Fe3+) oxide forms","Conversion of quartz to feldspar","Formation of gypsum from calcite","Reduction of nitrate to N2 gas"],"a":0,"e":"Exposure to atmospheric oxygen oxidizes Fe2+-bearing minerals to more stable Fe3+ oxide/hydroxide forms."},{"id":"Q0495","t":"Soil Microbiology","q":"Which enzyme's activity is specifically used to indicate the soil's capacity for sulfur mineralization from organic matter?","o":["Arylsulfatase","Urease","Nitrogenase","Catalase"],"a":0,"e":"Arylsulfatase catalyzes hydrolysis of organic sulfate esters, and its activity indicates potential for organic sulfur mineralization."},{"id":"Q0169","t":"Soil Chemistry","q":"'Reserve' (potential) soil acidity refers mainly to:","o":["Acidity in soil solution","The much larger pool of exchangeable and mineral-bound acidity beyond the solution phase","Only carbonic acid in soil water","Nitrate concentration"],"a":1,"e":"Reserve acidity, mostly exchangeable Al3+/H+ and structural acidity, greatly exceeds active (solution) acidity in magnitude."},{"id":"Q0774","t":"General Agriculture & Statistics","q":"A 'null hypothesis' in agricultural research statistics typically states that:","o":["There is a significant, real difference between treatments being compared","There is no significant difference/effect between the treatments or variables being compared, which the test seeks to potentially reject based on evidence","The experiment has no experimental error","All treatment means are guaranteed to be equal in the true population"],"a":1,"e":"The null hypothesis (H0) is the default assumption of 'no effect/no difference', which statistical testing seeks to evaluate against the collected data."},{"id":"Q0164","t":"Soil Chemistry","q":"A soil's CEC generally increases with increasing:","o":["Sand content","Clay content (especially 2:1 clays) and organic matter","Bulk density","Soil temperature"],"a":1,"e":"More clay (particularly high-charge types) and more humus both add exchange sites, raising CEC."},{"id":"Q0543","t":"Soil Pollution","q":"Application of organic amendments (e.g., compost, biochar) in metal-contaminated soils can help reduce metal bioavailability through:","o":["Complexation/adsorption of metals onto organic matter and increased soil pH/CEC, reducing free metal ion activity","Directly removing metals from the field","Volatilizing metals into the atmosphere","Increasing metal solubility uniformly"],"a":0,"e":"Organic matter provides binding sites (complexation, adsorption) that reduce the free, bioavailable fraction of soil metals."},{"id":"Q0992","t":"General Agriculture & Statistics","q":"'Standard error of difference' (SEd) between two treatment means, in agricultural trial statistics, is used together with the appropriate t-value to calculate:","o":["The total experimental area","The critical difference (CD)/LSD value used to test whether two specific treatment means differ significantly","The soil bulk density","The total number of treatments"],"a":1,"e":"CD (LSD) is typically calculated as SEd multiplied by the appropriate t-value (at the chosen significance level and error degrees of freedom), providing the threshold for declaring two means significantly different."},{"id":"Q0711","t":"Remote Sensing & DSM","q":"Unmanned Aerial Vehicles (UAVs/drones) equipped with multispectral or hyperspectral sensors are increasingly used in precision agriculture mainly for their advantage of:","o":["Providing very coarse resolution imagery only, unsuitable for field-scale work","Providing high-resolution, flexible, on-demand imagery at field scale, useful for crop and soil monitoring","Being unable to carry any sensors","Replacing the need for any ground truthing forever"],"a":1,"e":"UAVs offer flexible, high-resolution imagery acquisition tailored to field-scale needs, complementing satellite data for precision agriculture applications."},{"id":"Q0817","t":"Analytical Techniques","q":"The gypsum requirement of a sodic soil can be estimated in the laboratory using methods such as the Schoonover method, which is based on:","o":["Direct measurement of soil color","Reaction of the soil with a standard gypsum-saturated solution to estimate the calcium needed to replace excess exchangeable sodium","Measurement of soil bulk density","Combustion analysis"],"a":1,"e":"The Schoonover method estimates gypsum requirement from the change in calcium/sulfate concentration when soil reacts with a gypsum-saturated extracting solution."},{"id":"Q0066","t":"Soil Physics","q":"Soil thermal conductivity is generally highest in soils that are:","o":["Dry and loose","Wet and compact","Dry and well-aggregated","Air-dry and sandy"],"a":1,"e":"Water conducts heat far better than air, so moist, compact soils (with fewer air gaps) conduct heat more efficiently."},{"id":"Q0439","t":"Manures & Fertilizers","q":"Which of the following is an example of a bulky organic manure rather than a concentrated organic manure?","o":["Neem cake","Fish meal","Farmyard manure (FYM)","Bone meal"],"a":2,"e":"FYM is a classic bulky organic manure with comparatively low nutrient concentration relative to concentrated cakes/meals."},{"id":"Q0506","t":"Soil Microbiology","q":"Soil biochemical indicators of soil quality/health commonly include:","o":["Soil color and particle size only","Microbial biomass, enzyme activities (e.g., dehydrogenase, urease), and soil respiration","Only mineralogical composition","Only bulk density"],"a":1,"e":"Biological/biochemical indicators (microbial biomass, key enzyme activities, respiration) are widely used to assess soil biological health, often responding faster than chemical/physical indicators."},{"id":"Q0231","t":"Soil Chemistry","q":"Soil chemical weathering reactions such as hydrolysis, oxidation, and carbonation collectively contribute to:","o":["Formation of secondary minerals and release of plant nutrients","Only physical breakdown of rock","Loss of all soil minerals","Reduction of soil pH to zero"],"a":0,"e":"These chemical processes break down primary minerals, releasing nutrient ions and forming new secondary minerals."},{"id":"Q0784","t":"Remote Sensing & DSM","q":"Thermal infrared remote sensing is particularly useful in agriculture for estimating:","o":["Soil mineralogy directly","Land/canopy surface temperature, which can be related to crop water stress and evapotranspiration","Soil color under the Munsell system","Soil particle size distribution directly"],"a":1,"e":"Thermal sensors detect emitted infrared radiation related to surface temperature, widely used to infer crop water stress and estimate evapotranspiration."},{"id":"Q0466","t":"Soil Microbiology","q":"Arbuscular mycorrhizal fungi (VAM/AMF), a type of endomycorrhiza, are characterized by forming:","o":["An external mantle only, without cell penetration","Arbuscules and vesicles within root cortical cells, along with external hyphae extending into soil","Nodules on legume roots","No physical structures at all"],"a":1,"e":"VAM fungi penetrate cortical cells to form arbuscules (nutrient exchange sites) and often vesicles, while extending hyphae into surrounding soil."},{"id":"Q0736","t":"Analytical Techniques","q":"A pH meter measures soil pH based on the potential difference generated at:","o":["A thermocouple sensor","A glass electrode selectively sensitive to hydrogen ion activity, compared against a reference electrode","A conductivity probe","An optical sensor"],"a":1,"e":"pH meters use a glass electrode whose potential responds to H+ activity, measured relative to a stable reference electrode, to determine pH."},{"id":"Q0815","t":"Analytical Techniques","q":"In Kjeldahl nitrogen determination, after acid digestion converts organic nitrogen to ammonium sulfate, the next step typically involves:","o":["Direct measurement of digest color","Steam distillation of the digest with excess alkali to release ammonia, which is then trapped and titrated to quantify nitrogen","Immediate combustion of the digest","X-ray diffraction of the digest"],"a":1,"e":"After digestion, alkali is added and ammonia is distilled off, trapped in an acid/boric acid solution, and quantified by titration to determine total nitrogen."},{"id":"Q0118","t":"Soil Mineralogy","q":"Among common clay minerals, the lowest cation exchange capacity is generally shown by:","o":["Kaolinite","Vermiculite","Montmorillonite","Smectite"],"a":0,"e":"Kaolinite's 1:1 structure and low isomorphous substitution give it the lowest CEC of common clay minerals."},{"id":"Q0793","t":"Remote Sensing & DSM","q":"A Differential GPS (DGPS) system improves upon standard GPS positioning mainly by:","o":["Reducing signal accuracy intentionally","Using a reference station with a known precise location to correct systematic errors, achieving significantly higher positional accuracy than standard GPS","Eliminating the need for satellites entirely","Working only indoors"],"a":1,"e":"DGPS applies corrections derived from a fixed reference station to reduce common GPS error sources, greatly improving positional accuracy for survey applications."},{"id":"Q0342","t":"Soil Fertility","q":"The 'Soil Health Card' scheme in India is designed to provide farmers with:","o":["Only crop insurance information","Soil test-based nutrient status and fertilizer recommendations for their specific fields","Weather forecasts only","Market price information only"],"a":1,"e":"Soil Health Cards report nutrient status (N, P, K, secondary and micronutrients, pH, EC, organic carbon) with recommended fertilizer doses."},{"id":"Q0111","t":"Soil Mineralogy","q":"The structural unit of kaolinite consists of:","o":["Two tetrahedral sheets and one octahedral sheet","One tetrahedral sheet and one octahedral sheet","Two octahedral sheets only","Three tetrahedral sheets"],"a":1,"e":"Kaolinite's 1:1 layer is one Si-tetrahedral sheet bonded to one Al-octahedral sheet, held by strong hydrogen bonding."},{"id":"Q0450","t":"Manures & Fertilizers","q":"The recommended general practice while applying chemical fertilizer along with biofertilizer seed treatment is to:","o":["Mix biofertilizer directly with concentrated chemical fertilizer for extended contact","Avoid direct, prolonged contact between biofertilizer inoculum and concentrated chemical fertilizers/pesticides, which can harm the live organisms","Always apply biofertilizer only after harvest","Store biofertilizer with fungicide-treated seed for months before use"],"a":1,"e":"High salt concentration and pesticide residues can be toxic to the living microbial inoculum, so direct prolonged contact is avoided."},{"id":"Q0672","t":"Soil Conservation","q":"Land classified in Capability Classes VII and VIII, with severe limitations (e.g., very steep slopes, shallow soils), is generally recommended for:","o":["Intensive row-crop cultivation","Permanent vegetation such as forestry, grazing (limited, Class VII) or wildlife habitat/recreation (Class VIII, generally excluding grazing/forestry too)","High-value irrigated horticulture","Urban and industrial development only"],"a":1,"e":"These classes carry severe or very severe limitations unsuitable for cultivation, best kept under permanent cover for forestry, restricted grazing, or conservation/wildlife use."},{"id":"Q0877","t":"Soil Conservation","q":"Conservation agriculture is generally built around three core interlinked principles: minimum soil disturbance, permanent soil cover, and:","o":["Continuous monocropping of a single species","Crop diversification/rotation","Complete removal of all crop residues","Intensive tillage every season"],"a":1,"e":"Conservation agriculture's three pillars are minimal mechanical soil disturbance, maintaining permanent soil cover (residue/cover crops), and diversified crop rotations."},{"id":"Q0006","t":"Soil Physics","q":"The textural triangle is used to determine soil textural class from the percentages of:","o":["Sand, silt and organic matter","Sand, silt and clay","Clay, gravel and silt","Bulk density, porosity and texture"],"a":1,"e":"The USDA textural triangle plots %sand, %silt and %clay to assign a textural class name."},{"id":"Q0321","t":"Soil Fertility","q":"Iron deficiency chlorosis typically appears first on:","o":["Older, lower leaves","Younger, upper leaves, as interveinal chlorosis","Roots only","Flowers only"],"a":1,"e":"Iron is relatively immobile within the plant, so deficiency symptoms (interveinal yellowing) show up first in new growth."},{"id":"Q0172","t":"Soil Chemistry","q":"The neutralizing value (calcium carbonate equivalent) of a liming material expresses:","o":["Its particle size only","Its acid-neutralizing capacity relative to pure CaCO3","Its nitrogen content","Its solubility in water"],"a":1,"e":"CaCO3 equivalent standardizes different liming materials against pure calcium carbonate as 100%."},{"id":"Q0259","t":"Problem Soils","q":"In the widely used irrigation water classification (US Salinity Laboratory diagram), water quality is classified using:","o":["EC (salinity hazard) and SAR (sodium hazard)","Only pH","Only total dissolved solids","Only temperature"],"a":0,"e":"The USSL diagram plots EC (C1–C4 salinity classes) against SAR (S1–S4 sodium/alkali classes) to rate irrigation water suitability."},{"id":"Q0563","t":"Pedology","q":"'Parent material' in soil formation refers to:","o":["The final mature soil profile","The unconsolidated mineral or organic material from which soil develops through pedogenic processes","Only bedrock that has never weathered","Only transported alluvium"],"a":1,"e":"Parent material is the initial geological/organic substrate (residual or transported) upon which soil-forming processes act."},{"id":"Q0200","t":"Soil Chemistry","q":"Application of elemental sulfur to a calcareous alkaline soil is intended to:","o":["Increase soil pH further","Lower soil pH through microbial oxidation to sulfuric acid","Increase salinity permanently","Increase exchangeable sodium"],"a":1,"e":"Soil bacteria (e.g., Thiobacillus) oxidize elemental S to sulfuric acid, which reacts with lime to lower pH."},{"id":"Q0687","t":"Soil Conservation","q":"Which of the following best explains why vegetative cover is generally considered the single most effective and economical erosion control measure?","o":["Vegetation has no effect on runoff or erosion","Vegetation intercepts rainfall, reduces raindrop impact energy, slows runoff, and binds soil with roots, addressing multiple erosion mechanisms simultaneously and often at lower cost than structural works","Vegetation increases raindrop impact energy","Vegetation is always more expensive than building structural terraces"],"a":1,"e":"By simultaneously reducing rainfall impact, slowing runoff, and physically binding soil, vegetative cover addresses several erosion processes at once, often more cost-effectively than purely structural interventions."},{"id":"Q0410","t":"Manures & Fertilizers","q":"A commonly used carrier material for preparing biofertilizer inoculants is:","o":["Concentrated sulfuric acid","Finely powdered, sterilized lignite or peat/charcoal","Pure sand only","Liquid ammonia"],"a":1,"e":"Lignite, peat or charcoal-based carriers protect and support the living microbial inoculum, aiding shelf life and field application."},{"id":"Q0371","t":"Soil Fertility","q":"'Nutrient budgeting' in a cropping system involves accounting for:","o":["Only the fertilizer applied","All nutrient inputs (fertilizer, manure, atmospheric deposition, fixation) versus outputs (crop removal, losses) over a period","Only crop yield","Only soil color changes"],"a":1,"e":"A nutrient budget compares total inputs against total outputs/removals to assess whether soil fertility is being maintained, built up or depleted."},{"id":"Q0754","t":"General Agriculture & Statistics","q":"A Split-Plot design is particularly useful in agricultural experiments when:","o":["All treatment factors require identical, small experimental unit sizes","Some treatment factors (e.g., irrigation methods) require larger plots than others (e.g., varieties), and different levels of precision are acceptable for different factors","No factorial combination of treatments is being tested","Only a single treatment factor is under study"],"a":1,"e":"Split-plot designs accommodate practical constraints where certain factors (main plot factors) need larger experimental units than others (sub-plot factors), common in irrigation/tillage/variety studies."},{"id":"Q0583","t":"Pedology","q":"An 'argillic horizon', a common diagnostic subsurface horizon, is defined mainly by:","o":["Significant illuvial accumulation of silicate clay compared to the overlying horizon","Accumulation of soluble salts","Presence of permafrost","Cementation by organic matter only"],"a":0,"e":"Argillic horizons show measurable clay increase from illuviation, a key diagnostic feature for orders like Alfisols and Ultisols."},{"id":"Q0100","t":"Soil Mineralogy","q":"Weathering of feldspars in soil ultimately gives rise mainly to:","o":["Quartz grains only","Secondary clay minerals such as kaolinite","Organic matter","Gypsum"],"a":1,"e":"Feldspar hydrolysis releases cations and forms clay minerals, commonly kaolinite under intense weathering."},{"id":"Q0339","t":"Soil Fertility","q":"Neem-coated urea is promoted mainly because the neem coating:","o":["Increases soil salinity","Acts as a nitrification/urease inhibitor, slowing nitrogen transformation and loss, thereby improving N use efficiency","Has no agronomic effect","Converts urea entirely to ammonium sulfate"],"a":1,"e":"Neem oil compounds inhibit urease and nitrifying bacteria activity, slowing urea hydrolysis/nitrification and reducing losses."},{"id":"Q0350","t":"Soil Fertility","q":"Response of a crop to applied phosphorus is generally greater in soils that are:","o":["Already high in available P","Low in available P and/or have high P-fixing capacity","High in organic matter and low in clay","Saline with high soluble P"],"a":1,"e":"Where native available P is low or fixation capacity is high, added P is more likely to produce a significant yield response."},{"id":"Q0615","t":"Pedology","q":"Residual soils, as opposed to transported soils, are those that:","o":["Have formed in place directly from the weathering of the underlying bedrock, with no significant transport of parent material","Have been transported and deposited by wind, water, ice or gravity","Consist entirely of organic material","Occur only in river deltas"],"a":0,"e":"Residual soils develop in situ from weathering of the bedrock beneath them, unlike transported soils formed from material moved from elsewhere."},{"id":"Q0078","t":"Soil Physics","q":"Root penetration into the soil profile is most directly restricted by:","o":["Soil color","High bulk density/compaction","Low CEC","High organic carbon"],"a":1,"e":"Compacted, high-bulk-density layers physically impede root elongation."},{"id":"Q0900","t":"Soil Pollution","q":"Desertification, as addressed by the UNCCD (United Nations Convention to Combat Desertification), refers to:","o":["The natural, permanent expansion of true deserts only, with no human influence","Land degradation in arid, semi-arid and dry sub-humid areas resulting from various factors including climatic variations and human activities","A process that only occurs in already-forested regions","A term unrelated to soil degradation"],"a":1,"e":"Desertification specifically describes land degradation in drylands arising from a combination of climatic and human-induced factors, a focus of the UNCCD framework."},{"id":"Q0280","t":"Problem Soils","q":"Boron toxicity is sometimes an associated problem in reclaiming certain saline soils because:","o":["Boron is always deficient in saline soils","Some saline groundwaters/soils carry excess soluble boron, which is difficult to leach and toxic at low concentrations","Boron has no relation to salinity","Boron only affects sodic soils"],"a":1,"e":"Boron is highly soluble and slow to leach; some saline soils/waters carry enough boron to cause toxicity even as other salts are managed."},{"id":"Q0931","t":"Problem Soils","q":"Iron toxicity in lowland rice, associated with excessive Fe2+ uptake under strongly reducing waterlogged conditions, is often aggravated in soils that are additionally:","o":["Well-drained and calcareous","Acidic, since low pH further increases the solubility of reduced Fe2+ under waterlogged conditions","Extremely alkaline with high free calcium carbonate","Completely free of any iron-bearing minerals"],"a":1,"e":"Acidic soil conditions, combined with the reducing environment of flooding, further increase Fe2+ solubility, exacerbating the risk of iron toxicity in submerged rice."},{"id":"Q0171","t":"Soil Chemistry","q":"The main purpose of liming an acid soil is to:","o":["Increase soil pH and reduce Al/Mn toxicity","Increase soil salinity","Decrease CEC","Decrease base saturation"],"a":0,"e":"Lime neutralizes soil acidity, raising pH and reducing exchangeable Al and Mn to non-toxic levels."},{"id":"Q0403","t":"Manures & Fertilizers","q":"Composting of crop residues and farm waste primarily involves:","o":["Anaerobic digestion for biogas production only","Controlled aerobic microbial decomposition of organic material into a stable, humus-like product","Chemical synthesis of fertilizer","Direct burning of residues"],"a":1,"e":"Composting relies on aerobic microbial breakdown of organic matter under controlled moisture/aeration to produce a stabilized, nutrient-rich product."},{"id":"Q0316","t":"Soil Fertility","q":"Potassium fixation (conversion to a non-exchangeable, less available form) occurs mainly in soils dominated by:","o":["Kaolinite","2:1 clay minerals such as illite and vermiculite","Quartz sand","Organic peat"],"a":1,"e":"K+ ions of appropriate size can become trapped in the collapsed interlayers of illite/vermiculite, becoming largely non-exchangeable."},{"id":"Q0573","t":"Pedology","q":"'Eluviation' in soil profile development refers to:","o":["Accumulation of material within a horizon","The movement of soil material (e.g., clay, sesquioxides) OUT of an upper horizon by percolating water","Only mineral weathering in place","Compaction of soil by machinery"],"a":1,"e":"Eluviation is the removal/washing-out of fine material from a horizon (typically the E horizon), which is then illuviated (deposited) lower in the profile."},{"id":"Q0040","t":"Soil Physics","q":"According to Darcy's law, water flux through soil is directly proportional to:","o":["Soil temperature","The hydraulic gradient","Soil pH","Organic carbon content"],"a":1,"e":"Flux (q) = −K × (hydraulic gradient), where K is hydraulic conductivity."},{"id":"Q0803","t":"Remote Sensing & DSM","q":"A shapefile, a common vector GIS data format, typically stores geographic features along with:","o":["No attribute information at all, only coordinates","An associated attribute table linking each feature to descriptive data (e.g., soil type name, sample ID)","Only raster pixel values","Only satellite orbital parameters"],"a":1,"e":"Shapefiles pair feature geometry with an attribute table, allowing each spatial feature to carry associated descriptive/tabular information."},{"id":"Q0036","t":"Soil Physics","q":"Plant-available water capacity of a soil is calculated as:","o":["Field capacity minus permanent wilting point","Saturation minus field capacity","Field capacity plus wilting point","Total porosity minus bulk density"],"a":0,"e":"Available water capacity (AWC) = water content at field capacity − water content at permanent wilting point."},{"id":"Q0914","t":"Problem Soils","q":"Breeding and selection of salt-tolerant crop varieties is an important complementary strategy in managing salt-affected soils mainly because it:","o":["Eliminates the need for any soil reclamation ever","Allows productive cropping to continue on marginally salt-affected land while other reclamation measures are gradually implemented, or where full reclamation is not economically feasible","Increases soil salinity further","Has no agronomic relevance to salinity management"],"a":1,"e":"Salt-tolerant varieties enable continued productive use of salt-affected land, complementing (not replacing) longer-term reclamation efforts, especially where full reclamation is costly or gradual."},{"id":"Q0351","t":"Soil Fertility","q":"The main agronomic reason for recommending a 'starter dose' of phosphorus at sowing for many crops is to:","o":["Promote early root development when P mobility in soil is low","Replace the need for nitrogen entirely","Increase soil salinity","Reduce germination"],"a":0,"e":"Because P diffuses slowly in soil, placing some P near the seed/root zone at planting helps ensure early uptake for root establishment."},{"id":"Q0096","t":"Soil Physics","q":"A 'perched water table' forms when:","o":["Water accumulates above a less permeable layer, above the main water table","Water rises directly from bedrock","Rainfall is extremely low","Soil is completely saline"],"a":0,"e":"An impeding layer (e.g., a clay pan) can hold a temporary saturated zone above the regional water table."},{"id":"Q0557","t":"Soil Pollution","q":"Which of these is a recognized limitation of phytoremediation as a soil clean-up strategy?","o":["It works instantly, within days","It is generally a slower process than some physical/chemical methods and is limited by plant tolerance, root depth, and the concentration/type of contaminant","It cannot be used for any type of contaminant","It always costs more than excavation and disposal"],"a":1,"e":"Phytoremediation typically takes multiple growing seasons and depends on suitable, tolerant plant species and manageable contaminant levels/depths."},{"id":"Q0574","t":"Pedology","q":"'Illuviation' refers to:","o":["Removal of material from a horizon","The accumulation/deposition of translocated material (e.g., clay, Fe/Al oxides) within a lower horizon, having moved from an overlying horizon","Formation of primary minerals","Volatilization of soil nitrogen"],"a":1,"e":"Illuviation is the deposition, typically in a B horizon, of material (clay, oxides, humus) that eluviated from horizons above."},{"id":"Q0682","t":"Soil Conservation","q":"Zero tillage/conservation tillage practices contribute to erosion control mainly by:","o":["Leaving the soil surface bare and finely pulverized","Retaining crop residue on the soil surface and minimizing soil disturbance, which protects against raindrop impact and improves infiltration","Requiring complete removal of all crop residue","Increasing wind erosion susceptibility"],"a":1,"e":"Reduced disturbance and residue retention protect the surface from raindrop impact/crusting and improve infiltration, both reducing runoff and erosion compared to conventional tillage."},{"id":"Q0818","t":"Analytical Techniques","q":"The Munsell Soil Color Book is used in the field primarily to:","o":["Measure soil pH","Standardize soil color description using consistent hue, value and chroma notations, comparing soil against reference color chips","Measure soil salinity","Measure soil texture"],"a":1,"e":"The Munsell system provides standardized reference color chips (organized by hue, value, chroma) against which soil color is matched and consistently recorded."},{"id":"Q0973","t":"Manures & Fertilizers","q":"Application of well-decomposed organic manures is generally preferred over fresh manure for standing crops mainly because well-decomposed manure:","o":["Contains no nutrients at all","Has undergone stabilization, reducing risks like phytotoxicity, weed seed viability, pathogen load, and nitrogen immobilization associated with fresh material","Always contains higher salt content than fresh manure","Cannot be handled or applied to fields"],"a":1,"e":"Decomposition/composting reduces phytotoxic compounds, weed seed viability, pathogens, and the sharp nitrogen immobilization risk associated with very fresh, undecomposed organic material."},{"id":"Q0899","t":"Soil Pollution","q":"'Land degradation neutrality', a concept promoted internationally (e.g., under the UNCCD), refers to a state where:","o":["All land degradation is considered acceptable with no target","The amount and quality of land resources needed to sustain ecosystem functions is maintained or improved, balancing degradation with restoration/rehabilitation efforts","Land can never be used for any agricultural purpose","Only urban land is considered relevant"],"a":1,"e":"Land degradation neutrality aims to balance ongoing land degradation with equivalent gains through restoration, so the overall land resource base remains stable or improves over time."},{"id":"Q0797","t":"Remote Sensing & DSM","q":"A soil survey conducted at a mapping scale of 1:10,000 to 1:15,000, providing very detailed soil information, would generally be classified as a:","o":["Reconnaissance survey","Detailed (or very detailed) soil survey","Exploratory survey only","Continental-scale survey"],"a":1,"e":"Larger map scales (smaller ratio denominator, e.g., 1:10,000) correspond to more detailed surveys, typically used for intensive farm/project-level planning."},{"id":"Q0854","t":"General Agriculture & Statistics","q":"The acid soils widespread across much of Northeast India, including Assam, are primarily attributed to:","o":["Low rainfall and desert conditions","High rainfall promoting intense leaching of bases, combined with humid subtropical weathering, leaving soils naturally acidic and often low in base saturation","Continuous liming by farmers over centuries","Complete absence of any organic matter"],"a":1,"e":"The very high rainfall of Northeast India drives intense leaching of basic cations, producing widely acidic soils, a defining regional soil fertility management challenge."},{"id":"Q0322","t":"Soil Fertility","q":"Zinc deficiency in crops such as rice and maize is a widespread problem particularly in:","o":["Acid, well-drained sandy soils only","Calcareous, alkaline and sodic soils, and in soils with high available phosphorus","Saline soils exclusively","Soils very high in organic matter only"],"a":1,"e":"High pH and high available P both reduce Zn solubility/uptake, making zinc deficiency common in calcareous/alkaline and heavily-P-fertilized soils."},{"id":"Q0330","t":"Soil Fertility","q":"The Soil Test Crop Response (STCR) approach is used to:","o":["Recommend fertilizer doses based on soil test values, targeted yield, and nutrient requirement per unit yield","Measure only soil pH","Classify soil texture","Estimate only soil salinity"],"a":0,"e":"STCR equations link soil test values and target yield to a fertilizer dose recommendation calibrated through field experiments."},{"id":"Q0254","t":"Problem Soils","q":"Which crop is generally most sensitive to soil salinity, among common field crops?","o":["Barley","Cotton","Beans (common bean)","Sugar beet"],"a":2,"e":"Common beans are among the more salt-sensitive crops; barley, cotton and sugar beet are comparatively tolerant."},{"id":"Q0070","t":"Soil Physics","q":"Subsoiling is a tillage operation carried out mainly to:","o":["Increase bulk density uniformly","Break up compacted layers or hardpans below plough depth","Improve soil color","Reduce organic matter"],"a":1,"e":"Subsoilers use deep tines to fracture compacted zones and restore deep drainage/root penetration."},{"id":"Q0871","t":"Soil Conservation","q":"Agroforestry systems contribute to soil conservation on sloping/marginal lands mainly through:","o":["Complete removal of all tree cover to maximize crop area","Combining trees/shrubs with crops or pasture, providing year-round vegetative cover, root binding, and reduced raindrop impact compared to sole cropping","Increasing bare fallow periods","Eliminating any agricultural income from the land"],"a":1,"e":"Integrating trees with crops/pasture provides more continuous cover, additional root systems, and reduced exposure of bare soil, enhancing conservation on erosion-prone lands."},{"id":"Q0302","t":"Soil Fertility","q":"Nitrification is the biological process by which:","o":["Ammonium is oxidized to nitrite and then nitrate","Nitrate is reduced to N2 gas","Atmospheric N2 is fixed into ammonia","Organic N is mineralized to ammonium"],"a":0,"e":"Nitrifying bacteria (Nitrosomonas, then Nitrobacter) sequentially oxidize NH4+ to NO2- and then to NO3-."}]},{"id":3,"title":"Mock Test 3","questions":[{"id":"Q0521","t":"Soil Pollution","q":"Which of the following heavy metals is particularly associated with 'Itai-itai disease', a historical case of chronic toxicity through contaminated rice consumption?","o":["Lead","Cadmium","Zinc","Manganese"],"a":1,"e":"Itai-itai disease in Japan resulted from chronic cadmium exposure through cadmium-contaminated irrigation water and rice."},{"id":"Q0270","t":"Problem Soils","q":"Green manuring and organic matter addition help in reclamation of sodic soils mainly by:","o":["Increasing exchangeable sodium","Improving soil structure/permeability and providing CO2 that helps dissolve native lime for calcium release","Increasing soil pH further","Preventing any calcium release"],"a":1,"e":"Decomposing organic matter improves aggregation and generates CO2/organic acids that can help mobilize calcium from native carbonates."},{"id":"Q0338","t":"Soil Fertility","q":"Slow/controlled-release fertilizers (e.g., neem-coated or sulfur-coated urea) primarily aim to:","o":["Release nutrients faster than conventional fertilizers","Gradually release nutrients over an extended period, reducing losses and matching crop uptake","Increase volatilization losses","Eliminate the need for any nitrogen application"],"a":1,"e":"Coatings slow the release rate, synchronizing nutrient availability with plant demand and cutting losses."},{"id":"Q0282","t":"Problem Soils","q":"For classification purposes, a soil showing ECe = 2 dS/m and ESP = 25 would be classified as:","o":["Saline soil","Normal soil","Sodic soil","Acid sulfate soil"],"a":2,"e":"Low ECe (<4) with high ESP (>15) fits the definition of a sodic (non-saline alkali) soil."},{"id":"Q0271","t":"Problem Soils","q":"Which measurement is used to directly quantify the sodium hazard of an irrigation water source?","o":["Electrical conductivity alone","Sodium adsorption ratio (SAR)","Soil bulk density","Soil color"],"a":1,"e":"SAR of the irrigation water predicts the extent to which it will promote sodium accumulation on soil exchange sites."},{"id":"Q0223","t":"Soil Chemistry","q":"Which reaction best explains why aluminium becomes increasingly soluble and toxic as soil pH falls below about 5.5?","o":["Aluminium hydroxide precipitates dissolve, releasing Al3+ into solution","Aluminium forms insoluble phosphates","Aluminium volatilizes as a gas","Aluminium is fixed permanently in oxide form"],"a":0,"e":"Al(OH)3 solubility increases sharply at low pH, releasing phytotoxic Al3+/hydroxy-Al species into solution."},{"id":"Q0487","t":"Soil Microbiology","q":"Soil fungi play an essential ecological role, in addition to decomposition and mycorrhizal symbiosis, as:","o":["Primary producers via photosynthesis","Important plant pathogens (e.g., causing root rot, wilt diseases)","Nitrogen-fixing symbionts of legumes exclusively","Exclusive decomposers of only mineral matter"],"a":1,"e":"Beyond beneficial roles, many soil fungi are significant plant pathogens responsible for various root and vascular diseases."},{"id":"Q0045","t":"Soil Physics","q":"Capillary rise of water above a saturated zone is generally greatest in:","o":["Coarse sand","Fine-textured soils with well-connected small pores (up to a limit)","Gravel","Pure quartz sand"],"a":1,"e":"Finer pores exert stronger capillary forces, producing greater rise, though very fine clays may have slow rise rates due to low conductivity."},{"id":"Q0599","t":"Pedology","q":"Ultisols differ from Alfisols mainly in that Ultisols have:","o":["Higher base saturation than Alfisols","Lower base saturation (reflecting more intense, prolonged weathering/leaching) despite both having a clay-enriched (argillic/kandic) horizon","No clay-enriched horizon at all","Perennial permafrost"],"a":1,"e":"Both orders have a clay-accumulation horizon, but Ultisols show lower base saturation due to more intense weathering/leaching, typical of humid subtropical/tropical regions."},{"id":"Q0091","t":"Soil Physics","q":"Consistence of soil refers to its:","o":["Chemical fertility status","Resistance to deformation/rupture at various moisture levels","Microbial diversity","Cation exchange capacity"],"a":1,"e":"Consistence describes how soil behaves mechanically (friable, plastic, hard, etc.) at different water contents."},{"id":"Q0308","t":"Soil Fertility","q":"Blue-green algae (cyanobacteria) used as a biofertilizer for rice fix nitrogen and are notable because they:","o":["Require symbiosis with legume roots","Can photosynthesize and fix atmospheric N2 simultaneously, thriving in flooded rice fields","Only work in acidic upland soils","Cannot survive in standing water"],"a":1,"e":"Cyanobacteria like Anabaena/Nostoc are photosynthetic N2-fixers well adapted to submerged (flooded) rice conditions."},{"id":"Q0474","t":"Soil Microbiology","q":"Humic acid and fulvic acid, both major humic substance fractions, are distinguished mainly by their:","o":["Solubility behaviour in acid and alkali (humic acid insoluble in acid, fulvic acid soluble in both)","Complete insolubility of both under all conditions","Identical molecular weight and color","Absence of any carbon content"],"a":0,"e":"Humic acid precipitates from alkaline extract on acidification, while fulvic acid remains soluble under both acid and alkaline conditions; fulvic acid also has lower molecular weight."},{"id":"Q0766","t":"General Agriculture & Statistics","q":"'Stratified random sampling' improves upon simple random sampling when the population is heterogeneous by:","o":["Ignoring subgroup differences entirely","Dividing the population into relatively homogeneous subgroups (strata) and then sampling randomly within each stratum, often improving precision","Sampling only from one subgroup","Requiring no randomization at all"],"a":1,"e":"By ensuring representation from each relevant subgroup and often reducing within-group variability, stratified sampling can improve estimate precision compared to purely simple random sampling."},{"id":"Q0476","t":"Soil Microbiology","q":"Cellulose decomposition in soil is carried out mainly by:","o":["A wide range of cellulolytic bacteria and fungi possessing cellulase enzymes","Only nitrifying bacteria","Only mycorrhizal fungi","Only protozoa"],"a":0,"e":"Cellulolytic microorganisms (various fungi and bacteria) secrete cellulase enzymes that hydrolyze cellulose into simpler sugars."},{"id":"Q0689","t":"Soil Conservation","q":"Bench terracing, commonly used on steep hill slopes for horticultural/agricultural use, converts a steep slope into:","o":["A series of level or nearly level steps (benches) separated by risers, reducing effective slope and erosion","A single continuous unmodified steep slope","A completely paved surface","A deep single trench along the entire slope"],"a":0,"e":"Bench terraces reshape a steep slope into a stepped series of flatter platforms, substantially reducing effective slope steepness/length and erosion risk while enabling cultivation."},{"id":"Q0503","t":"Soil Microbiology","q":"Which of the following best distinguishes symbiotic nitrogen fixation from associative nitrogen fixation?","o":["Symbiotic fixation involves formation of specialized structures like nodules with an intimate, mutually dependent relationship; associative fixation occurs in looser, non-structural association with roots","Both are structurally and functionally identical","Associative fixation always fixes more nitrogen than symbiotic fixation","Symbiotic fixation never involves legumes"],"a":0,"e":"Symbiotic fixation (e.g., Rhizobium-legume) involves specialized nodule structures, while associative fixation (e.g., Azospirillum with cereal roots) lacks such dedicated organs."},{"id":"Q0962","t":"General Agriculture & Statistics","q":"The term 'heritability', occasionally referenced in crop improvement/breeding-adjacent agricultural research, refers to:","o":["The proportion of total phenotypic variation in a trait attributable to genetic factors, as opposed to environmental factors","The total yield of a crop variety","The soil fertility status of a breeding trial site","The market price of a crop"],"a":0,"e":"Heritability quantifies how much of the observed variability in a trait among individuals is due to genetic differences rather than environmental influences, guiding breeding/selection decisions."},{"id":"Q0836","t":"Analytical Techniques","q":"A conductivity/EC value measured on a soil paste 'saturation extract', as opposed to a fixed soil:water ratio (e.g., 1:2), is preferred for salinity classification mainly because it:","o":["Uses much less soil than other methods","Approximates the soil's actual field moisture condition more closely, providing values directly comparable to established salinity classification thresholds (e.g., USSL criteria)","Cannot be related to any classification system","Requires no water at all"],"a":1,"e":"The saturation extract approximates a soil's natural water content near field capacity, and standard salinity/sodicity classification criteria (like the USSL system) are calibrated to this specific extract method."},{"id":"Q0058","t":"Soil Physics","q":"Plasticity index (PI) is calculated as:","o":["Liquid limit − Plastic limit","Plastic limit − Liquid limit","Liquid limit + Plastic limit","Field capacity − Wilting point"],"a":0,"e":"PI = LL − PL, and represents the water-content range over which soil behaves plastically."},{"id":"Q0958","t":"General Agriculture & Statistics","q":"India's National Agricultural Research System (NARS) broadly comprises which key institutional components?","o":["Only private seed companies, with no government institutions","ICAR and its institutes, State Agricultural Universities, and other affiliated research/education bodies working in a coordinated national framework","Only international organizations, with no domestic institutions","Only village-level cooperative societies"],"a":1,"e":"NARS integrates ICAR's central research institutes with State Agricultural Universities and related bodies, forming India's coordinated national agricultural research and education framework."},{"id":"Q0122","t":"Soil Mineralogy","q":"Kaolinite has a comparatively low specific surface area mainly because:","o":["Its 1:1 layers are tightly hydrogen-bonded, preventing interlayer expansion","It has no tetrahedral sheet","It dissolves readily in water","It is a primary mineral"],"a":0,"e":"Strong hydrogen bonding between 1:1 layers in kaolinite keeps layers stacked tightly, exposing only external surfaces."},{"id":"Q0828","t":"Analytical Techniques","q":"A soil penetrometer is a field instrument primarily used to assess:","o":["Soil color","Soil mechanical resistance/compaction (penetration resistance) at various depths","Soil salinity","Soil organic carbon content"],"a":1,"e":"Penetrometers measure the force required to push a probe into the soil, providing an index of soil compaction/mechanical resistance with depth."},{"id":"Q0946","t":"Analytical Techniques","q":"An acid-base titration used to determine total (titratable) soil acidity would typically use which type of standard titrant?","o":["A standardized acid solution, such as HCl","A standardized base solution, such as NaOH, to neutralize the acidity present","A metal salt solution with no acid-base property","Pure distilled water only"],"a":1,"e":"Because the goal is to neutralize acidity, a standardized base (e.g., NaOH) is titrated into the sample until the acidity is fully neutralized, as indicated by an endpoint."},{"id":"Q0806","t":"Remote Sensing & DSM","q":"A key limitation of optical satellite remote sensing, not shared by radar (microwave) sensing, is that optical sensors:","o":["Cannot detect vegetation at all","Cannot see through cloud cover, since they rely on reflected sunlight in visible/infrared wavelengths","Work equally well day and night with no difference","Have unlimited spatial resolution"],"a":1,"e":"Because optical sensors depend on sunlight reflectance, thick cloud cover blocks the signal, unlike microwave sensors that can penetrate clouds."},{"id":"Q0616","t":"Pedology","q":"Alluvial soils are formed from parent material transported and deposited primarily by:","o":["Wind","Rivers/flowing water","Glacial ice","Volcanic eruption"],"a":1,"e":"Alluvial soils develop on sediments deposited by river/stream action, common in floodplains and deltas."},{"id":"Q0952","t":"Analytical Techniques","q":"Use of a certified reference material (CRM) with a known, certified property value in a soil testing laboratory is important mainly to:","o":["Replace the need for any sample analysis at all","Verify the accuracy of the laboratory's analytical method/instrument by comparing measured results against the CRM's certified true value","Only measure soil color","Eliminate the need for any calibration curve"],"a":1,"e":"CRMs provide an independently verified 'true value' benchmark against which a lab's measured results can be checked, confirming method/instrument accuracy."},{"id":"Q0397","t":"Soil Fertility","q":"Which best explains why organic matter decomposition rate, and hence nutrient mineralization, is generally faster in warm, moist, well-aerated soils?","o":["Microbial activity driving decomposition is favoured by warmth, adequate moisture and oxygen availability","Cold, dry, waterlogged soils always decompose organic matter fastest","Decomposition rate is unrelated to soil conditions","Decomposition only occurs in the absence of oxygen"],"a":0,"e":"Optimal temperature, moisture and aeration support high microbial activity, accelerating organic matter breakdown and nutrient release."},{"id":"Q0174","t":"Soil Chemistry","q":"Dolomitic limestone is preferred over calcitic limestone on soils that are additionally deficient in:","o":["Nitrogen","Magnesium","Potassium","Sulfur"],"a":1,"e":"Dolomite [CaMg(CO3)2] supplies both calcium and magnesium, correcting Mg deficiency along with acidity."},{"id":"Q0434","t":"Manures & Fertilizers","q":"Fertilizer granulation (as in DAP, complex NPK fertilizers) is primarily done to:","o":["Reduce nutrient content","Improve handling, uniform application, and reduce dust/caking during storage and use","Make the fertilizer unusable in soil","Convert it into a liquid form"],"a":1,"e":"Granulation produces uniform particle size for easier, more even mechanical application and better storage/handling characteristics."},{"id":"Q0771","t":"General Agriculture & Statistics","q":"A cropping intensity greater than 100% for a given piece of land indicates that:","o":["The land is left completely fallow every year","More than one crop is harvested from the same land within a single agricultural year","The land is used only once every two years","The land is entirely unproductive"],"a":1,"e":"Cropping intensity = (gross cropped area / net sown area) × 100; a value above 100% reflects multiple cropping (more than one crop harvested annually) on the same land."},{"id":"Q0001","t":"Soil Physics","q":"As per the USDA system, the sand fraction includes particles in the size range:","o":["0.002–0.05 mm","0.05–2.0 mm","2.0–4.75 mm",">4.75 mm"],"a":1,"e":"USDA classifies sand as 0.05–2.0 mm, silt as 0.002–0.05 mm, and clay as <0.002 mm."},{"id":"Q0928","t":"Problem Soils","q":"Which best describes 'residual alkalinity' concerns when irrigation water high in bicarbonate is used over the long term, even where initial soil sodicity is low?","o":["Bicarbonate has no long-term effect on soil sodium status","Repeated precipitation of calcium/magnesium as carbonates from bicarbonate-rich water progressively concentrates sodium in solution relative to calcium/magnesium, gradually raising the effective sodium hazard (as reflected by adjusted SAR)","Bicarbonate immediately eliminates all soil sodium","Bicarbonate only affects soil texture, not sodicity"],"a":1,"e":"As Ca/Mg precipitate out of bicarbonate-rich water upon concentration/evaporation, the relative proportion of sodium in solution rises, increasing the effective long-term sodium/alkali hazard even if initial water SAR seems moderate."},{"id":"Q0151","t":"Soil Mineralogy","q":"The silica-to-sesquioxide (SiO2:R2O3) ratio in soil clays is used as an index of:","o":["Soil salinity","Degree of weathering/soil development","Soil temperature regime","Soil texture only"],"a":1,"e":"A lower silica:sesquioxide ratio reflects more advanced desilication and hence more intense weathering."},{"id":"Q0025","t":"Soil Physics","q":"'Single grain' and 'massive' are terms used to describe soils that are:","o":["Highly aggregated","Structureless","Rich in humus","Strongly granular"],"a":1,"e":"Single-grain (loose sand) and massive (coherent clay mass) describe soils lacking developed structure."},{"id":"Q0289","t":"Problem Soils","q":"For reliable classification of a soil as saline, sodic or saline-sodic, samples are conventionally analysed using the:","o":["Air-dry soil extract at any dilution","Saturation paste extract (ECe, SAR of the extract) and exchangeable sodium percentage","Only soil color chart","Only bulk density measurement"],"a":1,"e":"The standard USSL protocol uses the saturation paste extract for ECe/SAR along with exchangeable cation analysis for ESP."},{"id":"Q0855","t":"General Agriculture & Statistics","q":"The National Bureau of Soil Survey and Land Use Planning (NBSS&LUP), an ICAR institute, is primarily responsible for:","o":["Only marketing agricultural produce","Soil survey, soil resource mapping, and land use planning research at the national level in India","Only crop breeding research","Only weather forecasting"],"a":1,"e":"NBSS&LUP is India's premier institute dedicated to soil survey, soil resource inventory, and land use planning research and mapping."},{"id":"Q0188","t":"Soil Chemistry","q":"Synthetic chelates such as EDTA are agriculturally used mainly to:","o":["Increase soil salinity","Supply micronutrients (e.g., Fe, Zn) in plant-available chelated form","Neutralize soil acidity","Reduce cation exchange capacity"],"a":1,"e":"Chelated micronutrient fertilizers (e.g., Fe-EDTA, Zn-EDTA) remain soluble and available across a wider pH range."},{"id":"Q0293","t":"Soil Fertility","q":"Which of the following is classified as a micronutrient (required in very small amounts)?","o":["Nitrogen","Zinc","Potassium","Sulfur"],"a":1,"e":"Zinc is one of the essential micronutrients, needed by plants in only trace quantities."},{"id":"Q0533","t":"Soil Pollution","q":"'Hyperaccumulator' plants, important for phytoextraction, are characterized by their ability to:","o":["Exclude all metals from uptake","Accumulate unusually high concentrations of specific metals in their tissues without severe toxicity symptoms, far exceeding normal plant levels","Grow only in metal-free soils","Die immediately upon any metal exposure"],"a":1,"e":"Hyperaccumulators tolerate and concentrate specific metals at levels many times higher than typical plants, making them valuable for phytoextraction."},{"id":"Q0630","t":"Pedology","q":"A key reason Soil Taxonomy relies heavily on measurable, quantitative diagnostic horizons and properties rather than genetic (process-based) criteria alone is to:","o":["Make classification entirely subjective","Provide an objective, reproducible basis for classifying soils that can be consistently applied by different surveyors","Eliminate the need for any field observation","Restrict use of the system to a single country"],"a":1,"e":"Quantitative diagnostic criteria increase consistency and reproducibility of classification across different surveyors, regions and time periods."},{"id":"Q0032","t":"Soil Physics","q":"Matric potential in soil arises mainly from:","o":["Dissolved salts","Capillary and adsorptive (surface) forces","Atmospheric pressure","Gravity alone"],"a":1,"e":"Matric potential reflects the attraction of water to soil particle surfaces and capillary pores."},{"id":"Q0416","t":"Manures & Fertilizers","q":"Single superphosphate (SSP) supplies approximately what percentage of P2O5, along with useful amounts of sulfur and calcium?","o":["10%","16%","46%","60%"],"a":1,"e":"SSP is conventionally about 16% P2O5, and additionally supplies calcium and sulfur (as gypsum) beneficial for many crops."},{"id":"Q0713","t":"Remote Sensing & DSM","q":"Machine learning algorithms such as random forest and support vector machines are increasingly applied in digital soil mapping mainly to:","o":["Replace the need for any field soil sampling entirely","Build predictive models relating soil properties/classes to environmental covariates, enabling spatial prediction across unsampled locations","Only visualize soil maps with no predictive capability","Measure soil pH directly in the lab"],"a":1,"e":"Machine learning methods learn complex, often non-linear relationships between soil observations and covariates (terrain, climate, spectral data), enabling robust spatial prediction."},{"id":"Q0805","t":"Remote Sensing & DSM","q":"Remote sensing-based crop yield estimation models commonly use vegetation indices (like NDVI) as inputs mainly because these indices:","o":["Directly measure grain yield with no further modeling required","Correlate with crop biomass/vigor through the growing season, providing useful predictor variables for statistical or crop-growth-model-based yield estimation","Have no relationship to crop growth at all","Only work for forest ecosystems"],"a":1,"e":"Vegetation indices track crop growth/vigor patterns that, combined with modeling approaches, can be related to expected yield, though not a direct yield measurement themselves."},{"id":"Q0977","t":"Manures & Fertilizers","q":"Which of the following best describes the agronomic rationale for applying biofertilizers together with a reduced (rather than full) dose of chemical fertilizer, as often recommended in INM programs?","o":["Biofertilizers work only when no chemical fertilizer is used at all","Biofertilizers can supplement biological nutrient supply, allowing a reduction in chemical fertilizer dose while maintaining comparable yield and improving overall input efficiency and sustainability","Biofertilizers always require a higher chemical fertilizer dose than normal","There is no established agronomic basis for combining biofertilizers with reduced fertilizer doses"],"a":1,"e":"Well-designed INM trials often show that biofertilizer use can substitute for part of the chemical fertilizer requirement while sustaining yield, improving overall efficiency and reducing chemical input dependency."},{"id":"Q0537","t":"Soil Pollution","q":"Pesticide 'persistence' in soil refers to:","o":["The time a pesticide remains active/undegraded in the soil environment","The rate at which a pesticide volatilizes immediately after application","The solubility of a pesticide in water","The toxicity of a pesticide to target pests only"],"a":0,"e":"Persistence describes how long a pesticide (or its residues) remains in the soil before being degraded, indicating potential for accumulation."},{"id":"Q0352","t":"Soil Fertility","q":"'Luxury consumption' of a nutrient by a crop refers to:","o":["Uptake of a nutrient in amounts beyond what is needed for maximum yield, without further yield increase","Complete absence of nutrient uptake","A deficiency symptom","A toxicity symptom only"],"a":0,"e":"Some crops absorb nutrients like K beyond the amount needed for maximum yield when supply is abundant, a phenomenon called luxury consumption."},{"id":"Q0384","t":"Soil Fertility","q":"The 'Mitscherlich equation' and the 'quadratic response' model are both examples of:","o":["Soil classification systems","Mathematical models used to describe crop yield response to nutrient dose","Methods for measuring soil pH","Water quality indices"],"a":1,"e":"Both are curve-fitting models commonly used in agronomy to describe and predict yield response to increasing nutrient application."},{"id":"Q0648","t":"Soil Conservation","q":"Sheet erosion is characterized by:","o":["Formation of large, deep channels visible in the field","Fairly uniform removal of a thin layer of surface soil over an area, often not immediately obvious","Removal of soil only through wind action","Deposition of soil only, with no removal"],"a":1,"e":"Sheet erosion removes a relatively even thin layer of topsoil across a slope, often going unnoticed until productivity decline or subtle signs appear."},{"id":"Q0396","t":"Soil Fertility","q":"Green Seeker and similar optical sensors used in precision agriculture estimate crop nitrogen status based on:","o":["Soil color","Reflectance of crop canopy in specific light wavelengths (e.g., NDVI), correlated with crop nitrogen/biomass status","Soil pH","Direct chemical extraction of leaf tissue"],"a":1,"e":"Canopy reflectance-based vegetation indices (like NDVI) are correlated with crop vigor/nitrogen status to guide variable-rate N application."},{"id":"Q0658","t":"Soil Conservation","q":"Contour farming, as an erosion control practice, involves:","o":["Ploughing and planting up and down the slope","Conducting tillage and planting operations along the natural contour lines of the land, roughly perpendicular to the slope direction","Removing all vegetation from the field","Only applicable on completely flat land"],"a":1,"e":"Contour operations create small ridges/furrows across the slope that slow runoff and reduce erosion, unlike up-and-down slope farming which channels water directly downhill."},{"id":"Q0440","t":"Manures & Fertilizers","q":"Poultry manure, compared with cattle FYM, generally has:","o":["Lower nutrient concentration, especially nitrogen","Higher nutrient concentration, especially nitrogen and phosphorus, per unit weight","Identical nutrient content to FYM","No nitrogen content at all"],"a":1,"e":"Poultry manure is typically richer in N and P per unit weight than cattle FYM, owing to differences in animal diet and excreta composition."},{"id":"Q0365","t":"Soil Fertility","q":"The concept of a nutrient 'omission plot' trial in soil fertility research is used to:","o":["Determine the yield contribution and limiting status of individual nutrients by comparing plots lacking one nutrient against a complete treatment","Only measure soil color","Test irrigation scheduling","Assess crop variety performance only"],"a":0,"e":"Omission plots (leaving out N, or P, or K, etc., from an otherwise complete fertilizer treatment) reveal which nutrient(s) most limit yield at a site."},{"id":"Q0586","t":"Pedology","q":"A 'natric horizon' is essentially an argillic horizon that additionally shows:","o":["High organic matter only","Prismatic/columnar structure and high exchangeable sodium percentage (typically ESP > 15)","Complete absence of clay","Permafrost conditions"],"a":1,"e":"Natric horizons are argillic horizons with the added diagnostic feature of high sodium saturation, associated with the characteristic sodic prismatic/columnar structure."},{"id":"Q0647","t":"Pedology","q":"A soil survey report typically includes information useful for land-use planning such as:","o":["Only the names of nearby villages","Soil map units, their properties, interpretations for various uses (agriculture, engineering), and management limitations/recommendations","Only historical crop prices","Only the geological age of bedrock"],"a":1,"e":"Soil survey reports translate mapped soil information into practical interpretations and recommendations relevant to diverse land-use decisions."},{"id":"Q0029","t":"Soil Physics","q":"Which exchangeable cation, when dominant, promotes dispersion of clay particles?","o":["Calcium","Magnesium","Sodium","Aluminium"],"a":2,"e":"High exchangeable sodium disrupts the diffuse double layer, causing clay dispersion and structural breakdown."},{"id":"Q0113","t":"Soil Mineralogy","q":"Illite is best described as a:","o":["1:1 clay mineral with high CEC","Non-expanding 2:1 clay mineral with potassium fixed between layers","Non-crystalline aluminosilicate","Iron oxide mineral"],"a":1,"e":"Illite (a mica-like clay) has K+ ions strongly held between 2:1 layers, preventing expansion."},{"id":"Q0598","t":"Pedology","q":"Alfisols are generally characterized by:","o":["An argillic (or similar clay-enriched) horizon with moderate to high base saturation, typically found under forest vegetation in humid to sub-humid regions","An oxic horizon with very low base saturation","A histic (organic) surface horizon","Perennial aridity"],"a":0,"e":"Alfisols have a clay-enriched (argillic/kandic) subsoil horizon and relatively high base saturation, distinguishing them from the more weathered, less fertile Ultisols."},{"id":"Q0148","t":"Soil Mineralogy","q":"Halloysite differs from kaolinite mainly in that halloysite:","o":["Is a 2:1 clay mineral","Commonly occurs in a hydrated, tubular morphology","Has no aluminium in its structure","Forms only in deserts"],"a":1,"e":"Halloysite is chemically similar to kaolinite (1:1 structure) but often occurs as hydrated tubes/rolls rather than platy crystals."},{"id":"Q0990","t":"Analytical Techniques","q":"A key reason for expressing soil test results on an 'oven-dry soil basis' rather than an 'as-received (moist) basis' is to:","o":["Introduce inconsistency between samples with different moisture content","Provide a consistent, comparable basis for reporting results across samples that may have differing initial moisture content at the time of sampling","Eliminate the need for weighing samples","Increase reported nutrient values artificially"],"a":1,"e":"Expressing values per unit oven-dry mass removes the confounding effect of variable sample moisture content, ensuring results are comparable across different samples/times."},{"id":"Q0132","t":"Soil Mineralogy","q":"The characteristic red color of many well-drained tropical and subtropical soils is mainly due to:","o":["Hematite","Goethite","Gypsum","Calcite"],"a":0,"e":"Hematite crystals, even in small amounts, strongly impart a red hue to soil."},{"id":"Q0921","t":"Problem Soils","q":"Phytoremediation approaches specifically applied to salt-affected soils generally rely on:","o":["Salt-tolerant or halophytic plants that can take up and help remove salts (particularly sodium) from the root zone over successive growing cycles, complementing chemical/leaching methods","Only salt-sensitive ornamental plants","Complete avoidance of any plant-based approach","Immediate, one-season complete desalinization with no repeated cycles needed"],"a":0,"e":"Salt-tolerant/halophytic species can extract and remove some salts from soil over repeated growing cycles, offering a biological complement to conventional chemical amendment and leaching approaches."},{"id":"Q0738","t":"Analytical Techniques","q":"A CHN(S) elemental analyzer is used to directly determine, via combustion, the:","o":["Total carbon, hydrogen, nitrogen (and sometimes sulfur) content of a sample","Soil texture class","Soil bulk density","Soil color"],"a":0,"e":"CHN(S) analyzers combust a sample and measure resulting gases to quantify total elemental carbon, hydrogen, nitrogen and sulfur content directly."},{"id":"Q0346","t":"Soil Fertility","q":"A major reason legume-based cropping systems/rotations help sustain soil nitrogen fertility is:","o":["Legumes deplete soil nitrogen faster than cereals","Symbiotic Rhizobium in legume root nodules fixes atmospheric N2, part of which can benefit the following crop","Legumes require no nitrogen at all","Legumes convert nitrate to N2 gas"],"a":1,"e":"Biologically fixed N accumulated in legume nodules/residues contributes to soil N supply for subsequent crops."},{"id":"Q0087","t":"Soil Physics","q":"For bulk density determination in stony or gravelly soils, the preferred method is:","o":["The standard core (cylinder) method","The excavation (sand-replacement) method","The pipette method","The hydrometer method"],"a":1,"e":"Where cores cannot be driven cleanly due to stones, the excavation/sand-replacement method measures the volume of the irregular hole directly."},{"id":"Q0635","t":"Pedology","q":"Which factor most directly explains why arid-region soils commonly retain more unweathered primary minerals than humid-region soils of similar age?","o":["Arid soils experience more intense chemical weathering","Limited water availability in arid climates slows chemical weathering reactions, preserving more primary minerals compared to humid climates","Arid soils have no primary minerals to begin with","Primary minerals are unaffected by climate"],"a":1,"e":"Chemical weathering reactions require water; the scarcity of moisture in arid climates slows mineral breakdown, preserving more primary minerals than in humid regions."},{"id":"Q0651","t":"Soil Conservation","q":"Splash erosion is the initial stage of water erosion caused primarily by:","o":["Wind action alone","The direct impact of raindrops on bare soil, detaching soil particles","Deep percolation of water","Root growth"],"a":1,"e":"Raindrop impact on unprotected soil dislodges and disperses particles, marking the first stage in the water erosion process, preceding sheet/rill/gully stages."},{"id":"Q0456","t":"Manures & Fertilizers","q":"Which practice best exemplifies the Integrated Nutrient Management approach for a cereal-legume cropping system?","o":["Applying only chemical N fertilizer to both crops every season","Combining recommended fertilizer doses with FYM/compost, biofertilizer inoculation of the legume, and residue incorporation across the rotation","Relying solely on residue burning between crops","Avoiding all nutrient inputs to save cost"],"a":1,"e":"An INM approach draws on multiple complementary nutrient sources (inorganic, organic, biological) across the rotation rather than a single input."},{"id":"Q0226","t":"Soil Chemistry","q":"Total acidity of a soil, as opposed to exchangeable acidity, additionally includes:","o":["Only free H+ in solution","Non-exchangeable ('residual') acidity locked within clay/organic structures","Only soluble salts","Only carbonate alkalinity"],"a":1,"e":"Total (potential) acidity encompasses active, exchangeable and residual (structural) acidity components."},{"id":"Q0442","t":"Manures & Fertilizers","q":"A major reason for recommending fresh biofertilizer inoculants within their shelf life, and avoiding exposure to high temperature or sunlight, is that:","o":["Biofertilizers contain living organisms whose viability declines with age and adverse storage conditions","Biofertilizers are entirely chemical and unaffected by storage","Storage conditions have no effect on efficacy","Biofertilizers improve with age indefinitely"],"a":0,"e":"Since biofertilizers carry live microbial populations, poor storage or expiry reduces the number of viable organisms and hence effectiveness."},{"id":"Q0311","t":"Soil Fertility","q":"The dominant form of phosphorus taken up by plant roots from soil solution is:","o":["H2PO4- and HPO4^2- (orthophosphate ions)","Elemental phosphorus","PO4^3- exclusively at all pH","Organic phytate directly"],"a":0,"e":"Depending on soil pH, plants absorb phosphate mainly as the monovalent (H2PO4-) or divalent (HPO4^2-) orthophosphate ion."},{"id":"Q0549","t":"Soil Pollution","q":"'Vermiremediation' refers to the use of:","o":["Chemical oxidants for pollutant breakdown","Earthworms to help degrade/transform organic pollutants and improve contaminated soil properties","Only bacteria, with no role for soil fauna","Heavy machinery for soil excavation"],"a":1,"e":"Earthworms can enhance microbial activity, aeration, and organic matter turnover, contributing to degradation/detoxification of certain contaminants."},{"id":"Q0703","t":"Remote Sensing & DSM","q":"The SCORPAN framework, widely used in digital soil mapping, extends Jenny's classical soil-forming factors by adding which factor as an explicit predictor?","o":["Spatial position (n), in addition to soil (S), climate (C), organisms (O), relief (R), parent material (P) and age (A)","Only crop type","Only market price of land","Only irrigation source"],"a":0,"e":"SCORPAN reformulates soil-forming factors as spatially explicit predictors, adding spatial position (n) and treating existing soil information (S) as a predictor for mapping unmeasured properties/classes."},{"id":"Q0881","t":"Soil Conservation","q":"'Biodrainage', an alternative/complementary approach to conventional engineering drainage, uses:","o":["Deep-rooted, high-water-use trees (e.g., eucalyptus) to help lower a shallow water table by transpiring large volumes of water","Only concrete drainage channels","Only chemical amendments","Only mechanical pumps with no vegetation involved"],"a":0,"e":"Biodrainage employs fast-growing, deep-rooted, water-demanding tree species to draw down shallow water tables through transpiration, complementing or substituting for engineered drainage in some settings."},{"id":"Q0180","t":"Soil Chemistry","q":"Redox potential (Eh) of soil measures:","o":["The soil's tendency to donate or accept electrons (oxidizing/reducing intensity)","Soil salinity","Soil pH directly","Soil water retention"],"a":0,"e":"Eh, measured in millivolts, indicates whether soil conditions are oxidizing (high Eh) or reducing (low Eh)."},{"id":"Q0999","t":"General Agriculture & Statistics","q":"Alluvial soils of the Brahmaputra valley in Assam are generally characterized, relative to older Gangetic alluvium, by:","o":["Extremely old, highly weathered profiles with an oxic horizon","Relatively young, less weathered, fertile soils with ongoing sediment deposition and generally good natural fertility, though often acidic in reaction due to high regional rainfall","Complete absence of any river-deposited material","Permanently frozen conditions"],"a":1,"e":"Brahmaputra valley alluvium is relatively young and fertile, being continually replenished by fresh sediment, though the region's very high rainfall commonly imparts an acidic soil reaction."},{"id":"Q0114","t":"Soil Mineralogy","q":"Vermiculite is characterized as a:","o":["1:1 clay mineral with very low CEC","2:1 clay mineral with moderate expansion and high CEC","A primary silicate mineral","An amorphous aluminosilicate"],"a":1,"e":"Vermiculite is a 2:1 clay with hydrated interlayer cations, giving moderate expansion and very high CEC."},{"id":"Q0229","t":"Soil Chemistry","q":"Adsorbed (exchangeable) potassium in soil is generally considered:","o":["Completely unavailable to plants","More readily available than fixed (non-exchangeable) interlayer potassium","Less available than solution potassium but part of a dynamic equilibrium with it","Identical in availability to mineral (structural) K"],"a":2,"e":"Exchangeable K is in dynamic equilibrium with solution K, replenishing it as plants take up K, but is less immediately available than solution K itself."},{"id":"Q0089","t":"Soil Physics","q":"An 'ideal' agricultural soil is often said to have approximate volume proportions of solids, water and air of:","o":["90% solids, 5% water, 5% air","50% solids, 25% water, 25% air","10% solids, 45% water, 45% air","70% solids, 15% water, 15% air"],"a":1,"e":"A commonly cited ideal composition is about 50% solid space and 50% pore space, with pore space roughly split between water and air."},{"id":"Q0631","t":"Pedology","q":"Which of the following diagnostic subsurface horizons is specifically associated with accumulation of gypsum (calcium sulfate)?","o":["Argillic horizon","Gypsic horizon","Spodic horizon","Oxic horizon"],"a":1,"e":"A gypsic horizon shows significant secondary accumulation of gypsum, common in some Aridisols of gypsum-rich arid regions."},{"id":"Q0222","t":"Soil Chemistry","q":"The dominant exchangeable cation in most non-saline, non-sodic agricultural soils of humid-to-subhumid regions is typically:","o":["Sodium","Calcium","Aluminium","Potassium"],"a":1,"e":"In most well-drained, non-saline soils, calcium usually dominates the exchange complex among basic cations."},{"id":"Q0920","t":"Problem Soils","q":"A key long-term risk of continuous canal irrigation in poorly drained command areas, if not managed with adequate drainage, is:","o":["Permanent lowering of the water table with no salinity risk","Progressive rise of the water table leading to waterlogging and secondary soil salinization over time","Complete prevention of any salt accumulation","Immediate improvement in soil structure with no other effects"],"a":1,"e":"Without adequate drainage, continuous irrigation can raise the water table, promoting waterlogging and, through capillary rise and evaporation, secondary salinization over successive irrigation seasons."},{"id":"Q0959","t":"General Agriculture & Statistics","q":"Desert soils of India, found predominantly in western Rajasthan and adjoining areas, are generally characterized by:","o":["High organic matter and excellent natural fertility","Coarse texture, low organic matter, low moisture retention, and often calcium carbonate accumulation, reflecting arid climatic conditions","Perennial waterlogging","Dominance of expanding montmorillonite clay causing deep cracking"],"a":1,"e":"Desert (Aridisol-type) soils of India's arid west typically show coarse texture, low organic matter and moisture-holding capacity, and often calcareous subsoil layers, consistent with the region's arid climate."},{"id":"Q0532","t":"Soil Pollution","q":"'Rhizofiltration', a phytoremediation approach mainly applied to contaminated water, involves:","o":["Absorption/adsorption of contaminants by plant roots from water passing through the root zone","Volatilization of contaminants from leaves","Direct chemical incineration of pollutants","Physical filtration through sand alone"],"a":0,"e":"Rhizofiltration uses root systems (often of plants grown hydroponically) to absorb/adsorb and concentrate contaminants from water."},{"id":"Q0717","t":"Remote Sensing & DSM","q":"'Temporal resolution' of a satellite remote sensing system refers to:","o":["The spectral range covered by the sensor","How frequently the satellite revisits and images the same location on Earth","The ground area represented by one pixel","The number of bits used to record brightness values"],"a":1,"e":"Temporal resolution (revisit time) indicates how often repeat imagery of the same area becomes available, important for monitoring dynamic processes like crop growth."},{"id":"Q0740","t":"Analytical Techniques","q":"A composite soil sample, commonly used for routine soil fertility testing of a field, is prepared by:","o":["Taking a single sample from just one spot in the field","Thoroughly mixing several individual sub-samples collected from multiple representative spots across a uniform field/area into one composite sample","Using only subsoil, ignoring surface soil","Collecting a sample only from the field boundary"],"a":1,"e":"Compositing multiple sub-samples from across a representative area reduces the effect of local spatial variability, giving a more reliable overall estimate of field fertility status."},{"id":"Q0691","t":"Remote Sensing & DSM","q":"The electromagnetic spectrum region most commonly used in optical remote sensing of vegetation and soil includes:","o":["Only gamma rays","Visible, near-infrared and shortwave infrared regions","Only radio waves","Only X-rays"],"a":1,"e":"Visible through shortwave infrared wavelengths carry most of the useful reflectance information for vegetation and soil remote sensing."},{"id":"Q0668","t":"Soil Conservation","q":"Watershed management follows a 'ridge to valley' approach mainly because it:","o":["Starts conservation treatment from the lower valley areas first, ignoring upper areas","Prioritizes treating the upper catchment/ridge areas first to control runoff and erosion at the source, before treating lower valley areas","Focuses exclusively on downstream irrigation infrastructure","Is unrelated to erosion control sequencing"],"a":1,"e":"Treating upper slopes/ridges first reduces the volume and velocity of runoff reaching lower areas, making downstream conservation measures more effective and sustainable."},{"id":"Q0699","t":"Remote Sensing & DSM","q":"In GIS, 'vector' data format represents spatial features primarily as:","o":["A regular grid of pixels","Discrete points, lines and polygons defined by coordinate geometry","Only continuous surfaces with no discrete boundaries","Audio signal data"],"a":1,"e":"Vector format stores discrete features (e.g., a soil sampling point, a field boundary, a river) using coordinate-based geometric objects."},{"id":"Q0554","t":"Soil Pollution","q":"Soil salinization arising from long-term use of poor-quality (saline) groundwater for irrigation is best classified as a form of:","o":["Biological pollution","Chemical/physical soil degradation due to salt accumulation","Radioactive contamination","Pathogen contamination"],"a":1,"e":"Progressive salt buildup from saline irrigation water is a chemical/physical degradation process affecting soil fertility and structure, distinct from biological or radioactive contaminat
