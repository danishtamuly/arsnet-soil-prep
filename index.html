ion."},{"id":"Q0888","t":"Soil Conservation","q":"Compared to structural (engineering) conservation measures, agronomic (biological) conservation measures are generally:","o":["Always more expensive to establish and maintain","Often more economical to establish and maintain, though sometimes less immediately effective on very steep or severely eroded land where structural support is needed","Completely ineffective for erosion control","Applicable only to non-agricultural land"],"a":1,"e":"Agronomic measures (cropping/vegetation-based) are generally lower-cost and easier to maintain than structural works, though very steep or badly eroded sites often need structural support as well."},{"id":"Q0297","t":"Soil Fertility","q":"Mitscherlich's 'Law of Diminishing Returns' describes how crop yield responds to increasing doses of a limiting nutrient by:","o":["Increasing linearly without limit","Increasing at a progressively decreasing rate as the dose approaches a maximum yield","Decreasing continuously from the first increment","Remaining completely constant regardless of dose"],"a":1,"e":"Each additional unit of a limiting nutrient produces a smaller yield increase as the crop approaches its yield potential."},{"id":"Q0125","t":"Soil Mineralogy","q":"The interlayer cation characteristically fixed (largely non-exchangeable) in illite is:","o":["Calcium","Potassium","Sodium","Magnesium"],"a":1,"e":"K+ fits tightly into illite's interlayer space, becoming strongly (though not completely) fixed."},{"id":"Q0497","t":"Soil Microbiology","q":"Soil microbial ecology considers 'r-strategist' and 'K-strategist' microorganisms; r-strategists are generally characterized by:","o":["Slow growth on recalcitrant substrates with low nutrient availability","Rapid growth and reproduction, thriving on readily available, easily decomposable substrates","No response to substrate addition","Only anaerobic metabolism"],"a":1,"e":"r-strategist (copiotrophic) microbes rapidly exploit fresh, easily degradable organic inputs, in contrast to slower-growing K-strategist (oligotrophic) organisms."},{"id":"Q0452","t":"Manures & Fertilizers","q":"'Nutrient recycling' through organic manures in a farming system primarily refers to:","o":["Permanent loss of nutrients from the system","Returning nutrients contained in crop residues, animal excreta and other organic wastes back into productive use within the system","Purchasing new chemical fertilizer every season","Exporting all crop residues off-farm"],"a":1,"e":"Composting/manuring channels nutrients present in farm wastes back into the soil-crop system rather than losing them."},{"id":"Q0028","t":"Soil Physics","q":"Puddling of soil, practised before transplanting rice, is done to:","o":["Increase infiltration","Destroy structure and reduce percolation losses","Improve aeration","Increase bulk density of subsoil only"],"a":1,"e":"Puddling breaks down aggregates to create a compact, less permeable layer that reduces water loss in lowland rice."},{"id":"Q0498","t":"Soil Microbiology","q":"Which statement about soil viruses (bacteriophages) in soil ecology is correct?","o":["Viruses are entirely absent from soil","Soil viruses, though often overlooked, can influence microbial population dynamics by infecting and lysing host bacteria/archaea","Viruses fix atmospheric nitrogen","Viruses decompose lignin directly"],"a":1,"e":"Bacteriophages are abundant in soils and can regulate host bacterial populations through lysis, influencing nutrient cycling indirectly."},{"id":"Q0183","t":"Soil Chemistry","q":"In flooded (submerged) rice soils, the sequence of reduction of electron acceptors typically follows the order:","o":["O2 → NO3- → Mn4+ → Fe3+ → SO4^2- → CO2","CO2 → SO4^2- → Fe3+ → Mn4+ → NO3- → O2","All are reduced simultaneously","Only O2 is ever reduced"],"a":0,"e":"Thermodynamically, O2 is depleted first, followed by nitrate, then manganese, iron, sulfate and finally carbon dioxide reduction (methanogenesis)."},{"id":"Q0156","t":"Soil Chemistry","q":"Cation exchange capacity (CEC) is defined as:","o":["The total amount of exchangeable cations a soil can hold, expressed per unit mass","The concentration of soluble salts in soil solution","The rate of water infiltration into soil","The amount of organic carbon in soil"],"a":0,"e":"CEC quantifies the negatively charged sites available to retain and exchange cations, usually expressed as cmol(+)/kg."},{"id":"Q0907","t":"Soil Pollution","q":"Setting maximum permissible limits for pesticide residues in soil and food, as done by regulatory agencies, is primarily based on:","o":["Arbitrary values with no scientific basis","Toxicological risk assessment data combined with exposure considerations to protect human and environmental health within an acceptable margin of safety","Only the cost of the pesticide","Only farmer preference"],"a":1,"e":"Regulatory residue limits are derived from toxicological studies and exposure assessments, aiming to keep potential health/environmental risk within an acceptable margin."}]},{"id":4,"title":"Mock Test 4","questions":[{"id":"Q0896","t":"Soil Pollution","q":"Electronic waste (e-waste) dumping/informal recycling sites are associated with significant soil contamination risk mainly from:","o":["Only biodegradable organic material","Heavy metals (e.g., lead, cadmium, mercury) and other hazardous substances released during informal dismantling/burning of electronic components","Only paper and cardboard packaging","Only harmless plastic casings"],"a":1,"e":"Informal e-waste processing releases various heavy metals and hazardous compounds, posing significant soil (and health) contamination risks around such sites."},{"id":"Q0335","t":"Soil Fertility","q":"Foliar application of nutrients is particularly useful for correcting deficiencies of:","o":["Nitrogen only, never micronutrients","Micronutrients, especially when soil conditions limit their root uptake","Only macronutrients","No nutrients can be applied this way"],"a":1,"e":"Foliar sprays bypass unfavourable soil conditions (e.g., high pH fixing micronutrients), providing quick correction of deficiencies."},{"id":"Q0947","t":"Analytical Techniques","q":"A redox titration, as distinct from an acid-base titration, is based on a reaction involving:","o":["Neutralization of H+ and OH- ions only","Transfer of electrons between an oxidizing agent and a reducing agent","Precipitation of an insoluble salt only","Formation of a chelate complex only"],"a":1,"e":"Redox titrations rely on oxidation-reduction (electron transfer) reactions between the titrant and analyte, as in dichromate-based organic carbon determination."},{"id":"Q0715","t":"Remote Sensing & DSM","q":"Soil salinity mapping using remote sensing typically exploits the fact that saline soils often show:","o":["No distinguishing spectral characteristics whatsoever","Characteristically higher visible-band reflectance due to salt efflorescence/crusts on the surface, along with sparse or stressed vegetation","Only differences detectable by radar, never optical sensors","Identical spectral signatures to non-saline soils in all cases"],"a":1,"e":"Visible salt crusts increase surface brightness, and associated vegetation stress/sparseness provides additional spectral cues used to map salt-affected areas."},{"id":"Q0409","t":"Manures & Fertilizers","q":"Phosphate-solubilizing bacteria (PSB) used as biofertilizers work by:","o":["Fixing atmospheric nitrogen","Producing organic acids/enzymes that convert insoluble soil/rock phosphate into plant-available forms","Oxidizing ammonium to nitrate","Decomposing lignin only"],"a":1,"e":"PSB (e.g., certain Bacillus, Pseudomonas species) secrete organic acids and enzymes that solubilize fixed/insoluble phosphate compounds."},{"id":"Q0449","t":"Manures & Fertilizers","q":"Which of the following biofertilizers is specifically used to enhance phosphorus uptake through extended hyphal networks rather than through solubilization?","o":["Rhizobium","Arbuscular mycorrhizal fungi (VAM)","Azotobacter","Phosphate-solubilizing bacteria"],"a":1,"e":"VAM fungi physically extend the root's absorptive reach via hyphae, improving uptake of relatively immobile P (and some micronutrients), distinct from PSB's solubilization mechanism."},{"id":"Q0957","t":"General Agriculture & Statistics","q":"'Path analysis', sometimes used in crop/soil research to examine relationships among multiple variables, helps distinguish:","o":["Only the average of a single variable","Direct and indirect effects of predictor variables on a dependent variable (e.g., yield), beyond simple correlation","Only categorical data","Only qualitative descriptions with no numerical basis"],"a":1,"e":"Path analysis decomposes correlations into direct and indirect effect components, offering more insight into causal-type relationships among multiple variables than simple correlation alone."},{"id":"Q0256","t":"Problem Soils","q":"Waterlogging in irrigated arid regions commonly contributes to secondary soil salinization mainly because:","o":["It lowers the water table permanently","A rising water table brings dissolved salts upward through capillary action to the root zone as water evaporates","It has no link to salinity","It only affects sodic soils"],"a":1,"e":"A high water table allows capillary rise and evaporative concentration of salts at or near the surface."},{"id":"Q0179","t":"Soil Chemistry","q":"Aluminium toxicity to plant roots is a major constraint typically associated with:","o":["Strongly acidic soils (low pH)","Strongly alkaline soils","Saline soils","Waterlogged neutral soils"],"a":0,"e":"Below about pH 5.5, soluble Al3+ increases sharply, becoming toxic to root growth."},{"id":"Q0364","t":"Soil Fertility","q":"Terminal bud death and distorted new growth are classic symptoms of deficiency of which relatively immobile nutrient?","o":["Nitrogen","Calcium or boron","Potassium","Sulfur"],"a":1,"e":"Ca and B are poorly mobile (phloem-immobile), so their deficiency preferentially damages actively growing meristems/new tissue."},{"id":"Q0003","t":"Soil Physics","q":"The USDA clay fraction consists of particles smaller than:","o":["0.05 mm","0.02 mm","0.002 mm","0.0002 mm"],"a":2,"e":"Clay particles are defined as <0.002 mm (2 microns) in the USDA system."},{"id":"Q0929","t":"Problem Soils","q":"Soil test parameters most essential for correctly classifying a suspected salt-affected soil sample include:","o":["Only soil color and texture","Electrical conductivity of the saturation extract (ECe), soil pH, and exchangeable sodium percentage (ESP) or SAR","Only soil bulk density","Only total nitrogen content"],"a":1,"e":"ECe, pH, and ESP/SAR together provide the standard basis for classifying a soil as normal, saline, sodic, or saline-sodic per USSL criteria."},{"id":"Q0839","t":"Analytical Techniques","q":"In soil analysis, a 'reagent blank' differs from a 'method blank' mainly (when distinguished) in that a method blank additionally undergoes:","o":["No processing at all, unlike a reagent blank","The complete sample preparation/digestion procedure alongside the actual samples, capturing any contamination introduced during the full analytical process, not just from reagents alone","Only the final measurement step, skipping all preparation","A completely different set of reagents"],"a":1,"e":"A method blank is carried through the entire analytical procedure (digestion, extraction, etc.) like real samples, so it captures contamination from the whole process, not only the reagents themselves."},{"id":"Q0646","t":"Pedology","q":"Soils formed on recently deposited river alluvium, showing minimal profile development, would most likely be classified in Soil Taxonomy as:","o":["Oxisols","Entisols","Spodosols","Ultisols"],"a":1,"e":"Young, weakly developed soils lacking diagnostic subsurface horizons, such as recent alluvial deposits, typically classify as Entisols."},{"id":"Q0117","t":"Soil Mineralogy","q":"Among common clay minerals, the highest cation exchange capacity is generally shown by:","o":["Kaolinite","Illite","Montmorillonite (smectite)","Quartz"],"a":2,"e":"Montmorillonite's high isomorphous substitution and expanding interlayer surfaces give it a very high CEC."},{"id":"Q0780","t":"Remote Sensing & DSM","q":"Orthorectification of an aerial or satellite image corrects for:","o":["Spectral band misalignment only","Geometric distortions caused by terrain relief and sensor viewing angle, producing an image with a uniform, map-accurate scale","Radiometric noise only","Only cloud cover"],"a":1,"e":"Orthorectification removes terrain- and perspective-induced geometric distortion, yielding an image usable for accurate spatial measurement, like a map."},{"id":"Q0355","t":"Soil Fertility","q":"Response of legume crops to molybdenum fertilization is particularly important because Mo is required for:","o":["Chlorophyll synthesis directly","The functioning of nitrogenase in symbiotic nitrogen fixation","Cell wall formation","Water uptake regulation"],"a":1,"e":"Mo is a cofactor in nitrogenase (and nitrate reductase), so its deficiency impairs biological nitrogen fixation in legumes."},{"id":"Q0858","t":"General Agriculture & Statistics","q":"'Cropping intensity' for a region/farm is calculated as:","o":["(Net sown area / Gross cropped area) × 100","(Gross cropped area / Net sown area) × 100","Total rainfall divided by total irrigated area","Number of crops grown divided by farm size in hectares"],"a":1,"e":"Cropping intensity expresses how many times, on average, the net sown area is cropped in a year: (Gross cropped area / Net sown area) × 100."},{"id":"Q0472","t":"Soil Microbiology","q":"Soil respiration, measured as CO2 evolution, is commonly used as an index of:","o":["Overall microbial and root metabolic activity/decomposition rate","Soil texture","Soil color","Soil bulk density"],"a":0,"e":"CO2 release from soil reflects the combined respiratory activity of microorganisms and roots, indicating overall biological activity."},{"id":"Q0825","t":"Analytical Techniques","q":"Total phosphorus in a soil or plant sample, as opposed to available phosphorus, is typically determined after:","o":["A mild water extraction only","Complete digestion of the sample (e.g., with perchloric or sulfuric acid, or dry ashing) to release all forms of phosphorus for measurement","No sample preparation at all","Only physical sieving"],"a":1,"e":"Total P determination requires strong digestion to break down all organic and mineral P forms into a measurable soluble form, unlike the milder extraction used for available P."},{"id":"Q0437","t":"Manures & Fertilizers","q":"The primary role of a nitrification inhibitor co-applied with nitrogenous fertilizer is to:","o":["Speed up conversion of ammonium to nitrate","Slow down the microbial oxidation of ammonium to nitrate, reducing nitrate leaching/denitrification losses","Prevent any nitrogen from being available to the crop","Convert urea directly to protein"],"a":1,"e":"By slowing nitrification, more N stays as less-mobile ammonium for longer, reducing losses via nitrate leaching and denitrification."},{"id":"Q0013","t":"Soil Physics","q":"Total porosity of a soil can be calculated from bulk density (BD) and particle density (PD) as:","o":["Porosity = BD/PD","Porosity = PD/BD","Porosity = 1 − (BD/PD)","Porosity = BD × PD"],"a":2,"e":"Porosity (fraction) = 1 − (bulk density/particle density)."},{"id":"Q0185","t":"Soil Chemistry","q":"Phosphorus fixation in acid soils occurs mainly through reaction with:","o":["Exchangeable sodium","Iron and aluminium oxides/hydroxides","Calcium carbonate","Soil organic nitrogen"],"a":1,"e":"In acid soils, phosphate reacts with amorphous and crystalline Fe/Al oxides to form insoluble Fe/Al-phosphates."},{"id":"Q0220","t":"Soil Chemistry","q":"A 'buffer curve' relating soil pH to increments of added acid or base is used practically to:","o":["Estimate lime or acidifying-material requirement","Determine soil texture","Determine soil color","Measure infiltration rate"],"a":0,"e":"The slope of the buffer curve indicates buffering capacity, from which the amendment dose for a target pH change is calculated."},{"id":"Q0890","t":"Soil Conservation","q":"The primary hydrological rationale for treating a watershed 'from ridge to valley' rather than 'valley to ridge' is that:","o":["It is administratively simpler to start from the valley","Controlling runoff generation at its source (upper catchment/ridge) prevents accumulation of large volumes of fast-flowing water reaching and potentially overwhelming lower treatments","Ridge areas never generate any runoff","Valley areas are always more erosion-prone than ridges"],"a":1,"e":"Since runoff and its erosive energy accumulate as it moves downslope, controlling it near its source (the ridge/upper catchment) reduces the volume and force reaching, and potentially damaging, treatments and land lower in the watershed."},{"id":"Q0167","t":"Soil Chemistry","q":"'Active acidity' in soil refers to:","o":["H+ ions held on exchange sites","H+ ions present in the soil solution, measured as pH","Reserve acidity in clay lattices","Total titratable acidity"],"a":1,"e":"Active acidity is the free H+ concentration in soil solution, directly measured as pH."},{"id":"Q0483","t":"Soil Microbiology","q":"Soil microbial diversity assessment using culture-independent molecular methods (e.g., DNA/RNA-based techniques) is preferred over traditional plate culturing because:","o":["Most soil microorganisms can be readily cultured in the laboratory","A large majority of soil microorganisms are not readily culturable by standard laboratory methods, so molecular methods capture a fuller picture of diversity","Molecular methods are always cheaper","Culturing methods are always more accurate"],"a":1,"e":"It is well established that only a small fraction of soil microbes grow on standard media; molecular tools reveal the much larger 'unculturable' diversity."},{"id":"Q0094","t":"Soil Physics","q":"The term 'soil tilth' broadly refers to:","o":["The nutrient content of soil","The physical condition of soil as it relates to ease of tillage and root growth","The mineralogical composition of clay","The salinity status of soil"],"a":1,"e":"Tilth describes the physical state (structure, friability, workability) of soil relevant to seedbed preparation and root growth."},{"id":"Q0134","t":"Soil Mineralogy","q":"Allophane is best described as a:","o":["Well-crystallized 2:1 clay mineral","Non-crystalline (short-range order) aluminosilicate typical of Andisols","Primary mica mineral","Carbonate mineral"],"a":1,"e":"Allophane lacks long-range crystalline order and typically forms from weathering of volcanic glass."},{"id":"Q0869","t":"Soil Conservation","q":"Torrent control and river training structures in hilly watershed areas are designed mainly to:","o":["Increase flood peaks and downstream erosion","Regulate the flow of fast-moving hill streams/torrents, reducing bank erosion, channel instability, and downstream sediment/flood damage","Eliminate all water flow entirely","Replace the need for afforestation upstream"],"a":1,"e":"Torrent control structures stabilize and regulate flow in steep, fast-flowing hill streams, reducing erosive bank/bed damage and downstream sedimentation/flooding risk."},{"id":"Q0568","t":"Pedology","q":"'Podzolization' is a soil-forming process characterized by:","o":["Accumulation of calcium carbonate in the profile","Intense leaching of Fe, Al and organic matter from the surface (E horizon) with their accumulation in a lower spodic (B) horizon, typical of cool humid coniferous forest regions","Accumulation of soluble salts near the surface","Formation of a hardpan of silica only"],"a":1,"e":"Podzolization involves strong acid leaching that removes sesquioxides and organic matter from upper horizons, redepositing them lower down, forming characteristic ashy-grey E and dark spodic B horizons."},{"id":"Q0604","t":"Pedology","q":"Histosols are soils dominated by:","o":["Mineral material with less than 1% organic matter","Organic material (e.g., peat, muck), typically formed under waterlogged conditions that slow decomposition","Perennial permafrost with no organic matter","Extremely saline mineral material"],"a":1,"e":"Histosols are 'organic soils', containing a high proportion of organic material, usually accumulated under poorly drained, anaerobic conditions."},{"id":"Q0680","t":"Soil Conservation","q":"Which erosion control measure is classified as an 'engineering' (structural) rather than an 'agronomic' measure?","o":["Cover cropping","Mulching","Contour bunding/terracing","Crop rotation"],"a":2,"e":"Bunding and terracing involve constructing physical earthen/structural works, distinguishing them as engineering measures from purely crop/vegetation-based agronomic practices."},{"id":"Q0579","t":"Pedology","q":"The 'C horizon' in a soil profile represents:","o":["The most biologically active surface layer","Relatively unconsolidated material, little affected by pedogenic processes, resembling the parent material","Solid bedrock only","The horizon richest in humus"],"a":1,"e":"The C horizon is little altered by soil-forming processes and often closely resembles the original parent material."},{"id":"Q0281","t":"Problem Soils","q":"For classification purposes, a soil showing ECe = 6 dS/m and ESP = 8 would be classified as:","o":["Normal soil","Saline soil","Sodic soil","Saline-sodic soil"],"a":1,"e":"High ECe (>4) with low ESP (<15) fits the definition of a saline (non-sodic) soil."},{"id":"Q0791","t":"Remote Sensing & DSM","q":"'Band ratioing', a common image enhancement technique, involves:","o":["Adding the digital numbers of all bands together","Dividing the digital number/reflectance of one spectral band by another, often to enhance specific surface feature contrasts (e.g., vegetation, minerals) while reducing illumination effects","Deleting all but one spectral band permanently","Converting raster data to vector format only"],"a":1,"e":"Ratioing two bands can enhance specific spectral contrasts and partially normalize for topographic illumination differences, useful in vegetation and mineral mapping indices."},{"id":"Q0866","t":"Soil Conservation","q":"Staggered contour trenches, commonly constructed on degraded hill slopes, are designed as:","o":["Continuous, uninterrupted trenches running the full length of the slope","Short, discontinuous trenches arranged in a staggered (offset) pattern along the contour, intercepting runoff while allowing safe overflow between trench segments","Deep vertical pits with no connection to the contour","Only used for wind erosion control, never water erosion"],"a":1,"e":"Staggered trenches break the slope into short segments offset from row to row, capturing runoff/sediment locally while avoiding the risk of a single continuous channel failing catastrophically."},{"id":"Q0405","t":"Manures & Fertilizers","q":"Green manuring refers to the practice of:","o":["Growing a legume or other quick-growing crop and incorporating it into the soil while still green, to improve fertility","Applying only chemical green-colored fertilizers","Spraying green dye on crops","Composting only green leaves from forest trees"],"a":0,"e":"Green manure crops (e.g., dhaincha, sunhemp) are grown and ploughed in green to add organic matter and nitrogen (if leguminous) to the soil."},{"id":"Q0850","t":"General Agriculture & Statistics","q":"India's major cropping seasons are conventionally classified as:","o":["Only summer and winter","Kharif (monsoon season), Rabi (winter season), and Zaid (short summer season)","Only spring and autumn","Only wet season and dry season with no further division"],"a":1,"e":"Indian agriculture conventionally recognizes Kharif (June-October, monsoon-sown), Rabi (October-March, winter-sown) and Zaid (short summer season between Rabi and Kharif) cropping seasons."},{"id":"Q0502","t":"Soil Microbiology","q":"The 'priming effect' in soil organic matter dynamics refers to:","o":["No interaction between added fresh organic matter and existing native soil organic matter decomposition","A change (often an increase) in the decomposition rate of native soil organic matter following addition of fresh organic substrates","A decrease in microbial biomass upon any organic matter addition","An effect only observed in sterile soils"],"a":1,"e":"Fresh, easily available carbon can stimulate microbial activity that also accelerates ('primes') decomposition of existing native soil organic matter."},{"id":"Q0494","t":"Soil Microbiology","q":"Soil microbial quotient (microbial biomass C / total organic C) is used as an indicator of:","o":["Soil color quality","The proportion of soil organic carbon in an active, living form, reflecting soil biological quality/health","Soil salinity","Soil texture class"],"a":1,"e":"A higher microbial quotient suggests a more biologically active, higher-quality organic matter pool relative to total organic carbon."},{"id":"Q0354","t":"Soil Fertility","q":"An important soil factor that reduces the availability of most cationic micronutrients (Fe, Zn, Mn, Cu) is:","o":["Low soil pH","High soil pH (alkaline/calcareous conditions)","High soil organic matter alone","Low bulk density"],"a":1,"e":"Alkaline/calcareous conditions favour precipitation of these micronutrients as insoluble hydroxides/carbonates, reducing solubility."},{"id":"Q0978","t":"Manures & Fertilizers","q":"Sulphur-coated urea and polymer-coated urea are both examples of:","o":["Straight, uncoated conventional fertilizers","Controlled/slow-release nitrogen fertilizers designed to gradually release nitrogen and improve use efficiency","Purely organic manures with no synthetic component","Micronutrient fertilizers only"],"a":1,"e":"Both coating approaches slow the release of nitrogen from the urea granule, aiming to better match nitrogen availability with crop uptake and reduce losses."},{"id":"Q0504","t":"Soil Microbiology","q":"Nematodes present in soil food webs primarily influence nutrient cycling through their role as:","o":["Photosynthetic primary producers","Consumers of bacteria, fungi, and other organisms, contributing to nutrient mineralization, alongside some plant-parasitic species","Nitrogen-fixing symbionts","Decomposers of lignin directly"],"a":1,"e":"Free-living nematodes graze on microbes, contributing to nutrient turnover; certain nematode species are also important plant pathogens."},{"id":"Q0911","t":"Problem Soils","q":"Subsidence of reclaimed peat/organic soils over time, after drainage for cultivation, occurs mainly due to:","o":["Continued accumulation of new organic matter","Oxidative decomposition, compaction, and shrinkage of the organic material once aerobic conditions are introduced by drainage","Increased water saturation over time","Formation of new bedrock beneath the peat"],"a":1,"e":"Draining organic soils exposes previously waterlogged, preserved organic matter to aerobic decomposition, causing progressive loss of volume (subsidence) over time."},{"id":"Q0670","t":"Soil Conservation","q":"Land capability classification (as developed by the USDA) groups agricultural land into classes (I through VIII) primarily based on:","o":["Market value of the land","The land's inherent limitations/hazards for sustained use, ranging from few limitations (Class I) to severe limitations unsuitable for cultivation (Classes VII-VIII)","Distance from the nearest city","Crop variety grown"],"a":1,"e":"Land capability classes rank land from the most versatile with fewest limitations (Class I) to land unsuited to cultivation and best left for wildlife/forestry (Classes VII, VIII)."},{"id":"Q0898","t":"Soil Pollution","q":"Antibiotic residues and antibiotic-resistance genes entering soil through application of livestock manure are an emerging concern mainly because they may contribute to:","o":["Improved crop yield with no other consequence","The spread of antibiotic resistance in soil microbial communities, with potential implications for environmental and public health","Complete elimination of soil-borne pathogens","Increased soil salinity"],"a":1,"e":"Manure from antibiotic-treated livestock can introduce antibiotic residues and resistance genes into soil, raising concerns about the environmental spread of antimicrobial resistance."},{"id":"Q0267","t":"Problem Soils","q":"For successful reclamation of saline soils by leaching, an essential prerequisite is:","o":["High exchangeable sodium percentage","Adequate internal soil drainage to remove leached salts","Absence of any water supply","High soil salinity to begin with, nothing else needed"],"a":1,"e":"Without adequate drainage, leaching water cannot carry salts away, and the soil may become waterlogged instead of reclaimed."},{"id":"Q0149","t":"Soil Mineralogy","q":"Chlorite clay mineral in soils is most commonly derived from and found in:","o":["Highly weathered tropical Oxisols","Soils derived from low-grade metamorphic rocks, generally less weathered","Fresh volcanic ash deposits","Peat soils"],"a":1,"e":"Chlorite often survives as a residual mineral from metamorphic parent rocks in less intensely weathered soils."},{"id":"Q0206","t":"Soil Chemistry","q":"Soil acidification over time in intensively cropped, high-rainfall areas is commonly accelerated by:","o":["Continuous use of ammonium-based nitrogen fertilizers and nitrate leaching","Application of agricultural lime","Application of farmyard manure only","Crop rotation with legumes"],"a":0,"e":"Nitrification of ammonium fertilizers releases H+, and leaching of the resulting nitrate carries basic cations away, both acidifying soil."},{"id":"Q0971","t":"Soil Mineralogy","q":"The mineral montmorillonite is named after a locality in France, and is now more broadly classified within which general mineral group?","o":["The mica group","The smectite group","The kaolin group","The chlorite group"],"a":1,"e":"Montmorillonite is the most common member of the smectite group of expanding 2:1 clay minerals."},{"id":"Q0544","t":"Soil Pollution","q":"'Soil quality index' related to pollution assessment typically integrates:","o":["Only soil color measurements","Multiple physical, chemical and biological indicators (e.g., contaminant levels, microbial activity, enzyme activity) into a composite score","Only crop yield data","Only rainfall records"],"a":1,"e":"Soil quality/pollution indices combine several relevant indicators to give an integrated assessment of soil condition/contamination status."},{"id":"Q0954","t":"Analytical Techniques","q":"'Matrix effect' in analytical chemistry refers to a situation where:","o":["The sample matrix (its overall chemical composition/background) influences and potentially biases the measured signal of the analyte of interest, requiring correction (e.g., matrix-matched standards)","The sample has no influence on measurement at all","Only the color of the sample matters","Matrix effects only occur in gas chromatography, never other techniques"],"a":0,"e":"Matrix effects occur when other components of a sample interfere with or alter the measured signal for the target analyte, often requiring matrix-matched calibration standards or other corrective measures for accurate quantification."},{"id":"Q0800","t":"Remote Sensing & DSM","q":"WGS84 is widely referenced in GPS and GIS work as:","o":["A specific soil classification order","A commonly used global geodetic datum/coordinate reference system","A type of remote sensing satellite","A soil fertility index"],"a":1,"e":"WGS84 (World Geodetic System 1984) is the standard reference datum underlying GPS coordinates and widely used in global GIS applications."},{"id":"Q0193","t":"Soil Chemistry","q":"The Olsen method for extractable phosphorus is specifically recommended for soils that are:","o":["Strongly acidic","Calcareous / alkaline","Highly saline only","Sandy only"],"a":1,"e":"Olsen's sodium bicarbonate extractant is designed to estimate available P in calcareous and neutral-to-alkaline soils."},{"id":"Q0218","t":"Soil Chemistry","q":"Sodium adsorption ratio (SAR) of a soil/water sample is calculated from the concentrations of:","o":["Ca, Mg and Na in solution","N, P and K in solution","Fe, Mn and Zn in solution","Cl and SO4 in solution"],"a":0,"e":"SAR = [Na+] / sqrt(([Ca2+]+[Mg2+])/2), using solution concentrations in meq/L, to index sodium hazard."},{"id":"Q0857","t":"General Agriculture & Statistics","q":"State Agricultural Universities (SAUs) in India, such as Assam Agricultural University, primarily undertake:","o":["Only school-level education","Higher agricultural education, research, and extension activities within their respective states, under a mandate similar to a land-grant university model","Only industrial manufacturing","Only urban planning"],"a":1,"e":"SAUs combine agricultural teaching, research and extension functions for their state, broadly following the land-grant university concept adapted for India."},{"id":"Q0341","t":"Soil Fertility","q":"Continuous imbalanced use of nitrogen fertilizer without adequate P and K over many years commonly leads to:","o":["Improved overall soil fertility","Depletion of soil P and K reserves and yield stagnation/decline","No change in soil nutrient status","Excess micronutrient accumulation only"],"a":1,"e":"Mining of P and K without replenishment, alongside continued heavy N use, causes nutrient imbalance and can plateau or reduce yields over time."},{"id":"Q0486","t":"Soil Microbiology","q":"During composting, the 'thermophilic phase' (high-temperature stage) is important mainly because it:","o":["Prevents any decomposition from occurring","Accelerates decomposition and helps destroy weed seeds and many pathogens through heat generated by intense microbial activity","Cools the compost pile rapidly","Has no biological significance"],"a":1,"e":"Rapid microbial activity generates heat (thermophilic temperatures), speeding decomposition and sanitizing the compost of weed seeds/pathogens."},{"id":"Q0565","t":"Pedology","q":"'Relief' (topography) affects soil formation mainly by influencing:","o":["Soil mineralogy directly, with no other effect","Drainage, erosion/deposition patterns, and microclimate, which in turn affect profile development","Only atmospheric CO2 levels","Parent rock composition"],"a":1,"e":"Slope position and topography control water movement, erosion and deposition, and local microclimate, all shaping soil development."},{"id":"Q0765","t":"General Agriculture & Statistics","q":"Sampling techniques such as simple random sampling and stratified random sampling are used in agricultural surveys mainly to:","o":["Guarantee that every individual in the population is surveyed","Select a representative subset of a larger population for study, allowing valid inferences about the whole population without a complete census","Eliminate the need for any statistical analysis","Only apply to laboratory experiments, never field surveys"],"a":1,"e":"Sampling methods aim to obtain a manageable, representative subset from which conclusions about the entire population can be validly drawn."},{"id":"Q0345","t":"Soil Fertility","q":"The critical concept behind 'integrated nutrient management' (INM) is to:","o":["Rely solely on chemical fertilizers","Combine chemical fertilizers, organic manures and biofertilizers judiciously to sustain soil fertility and crop productivity","Avoid all external nutrient inputs","Use only biofertilizers and no fertilizer at all"],"a":1,"e":"INM integrates multiple nutrient sources to optimize efficiency, maintain soil health and reduce dependence on any single source."},{"id":"Q0269","t":"Problem Soils","q":"Growing a rice crop is sometimes recommended as an initial phase in reclaiming moderately sodic soils because:","o":["Rice cannot tolerate any standing water","Continuous ponding during rice cultivation aids leaching of sodium and salts while the crop tolerates the conditions","Rice increases soil sodicity","Rice requires no water management"],"a":1,"e":"Standing water in paddy fields facilitates salt/sodium leaching while rice, a relatively tolerant crop, can still be grown."},{"id":"Q0701","t":"Remote Sensing & DSM","q":"Terrain attributes commonly derived from a DEM for digital soil mapping include:","o":["Only soil pH values","Slope, aspect, curvature, and topographic wetness index","Only crop yield data","Only mineral composition"],"a":1,"e":"DEM-derived terrain attributes capture landscape position/hydrological characteristics that strongly correlate with soil-forming processes and properties."},{"id":"Q0710","t":"Remote Sensing & DSM","q":"Microwave (radar) remote sensing has a particular advantage over optical remote sensing for soil moisture estimation because microwave sensors:","o":["Cannot penetrate cloud cover at all","Can operate under cloud cover and, for certain wavelengths, are sensitive to the dielectric properties (strongly influenced by water content) of the near-surface soil","Only work at night","Cannot detect soil properties at all"],"a":1,"e":"Microwave sensors penetrate clouds (unlike optical sensors) and respond to the soil dielectric constant, which changes markedly with moisture content, enabling soil moisture retrieval."},{"id":"Q0065","t":"Soil Physics","q":"Dark-coloured soils, compared to light-coloured soils, typically:","o":["Absorb less solar radiation","Absorb more solar radiation and warm faster","Have identical thermal behaviour","Reflect all incoming radiation"],"a":1,"e":"Dark soils (often higher in organic matter) absorb more radiation, raising soil temperature faster."},{"id":"Q0641","t":"Pedology","q":"Which of the following pairs correctly matches a soil order with its most typically associated broad climatic setting?","o":["Gelisols — hot arid deserts","Histosols — waterlogged/wetland environments favouring organic matter accumulation","Vertisols — cold polar permafrost regions","Andisols — coral reef limestone terrain"],"a":1,"e":"Histosols (organic soils) form specifically where poor drainage/waterlogging slows decomposition, allowing thick accumulation of organic material."},{"id":"Q0408","t":"Manures & Fertilizers","q":"Biofertilizers are best described as:","o":["Chemical fertilizers with added dyes","Carrier-based preparations containing living beneficial microorganisms that enhance nutrient availability to plants","Synthetic slow-release fertilizer granules","Herbicide formulations"],"a":1,"e":"Biofertilizers deliver live, beneficial microbes (N-fixers, P-solubilizers, mycorrhizae, etc.) to enhance nutrient supply through biological processes."},{"id":"Q0822","t":"Analytical Techniques","q":"The 'Beer-Lambert law', fundamental to spectrophotometric analysis, describes the relationship between:","o":["Soil bulk density and porosity","Absorbance of light by a solution and the concentration of the absorbing substance (at a given path length and wavelength)","Soil pH and soil salinity","Soil texture and soil color"],"a":1,"e":"Beer-Lambert law states that absorbance is directly proportional to concentration (and path length), the basis for quantifying analyte concentration via colorimetric/spectrophotometric methods."},{"id":"Q0290","t":"Soil Fertility","q":"According to Arnon and Stout's criteria of essentiality, an element is 'essential' for plant growth if:","o":["It is present in the plant tissue in any amount","Its absence prevents the plant from completing its life cycle and its role cannot be replaced by another element","It improves yield but is not strictly required","It is toxic at high concentration"],"a":1,"e":"Essentiality requires the plant cannot complete its life cycle without the element and no other element can substitute for its specific function."},{"id":"Q0168","t":"Soil Chemistry","q":"'Exchangeable acidity' in soil refers to:","o":["H+ and Al3+ ions held on colloidal exchange sites","Dissolved CO2 in soil air","H+ in the soil solution only","Salinity of the soil"],"a":0,"e":"Exchangeable acidity comprises H+ and Al3+ held on cation exchange sites, released into solution on exchange."},{"id":"Q0139","t":"Soil Mineralogy","q":"Among common primary silicate minerals, weathering typically proceeds SLOWEST for:","o":["Olivine","Pyroxene","Quartz","Biotite"],"a":2,"e":"Quartz's fully polymerized, strongly bonded structure makes it the slowest-weathering common silicate."},{"id":"Q0536","t":"Soil Pollution","q":"Biodegradation of a pesticide in soil generally refers to its breakdown by:","o":["Photolysis by sunlight only","Microbial metabolic activity, transforming it into simpler, often less toxic compounds","Physical erosion only","Plant uptake without any transformation"],"a":1,"e":"Soil microorganisms often possess enzymes capable of degrading pesticide molecules into simpler metabolites, reducing persistence and toxicity."},{"id":"Q0882","t":"Soil Conservation","q":"A gabion structure, used in gully control and streambank stabilization, consists of:","o":["Loose soil piled without any containment","Wire mesh baskets/cages filled with rock, forming flexible, permeable structures that resist erosion while allowing some water passage","Solid, impermeable concrete walls only","Only vegetation with no structural component"],"a":1,"e":"Gabions are wire-cage rock-filled structures, valued for their flexibility, permeability, and relatively low cost in controlling erosion at gully heads/banks."},{"id":"Q0589","t":"Pedology","q":"'Soil moisture regime' classes used in Soil Taxonomy (e.g., aquic, udic, ustic, aridic, xeric) describe:","o":["The soil's texture class","The characteristic seasonal pattern of soil water availability/saturation in the root zone, closely tied to climate","The soil's color classification","The soil's cation exchange capacity"],"a":1,"e":"Moisture regimes classify how much of the year the soil is dry, moist, or saturated, reflecting climatic water balance and strongly influencing soil classification."},{"id":"Q0540","t":"Soil Pollution","q":"Long-term irrigation with untreated industrial or sewage effluent can lead to soil pollution mainly through accumulation of:","o":["Only beneficial plant nutrients with no risk","Heavy metals, salts, and pathogenic organisms, depending on effluent source and treatment level","Only water, with no chemical constituents","Only organic carbon, always beneficial"],"a":1,"e":"Untreated effluents may carry heavy metals, excess salts, and pathogens that accumulate in soil over repeated irrigation cycles."},{"id":"Q0986","t":"Analytical Techniques","q":"'Internal standard' addition, a technique sometimes used in instrumental analysis (e.g., some chromatographic/spectrometric methods), helps to:","o":["Replace the need for external calibration standards entirely, always","Correct for variability in sample preparation/instrument response by comparing the analyte's signal to that of a known, added reference compound processed identically","Increase the analyte concentration artificially","Eliminate the need for any sample preparation"],"a":1,"e":"An internal standard, added at a known amount and carried through the whole procedure, helps correct for variability in recovery/instrument response, improving quantification accuracy."},{"id":"Q0909","t":"Problem Soils","q":"Coastal saline soils, distinct from inland saline soils, are additionally characterized by:","o":["Complete absence of any tidal/seawater influence","Periodic or continuous influence of tidal seawater intrusion, often combined with poor drainage in low-lying coastal/deltaic terrain","Permanently frozen conditions","Extremely high elevation, far from any coastline"],"a":1,"e":"Coastal saline soils are shaped by tidal seawater influence and typically poor drainage of low-lying coastal/estuarine land, distinguishing their management from purely inland saline soils."},{"id":"Q0320","t":"Soil Fertility","q":"A common visible symptom of sulfur deficiency in plants is:","o":["Interveinal chlorosis of older leaves only","Uniform yellowing (chlorosis) of younger leaves, similar in appearance to nitrogen deficiency but on new growth","Purpling of leaf margins only","Necrotic spots on roots"],"a":1,"e":"Unlike relatively mobile nitrogen, sulfur is less mobile in the plant, so deficiency symptoms (general chlorosis) appear first on younger leaves."},{"id":"Q0068","t":"Soil Physics","q":"Diurnal (day–night) temperature variation in soil is greatest:","o":["At the surface, decreasing with depth","At 1 metre depth","Uniform throughout the profile","Only in the subsoil"],"a":0,"e":"Surface soil experiences the largest daily temperature swing; amplitude damps out with increasing depth."},{"id":"Q0022","t":"Soil Physics","q":"Blocky (angular/sub-angular) structure is most characteristic of:","o":["A horizons of grassland soils","Subsoil B horizons","Loose sandy C horizons","Compacted plough pans only"],"a":1,"e":"Blocky peds commonly develop in clay-enriched B horizons."},{"id":"Q0902","t":"Soil Pollution","q":"Sorption isotherms, such as the Langmuir and Freundlich models, are used in soil pollution studies to describe:","o":["The relationship between soil color and pH","The relationship between the concentration of a pollutant in soil solution and the amount adsorbed onto soil solid surfaces at equilibrium","Only soil bulk density","Only soil microbial biomass"],"a":1,"e":"Sorption isotherms mathematically describe how a contaminant partitions between soil solution and solid surfaces at equilibrium, informing predictions of mobility/retention."},{"id":"Q0963","t":"Soil Mineralogy","q":"Vermiculite is thought to commonly form in soils through weathering/alteration of:","o":["Quartz","Mica minerals, via progressive loss of interlayer potassium and hydration","Gypsum","Calcite"],"a":1,"e":"Vermiculite is generally considered an alteration product of mica, formed as interlayer K+ is progressively leached and replaced by hydrated cations."},{"id":"Q0332","t":"Soil Fertility","q":"Split application of nitrogen fertilizer (dividing the total dose into 2–3 doses during the crop cycle) is recommended mainly to:","o":["Reduce total nitrogen use efficiency","Improve nitrogen use efficiency by synchronizing supply with crop demand and reducing losses","Increase leaching losses deliberately","Have no effect on efficiency"],"a":1,"e":"Splitting doses matches N supply more closely to crop uptake pattern, reducing losses via leaching, volatilization and denitrification."},{"id":"Q0363","t":"Soil Fertility","q":"General yellowing (chlorosis) starting from older, lower leaves and progressing upward is a classic symptom of deficiency of:","o":["Iron","Nitrogen (a mobile nutrient, retranslocated from older tissue)","Boron","Calcium"],"a":1,"e":"Because N is mobile within the plant, deficiency symptoms appear first in older leaves as N is remobilized to younger growth."},{"id":"Q0007","t":"Soil Physics","q":"Which soil separate contributes the greatest specific surface area per unit mass?","o":["Sand","Silt","Clay","Gravel"],"a":2,"e":"Because of its small particle size, clay has by far the highest specific surface area of the mineral separates."},{"id":"Q0755","t":"General Agriculture & Statistics","q":"'Replication' in a field experiment refers to:","o":["Testing only one treatment once","Repeating each treatment multiple times within the experiment to allow estimation of experimental error and improve reliability of conclusions","Avoiding randomization","Using only one experimental site"],"a":1,"e":"Replication provides repeated observations of each treatment, enabling estimation of random variability (experimental error) and more reliable statistical inference."},{"id":"Q0309","t":"Soil Fertility","q":"Azolla, a floating water fern used as a biofertilizer in rice, fixes atmospheric nitrogen through symbiotic association with:","o":["Rhizobium bacteria in root nodules","The cyanobacterium Anabaena azollae in its leaf cavities","Mycorrhizal fungi","Azotobacter in the rhizosphere"],"a":1,"e":"Azolla harbours Anabaena azollae in specialized leaf cavities, which fixes N2 that benefits both the fern and the rice crop upon decomposition."},{"id":"Q0996","t":"General Agriculture & Statistics","q":"Long-term fertilizer experiments (multi-decade trials at a fixed site) are particularly valuable in soil fertility research mainly because they:","o":["Can only ever show short-term results","Reveal gradual, cumulative changes in soil properties and crop response to sustained management practices that shorter-term trials cannot capture","Have no relevance to understanding soil sustainability","Always show identical results to single-season trials"],"a":1,"e":"Because many changes in soil organic matter, fertility status, and sustainability of practices unfold over many years, long-term trials capture cumulative trends invisible in short-duration experiments."},{"id":"Q0781","t":"Remote Sensing & DSM","q":"Ground Control Points (GCPs) are used in remote sensing image processing mainly to:","o":["Increase spectral resolution of the sensor","Georeference and geometrically correct an image by matching identifiable image features to known real-world coordinates","Measure soil pH directly","Replace the need for any satellite orbit information"],"a":1,"e":"GCPs, precisely located features with known coordinates, allow an image to be accurately registered to a real-world coordinate system."},{"id":"Q0033","t":"Soil Physics","q":"Osmotic potential becomes particularly significant in:","o":["Saline soils","Well-drained sandy loams","Organic mulched soils","Freshly tilled soils"],"a":0,"e":"High dissolved salt concentration in saline soils creates a substantial osmotic potential component."},{"id":"Q0751","t":"Analytical Techniques","q":"Calibration of an analytical instrument using a series of known-concentration standard solutions is essential mainly to:","o":["Save time by skipping sample preparation","Establish a reliable relationship between instrument response and analyte concentration, ensuring accurate quantification of unknown samples","Eliminate the need for any reference materials","Avoid the need for any blank measurement"],"a":1,"e":"A calibration curve built from standards of known concentration is the basis for converting an instrument's raw signal into accurate concentration values for unknown samples."},{"id":"Q0688","t":"Soil Conservation","q":"Which of the following measures would be most appropriate for controlling erosion on very steep hill slopes unsuitable for regular cultivation?","o":["Intensive row-crop farming up and down the slope","Permanent vegetative cover such as forestry, agroforestry or grass, per land capability classification guidance","Deep ploughing every season","Removal of all existing vegetation for maximum crop area"],"a":1,"e":"Steep, erosion-prone land is generally best kept under permanent vegetative cover (forest, agroforestry, or grass) rather than intensive row cropping, consistent with land capability principles."},{"id":"Q0237","t":"Soil Chemistry","q":"The term 'soil reaction' as used in soil science is synonymous with:","o":["Soil pH (acidity/alkalinity status)","Soil texture","Soil color","Soil temperature"],"a":0,"e":"'Soil reaction' is a traditional term for the acid–alkaline status of soil, i.e., its pH."},{"id":"Q0049","t":"Soil Physics","q":"Gravimetric soil water content is calculated as:","o":["Mass of water / mass of oven-dry soil","Volume of water / volume of soil","Mass of water / volume of soil","Bulk density × porosity"],"a":0,"e":"Gravimetric water content = (mass of water lost on drying) / (mass of oven-dry soil)."},{"id":"Q0623","t":"Pedology","q":"Soil survey interpretation maps (e.g., land capability, irrigation suitability) are prepared mainly by:","o":["Ignoring soil properties entirely","Combining soil survey data (properties, classification) with specific use requirements to rate land suitability for given purposes","Using only rainfall data","Using only crop market prices"],"a":1,"e":"Interpretive maps translate basic soil survey information into practical ratings for specific uses like cropping, irrigation, or engineering."},{"id":"Q0009","t":"Soil Physics","q":"The hydrometer and pipette methods are used in the laboratory to determine:","o":["Soil pH","Particle size distribution","Bulk density","Hydraulic conductivity"],"a":1,"e":"Both methods estimate the settling rate of particles in suspension to derive percentages of sand, silt and clay."},{"id":"Q0552","t":"Soil Pollution","q":"Eutrophication of water bodies adjacent to agricultural land is most directly linked to runoff/leaching of which nutrients from over-fertilized soils?","o":["Iron and manganese","Nitrogen and phosphorus","Calcium and magnesium","Zinc and copper"],"a":1,"e":"Excess N and P reaching water bodies stimulate excessive algal/plant growth, depleting oxygen and degrading aquatic ecosystems (eutrophication)."},{"id":"Q0131","t":"Soil Mineralogy","q":"Goethite, a common yellowish-brown iron oxide mineral, has the formula:","o":["Fe2O3","FeOOH","Fe3O4","FeS"],"a":1,"e":"Goethite (FeOOH) is a hydrated iron oxide that imparts yellow-brown colors to soils."},{"id":"Q0414","t":"Manures & Fertilizers","q":"Urea, the most widely used nitrogenous fertilizer, contains approximately what percentage of nitrogen?","o":["20%","33%","46%","60%"],"a":2,"e":"Urea [CO(NH2)2] contains about 46% nitrogen, the highest N content among common solid N fertilizers."}]}],"practice":{"Soil Mineralogy":[{"id":"Q0121","t":"Soil Mineralogy","q":"The very high specific surface area of montmorillonite compared to kaolinite is mainly because montmorillonite:","o":["Has larger particle size","Exposes both external and expandable internal (interlayer) surfaces","Contains no silica","Is non-crystalline"],"a":1,"e":"Water and cations can enter between montmorillonite's layers, adding internal surface area absent in non-expanding kaolinite."},{"id":"Q0126","t":"Soil Mineralogy","q":"Compared with montmorillonite, vermiculite generally shows:","o":["Lower CEC","Similar or even higher CEC per unit mass","Zero CEC","No isomorphous substitution"],"a":1,"e":"Vermiculite typically has very high, often greater, layer charge and CEC compared with montmorillonite."},{"id":"Q0109","t":"Soil Mineralogy","q":"Kaolinite is a classic example of a:","o":["1:1 type clay mineral","2:1 type clay mineral","2:1:1 type clay mineral","Non-silicate oxide mineral"],"a":0,"e":"Kaolinite's unit layer comprises one tetrahedral (Si) sheet bonded to one octahedral (Al) sheet — a 1:1 structure."},{"id":"Q0106","t":"Soil Mineralogy","q":"Highly resistant 'heavy minerals' such as zircon, tourmaline and rutile are often used in soil studies as:","o":["Indicators of soil fertility","Indices of parent material uniformity and degree of weathering","Indicators of soil pH","Sources of plant-available potassium"],"a":1,"e":"Being extremely weathering-resistant, these minerals help trace parent material and assess relative weathering intensity."},{"id":"Q0972","t":"Soil Mineralogy","q":"Given similar parent material, a soil developed under much older, more prolonged weathering would generally be expected to show, in its clay mineral suite, a relative shift toward:","o":["More primary minerals and less clay","More kaolinite/oxides and less 2:1 clay minerals like smectite","More gypsum and halite","No change whatsoever in mineral composition"],"a":1,"e":"With prolonged weathering, more soluble/reactive 2:1 clays and primary minerals progressively transform toward more stable, highly weathered end products like kaolinite and Fe/Al oxides."},{"id":"Q0137","t":"Soil Mineralogy","q":"According to Jackson's weathering stages, the most advanced stage of mineral weathering is dominated by:","o":["Fresh feldspar and mica","Fe and Al oxides such as hematite and gibbsite","Gypsum and halite","Unweathered quartz"],"a":1,"e":"The most advanced stage reflects near-complete desilication, leaving residual Fe/Al oxides."},{"id":"Q0105","t":"Soil Mineralogy","q":"Primary minerals such as quartz, feldspar and mica predominantly occur in the:","o":["Clay fraction","Sand and silt fractions","Organic fraction","Dissolved (solution) fraction"],"a":1,"e":"Because of their larger crystal/particle size, primary minerals are concentrated in the sand and silt fractions."},{"id":"Q0108","t":"Soil Mineralogy","q":"Clay minerals belong chemically to which broad mineral group?","o":["Carbonates","Phyllosilicates (layer silicates)","Sulphates","Oxides only"],"a":1,"e":"Clay minerals are layer (sheet) silicates, i.e., phyllosilicates, built of tetrahedral and octahedral sheets."},{"id":"Q0966","t":"Soil Mineralogy","q":"Which of the following best explains why 2:1 clay minerals generally have higher CEC than 1:1 clay minerals?","o":["2:1 minerals are always larger particles","2:1 minerals typically undergo more isomorphous substitution and expose more surface area (including interlayer surfaces in expanding types), generating more negative charge sites","1:1 minerals always have more isomorphous substitution","CEC is unrelated to clay mineral structure"],"a":1,"e":"Greater isomorphous substitution and, in expanding 2:1 types, additional interlayer surface area together give 2:1 clays substantially more exchange capacity than the tightly bonded 1:1 kaolinite."},{"id":"Q0123","t":"Soil Mineralogy","q":"Kaolinite typically dominates the clay fraction of which highly weathered soils?","o":["Oxisols/Ultisols of the humid tropics","Aridisols of deserts","Andisols on recent volcanic ash","Gelisols of permafrost regions"],"a":0,"e":"Intense, prolonged weathering under humid tropical conditions favours kaolinite and oxide accumulation, typical of Oxisols/Ultisols."},{"id":"Q0115","t":"Soil Mineralogy","q":"Chlorite clay mineral is structurally described as a:","o":["1:1 layer silicate","2:1 layer silicate with a brucite/gibbsite interlayer (2:1:1 structure)","Non-crystalline oxide","Carbonate mineral"],"a":1,"e":"Chlorite has a 2:1 layer with an additional hydroxide (brucite-like) interlayer sheet, sometimes termed 2:1:1."},{"id":"Q0098","t":"Soil Mineralogy","q":"The most abundant primary mineral in the sand and silt fractions of most soils is:","o":["Mica","Quartz","Gibbsite","Kaolinite"],"a":1,"e":"Quartz (SiO2) is highly resistant to weathering and dominates the coarser mineral fractions of most soils."},{"id":"Q0153","t":"Soil Mineralogy","q":"Non-exchangeable fixation of potassium in soils is particularly associated with which clay minerals?","o":["Kaolinite only","Illite and vermiculite (in wedge/interlayer sites)","Allophane only","Gibbsite"],"a":1,"e":"K+ ions can become trapped in the collapsed interlayer wedge zones of illite and vermiculite, resisting exchange."},{"id":"Q0145","t":"Soil Mineralogy","q":"The colloidal properties of soil (surface charge, surface area, plasticity) are mainly attributed to:","o":["Sand and gravel fractions","Clay minerals and humus (organic colloids)","Silt fraction alone","Primary quartz grains"],"a":1,"e":"Clay and humus particles, both in the colloidal size range, dominate soil surface chemical behaviour."},{"id":"Q0136","t":"Soil Mineralogy","q":"According to Jackson's weathering stages, the early (least weathered) stage of soil mineral development is dominated by:","o":["Kaolinite and gibbsite","Resistant primary minerals such as quartz, feldspar and mica","Hematite and goethite only","Allophane exclusively"],"a":1,"e":"Jackson's earliest stages are characterized by persistence of primary, weathering-resistant minerals."},{"id":"Q0144","t":"Soil Mineralogy","q":"Relative to 2:1 clay minerals, kaolinite and Fe/Al oxides contribute proportionally MORE charge from:","o":["Permanent (lattice) charge","Variable (pH-dependent) charge","Neither type of charge","Osmotic charge"],"a":1,"e":"With little isomorphous substitution, kaolinite/oxide charge is dominated by pH-dependent edge and surface hydroxyl reactions."},{"id":"Q0128","t":"Soil Mineralogy","q":"'Sesquioxides' in soil mineralogy refers to:","o":["Oxides of iron and aluminium","Oxides of silicon only","Carbonate minerals","Sulphate minerals"],"a":0,"e":"Sesquioxides (oxides in a roughly 1.5:1 O:metal ratio) commonly refers to Fe and Al oxides/hydroxides in soils."},{"id":"Q0970","t":"Soil Mineralogy","q":"Which of the following techniques, in addition to X-ray diffraction, is commonly used to help characterize/identify clay minerals via their thermal decomposition behaviour?","o":["Flame photometry","Differential thermal analysis (DTA) / thermogravimetric analysis (TGA)","Kjeldahl digestion","Munsell color comparison"],"a":1,"e":"DTA/TGA monitor heat flow/mass loss as a clay sample is heated, producing characteristic thermal signatures (e.g., dehydroxylation temperatures) useful for identifying specific clay mineral species."},{"id":"Q0147","t":"Soil Mineralogy","q":"On a per-unit-mass basis, soil organic matter (humus) typically shows CEC that is:","o":["Much lower than clay minerals","Generally higher than most clay minerals","Exactly equal to kaolinite","Zero"],"a":1,"e":"Humus carries abundant pH-dependent carboxyl and phenolic groups, often giving it very high CEC per unit mass."},{"id":"Q0141","t":"Soil Mineralogy","q":"Variable (pH-dependent) charge soils are especially common in:","o":["Young alluvial soils rich in 2:1 clays","Highly weathered tropical soils dominated by kaolinite and Fe/Al oxides","Saline desert soils","Fresh volcanic ash soils only"],"a":1,"e":"Kaolinite and oxide-dominated, highly weathered soils (e.g., Oxisols, Ultisols) show strong pH-dependent charge behaviour."},{"id":"Q0152","t":"Soil Mineralogy","q":"A LOW silica:sesquioxide ratio in a soil's clay fraction indicates:","o":["Weak, early-stage weathering","Advanced weathering, as in many Oxisols","High content of 2:1 expanding clays","High soluble salt content"],"a":1,"e":"Extensive silica loss (desilication) relative to Fe/Al oxide accumulation lowers this ratio, marking advanced weathering."},{"id":"Q0129","t":"Soil Mineralogy","q":"Gibbsite is a common example of a soil:","o":["Iron oxide mineral","Aluminium oxide/hydroxide mineral","Manganese oxide mineral","Primary silicate mineral"],"a":1,"e":"Gibbsite, Al(OH)3, is a common crystalline aluminium hydroxide accumulating in highly weathered soils."},{"id":"Q0101","t":"Soil Mineralogy","q":"Muscovite and biotite are members of which primary mineral group?","o":["Feldspar group","Mica group","Pyroxene group","Olivine group"],"a":1,"e":"Muscovite (white mica) and biotite (dark mica) are members of the mica group of phyllosilicate primary minerals."},{"id":"Q0107","t":"Soil Mineralogy","q":"Weathering of K-feldspar in soils releases potassium and typically leads to formation of:","o":["Quartz only","Secondary clay minerals (e.g., illite or kaolinite)","Gypsum","Elemental silicon"],"a":1,"e":"K-feldspar hydrolysis liberates K+ and forms secondary aluminosilicate clay minerals."},{"id":"Q0112","t":"Soil Mineralogy","q":"The structural unit of montmorillonite consists of:","o":["One tetrahedral sheet only","Two tetrahedral sheets sandwiching one octahedral sheet","One octahedral sheet only","Three octahedral sheets"],"a":1,"e":"Its 2:1 layer places an Al-octahedral sheet between two Si-tetrahedral sheets, weakly bonded, allowing expansion."},{"id":"Q0133","t":"Soil Mineralogy","q":"Yellowish-brown soil colors are commonly attributed to the presence of:","o":["Hematite","Goethite","Gibbsite","Quartz"],"a":1,"e":"Goethite is the classic iron oxide associated with yellow-brown soil colors, common in moister or cooler environments than hematite."},{"id":"Q0965","t":"Soil Mineralogy","q":"Soils with a high proportion of amorphous/short-range-order minerals (e.g., allophane-rich Andisols) are often noted for:","o":["Very low phosphorus fixation capacity","Unusually high phosphorus fixation capacity, due to the large reactive surface area of these minerals","Complete absence of any charge","Extremely low water-holding capacity"],"a":1,"e":"The large, highly reactive surface area of allophane/imogolite gives these soils a notably high capacity to fix (retain) phosphate, a well-known agronomic characteristic of Andisols."},{"id":"Q0120","t":"Soil Mineralogy","q":"Which clay mineral is essentially non-expanding due to strong interlayer bonding?","o":["Montmorillonite","Vermiculite","Kaolinite / illite","Smectite"],"a":2,"e":"Kaolinite (strong H-bonding) and illite (K+ fixation) resist interlayer expansion, unlike smectites."},{"id":"Q0146","t":"Soil Mineralogy","q":"Cation exchange capacity of a soil generally correlates positively with:","o":["Sand content only","Clay content, clay mineral type, and organic matter content","Soil bulk density","Soil bulk color value"],"a":1,"e":"More clay (especially high-CEC types like smectite) and more organic matter both raise a soil's CEC."},{"id":"Q0130","t":"Soil Mineralogy","q":"Hematite, a common red-coloured iron oxide in soils, has the formula:","o":["FeOOH","Fe2O3","FeCO3","FeS2"],"a":1,"e":"Hematite (Fe2O3) imparts a characteristic red color to well-drained, oxidized soils."},{"id":"Q0103","t":"Soil Mineralogy","q":"Among common primary minerals, the one most resistant to chemical weathering is:","o":["Olivine","Quartz","Biotite","Calcite"],"a":1,"e":"Quartz's simple, fully-bonded silica structure makes it highly resistant, persisting even in very old, weathered soils."},{"id":"Q0104","t":"Soil Mineralogy","q":"The Goldich stability series ranks common minerals by their resistance to weathering; it places quartz at one end because it is:","o":["The least stable/most easily weathered","The most stable/most resistant to weathering","Only found in clay minerals","A secondary mineral"],"a":1,"e":"Goldich's series places quartz as the most weathering-resistant common silicate mineral."},{"id":"Q0102","t":"Soil Mineralogy","q":"Olivine, pyroxene and amphibole are primary minerals that, relative to quartz, generally:","o":["Weather much more slowly","Weather much more rapidly, being ferromagnesian minerals","Never weather","Only occur in clay fraction"],"a":1,"e":"These ferromagnesian silicates are structurally less stable and weather far faster than resistant quartz."},{"id":"Q0142","t":"Soil Mineralogy","q":"Permanent negative charge on clay minerals arises mainly from:","o":["Protonation of surface hydroxyls","Isomorphous substitution within the crystal lattice","Dissolution of quartz","Organic matter decomposition"],"a":1,"e":"Lattice substitution of lower-valence cations for higher-valence ones fixes a permanent negative charge, independent of pH."},{"id":"Q0968","t":"Soil Mineralogy","q":"The presence of abundant gibbsite (aluminium hydroxide) in a soil's clay fraction is generally indicative of:","o":["Very weak, early-stage weathering","An advanced stage of weathering, with substantial silica removal (desilication) relative to alumina","High content of unweathered primary minerals","Recent volcanic ash deposition with no further weathering"],"a":1,"e":"Gibbsite accumulation reflects advanced desilication — silica has been preferentially leached away, leaving behind residual aluminium hydroxide, a hallmark of intensely weathered soils."},{"id":"Q0155","t":"Soil Mineralogy","q":"Formation of montmorillonite (smectite) in soils is generally favoured by:","o":["Excellent drainage and intense leaching over long periods","Poor drainage, base-rich conditions and moderate weathering intensity","Extremely high rainfall and complete desilication","Volcanic glass weathering only"],"a":1,"e":"Restricted leaching that retains silica and bases (e.g., semi-arid climate, basic parent rock, impeded drainage) favours smectite formation over kaolinite."},{"id":"Q0116","t":"Soil Mineralogy","q":"Isomorphous substitution in clay minerals refers to:","o":["Replacement of Si4+ or Al3+ by cations of similar size but lower charge, creating permanent negative charge","Complete dissolution of the clay structure","Substitution of clay by sand particles","Oxidation of iron within the lattice"],"a":0,"e":"Substitution of lower-valence cations (e.g., Al3+ for Si4+, Mg2+ for Al3+) within the lattice generates a permanent negative charge."},{"id":"Q0124","t":"Soil Mineralogy","q":"Soils derived from volcanic ash (Andisols) are commonly dominated by which clay-sized minerals?","o":["Montmorillonite and illite","Allophane and imogolite (non-crystalline aluminosilicates)","Gypsum and halite","Quartz and mica"],"a":1,"e":"Rapid weathering of volcanic glass in Andisols produces short-range-order minerals like allophane and imogolite."},{"id":"Q0150","t":"Soil Mineralogy","q":"Under conditions of high rainfall, high temperature and long weathering duration, clay mineral formation tends to progress toward:","o":["Montmorillonite dominance","Kaolinite, and eventually Fe/Al oxide dominance","Illite dominance exclusively","Chlorite dominance"],"a":1,"e":"Intense, prolonged weathering progressively desilicates the system, favouring kaolinite and finally sesquioxides."},{"id":"Q0140","t":"Soil Mineralogy","q":"The 'zero point of charge' (ZPC) concept is particularly relevant to:","o":["Permanently charged 2:1 clay minerals","Variable-charge minerals such as Fe/Al oxides","Quartz sand grains","Soil organic carbon content"],"a":1,"e":"ZPC is the pH at which a variable-charge mineral (oxide surface) carries no net surface charge."}],"Soil Conservation":[{"id":"Q0671","t":"Soil Conservation","q":"Land in USDA Land Capability Class I is generally characterized by:","o":["Severe limitations that restrict use to grazing or forestry only","Few limitations, suitable for a wide range of crops with ordinary good management practices","Being unsuitable for any agricultural or non-agricultural use","Steep slopes with severe erosion hazard"],"a":1,"e":"Class I lands are nearly level with minimal limitations, allowing a wide range of crops to be grown safely with standard good management."},{"id":"Q0667","t":"Soil Conservation","q":"Mulching, as a soil conservation practice, helps reduce erosion mainly by:","o":["Exposing bare soil directly to raindrop impact","Covering the soil surface, thereby reducing raindrop impact, runoff velocity, and evaporation, while also often adding organic matter","Increasing soil compaction directly","Removing all vegetation"],"a":1,"e":"A surface mulch layer intercepts raindrop energy, slows runoff, conserves moisture and can add organic matter as it decomposes, all reducing erosion risk."},{"id":"Q0674","t":"Soil Conservation","q":"Rainwater harvesting structures such as farm ponds primarily serve to:","o":["Increase runoff and erosion downstream","Capture and store surface runoff for later beneficial use (irrigation, livestock, domestic use) and to recharge groundwater","Eliminate the need for any irrigation entirely","Increase soil salinity"],"a":1,"e":"Farm ponds/check dams capture otherwise-lost runoff, providing a water source for later use and helping recharge local groundwater."},{"id":"Q0649","t":"Soil Conservation","q":"Rill erosion is distinguished from sheet erosion mainly by the formation of:","o":["No visible channels at all","Numerous small, shallow channels that can generally be smoothed out by normal tillage","Very large, permanent channels resistant to leveling","Erosion caused only by wind"],"a":1,"e":"Rills are small, shallow erosional channels that concentrate runoff, but are shallow enough to be obliterated by routine tillage operations."},{"id":"Q0669","t":"Soil Conservation","q":"A watershed, as a fundamental unit for integrated natural resource management, is defined as:","o":["Any administratively defined district boundary","The total land area that drains to a common outlet point, delineated by natural topographic divides (ridgelines)","A body of standing water only","A single agricultural field"],"a":1,"e":"A watershed is a hydrologically defined area — all land draining to a single outlet — making it a natural unit for coordinated land and water management."},{"id":"Q0884","t":"Soil Conservation","q":"Selection of tree/shrub species for afforestation of degraded, eroded lands should primarily consider:","o":["Only ornamental value, with no regard to site conditions","Adaptability to local site conditions (soil, climate, degradation level), fast establishment, and root systems suited to soil stabilization","Only timber market price, ignoring survivability","Species that require intensive irrigation regardless of site rainfall"],"a":1,"e":"Successful afforestation of degraded/marginal land depends on choosing hardy, well-adapted species capable of establishing and stabilizing soil under the specific, often harsh, site conditions."},{"id":"Q0683","t":"Soil Conservation","q":"Which watershed management practice specifically targets controlling and utilizing excess surface runoff for groundwater recharge and supplemental irrigation?","o":["Deep ploughing","Water harvesting structures such as farm ponds, check dams, and percolation tanks","Removal of all vegetation from the watershed","Continuous monocropping"],"a":1,"e":"Water harvesting structures are specifically designed to capture and beneficially use/store runoff that would otherwise be lost, supporting both irrigation supply and recharge."},{"id":"Q0879","t":"Soil Conservation","q":"'Keyline design', a land and water management approach, focuses on:","o":["Ignoring topography entirely in farm planning","Planning cultivation, drainage and water management patterns in relation to the natural contour and key topographic lines of a landscape, to optimize water distribution and minimize erosion","Only urban infrastructure design","Only livestock breeding programs"],"a":1,"e":"Keyline design uses specific topographic reference lines to guide cultivation and water management patterns, aiming to spread and slow water movement across the landscape while reducing erosion."},{"id":"Q0686","t":"Soil Conservation","q":"Which practice is generally recommended to minimize wind erosion risk on light-textured (sandy) soils in dry, windy regions?","o":["Leaving the soil bare and finely pulverized after harvest","Maintaining vegetative cover/crop residue, establishing shelterbelts, and using strip cropping oriented across the prevailing wind direction","Removing all trees and shelterbelts","Deep, fine tillage immediately before the windy season"],"a":1,"e":"Cover, residue retention, windbreaks and wind-oriented strip cropping all reduce exposed, erodible surface and near-surface wind velocity."},{"id":"Q0684","t":"Soil Conservation","q":"The primary objective of integrated watershed management programs (e.g., in India's rainfed regions) is generally to:","o":["Maximize soil erosion for downstream reservoir siltation studies","Conserve soil and water resources, improve land productivity, and enhance rural livelihoods through an integrated, participatory approach across the watershed","Focus exclusively on urban water supply, ignoring agriculture","Eliminate all agricultural activity in the watershed"],"a":1,"e":"Watershed programs aim to holistically improve soil/water conservation, agricultural productivity, and community livelihoods through coordinated treatment of the entire watershed."},{"id":"Q0676","t":"Soil Conservation","q":"Afforestation and reforestation of degraded/eroded watershed areas contribute to soil conservation mainly by:","o":["Increasing surface runoff velocity","Improving vegetative cover, reducing raindrop impact and runoff velocity, and increasing infiltration and root-binding of soil","Eliminating the need for any other conservation measure immediately","Increasing soil erosion in the short term with no long-term benefit"],"a":1,"e":"Tree cover and root systems intercept rainfall, slow runoff, increase infiltration, and physically bind soil, substantially reducing erosion on treated slopes."},{"id":"Q0885","t":"Soil Conservation","q":"A spillway constructed as part of a check dam or farm pond structure serves the essential function of:","o":["Preventing any water from ever leaving the structure","Safely conveying excess flood water around or over the structure without causing damage/failure of the main embankment","Increasing the height of the dam indefinitely","Blocking all water flow permanently"],"a":1,"e":"Spillways provide a controlled, protected pathway for excess water to bypass the main structure during high-flow events, preventing overtopping damage or structural failure."},{"id":"Q0875","t":"Soil Conservation","q":"In wind erosion processes, soil particles move by three main mechanisms: saltation, suspension, and:","o":["Sedimentation only","Surface creep (rolling/sliding of larger particles along the ground surface)","Only chemical dissolution","Only biological decomposition"],"a":1,"e":"Wind-eroded particles move by saltation (bouncing), suspension (fine particles carried aloft), and surface creep (larger particles rolled/pushed along the surface)."},{"id":"Q0874","t":"Soil Conservation","q":"The Wind Erosion Equation (WEQ), analogous in concept to the USLE for water erosion, estimates wind-driven soil loss as a function of factors including:","o":["Only rainfall amount, with no reference to wind","Soil erodibility, surface roughness, climate (wind), unsheltered field width, and vegetative cover","Only crop market price","Only soil salinity"],"a":1,"e":"WEQ integrates factors such as soil erodibility, ridge roughness, climatic (wind) factor, field width, and vegetative cover to estimate potential wind erosion soil loss."},{"id":"Q0891","t":"Soil Conservation","q":"Establishing vegetative cover as quickly as possible after any land disturbance (e.g., construction, mining) is emphasized in erosion control mainly because:","o":["Bare, freshly disturbed soil is typically highly erodible until protective cover is established","Disturbed soil is never erodible","Vegetation takes decades to provide any erosion protection","Erosion control is unnecessary immediately after disturbance"],"a":0,"e":"Freshly disturbed, unprotected soil is especially vulnerable to erosion; prompt revegetation (or temporary cover) minimizes the high-risk exposure window."},{"id":"Q0662","t":"Soil Conservation","q":"Graded bunds, as opposed to level (contour) bunds, are designed with:","o":["No slope at all along their length, holding all water in place","A gentle, controlled slope along their length that safely conveys excess runoff to a stable outlet, useful in higher-rainfall areas","Extremely steep, near-vertical faces","No connection to any drainage outlet"],"a":1,"e":"Graded bunds are built with a slight gradient to safely drain excess water to protected outlets, useful where rainfall is too high for bunds to fully retain runoff."},{"id":"Q0653","t":"Soil Conservation","q":"The Universal Soil Loss Equation (USLE) estimates average annual soil loss as a function of:","o":["Only rainfall amount","Rainfall erosivity (R), soil erodibility (K), slope length-steepness (LS), cover-management (C), and support practice (P) factors","Only soil color","Only crop market value"],"a":1,"e":"USLE: A = R × K × LS × C × P, integrating climatic, soil, topographic, cropping and conservation practice factors to estimate soil loss."},{"id":"Q0661","t":"Soil Conservation","q":"Contour bunding is a soil and water conservation structure that involves:","o":["Constructing embankments along the contour to intercept and reduce runoff velocity, promoting infiltration and reducing erosion","Digging deep vertical trenches down the slope","Removing all vegetation from the field","Only used for wind erosion control"],"a":0,"e":"Contour bunds are earthen embankments built along contour lines that slo
